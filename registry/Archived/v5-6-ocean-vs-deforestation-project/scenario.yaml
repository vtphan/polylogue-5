scenario_id: ocean-vs-deforestation-project

topic: Whether to focus the group's environmental project on ocean pollution or deforestation

context: >
  A 6th-grade STEM class is working on the PBL driving question: "What are the
  major threats affecting our global environment, and what can our communities do
  to protect our ecosystems?" This group needs to choose one environmental issue
  for their semester project. They're debating between ocean pollution (one member
  saw a documentary about plastic in the Pacific) and deforestation (another member
  read about Amazon fires). They can only pick one.

instructional_goals:
  - Practice noticing when someone's evidence doesn't actually support the specific claim they're making
  - Practice noticing when the group only considers one side of a question

discussion_dynamic: >
  The personas must genuinely disagree — they want different projects, not just
  different angles on the same project. One is passionate about ocean pollution
  because of a documentary; the other thinks deforestation is more practical
  because they could plant trees at school. The ocean-pollution persona is more
  enthusiastic and emotionally invested; the deforestation persona is more
  practical but less assertive. The shift happens when the practical persona
  starts backing down in the face of the other's enthusiasm and confident citing
  of dramatic facts. The discussion ends when they pick ocean pollution, with
  the deforestation persona's concerns unresolved — not because they were wrong,
  but because they stopped pressing.

personas:
  - name: Maya
    perspective: >
      Believes ocean pollution is the most urgent environmental issue and wants the
      group to choose it. She watched a documentary about the Great Pacific Garbage
      Patch and was deeply moved by footage of sea turtles trapped in plastic. She
      feels passionate that this is the problem that matters most and wants to do
      something about it.
    knowledge: >
      Watched a documentary about ocean plastic pollution. Knows facts about the
      Great Pacific Garbage Patch — millions of tons of plastic, thousands of miles
      across, harmful to marine life. Can cite specific numbers and images from the
      film. Has not researched what a school group could realistically do about
      ocean pollution or how ocean cleanup efforts actually work.
    weaknesses: >
      Gets swept up in dramatic facts and emotional reactions without stopping to
      ask whether those facts connect to what she's actually proposing. Tends to
      treat big, impressive evidence as automatically relevant to any related
      decision, even when the scale doesn't match. When someone raises a concern
      that threatens her preferred choice, she redirects to how important the
      problem is rather than addressing the concern itself. Confident enough in
      her position that she doesn't feel the need to engage with pushback — she
      acknowledges it just enough to seem fair, then moves past it.

  - name: Ethan
    perspective: >
      Thinks deforestation is the better project choice because it's something they
      could actually do at their school — planting trees, starting a garden, reducing
      paper waste. He read about Amazon fires and cares about the issue, but his main
      argument is about what's practical and doable for a school group.
    knowledge: >
      Read articles about Amazon deforestation and rainforest fires. Has some ideas
      about local tree-planting programs and school garden projects. Knows that their
      school has open space that could be used for planting. Less informed about
      ocean pollution specifically.
    weaknesses: >
      Tends to back down when someone is more enthusiastic or confident than he is,
      even when his own points are strong. Raises good concerns but doesn't press
      them — if the other person doesn't engage, he lets it go rather than insisting.
      More comfortable agreeing than pushing back, especially when the other person
      seems really sure of themselves.

target_facets:
  - facet_id: relevance
    target_quality: weak
    primary_lens: evidence
    also_visible_through:
      - logic
    designed_explanation:
      cognitive_pattern: overgeneralization
      social_dynamic: group_pressure
      interaction_note: >
        Maya overgeneralizes from dramatic documentary evidence about a global-scale
        problem (the Great Pacific Garbage Patch) to justify a local school project,
        not noticing the scale mismatch. Ethan finds the documentary facts compelling
        and doesn't push back on whether they actually support the choice of a school
        project — the impressiveness of the evidence creates group pressure that
        discourages questioning its relevance.
    carrier_persona: Maya
    signal_mechanism: >
      The persona cites dramatic facts from a documentary about the Great Pacific
      Garbage Patch — millions of tons of plastic, sea turtles — to argue their
      school group should do an ocean pollution project. The documentary evidence
      is real and compelling but it's about a global-scale problem in the Pacific,
      not about what a school group can do locally. The gap is between the
      evidence's scope (Pacific Ocean) and the project's scope (their school).
      The persona doesn't notice the mismatch because the documentary was so
      dramatic.

  - facet_id: perspective_engagement
    target_quality: weak
    primary_lens: scope
    also_visible_through:
      - evidence
      - logic
    designed_explanation:
      cognitive_pattern: confirmation_bias
      social_dynamic: conflict_avoidance
      interaction_note: >
        Maya's confirmation bias leads her to dismiss Ethan's feasibility concerns
        because they threaten her preferred choice — she redirects to how important
        ocean pollution is rather than addressing whether the group can actually do
        anything about it. Ethan's conflict avoidance means he lets the concern drop
        rather than pressing, even though his feasibility question is the strongest
        counterargument. The result is a perspective that was raised but never
        genuinely engaged with.
    carrier_persona: Maya
    signal_mechanism: >
      When the deforestation persona raises feasibility concerns ("we don't live
      near the ocean," "can we actually do anything about this?"), the
      ocean-pollution persona dismisses them with "we can figure that out later"
      and redirects to how important ocean pollution is. The concern is
      acknowledged just enough to not feel ignored, but never actually addressed.
      The feasibility question — which is the strongest counterargument — gets
      replaced by emotional urgency about the problem's size.

discussion_arc: >
  The discussion opens with both personas stating their positions — Maya
  enthusiastic about ocean pollution, Ethan advocating for deforestation as
  more practical. Tension builds as Maya brings in dramatic documentary
  evidence that impresses both of them, while Ethan tries to steer toward
  feasibility. The critical turning point comes when Ethan raises his
  strongest concern — that they don't live near the ocean and can't actually
  do anything about this problem — and Maya dismisses it by redirecting to
  how urgent ocean pollution is. Ethan pushes back once more but less firmly.
  The discussion resolves when Ethan concedes, not because his concerns were
  answered but because Maya's enthusiasm and confidence wore him down. They
  choose ocean pollution with Ethan's practical concerns still hanging
  unresolved.

turn_outline:
  - speaker: Maya
    accomplishes: >
      Opens with excitement about ocean pollution, mentions the documentary she
      watched and how it changed how she sees the problem.

  - speaker: Ethan
    accomplishes: >
      Proposes deforestation instead, arguing they could actually plant trees
      at school — it's something they can do, not just learn about.

  - speaker: Maya
    accomplishes: >
      Brings in specific facts from the documentary — millions of tons of
      plastic in the Pacific, sea turtles getting trapped — to make the case
      that ocean pollution is the bigger, more important problem.

  - speaker: Ethan
    accomplishes: >
      Acknowledges the documentary sounds serious but raises his first concern:
      deforestation lets them do something hands-on right here at their school.

  - speaker: Maya
    accomplishes: >
      Doubles down on the scale of ocean pollution — it's destroying whole
      ecosystems. Uses the drama of the evidence to argue this is what they
      should care about most.

  - speaker: Ethan
    accomplishes: >
      Raises his strongest point directly: they don't live near the ocean, so
      what would they actually do for an ocean pollution project? Questions
      whether they can really make a difference on something so far away.

  - speaker: Maya
    accomplishes: >
      Brushes past the feasibility concern — says they can figure out the
      details later, what matters is picking the most important issue. Pivots
      back to how serious ocean pollution is.

  - speaker: Ethan
    accomplishes: >
      Pushes back one more time, but less firmly — mentions that with trees
      they already know what they'd do, while ocean pollution still feels vague.

  - speaker: Maya
    accomplishes: >
      Suggests they could do a beach cleanup or awareness campaign, quickly
      moving past Ethan's concern. Talks about how ocean pollution affects
      everyone, even people who don't live near the coast.

  - speaker: Ethan
    accomplishes: >
      Starts to give in — says the documentary facts are pretty convincing and
      maybe ocean pollution is a bigger deal. His tone shifts from advocating
      to hedging.

  - speaker: Maya
    accomplishes: >
      Takes his softening as agreement and gets more enthusiastic — starts
      talking about what their project could look like, treating the decision
      as basically made.

  - speaker: Ethan
    accomplishes: >
      Agrees to go with ocean pollution. Mentions one last time that they still
      need to figure out what they'd actually do, but frames it as a detail
      rather than a real concern. The feasibility question is still unresolved
      but he's stopped pressing it.
