        - category: interaction
          levels:
            - level: developing
              examples:
                - >
                  Maya never considered Leo's concerns because she was too
                  attached to her idea, and Leo stopped raising them because
                  Maya was too confident to argue with
            - level: differentiated
              examples:
                - >
                  Maya's excitement made her treat every concern as a small
                  detail to get past, and each time she did that, it got
