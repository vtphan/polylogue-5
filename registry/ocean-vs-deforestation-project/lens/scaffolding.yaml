          - level: differentiated
            examples:
              - >
                Leo's "okay fine" shows he stopped objecting but was not
                actually persuaded — his practical concerns from earlier never
                got answered, so the group's decision came from one person
                being more forceful, not from the group actually working
                through the disagreement

    explanation_rubric:
      categories:
        - category: cognitive
          levels:
            - level: basic
              examples:
                - Maya just wanted ocean pollution from the start and never really thought about it
            - level: developing
              examples:
                - >
                  Maya was so attached to her idea that she never actually
                  considered whether their group could do what she was
                  proposing — she treated the problem being important as the
                  same thing as the project being a good idea
        - category: social
          levels:
            - level: basic
              examples:
                - Leo just went along with it
            - level: developing
              examples:
                - >
                  Leo gave up because disagreeing with someone that enthusiastic
                  and confident felt harder than just going along, even though
