      - turn_08.s01

    facet_annotations:
      - facet_id: perspective_engagement
        quality_level: weak
        evidence_sentences:
          - turn_06.s01
          - turn_06.s02
          - turn_07.s01
          - turn_07.s02
        primary_lens: scope
        also_visible_through:
          - evidence
          - logic
        explanatory_variables:
          cognitive_pattern: confirmation_bias
          social_dynamic: group_pressure
          interaction: >
            Leo makes his most concrete case — they could plant trees, measure
            growth, take pictures. Maya acknowledges the idea briefly then
            overrides it with emotional scale ("millions of animals," "real
            emergency"). The concrete alternative gets dismissed not by
            counter-argument but by escalation.
        was_targeted: true
        notes: >
          Second instance of perspective engagement weakness. Leo's practical
          alternative is his strongest moment in the discussion — specific,
          actionable, measurable. Maya's response acknowledges it ("trees are
          cool") but immediately pivots to emotional scale comparison, which
          is not actually a response to the practical argument.

      - facet_id: relevance
        quality_level: weak
        evidence_sentences:
          - turn_07.s01
          - turn_07.s02
        primary_lens: evidence
        also_visible_through:
          - logic
        explanatory_variables:
          cognitive_pattern: overgeneralization
          social_dynamic: null
          interaction: null
        was_targeted: true
        notes: >
          Maya continues applying global-scale reasoning ("millions of animals,"
          "real emergency") to a school-project decision. The relevance gap
          persists — the size of the problem is treated as the deciding factor,
          but the group is not choosing which problem is bigger, they are
          choosing which project they can do.

    ai_perspective:
      through_logic:
        observation: >
          Looking at the logic, I notice Leo makes a really concrete argument
          here — they could plant trees, measure growth, and document it for
          their presentation. That is specific and practical. Maya responds by
          comparing the size of the two problems, but that comparison does not
          actually address what Leo said. Whether ocean pollution is bigger
          than one courtyard does not tell the group whether they can do a
          good ocean pollution project.
        key_sentences:
          - turn_06.s01
          - turn_06.s02
          - turn_07.s01
      through_evidence:
        observation: >
          Looking at the evidence in this exchange, I notice something
          interesting about what each person brings. Leo offers concrete,
          checkable details — planting, measuring, taking pictures. Maya offers
          a big number — millions of animals. Both are real, but they are
          answering different questions. Leo is showing what the group could
          do. Maya is showing why the problem matters. The conversation might
          benefit from someone noticing that difference.
        key_sentences:
          - turn_06.s01
          - turn_06.s02
          - turn_07.s02
      through_scope:
        observation: >
          Looking at the scope, I notice the conversation narrows here instead
          of widening. Leo tries to broaden the discussion by offering a
          concrete alternative, but Maya brings it back to a size comparison.
          After this exchange, Leo starts to back down. The practical question —
          what can the group actually do — is still unanswered, but the
          conversation is moving away from it.
        key_sentences:
          - turn_07.s01
          - turn_08.s01
      why_it_happened: >
        A cognitive scientist might describe what is happening here as
        confirmation bias in action — Maya has already decided what she wants,
        so when Leo offers a concrete alternative, she does not engage with its
        strengths. Instead, she redirects to the emotional power of her
        preferred option. Meanwhile, notice how Leo responds to this. After
        making his strongest case and getting a size comparison in return, he
        starts to concede. That shift — from pressing a valid point to backing
        down — often happens when one person's confidence and enthusiasm makes
        the other person feel like disagreeing is not worth the effort.
      what_to_notice: >
        Look at what Leo says in this passage compared to what Maya says in
        response. Are they talking about the same thing?
      what_to_notice_sentences:
        - turn_06.s01
        - turn_06.s02
        - turn_07.s01

    diversity_potential:
      expected_lens_split: >
        All three lenses produce distinct readings. Logic sees the
        comparison mismatch. Evidence sees different types of support.
        Scope sees the narrowing conversation and unaddressed alternative.
      likely_student_observations:
        - lens: logic
          observations:
            - Leo gives specific reasons for his idea
            - Maya responds by comparing problem size, which is a different argument
          might_miss:
            - That Maya's comparison does not actually counter Leo's practical point
        - lens: evidence
          observations:
            - Leo offers concrete, actionable details
            - Maya offers an emotional appeal about millions of animals
          might_miss:
            - That these two types of evidence answer different questions
        - lens: scope
          observations:
            - Leo tries to offer an alternative but it gets compared away
            - The discussion is narrowing toward one option
          might_miss:
            - That Leo's wavering in turn 8 signals the practical perspective is being lost

  - passage_id: passage_04
    turns:
      - turn_09
      - turn_10
    sentence_range:
      - turn_09.s01
      - turn_09.s02
      - turn_10.s01

    facet_annotations:
      - facet_id: perspective_engagement
        quality_level: weak
        evidence_sentences:
          - turn_09.s01
          - turn_09.s02
          - turn_10.s01
        primary_lens: scope
        also_visible_through:
          - evidence
          - logic
        explanatory_variables:
          cognitive_pattern: confirmation_bias
          social_dynamic: conflict_avoidance
          interaction: >
            Maya presses forward with aspirational language while Leo's last
            challenge comes out tentative rather than forceful. The social
            dynamic has shifted — Leo phrases his concern as a question ("how
            would we even") rather than a statement, signaling he has already
            partly given up.
        was_targeted: true
        notes: >
          Leo's final substantive challenge. The phrasing ("but like, how would
          we even") is notably weaker than his earlier "we don't even live near
          the ocean." The conflict avoidance is visible in the softening of his
          language — same concern, less force.

    ai_perspective:
      through_logic:
        observation: >
          Looking at the logic, I notice Maya is making promises — "imagine if
          our project could actually help save ocean animals" and "we could
          make a real difference." Those are exciting ideas, but they are
          wishes, not plans. Leo seems to notice this, because he asks how
          they would actually help. That is a logical question — if the claim
          is "we can make a difference," the next step is explaining how.
        key_sentences:
          - turn_09.s01
          - turn_09.s02
          - turn_10.s01
      through_evidence:
        observation: null
        key_sentences: []
      through_scope:
        observation: >
          Looking at the scope, I notice Leo is still trying to bring the
          conversation back to what is realistic for their group. He has asked
          some version of this question before, and it has not been answered
          yet. Pay attention to what happens next — does the group ever work
          through this question, or does it keep getting set aside?
        key_sentences:
          - turn_10.s01
      why_it_happened: >
        Notice how Leo's language has changed since earlier in the
        conversation. Earlier he said things like "we don't even live near the
        ocean" — direct and clear. Now he says "but like, how would we even
        help" — hedging, tentative. The concern is the same, but the
        confidence behind it has faded. When someone keeps pressing an
        enthusiastic case and your challenges get brushed aside, it can start
        to feel easier to just go along — even when your question is still a
        good one.
      what_to_notice: >
        Compare how Leo talks here to how he talked earlier. Has anything
        changed?
      what_to_notice_sentences:
        - turn_10.s01

    diversity_potential:
      expected_lens_split: >
        Logic and Scope are most productive here. Logic students see
        aspirational claims without plans. Scope students see the repeated
        unanswered question.
      likely_student_observations:
        - lens: logic
          observations:
            - Maya makes a claim about making a difference but does not explain how
            - Leo asks a follow-up question about feasibility
          might_miss:
            - That Leo's question is essentially the same one from earlier, still unanswered
        - lens: evidence
          observations:
            - No new evidence is introduced in this passage
          might_miss:
            - The absence of evidence is itself notable — the decision is being made on enthusiasm
        - lens: scope
          observations:
            - Leo is still raising the practical scope question
            - His language is less assertive than before
          might_miss:
            - The shift in Leo's tone signals he is giving up, not being convinced

  - passage_id: passage_05
    turns:
      - turn_11
      - turn_12
    sentence_range:
      - turn_11.s01
      - turn_11.s02
      - turn_12.s01

    facet_annotations:
      - facet_id: perspective_engagement
        quality_level: weak
        evidence_sentences:
          - turn_11.s01
          - turn_12.s01
        primary_lens: scope
        also_visible_through:
          - evidence
          - logic
        explanatory_variables:
          cognitive_pattern: confirmation_bias
          social_dynamic: conflict_avoidance
          interaction: >
            The pattern completes here. Maya offers a vague plan ("beach cleanup
            trip or make posters or something") and immediately redirects to
            excitement. Leo capitulates. The feasibility question from passage 2
            was never answered — it was replaced by enthusiasm.
        was_targeted: true
        notes: >
          The resolution reveals the full scope of the perspective engagement
          weakness. Leo's "okay fine" signals concession, not agreement. The
          group has made a decision, but the strongest counterargument was
          never addressed — it was worn down.

      - facet_id: reasoning_completeness
        quality_level: weak
        evidence_sentences:
          - turn_11.s01
          - turn_12.s01
        primary_lens: logic
        also_visible_through:
          - evidence
        explanatory_variables:
          cognitive_pattern: null
          social_dynamic: group_pressure
          interaction: null
        was_targeted: false
        notes: >
          Emergent. Maya's proposed plan — "beach cleanup trip or make posters
          or something" — is presented as if it answers the feasibility
          question, but there is a gap between having a vague idea and having
          a workable plan. The reasoning jumps from "ocean pollution is
          important" to "we'll do a beach cleanup" without explaining how that
          connects to their school project or addresses the scale problem.
          Students looking through Logic may notice the missing steps.

    ai_perspective:
      through_logic:
        observation: >
          Looking at the logic of this ending, I notice the group reaches a
          decision, but I am not sure the reasoning got them there. Maya's plan
          — a beach cleanup or posters — is pretty vague. If someone asked
          "how does a beach cleanup at your school help with the Great Pacific
          Garbage Patch," would the group have an answer? There are some steps
          missing between the problem they described and the project they chose.
        key_sentences:
          - turn_11.s01
          - turn_12.s01
      through_evidence:
        observation: >
          Looking at the evidence, I notice the group started with dramatic
          facts about the Pacific Ocean and ended with a plan for posters or a
          beach cleanup. The evidence they used to choose this project is about
          a very different scale than the project they are actually going to
          do. That gap is worth thinking about.
        key_sentences:
          - turn_11.s01
      through_scope:
        observation: >
          Looking at the scope of this decision, I notice Leo says "okay fine"
          rather than something like "yeah, that sounds great." That is a
          different kind of agreement. The group has made a choice, but one
          member's concerns were never really worked through — they just faded
          out. When a group reaches a decision because someone stopped
          objecting rather than because everyone was persuaded, it is worth
          asking whether the best thinking actually made it into the final
          choice.
        key_sentences:
          - turn_12.s01
      why_it_happened: >
        What happened across this whole conversation is that two forces worked
        together to shape the outcome. Maya was genuinely excited and
        confident, and that enthusiasm naturally dominated the conversation —
        not because she was trying to be unfair, but because strong feelings
        can make us less interested in hearing challenges to what we want. At
        the same time, Leo had real, practical concerns but found it
        increasingly uncomfortable to keep pushing back against someone so
        certain. The combination — one person's confirmation bias and another
        person's conflict avoidance — meant the group's strongest
        counterargument quietly disappeared. The decision they made might be
        fine, but they never actually tested it against the hard questions.
      what_to_notice: >
        Look at how Leo agrees at the end. Does it sound like he was
        convinced?
      what_to_notice_sentences:
        - turn_12.s01

    diversity_potential:
      expected_lens_split: >
        All three lenses see something different. Logic sees the reasoning
        gap. Evidence sees the scale mismatch in the final plan. Scope sees
        the hollow agreement.
      likely_student_observations:
        - lens: logic
          observations:
            - Maya's plan is vague — beach cleanup or posters
            - There are missing steps between the problem and the solution
          might_miss:
            - That the vagueness is a symptom of never having addressed Leo's feasibility question
        - lens: evidence
          observations:
            - The evidence cited earlier was about the Pacific, the plan is local
            - No evidence was offered about whether beach cleanups or posters are effective
          might_miss:
            - That this scale mismatch has been present since passage 1
        - lens: scope
          observations:
            - Leo says "okay fine" which sounds reluctant
            - The group made a decision but one person does not seem fully on board
          might_miss:
            - That Leo's concerns were never actually answered, just worn down over time
