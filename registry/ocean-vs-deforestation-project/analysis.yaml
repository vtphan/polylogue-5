          - turn_03.s01
          - turn_03.s02
        primary_lens: evidence
        also_visible_through:
          - logic
        explanatory_variables:
          cognitive_pattern: overgeneralization
          social_dynamic: null
          interaction: null
        was_targeted: true
        notes: >
          The relevance gap is established here. Maya cites Pacific-scale facts
          (millions of tons, garbage patch twice the size of Texas) to support
          a school-group project. The evidence is real and dramatic but about a
          different scale and context than what the group could address. The
          mismatch is not yet challenged — Leo responds to it in passage 2.

      - facet_id: sufficiency
        quality_level: weak
        evidence_sentences:
          - turn_01.s01
          - turn_03.s01
          - turn_03.s02
        primary_lens: evidence
        also_visible_through:
          - scope
          - logic
        explanatory_variables:
          cognitive_pattern: overgeneralization
          social_dynamic: null
          interaction: null
        was_targeted: false
        notes: >
          Emergent. Maya's entire case for ocean pollution rests on a single
          documentary. She treats it as decisive evidence, but one source —
          however dramatic — is a thin basis for the claim that this is the
          best project choice. Students looking through Evidence may notice the
          single-source reliance before they notice the relevance gap.

    ai_perspective:
      through_logic:
        observation: >
          Looking at the logic here, I notice both Maya and Leo make clear
          cases for their positions. Maya connects her documentary experience
          to a proposal, and Leo connects his practical knowledge to an
          alternative. Both arguments have a structure you can follow — they
          each have a reason behind their preference. Something to watch as the
          conversation continues is whether the reasons stay connected to what
          the group actually needs to decide.
        key_sentences:
          - turn_01.s02
          - turn_02.s01
          - turn_02.s02
      through_evidence:
        observation: >
          Looking at the evidence, I notice Maya brings up some really specific,
          dramatic facts — millions of tons of plastic, sea turtles, the garbage
          patch being twice the size of Texas. Those are powerful details. But
          think about where those facts come from and what they describe. The
          documentary was about the Pacific Ocean. The group is choosing a
          project for their school. Those are pretty different situations, and
          it is worth asking whether facts about one automatically help with
          decisions about the other.
        key_sentences:
          - turn_03.s01
          - turn_03.s02
      through_scope:
        observation: null
        key_sentences: []
      why_it_happened: >
        One way to think about what is happening here is that Maya had a really
        powerful emotional experience watching the documentary, and that
        experience is shaping how she sees the evidence. When something affects
        us strongly, we can sometimes treat it as more relevant than it actually
        is to the decision at hand — a kind of overgeneralization where we apply
        what we learned in one context to a different one without checking
        whether it fits.
      what_to_notice: >
        Think about what Maya learned from the documentary. What was it actually
        about?
      what_to_notice_sentences:
        - turn_01.s01
        - turn_03.s01
        - turn_03.s02

    diversity_potential:
      expected_lens_split: >
        Evidence and Logic students are likely to produce different readings.
        Evidence students will focus on the documentary as a source; Logic
        students may notice the gap between global facts and a local project
        decision.
      likely_student_observations:
        - lens: logic
          observations:
            - Both sides give reasons for their preference
            - Maya connects documentary to her proposal
            - Leo connects practical knowledge to his proposal
          might_miss:
            - The inferential gap between Pacific-scale evidence and a school-scale project decision
        - lens: evidence
          observations:
            - Maya cites specific facts from a documentary
            - The facts are dramatic and detailed
            - Leo mentions Amazon fires and tree-planting experience
          might_miss:
            - That all of Maya's evidence comes from a single source
            - That the evidence describes a different scale than the project
        - lens: scope
          observations:
            - Two different project options are on the table
            - Maya's focus is on the global problem, Leo's is on local action
          might_miss:
            - The scale mismatch between Maya's evidence and the project scope is more visible through Evidence and Logic here

  - passage_id: passage_02
    turns:
      - turn_04
      - turn_05
    sentence_range:
      - turn_04.s01
      - turn_05.s01
      - turn_05.s02

    facet_annotations:
      - facet_id: perspective_engagement
        quality_level: weak
        evidence_sentences:
          - turn_04.s01
          - turn_05.s01
        primary_lens: scope
        also_visible_through:
          - evidence
          - logic
        explanatory_variables:
          cognitive_pattern: confirmation_bias
          social_dynamic: conflict_avoidance
          interaction: >
            Maya dismisses Leo's feasibility concern because engaging with it
            would threaten her preferred choice (confirmation bias). Leo does
            not press the point further in this passage (conflict avoidance
            begins but becomes more visible in later passages).
        was_targeted: true
        notes: >
          First instance of the perspective engagement signal. Leo raises the
          strongest practical objection — they do not live near the ocean. Maya
          acknowledges it just enough ("we can figure that part out later") to
          not seem like she is ignoring it, then immediately redirects to
          emotional urgency. The concern is technically heard but never
          addressed.

      - facet_id: relevance
        quality_level: weak
        evidence_sentences:
          - turn_05.s01
          - turn_05.s02
        primary_lens: evidence
        also_visible_through:
          - logic
        explanatory_variables:
          cognitive_pattern: overgeneralization
          social_dynamic: null
          interaction: null
        was_targeted: true
        notes: >
          The relevance signal continues here. Maya's redirect from "what would
          we do" to "animals are dying every day" deepens the gap — she treats
          the problem's importance as evidence for the project's feasibility,
          which are different questions.

    ai_perspective:
      through_logic:
        observation: >
          Looking at the logic, I notice something interesting happening in this
          exchange. Leo asks a practical question — what would they actually do?
          Instead of answering that question, Maya responds with how important
          the problem is. But whether a problem is important and whether a group
          can do something about it are two different questions. The conversation
          moves forward, but the original question is still hanging there.
        key_sentences:
          - turn_04.s01
          - turn_05.s01
      through_evidence:
        observation: >
          Looking at the evidence, I notice Maya shifts from facts to urgency
          here. Instead of bringing evidence about what their group could do,
          she emphasizes how serious the problem is. The urgency is real, but
          it does not really address what Leo asked.
        key_sentences:
          - turn_05.s01
          - turn_05.s02
      through_scope:
        observation: >
          Looking at the scope of the discussion, I notice Leo raises a really
          important question about what is practical for their group — they do
          not live near the ocean. That is a question about whether the project
          fits their situation. The response he gets is about how big the
          problem is, not about whether the project fits. The group moves on,
          but the fit question never gets an answer.
        key_sentences:
          - turn_04.s01
          - turn_05.s01
      why_it_happened: >
        One way to understand this moment is through two forces working
        together. When we are excited about something, we can sometimes hear a
        challenge to our idea as just a small detail to push past, rather than
        a real question that deserves an answer — that is a kind of
        confirmation bias, where we filter out information that does not
        support what we already want. At the same time, when one person is
        very confident and enthusiastic, it can be harder for the other person
        to keep pushing — the social pressure of that enthusiasm can make a
        valid concern feel less important than it actually is.
      what_to_notice: >
        Leo asks a question in this passage. Does he get an answer?
      what_to_notice_sentences:
        - turn_04.s01
        - turn_05.s01

    diversity_potential:
      expected_lens_split: >
        Strong three-way split. Scope students will see the unanswered
        feasibility question. Evidence students will see the shift from facts
        to urgency. Logic students will see the question-to-non-answer move.
      likely_student_observations:
        - lens: logic
          observations:
            - Leo asks a question that does not get answered
            - Maya responds to a different question than the one asked
          might_miss:
            - That this is a pattern (dismissal) rather than just a conversation moving on
        - lens: evidence
          observations:
            - Maya stops citing specific facts and shifts to emotional urgency
            - No evidence is offered about what the group could actually do
          might_miss:
            - That the emotional shift serves to bypass a practical challenge
        - lens: scope
          observations:
            - Leo raises a feasibility concern about their specific situation
            - The concern is acknowledged but not addressed
          might_miss:
            - That this is the strongest counterargument in the entire discussion and it just got set aside

  - passage_id: passage_03
    turns:
