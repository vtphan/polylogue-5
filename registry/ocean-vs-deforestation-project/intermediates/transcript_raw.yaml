scenario_id: ocean-vs-deforestation-project

personas:
  - name: Maya
    perspective: >
      Passionate about ocean pollution after watching a documentary about
      plastic in the Pacific Ocean.
  - name: Leo
    perspective: >
      Thinks deforestation is a more practical project because they could
      plant trees at their school.

turns:
  - speaker: Maya
    sentences:
      - text: "Okay so I watched this documentary last weekend about plastic in the ocean and it was like, so intense."
      - text: "I really think we should do our project on ocean pollution."

  - speaker: Leo
    sentences:
      - text: "I was actually thinking we could do deforestation, because I read about the Amazon fires and it's really bad too."
      - text: "Plus we could plant trees in the courtyard at school and actually see them grow."

  - speaker: Maya
    sentences:
      - text: "But did you know there's like millions of tons of plastic just floating in the Pacific right now?"
      - text: "Sea turtles are eating plastic bags because they think they're jellyfish, and the garbage patch out there is literally twice the size of Texas."

  - speaker: Leo
    sentences:
      - text: "That's really sad, but we don't even live near the ocean, so what would we actually do?"

  - speaker: Maya
    sentences:
      - text: "We can figure that part out later, the point is this is a huge problem."
      - text: "Like, animals are dying every single day because of this."

  - speaker: Leo
    sentences:
      - text: "I know, but with trees we could literally go outside and plant them."
      - text: "We could measure how much they grow and take pictures and stuff for our presentation."

  - speaker: Maya
    sentences:
      - text: "I mean, trees are cool, but ocean pollution is way bigger."
      - text: "We're talking about millions of animals dying, not just like one courtyard."
      - text: "Don't you think we should pick the one that actually matters more?"

  - speaker: Leo
    sentences:
      - text: "Yeah, I guess the documentary stuff does sound really important."

  - speaker: Maya
    sentences:
      - text: "Right, and imagine if our project could actually help save ocean animals!"
      - text: "We could make a real difference with this."

  - speaker: Leo
    sentences:
      - text: "But like, how would we even help with ocean pollution from here?"

  - speaker: Maya
    sentences:
      - text: "We could do like a beach cleanup day or make posters to spread awareness."
      - text: "It's gonna be awesome, trust me."

  - speaker: Leo
    sentences:
      - text: "Okay fine, let's do ocean pollution I guess."
