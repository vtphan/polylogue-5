scenario_id: ocean-vs-deforestation-project
topic: Whether to focus the group's environmental project on ocean pollution or deforestation
context: 'A 6th-grade STEM class is working on the PBL driving question: "What are the major threats affecting
  our global environment, and what can our communities do to protect our ecosystems?" This group needs
  to choose one environmental issue for their semester project. They''re debating between ocean pollution
  (one member saw a documentary about plastic in the Pacific) and deforestation (another member read about
  Amazon fires). They can only pick one.

  '
instructional_goals:
- Practice noticing when someone's evidence doesn't actually support the specific claim they're making
- Practice noticing when the group only considers one side of a question
personas:
- name: Maya
  perspective: 'Believes ocean pollution is the most urgent environmental issue and wants the group to
    choose it. She watched a documentary about the Great Pacific Garbage Patch and was deeply moved by
    footage of sea turtles trapped in plastic. She feels passionate that this is the problem that matters
    most and wants to do something about it.

    '
  knowledge: 'Watched a documentary about ocean plastic pollution. Knows facts about the Great Pacific
    Garbage Patch — millions of tons of plastic, thousands of miles across, harmful to marine life. Can
    cite specific numbers and images from the film. Has not researched what a school group could realistically
    do about ocean pollution or how ocean cleanup efforts actually work.

    '
  weaknesses: 'Gets swept up in dramatic facts and emotional reactions without stopping to ask whether
    those facts connect to what she''s actually proposing. Tends to treat big, impressive evidence as
    automatically relevant to any related decision, even when the scale doesn''t match. When someone raises
    a concern that threatens her preferred choice, she redirects to how important the problem is rather
    than addressing the concern itself. Confident enough in her position that she doesn''t feel the need
    to engage with pushback — she acknowledges it just enough to seem fair, then moves past it.

    '
- name: Ethan
  perspective: 'Thinks deforestation is the better project choice because it''s something they could actually
    do at their school — planting trees, starting a garden, reducing paper waste. He read about Amazon
    fires and cares about the issue, but his main argument is about what''s practical and doable for a
    school group.

    '
  knowledge: 'Read articles about Amazon deforestation and rainforest fires. Has some ideas about local
    tree-planting programs and school garden projects. Knows that their school has open space that could
    be used for planting. Less informed about ocean pollution specifically.

    '
  weaknesses: 'Tends to back down when someone is more enthusiastic or confident than he is, even when
    his own points are strong. Raises good concerns but doesn''t press them — if the other person doesn''t
    engage, he lets it go rather than insisting. More comfortable agreeing than pushing back, especially
    when the other person seems really sure of themselves.

    '
discussion_arc: 'The discussion opens with both personas stating their positions — Maya enthusiastic about
  ocean pollution, Ethan advocating for deforestation as more practical. Tension builds as Maya brings
  in dramatic documentary evidence that impresses both of them, while Ethan tries to steer toward feasibility.
  The critical turning point comes when Ethan raises his strongest concern — that they don''t live near
  the ocean and can''t actually do anything about this problem — and Maya dismisses it by redirecting
  to how urgent ocean pollution is. Ethan pushes back once more but less firmly. The discussion resolves
  when Ethan concedes, not because his concerns were answered but because Maya''s enthusiasm and confidence
  wore him down. They choose ocean pollution with Ethan''s practical concerns still hanging unresolved.

  '
turn_outline:
- speaker: Maya
  accomplishes: 'Opens with excitement about ocean pollution, mentions the documentary she watched and
    how it changed how she sees the problem.

    '
- speaker: Ethan
  accomplishes: 'Proposes deforestation instead, arguing they could actually plant trees at school — it''s
    something they can do, not just learn about.

    '
- speaker: Maya
  accomplishes: 'Brings in specific facts from the documentary — millions of tons of plastic in the Pacific,
    sea turtles getting trapped — to make the case that ocean pollution is the bigger, more important
    problem.

    '
- speaker: Ethan
  accomplishes: 'Acknowledges the documentary sounds serious but raises his first concern: deforestation
    lets them do something hands-on right here at their school.

    '
- speaker: Maya
  accomplishes: 'Doubles down on the scale of ocean pollution — it''s destroying whole ecosystems. Uses
    the drama of the evidence to argue this is what they should care about most.

    '
- speaker: Ethan
  accomplishes: 'Raises his strongest point directly: they don''t live near the ocean, so what would they
    actually do for an ocean pollution project? Questions whether they can really make a difference on
    something so far away.

    '
- speaker: Maya
  accomplishes: 'Brushes past the feasibility concern — says they can figure out the details later, what
    matters is picking the most important issue. Pivots back to how serious ocean pollution is.

    '
- speaker: Ethan
  accomplishes: 'Pushes back one more time, but less firmly — mentions that with trees they already know
    what they''d do, while ocean pollution still feels vague.

    '
- speaker: Maya
  accomplishes: 'Suggests they could do a beach cleanup or awareness campaign, quickly moving past Ethan''s
    concern. Talks about how ocean pollution affects everyone, even people who don''t live near the coast.

    '
- speaker: Ethan
  accomplishes: 'Starts to give in — says the documentary facts are pretty convincing and maybe ocean
    pollution is a bigger deal. His tone shifts from advocating to hedging.

    '
- speaker: Maya
  accomplishes: 'Takes his softening as agreement and gets more enthusiastic — starts talking about what
    their project could look like, treating the decision as basically made.

    '
- speaker: Ethan
  accomplishes: 'Agrees to go with ocean pollution. Mentions one last time that they still need to figure
    out what they''d actually do, but frames it as a detail rather than a real concern. The feasibility
    question is still unresolved but he''s stopped pressing it.

    '
