story_id: the-field-trip
episode_number: 1
scenario_id: the-field-trip-ep-01

passages:
  - passage_id: p1
    turn_range: [t01, t02, t03, t04, t05, t06, t07, t08, t09, t10, t11]

    facets_present:
      # --- Pass 1: target weaknesses from episode plan ---

      - facet_ref: inferential_validity
        label: Does the conclusion follow from the reasons given?
        lens: logic
        role: primary
        severity: strong
        evidence_turns: [t01, t05]
        one_line: >
          Maya chains "roller coasters are physics" to "the park is the best
          field trip" without checking whether the class studies physics or
          whether the park offers any structured learning. Her dismissal of
          Sam's proposal ("that's not really a field trip") substitutes a
          social redefinition for logical evaluation.

      - facet_ref: perspective_engagement
        label: Whose viewpoint is missing from the discussion?
        lens: scope
        role: primary
        severity: strong
        evidence_turns: [t02, t03, t07, t10]
        one_line: >
          Priya proposes the museum from a lifetime of free insider access and
          the committee treats her family connection as a credential rather than
          asking whether her experience is representative.

      # --- Pass 2: target strengths ---

      - facet_ref: relevance
        label: Does the evidence actually connect to the question being asked?
        lens: evidence
        role: strength
        severity: strong
        evidence_turns: [t04, t06]
        one_line: >
          Sam is the only committee member who starts from the assignment's
          actual criteria — cross-disciplinary questions — and proposes a
          subject that directly addresses what Integrated Studies is for.

      # --- Pass 3: emergent facets ---

      - facet_ref: relevance
        label: Does the evidence actually connect to the question being asked?
        lens: evidence
        role: primary
        severity: moderate
        evidence_turns: [t05, t07, t08, t10]
        one_line: >
          The committee evaluates proposals by how exciting the destination
          sounds rather than by how well the proposal answers the assignment's
          question, substituting "is this a cool field trip?" for "does this
          address cross-disciplinary learning?"

      - facet_ref: source_credibility
        label: Can we trust this source?
        lens: evidence
        role: cross_lens
        severity: subtle
        evidence_turns: [t02, t03]
        one_line: >
          Priya's casual mention of her mother's role at the museum functions
          as an implicit credential, and Maya's enthusiastic response treats
          insider access as evidence for the proposal's quality.

      - facet_ref: condition_sensitivity
        label: Under what conditions would this be true?
        lens: scope
        role: primary
        severity: moderate
        evidence_turns: [t01, t08]
        one_line: >
          Maya treats "roller coasters involve physics" as universally
          sufficient for educational value without asking what conditions —
          a physics teacher, structured worksheets, measurement time — would
          have to hold for the visit to actually teach physics.

      - facet_ref: sufficiency
        label: Is there enough evidence for this conclusion?
        lens: evidence
        role: cross_lens
        severity: subtle
        evidence_turns: [t01, t08]
        one_line: >
          Maya's entire case rests on one premise — roller coasters involve
          physics — which is thin support for the sweeping conclusion that the
          amusement park is "basically the perfect field trip." In t08 she
          endorses all proposals indiscriminately, treating enthusiasm as
          evaluation.

    facets_absent_but_tempting:
      - facet_ref: internal_consistency
        label: Do the claims contradict each other?
        why_tempting: >
          Maya says the park is "obviously" the best option while also
          enthusiastically endorsing Priya's museum, Jordan's zoo, and Kai's
          walking tour, which looks like she is contradicting her own claim.
        why_wrong: >
          Maya is not contradicting herself — she is being socially
          enthusiastic. Her "I love all of these" is social energy, not an
          argument that competes with her park pitch. She never retracts her
          claim that the park is the best; she just validates others' proposals
          as also cool. This is group_pressure behavior, not a logical
          inconsistency.

      - facet_ref: source_diversity
        label: Are there enough different sources?
        why_tempting: >
          Each committee member cites only their own experience or a single
          source tied to their preferred destination, which looks like a
          source-diversity failure.
        why_wrong: >
          This is the committee's first meeting where members are pitching
          initial proposals. The absence of multiple sources per proposal is
          expected at this stage and is not the analytical center of the
          episode. The real problems are the inferential leaps (inferential_validity),
          the unexamined perspectives (perspective_engagement), and the
          substituted question (relevance) — not the quantity of sources.

    lens_visibility:
      logic:
        engagement: partial
        affordance: rich
        what_shows: >
          Maya's argument has an explicit inferential chain with visible gaps.
          Every committee member builds backward from a preferred conclusion,
          but only Maya's chain is articulated enough for a student to trace
          the leaps. The Logic lens is richly afforded because the gap between
          "roller coasters are physics" and "therefore the park is the best
          field trip" is structural, not hidden.
      evidence:
        engagement: partial
        affordance: moderate
        what_shows: >
          Priya's family connection functions as implicit evidence that the
          committee accepts without scrutiny. Sam's cross-disciplinary
          framing is the strongest evidence-to-question connection in the
          passage but is dismissed. The Evidence lens is moderately afforded —
          a student can notice the relevance mismatch and the unexamined
          credential, but the passage does not foreground evidentiary claims
          as heavily as it foregrounds inferential structure.
      scope:
        engagement: none
        affordance: rich
        what_shows: >
          No committee member asks whose perspective is missing, what would
          happen if they chose a given destination, or under what conditions
          a proposal would actually work. The Scope lens is richly afforded
          precisely because it is absent — Priya's blind spot (her own
          financial and experiential position), the committee's failure to
          consider cost or accessibility, and the unconditional framing of
          every proposal all invite Scope analysis that the characters never
          perform.

    turn_annotations:
      - turn_id: t01
        speaker: Maya
        moves:
          - opening_pitch
          - inferential_chain
          - confidence_setting
        facet_signals:
          - facet_ref: inferential_validity
            polarity: weak
            strength: strong
          - facet_ref: condition_sensitivity
            polarity: weak
            strength: moderate
          - facet_ref: sufficiency
            polarity: weak
            strength: subtle
        why_it_matters: >
          Maya's opening pitch sets the room's energy and expectations. Her
          confident chain — roller coasters are physics, physics is real,
          real beats textbooks, therefore the park is the best — defines what
          a serious proposal sounds like for the rest of the meeting. Every
          subsequent speaker has to match or push against this frame.
        discussion_cue_seeds:
          - What does Maya skip between "roller coasters are physics" and "the park is the best field trip"?
          - Does the class actually study physics?
          - Is there a difference between something involving physics and something teaching physics?

      - turn_id: t02
        speaker: Priya
        moves:
          - validating_previous_speaker
          - structured_pitch
          - casual_credential_drop
        facet_signals:
          - facet_ref: perspective_engagement
            polarity: weak
            strength: strong
          - facet_ref: source_credibility
            polarity: weak
            strength: subtle
        why_it_matters: >
          Priya's pitch is polished and frames the museum as a case study in
          science communication — a legitimate academic angle. But the casual
          mention of her mother's role shifts how the committee hears the
          proposal: insider access becomes a reason to take it seriously,
          independent of the proposal's educational merit.
        discussion_cue_seeds:
          - Why does Priya know so much about the museum?
          - Does having a parent who works somewhere make the destination better for the class?
          - What would Priya's proposal sound like if she had never been to the museum?

      - turn_id: t03
        speaker: Maya
        moves:
          - enthusiastic_endorsement
          - treating_access_as_evidence
        facet_signals:
          - facet_ref: perspective_engagement
            polarity: weak
            strength: moderate
          - facet_ref: source_credibility
            polarity: weak
            strength: subtle
        why_it_matters: >
          Maya's excited reaction to the behind-the-scenes tour converts
          Priya's family connection from a personal detail into a committee
          asset. "That would make our proposal look so legit" treats insider
          access as evidence for quality, cementing the authority-deference
          dynamic.
        discussion_cue_seeds:
          - Does getting a behind-the-scenes tour make the museum a better educational destination?
          - What does "legit" mean here — educational quality or impressiveness?

      - turn_id: t04
        speaker: Sam
        moves:
          - reframing_question
          - criteria_check
          - concrete_proposal
        facet_signals:
          - facet_ref: relevance
            polarity: strong
            strength: strong
        why_it_matters: >
          Sam redirects the committee to the assignment's actual criteria.
          Her question — "shouldn't we start with the question, not the
          destination?" — is the episode's thesis statement, and her
          lunch-program proposal is the only one that starts from a genuine
          cross-disciplinary question. This is the strength that collapses.
        discussion_cue_seeds:
          - What is the difference between starting with a question and starting with a destination?
          - Why does Sam's approach fit what Integrated Studies is about?
          - Does anyone respond to Sam's actual point?

      - turn_id: t05
        speaker: Maya
        moves:
          - dismissal
          - inferential_redefinition
          - social_redirect
        facet_signals:
          - facet_ref: inferential_validity
            polarity: weak
            strength: strong
          - facet_ref: relevance
            polarity: weak
            strength: moderate
        why_it_matters: >
          Maya's dismissal — "that's not really a field trip, that's just the
          cafeteria" — redefines the question from "what addresses
          cross-disciplinary learning?" to "what counts as a real field trip?"
          The substitution is friendly and immediate, and it carries the room.
        discussion_cue_seeds:
          - What makes something a "real" field trip versus not?
          - Is Maya responding to Sam's reasoning or to the destination's glamour?
          - What happens to a good argument when the room has already decided what counts?

      - turn_id: t06
        speaker: Sam
        moves:
          - pushback
          - criteria_restatement
        facet_signals:
          - facet_ref: relevance
            polarity: strong
            strength: strong
        why_it_matters: >
          Sam's pushback is her clearest articulation of why her proposal fits:
          the lunch program touches science, civics, economics, and fairness,
          which is what cross-disciplinary means. She is clear but not loud,
          and the room has already moved on emotionally.
        discussion_cue_seeds:
          - Sam lists four subjects the lunch program touches. Does anyone check whether the other proposals do the same?
          - What is the difference between making a point clearly and making it effectively?

      - turn_id: t07
        speaker: Priya
        moves:
          - procedural_redirect
          - implicit_exclusion
        facet_signals:
          - facet_ref: perspective_engagement
            polarity: weak
            strength: strong
          - facet_ref: relevance
            polarity: weak
            strength: moderate
        why_it_matters: >
          Priya's pivot to logistics — "should we hear from Jordan and Kai?" —
