          not by argument.
        discussion_cue_seeds:
          - Priya says "four strong options." How many proposals were actually made?
          - Did anyone give a reason why Sam's idea was removed?
          - What is the difference between a summary and a decision?

      - turn_id: t11
        speaker: Maya
        moves:
          - closing_enthusiasm
          - false_progress_signal
        facet_signals:
          - facet_ref: relevance
            polarity: weak
            strength: subtle
        why_it_matters: >
          Maya's closing line — "we have so many good options" — reinforces
