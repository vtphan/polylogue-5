              evidence_turns: [t02, t03]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Priya's egocentric_thinking means she cannot see her own positional
            bias, and authority_deference means the committee cannot see it
            either. The cognitive pattern produces the blind spot; the social
            dynamic ensures nobody in the room compensates for it.

        - facet_ref: relevance
          cognitive:
            - pattern_ref: confirmation_bias
              label: Confirmation bias
              one_line: >
                Every committee member except Sam selected a destination first
                and built a justification backward, which means their evidence
                is filtered to support their preferred conclusion rather than
                to answer the assignment's question.
              evidence_turns: [t01, t02, t05, t08]
          social:
            - dynamic_ref: group_pressure
              label: Group pressure
              one_line: >
                The committee's collective momentum redefines the question from
                "what cross-disciplinary topic should we study?" to "which
                destination is coolest?", making Sam's on-target proposal feel
                irrelevant by social consensus rather than by argument.
              evidence_turns: [t05, t07, t10]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Each member's individual confirmation_bias leads them to substitute
            a preferred question for the assigned one, and the group_pressure
            of collective momentum ratifies the substitution — once everyone
            is playing "pick a destination," Sam's "find a question" approach
