          framing lists "Maya's park, my museum" as the established options,
          implicitly closing the door on Sam's question-first approach without
          engaging with it.
        discussion_cue_seeds:
          - Priya says "we have Maya's park, my museum" — what happened to Sam's idea?
          - Is moving on the same as deciding?
          - What is the difference between being organized and being dismissive?

      - turn_id: t08
        speaker: Maya
        moves:
          - social_facilitation
          - undifferentiated_enthusiasm
        facet_signals:
          - facet_ref: relevance
            polarity: weak
            strength: subtle
        why_it_matters: >
          Maya endorses Jordan's zoo and Kai's walking tour with the same
          undifferentiated enthusiasm she brought to her own pitch. "I honestly
          love all of these" treats all proposals as equally good without
          examining whether any of them answer the assignment's question.

      - turn_id: t09
        speaker: Sam
        moves:
          - quiet_persistence
        why_it_matters: >
          Sam's single sentence — "my idea's still on the table" — is the
          minimum assertion of presence. She neither withdraws nor fights.
          The turn is load-bearing as a social marker: it shows Sam staying
          in the conversation without the conversation staying with her.

      - turn_id: t10
        speaker: Priya
        moves:
          - summary
          - implicit_exclusion
          - ratifying_outcome
        facet_signals:
          - facet_ref: perspective_engagement
            polarity: weak
            strength: strong
          - facet_ref: relevance
            polarity: weak
            strength: moderate
        why_it_matters: >
          Priya's summary lists "four strong options" and omits Sam's proposal.
