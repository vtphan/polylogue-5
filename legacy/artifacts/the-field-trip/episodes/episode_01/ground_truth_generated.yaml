    perspective_transitions:
      - from: logic
        to: scope
        trigger: >
          A student notices Maya's inferential chain has gaps (Logic) and then
          asks why nobody on the committee questioned it.
        what_they_gain: >
          The Scope lens reveals that the committee's failure to question
          Maya's chain is not just a logical oversight — it is a perspective
          failure. The room defined "serious proposal" by Maya's energy and
          Priya's polish, which excluded Sam's question-first approach.
        what_they_realize: >
          The gaps in reasoning are not just logical errors — they survive
          because the group's social dynamics protect them from scrutiny.
        prompt: >
          You noticed the leap in Maya's argument. Now ask: why did nobody
          in the committee catch it? What does that tell you about how the
          group decided what counted as a good proposal?

      - from: evidence
        to: logic
        trigger: >
          A student notices that Priya's family connection is treated as
          evidence for the museum's quality (Evidence) and then examines the
          inferential step from "insider access" to "better proposal."
        what_they_gain: >
          The Logic lens reveals that the committee made an inferential leap:
          "Priya's mom works there" does not logically lead to "the museum is
          the best destination for our class." The connection between the
          evidence and the conclusion has a structural gap.
        what_they_realize: >
          Having a connection to a place is not the same as having a reason
          to go there. The committee confused access with argument.
        prompt: >
          You noticed the committee was impressed by Priya's museum
          connection. Now trace the logic: how does "my mom works there" lead
          to "the museum is the best field trip for our class"? What steps
          are missing?

      - from: scope
        to: evidence
        trigger: >
          A student notices that Sam's proposal was dismissed without
          engagement (Scope — her perspective was excluded) and then asks
          what evidence Sam actually offered.
        what_they_gain: >
          The Evidence lens reveals that Sam's proposal had stronger
          evidentiary grounding than the committee recognized: she named
          four subject areas the lunch program touches, directly connecting
          to the assignment's cross-disciplinary criteria.
        what_they_realize: >
          The committee dismissed Sam's idea without evaluating her evidence.
          The exclusion was social, not evidentiary — her evidence was actually
          the most relevant.
        prompt: >
          The committee moved past Sam's idea quickly. Before you decide
          whether they were right, look at what Sam actually said. What
          evidence did she give, and how does it compare to what Maya and
          Priya offered?

    counterfactuals:
      - facet_ref: inferential_validity
        evidence_turn: t01
        what_would_fix_it: >
          Maya could have paused after "roller coasters are applied physics"
          and asked: "Does our class actually study physics? And does the park
          offer structured learning, or would we just be riding rides?" This
          would expose the gap between "involves physics" and "teaches physics
          for our class."

      - facet_ref: perspective_engagement
        evidence_turn: t02
        what_would_fix_it: >
          After Priya mentioned her mother's role, any committee member could
          have asked: "That's cool that you know the museum so well — but
          does that change what the visit would be like for the rest of us
          who've never been?" This would separate Priya's experience from
          the proposal's educational merit.

      - facet_ref: relevance
        evidence_turn: t05
        what_would_fix_it: >
          Instead of dismissing Sam's proposal as "just the cafeteria," Maya
          could have engaged with Sam's framing: "Okay, but how does visiting
          a kitchen count as cross-disciplinary?" This would force the
          committee to evaluate Sam's proposal on the assignment's criteria
          rather than on destination glamour.

      - facet_ref: source_credibility
        evidence_turn: t03
        what_would_fix_it: >
          When Maya said the behind-the-scenes tour would "make our proposal
          look so legit," someone could have asked: "Does getting special
          access make the museum a better learning destination, or does it
          just make us look impressive?" This would distinguish between the
          credential's social value and its educational relevance.

      - facet_ref: condition_sensitivity
        evidence_turn: t01
        what_would_fix_it: >
          Any committee member could have asked Maya: "Under what conditions
          would the amusement park actually teach us physics? Would we need
          worksheets, a physics teacher, time to measure things?" This would
          convert Maya's unconditional claim into a testable one.

      - facet_ref: sufficiency
        evidence_turn: t01
        what_would_fix_it: >
          After Maya's pitch, someone could have asked: "You said roller
          coasters are physics — is that the whole argument? What else makes
          the park educational?" This would surface the thinness of the
          evidence base.

      - facet_ref: relevance
        evidence_turn: t07
        what_would_fix_it: >
          When Priya moved to hear from Jordan and Kai, someone could have
          said: "Wait — Sam raised a point about starting with the question
          instead of the destination. Can we respond to that before we move
          on?" This would have forced the committee to engage with the
          criteria-first approach.

