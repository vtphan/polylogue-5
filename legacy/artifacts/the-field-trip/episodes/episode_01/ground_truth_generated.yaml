    causal_layer:
      facets_explained:
        - facet_ref: inferential_validity
          cognitive:
            - pattern_ref: confirmation_bias
              label: Confirmation bias
              one_line: >
                Maya picked the amusement park first and built her reasoning
                backward to justify it, filtering for premises that support her
                preferred conclusion while skipping the question of whether the
                class studies physics.
              evidence_turns: [t01, t05]
          social:
            - dynamic_ref: group_pressure
              label: Group pressure
              one_line: >
                Maya's confident, energetic delivery makes the room treat her
                argument as stronger than it is; Jordan and Kai nod along, and
                Sam's quieter follow-up has to push against the momentum Maya
                created.
              evidence_turns: [t01, t03, t05, t08]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Maya's confirmation_bias produces an inferential chain with gaps,
            and group_pressure amplifies the effect — her social energy makes
            the room accept the chain without examining it. The gap in the
            argument would be easier to see if the room were not already
            nodding along.

        - facet_ref: perspective_engagement
          cognitive:
            - pattern_ref: egocentric_thinking
              label: Egocentric thinking
              one_line: >
                Priya sees the museum as obviously the best destination because
                she experienced it from the inside — free access, staff she
                knows by name — without recognizing that her perspective is a
                perspective, not an objective assessment.
              evidence_turns: [t02]
          social:
            - dynamic_ref: authority_deference
              label: Authority deference
              one_line: >
                The committee defers to the implied credibility of Priya's
                family connection — her mother runs the museum's education
                department — treating insider access as evidence for the
                proposal's quality rather than asking whether it biases the
