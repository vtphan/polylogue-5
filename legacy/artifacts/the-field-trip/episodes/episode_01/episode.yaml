# Episode Plan — the-field-trip episode 1
# Generated by planning_agent

scenario_id: the-field-trip-ep-01
story_id: the-field-trip
episode_number: 1

topic: >
  The field trip committee's first meeting — each member pitches their
  proposal and the group decides which ideas stay on the whiteboard.

context: >
  Ms. Tsai's 6th grade Integrated Studies class has one field trip this year.
  The class's premise is asking questions that cut across subjects. A five-person
  student committee must propose both a subject and a destination, submitting a
  written recommendation evaluated on reasoning quality, not conclusion. This is
  the committee's first meeting: each member presents a proposal they came in
  already wanting, with an educational justification built backward from the
  destination.

instructional_goals:
  - >
    Recognize when an argument's structure sounds convincing but contains
    logical leaps between premises and conclusion.
  - >
    Notice when a speaker's personal experience or insider connections shape
    how the group evaluates a proposal, independent of the proposal's merit.
  - >
    Identify when the strongest argument in the room fails to land because
    the group has already decided what counts as a serious answer.

discussion_dynamic: >
  Five committee members enter with pre-formed preferences. Maya goes first
  and sets the room's energy high — her confident, fast-paced pitch makes the
  committee expect proposals that are exciting and structured. Priya follows
  with a polished, carefully framed pitch that benefits from a casually
  mentioned family connection to the museum. Jordan and Kai add their proposals
  briefly. By the time Sam speaks, the committee has implicitly defined a
  "real field trip" as a glamorous destination with an educational overlay.
  Sam's proposal — the only one that starts from a genuine cross-disciplinary
  question — doesn't fit the mold and is dismissed as unglamorous. The meeting
  ends with four proposals on the whiteboard and Sam's crossed out. The group
  agrees to "research their options," which in practice means each person will
  look for evidence that supports the destination they already want.

personas:
  - name: Maya
    perspective: >
      Believes the amusement park is the most educational option because roller
      coasters are applied physics and seeing it in person beats reading about
      it. She came in wanting the amusement park and built her justification
      around it.
    knowledge: >
      Knows that roller coasters involve physics concepts like velocity,
      acceleration, and gravity. Has not checked whether the class is studying
      physics or whether the amusement park offers any structured learning
      experience.
    weaknesses: >
      Builds arguments that sound airtight in the moment but skip important
      steps. She chains ideas together confidently — roller coasters are physics,
      physics is real, real is better than books — without noticing the leaps
      between each link. Her enthusiasm is contagious, which means the room
      tends to nod along before anyone has actually examined what she said.
      She picked her destination first and built her reasoning to match, so
      she only notices information that supports the amusement park.
    strengths: >
      Genuinely good at building structured arguments and presenting them with
      energy and clarity. Her ability to construct a logical chain is a real
      skill — the problem is where she points it, not that she has it.

  - name: Priya
    perspective: >
      Believes the science museum is the best destination because it offers a
      case study in how science gets communicated to the public. She is
      confident in the proposal's rigor and sees insider access as a practical
      advantage.
    knowledge: >
      Grew up visiting the science museum — her mother is the education director
      there. Knows the staff by name, has been behind the scenes, and has a
      detailed understanding of what the museum offers. Has not considered what
      the museum experience looks like for someone who has never been there or
      who would need to pay $18 to attend.
    weaknesses: >
      Cannot see that her lifelong familiarity with the museum is doing the work
      her argument claims to do. She genuinely believes the museum is the best
      option for the whole class, but the belief is built on a lifetime of free
      access and personal connections she has never examined. When she mentions
      her mother's role, it is honest and natural — but the committee treats the
      insider connection as evidence for the proposal rather than asking whether
      it might shape the proposer's view.
    strengths: >
      Articulate, careful with structure, and usually the first person in any
      group to notice when a conversation is leaving someone out. Her proposals
      are well-organized and she presents them with precision.

  - name: Sam
    perspective: >
      Believes the committee should start with a question that cuts across
      subjects — which is what Integrated Studies is for — and then find a
      destination that answers it, rather than picking a destination and
      inventing a question to justify it.
    knowledge: >
      Thought about what Integrated Studies is actually about and came up with
      a set of cross-disciplinary questions about the school lunch program:
      where the food comes from, who decides the menu, what happens when
      families can't pay. Proposes visiting Greenleaf Dining's central kitchen.
    weaknesses: >
      Quiet and methodical in a room that rewards energy and polish. She makes
      her case once, clearly, but does not push when it is dismissed. She
      participates in the rest of the discussion without withdrawing, but also
      without fighting for her idea when the room moves past it.
    strengths: >
      Consistently asks whether the group is answering the question it was
      actually asked, not a different question it would prefer. She is the only
      committee member who started from the assignment's criteria rather than
      from a destination she already wanted. Her proposal directly addresses
      what Integrated Studies is supposed to do.

target_facets:
  - facet_id: inferential_validity
    target_quality: weak
    primary_lens: logic
    also_visible_through: []
    designed_explanation:
      cognitive_pattern: confirmation_bias
      social_dynamic: group_pressure
      cognitive_signal: >
        Maya builds a confident chain — roller coasters are applied physics,
        physics is a real subject, seeing it in person beats reading about it,
        therefore the amusement park is the most educational option — and
        treats each link as self-evident without noticing the chain skips the
        question of whether the class is studying physics at all.
      social_signal: >
        Maya's pitch lands with infectious energy; after she finishes, Jordan
        and Kai nod along before they've examined the argument, and Sam's
        quieter follow-up has to push against the room's momentum rather than
        start fresh.
      interaction_note: >
        confirmation_bias and group_pressure chain: Maya filtered her
        reasoning to reach the amusement park, and her confidence makes the
        room treat the argument as stronger than it is. The social energy
        from Maya's pitch is what makes Sam's proposal feel flat by
        comparison — not the quality of the reasoning.
    carrier_persona: Maya
    signal_mechanism: >
      Maya pitches the amusement park with a rapid, confident chain of
      reasoning — roller coasters involve physics, physics is educational,
      therefore the park is the best field trip — and her energy carries the
      room. The chain sounds complete but leaps past a critical question:
      whether the class is studying physics at all. The committee responds to
      Maya's confidence rather than her logic, and by the time Sam speaks,
      the room's momentum has already defined what a serious proposal sounds
      like. Sam's quieter, question-first approach has to push against that
      momentum instead of starting on equal footing.

  - facet_id: perspective_engagement
    target_quality: weak
    primary_lens: scope
    also_visible_through:
      - evidence
      - logic
    designed_explanation:
      cognitive_pattern: egocentric_thinking
      social_dynamic: authority_deference
      cognitive_signal: >
        Priya proposes studying how science gets communicated to the public,
        using the museum as a case study. The proposal is well-constructed
        and rigorous-sounding, but Priya does not notice that her familiarity
        with the museum — she grew up visiting for free, knows the staff by
        name — is doing the work her argument claims to do. She sees the
        museum as obviously the best destination because it is the only
        destination she has experienced from the inside.
      social_signal: >
        Priya casually mentions that her mother works at the museum's
        education department, framing it as a logistical advantage ("we could
        probably get a behind-the-scenes tour"), and the committee treats this
        insider access as evidence for the proposal's quality rather than
        asking whether it biases the proposer.
      interaction_note: >
        The egocentric_thinking here is positional, not selfish — Priya
        genuinely believes the museum is best for the class, but the belief
        is built on a lifetime of access she has not examined. The
        authority_deference is subtle: the committee defers not to Priya's
        mother directly but to the implied credibility of someone whose
        parent runs an educational institution. This is the setup for Priya's
        growth arc — the kid best at asking "whose perspective is missing?"
        cannot see that her own financial and experiential position is the
        missing perspective.
    carrier_persona: Priya
    signal_mechanism: >
      Priya presents a polished proposal for the science museum, framing it
      as a case study in science communication. The proposal sounds rigorous,
      but Priya's confidence comes from a lifetime of free access — her mother
      runs the museum's education department, and Priya knows the building
      from the inside. She casually mentions this connection as a logistical
      perk ("we could probably get a behind-the-scenes tour"), and the
      committee receives the insider access as a point in the proposal's favor
      rather than wondering whether it might be shaping Priya's view. The
      committee defers to the implied credibility of someone whose parent
      works at an educational institution, and nobody asks whether Priya's
      experience of the museum is representative of what the trip would
      actually be like for the rest of the class.

target_strengths:
  - facet_id: relevance
    primary_lens: evidence
    also_visible_through:
      - logic
    carrier_persona: Sam
    signal_mechanism: >
      Sam is the only committee member who starts from the assignment's actual
      criteria. While everyone else picks a destination and invents a
      justification, Sam asks what Integrated Studies is for — cross-disciplinary
      questions — and proposes a subject (the school lunch program) that
      genuinely cuts across science, civics, economics, and equity. Her
      argument directly addresses what the committee was asked to do. But the
      committee has already decided the game is "pick a cool destination," not
      "find a good question," so Sam's on-target reasoning is dismissed as
      unglamorous. The strength is visible to the careful reader even though
      the committee cannot see it.
    contrastive_note: >
      Every other committee member built their argument backward from a
      preferred destination, producing justifications that sound educational
      but don't address the actual assignment. Sam is the contrast: she
      started from the assignment and worked forward to a destination. The
      committee's failure to recognize this is part of the episode's design.

discussion_arc: >
  The meeting opens with Ms. Tsai reminding the committee of the criteria
  and leaving. Maya goes first, setting the bar high with energy and a
  confident chain of reasoning. Priya follows with a polished, structured
  pitch that benefits from her casual mention of a family connection.
  Jordan and Kai add their proposals briefly. When Sam speaks, her
  question-first approach — "shouldn't we start with the question, not
  the destination?" — is the right answer to the assignment but the wrong
  answer to the room. The committee is polite but dismissive. Sam tries
  once more to explain why the question matters, but Maya's earlier
  momentum and Priya's polish have already defined what a serious proposal
  looks like. The meeting ends with four proposals on the whiteboard,
  Sam's crossed out, and an agreement to "research options" — which
  everyone understands means finding evidence for the destination they
  already want.

turn_outline:
  - speaker: Maya
    accomplishes: >
      Opens by pitching the amusement park with energy and a fast chain of
      reasoning: roller coasters are applied physics, physics is educational,
      real experience beats textbooks, therefore the park is the best option.
      She delivers it like it's obvious.

  - speaker: Priya
    accomplishes: >
      Nods appreciatively at Maya's energy, then presents the science museum
      proposal with careful structure — framing it as studying how science gets
      communicated to the public. Casually mentions that her mother works in
      the museum's education department and they could probably get a
      behind-the-scenes tour.

  - speaker: Maya
    accomplishes: >
      Responds enthusiastically to Priya's mention of the behind-the-scenes
      tour, treating the insider access as a reason the museum proposal is
      strong — "wait, that's actually really cool" — rather than questioning
      whether it shapes Priya's recommendation.

  - speaker: Sam
    accomplishes: >
      Asks the committee to step back: "We're supposed to ask questions that
      cut across subjects, right? So shouldn't we start with the question,
      not the destination?" Proposes studying the school lunch program as an
      example of a genuinely cross-disciplinary question — where the food
      comes from, who decides the menu, what happens when families can't pay.

  - speaker: Maya
    accomplishes: >
      Jumps in before anyone can engage with Sam's point, redirecting the
      energy: "That's not really a field trip though, that's just the
      cafeteria." Her dismissal is friendly but immediate, and it carries the
      room — Jordan and Kai smile or nod.

  - speaker: Sam
    accomplishes: >
      Pushes back once, plainly: the lunch program touches science, civics,
      economics, and equity, which is exactly what cross-disciplinary means.
      She is clear but not loud, and the room has already moved on emotionally.

  - speaker: Priya
    accomplishes: >
      Moves past Sam's point without engaging it, pivoting to logistics:
      "So we have Maya's park, my museum — should we hear the others?" Her
      tone is organizing, not dismissive, but the effect is the same: Sam's
      proposal is treated as already handled.

  - speaker: Maya
    accomplishes: >
      Agrees with Priya's move to keep things going. Jordan briefly pitches
      the zoo (citing his volunteer experience and its educational
      certifications), and Kai pitches the downtown walking tour (free, close,
      back before lunch). Maya reacts positively to both, keeping the energy up.

  - speaker: Sam
    accomplishes: >
      Watches the four proposals go up on the whiteboard without protesting.
      When someone glances at her, she says her idea is still on the table
      but does not fight for it. She stays in the conversation.

  - speaker: Priya
    accomplishes: >
      Summarizes: they have four strong proposals and should each research
      their option before the next meeting. She does not list Sam's proposal
      among the four. Her summary is efficient and sounds fair, but it has
      quietly ratified the exclusion.

  - speaker: Maya
    accomplishes: >
      Caps the meeting with enthusiasm — "This is going to be awesome, we
      have so many good options" — reinforcing the feeling that the committee
      made progress, even though nobody examined whether the proposals
      actually answer the assignment's question.
