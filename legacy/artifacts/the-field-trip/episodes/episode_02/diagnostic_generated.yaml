# ──────────────────────────────────────────────
# §3  STRUGGLE CALIBRATION
# ──────────────────────────────────────────────

struggle_calibration:
  by_passage:
    p1:
      pace: standard
      minimum_wrestling:
        - selected_a_facet
        - viewed_turn_for_15s
      productive_duration: moderate

# ──────────────────────────────────────────────
# §4  OTHER BLOCKS
# ──────────────────────────────────────────────

introduces:
  - source_credibility
  - sufficiency
  - uncritical_acceptance
  - authority_deference
  - confirmation_bias

assumes_familiar_with:
  - inferential_validity
  - perspective_engagement
  - reasoning_completeness
  - relevance

character_arc_position: rising_action

growth_beats:
  Jordan:
    position: setup
    note: >
      Jordan's trust in official-sounding sources is established as a
      pattern — he defers to the brochure's credentials without
      questioning them. When challenged, he re-reads rather than
      re-evaluates.
  Maya:
    position: setup
    note: >
      Maya's ability to analyze others' reasoning is demonstrated
      alongside her blind spot for her own. She catches Jordan's gap
      but cannot see the identical gap in her own evidence.
  Sam:
    position: setup
    note: >
      Sam's role as the committee's overlooked voice is established.
      Her questions are the most relevant to the assignment, but the
      committee does not engage because her contribution doesn't look
      like everyone else's.

response_space:
  by_lens:
    logic:
      likely: >
        Students will notice Maya catching the science-vs-Integrated-Studies
        gap in Jordan's argument, which is the most visible logic move.
      partial: >
        Students may recognize Maya's point is correct but miss that the
        same gap applies to her own physics-class video.
      misreading: >
        Students may think Maya is just being competitive or trying to
        tear Jordan down, missing that her observation is analytically sound.
      blindspot: >
        The selective application of logic — Maya applies it outward but
        not inward — is the hardest observation for this age group.
    evidence:
      likely: >
        Students will notice Maya's single-video evidence and may question
        whether it's enough. Jordan's brochure is more challenging because
        it looks credible.
      partial: >
        Students may notice Jordan's brochure is from the zoo but not
        fully understand why that matters (promotional vs. independent).
      misreading: >
        Students may flag source diversity (everyone brought only one
        source) rather than source credibility (the brochure is
        self-promotional) or sufficiency (one video is not enough).
      blindspot: >
        The distinction between a source being real and a source being
        appropriate for the question being asked is difficult — the
        brochure is not fake or wrong, it's just the wrong kind of
        source.
    scope:
      likely: >
        Sam's observation that nobody researched anyone else's destination
        is the most accessible scope observation.
      partial: >
        Students may notice the committee moved past Sam's questions
        without recognizing this as a perspective-engagement failure.
      misreading: >
        Students may think Sam is unhelpful because she didn't pick a
        destination, missing that her questions are the most relevant
        research.
      blindspot: >
        The committee's comfortable feeling of progress (everyone
        presented, so we must be ready) masking the absence of actual
        evaluation is subtle.
