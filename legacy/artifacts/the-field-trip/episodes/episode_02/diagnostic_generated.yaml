# Diagnostic — the-field-trip episode 2
# Generated by diagnostic_agent

story_id: the-field-trip
episode_number: 2
scenario_id: the-field-trip-ep-02

# ──────────────────────────────────────────────
# §1  PROBES — the routing layer
# ──────────────────────────────────────────────

probes:
  facet:
    by_turn:

      t01:
        trigger: inactivity_or_manual
        question: >
          Jordan reads from the zoo brochure and says the zoo is "literally
          certified." What are you noticing about how he's using that brochure?
        options:
          - text: >
              He's treating the brochure like proof the zoo is a good choice,
              but the brochure was written by the zoo to get schools to visit.
            routes_to: {facet: source_credibility, role: present}
          - text: >
              He mentions science standards, but the committee isn't in a
              science class — that doesn't match.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t02:
        trigger: inactivity_or_manual
        question: >
          Sam asks "Certified for what, though?" What are you noticing
          about her question?
        options:
          - text: >
              She's asking Jordan to explain what the certification actually
              means instead of just accepting it.
            routes_to: {facet: source_credibility, role: present}
          - text: >
              She brought questions instead of evidence — maybe she should
              have looked up a destination too.
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t03:
        trigger: inactivity_or_manual
        question: >
          When Sam asks what "certified" means, Jordan re-reads the same line
          from the brochure more slowly. What are you noticing about that?
        options:
          - text: >
              He's just reading the brochure again instead of actually
              thinking about what the certification means.
            routes_to: {facet: source_credibility, role: present}
          - text: >
              Nobody else on the committee is pushing back or asking their
              own questions about it.
            routes_to: {facet: perspective_engagement, role: afforded_missing}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t04:
        trigger: inactivity_or_manual
        question: >
          Maya presents a YouTube video of a teacher who took students to a
          roller coaster park. What are you noticing about her evidence?
        options:
          - text: >
              She found one video and is acting like it proves her whole point,
              but there are a lot of differences between that video and their
              situation.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              She's making a big leap — just because one teacher did it
              doesn't mean it would work for their committee.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: >
              She only looked for things that support what she already wanted
              and stopped as soon as she found something.
            routes_to: {facet: sufficiency, role: present}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t05:
        trigger: inactivity_or_manual
        question: >
          Sam reads her list of questions — about the lunch menu, where the
          food comes from, what happens if a family can't pay. What are you
          noticing about what she brought?
        options:
          - text: >
              Her questions actually connect to what Integrated Studies is
              about — looking at real problems from different angles.
            routes_to: {facet: relevance, role: present}
          - text: >
              She's the only one who started with questions instead of
              already having an answer she wanted to prove.
            routes_to: {facet: relevance, role: present}
          - text: >
              Everyone only brought one thing — one brochure, one video,
              one list — that doesn't seem like enough sources.
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t06:
        trigger: inactivity_or_manual
        question: >
          After Sam reads her questions, Jordan says "Okay cool" and asks
          if anyone else brought something. What are you noticing about
          how the committee responds to Sam?
        options:
          - text: >
              They're moving past Sam's questions like she didn't really
              contribute anything, even though her questions are good.
            routes_to: {facet: perspective_engagement, role: present}
          - text: >
              Jordan is keeping the meeting organized, which is helpful.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t07:
        trigger: inactivity_or_manual
        question: >
          Maya tells Jordan that his brochure says "science standards" but
          they're in Integrated Studies, not science class. What are you
          noticing about what Maya caught?
        options:
          - text: >
              She spotted a real problem — the zoo's certification is for
              science, but their class is something different.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              She caught a gap in Jordan's argument, but the same gap
              applies to her own video — that was a physics class, not
              Integrated Studies either.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              Each person only has one source — the committee needs more
              variety in their evidence.
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t08:
        trigger: inactivity_or_manual
        question: >
          Jordan can't find "Integrated Studies" in the brochure, so he says
          "but it's still a real educational program." What are you noticing?
        options:
          - text: >
              He's holding onto the brochure even after Maya showed that
              the certification doesn't match their class.
            routes_to: {facet: source_credibility, role: present}
          - text: >
              He's making a leap — "it's educational" doesn't mean it's
              right for their specific class.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t09:
        trigger: inactivity_or_manual
        question: >
          Maya keeps pushing — "science standards and Integrated Studies are
          literally different things." What are you noticing about how she
          uses this observation?
        options:
          - text: >
              She's right about Jordan's gap, but she doesn't notice that
              her own video has the exact same problem.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              She's doing a good job of analyzing Jordan's argument carefully.
            routes_to: {facet: inferential_validity, role: present}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t10:
        trigger: inactivity_or_manual
        question: >
          Sam asks "Has anyone here actually looked at a destination that
          isn't their own?" What are you noticing about her observation?
        options:
          - text: >
              She noticed that every person only researched the place they
              already wanted — nobody checked anyone else's idea.
            routes_to: {facet: relevance, role: present}
          - text: >
              She's pointing out that the committee isn't really considering
              each other's viewpoints — they're just taking turns presenting.
            routes_to: {facet: perspective_engagement, role: present}
          - text: >
              Everyone only brought one source — the committee needs more
              evidence overall.
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t11:
        trigger: inactivity_or_manual
        question: >
          Jordan says "should we just vote next time?" right after Sam's
          observation. What are you noticing about that?
        options:
          - text: >
              He's moving to a vote even though nobody actually looked at
              anyone else's evidence.
            routes_to: {facet: perspective_engagement, role: present}
          - text: >
              He's making a logical leap from "we presented" to "we're
              ready to vote."
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t12:
        trigger: inactivity_or_manual
        question: >
          Maya says "We all did our research, so let's just pick next
          meeting." What are you noticing about her closing comment?
        options:
          - text: >
              She's saying they're ready to decide, but presenting evidence
              isn't the same as actually thinking about it together.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              Everyone only looked at their own destination — the committee
              doesn't have a full picture of the options.
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

  explanation:
    by_turn_facet:

      t01.source_credibility:
        question: >
          Why do you think Jordan treats the brochure's credentials as
          if they settle the question?
        options:
          - text: >
              He sees the words "state-certified" and "science standards"
              and believes them without checking what they actually mean.
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: >
              The brochure sounds official and professional, so the whole
              committee goes along with it instead of questioning it.
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: >
              Both — Jordan trusts it because it sounds official, and
              the committee trusts Jordan because he sounds confident
              reading it.
            routes_to: {explanatory_variable: interaction}
          - text: >
              He just didn't have time to do more research.
            routes_to: {explanatory_variable: tempting_absent}

      t04.sufficiency:
        question: >
          Why do you think Maya is treating one video as enough proof?
        options:
          - text: >
              She already believed amusement parks are educational and
              stopped looking as soon as she found something that agreed
              with her.
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: >
              One exciting video with two million views feels convincing
              even though it's just one example.
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: >
              She didn't realize she needed more than one source.
            routes_to: {explanatory_variable: tempting_absent}

# ──────────────────────────────────────────────
# §2  INTERVENTIONS — per-turn three-role dictionary
# ──────────────────────────────────────────────

interventions:
  by_turn:

    # ── t01: Jordan presents the brochure ──

    t01:
      blank_page:
        opening: >
          Let's look at what Jordan is doing with the zoo brochure.
        ladder:
          - type: nudge
            text: >
              Read what Jordan says about the brochure. What is he using
              it to prove?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Who wrote this brochure, and why did they write it?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              The brochure was made by the zoo to get schools to visit.
              Jordan is reading it as if someone outside the zoo wrote it
              to evaluate the zoo.
            reveals: 3
            cost: 1

      by_facet:
        source_credibility:
          role: present
          opening: >
            You noticed something about how Jordan is using the brochure
            as his evidence.
          ladder:
            - type: question
              text: >
                Jordan says the zoo is "literally certified." Who gave
                the zoo that certification — and who wrote the brochure
                he's reading from?
              reveals: 1
              cost: 0
            - type: question
              text: >
                If a restaurant wrote its own review saying "best food
                in town," would you trust that the same way you'd trust
                a review from someone who doesn't work there?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                The brochure is the zoo's own advertising material. It
                was written to convince schools to book field trips.
                Jordan is treating it like an outside expert said the
                zoo is great for learning.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Jordan could have asked what "state-certified" actually
                certifies and whether a brochure written by the zoo to
                attract school groups is the right source to evaluate the
                zoo's educational value for an Integrated Studies class.
              reveals: 4
              cost: 2
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - type: question
                    text: >
                      Jordan sees "state-certified" and stops questioning.
                      What is it about those words that makes him feel
                      like the case is closed?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      He accepts the credential at face value — the words
                      sound official, so he trusts them without checking
                      what they actually mean.
                    reveals: 2
                    cost: 1
              social:
                ladder:
                  - type: question
                    text: >
                      After Jordan reads the credentials, does anyone on
                      the committee push back? What does that tell you?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      The official-sounding language doesn't just convince
                      Jordan — it convinces the room. Everyone treats the
                      credentials as settling the question.
                    reveals: 2
                    cost: 1
              interaction:
                ladder:
                  - type: question
                    text: >
                      Jordan doesn't question the brochure, and the
                      committee doesn't question Jordan. What happens
                      when both of those things are true at the same time?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      It's a double pass — Jordan trusts the source because
                      it sounds official, and the committee trusts Jordan
                      because he sounds confident. The credential goes
                      through two checkpoints and nobody stops to examine it.
                    reveals: 2
                    cost: 1
              tempting_absent:
                ladder:
                  - type: redirect
                    text: >
                      It might seem like Jordan just ran out of time, but
                      look at how he responds when Sam asks "certified
                      for what?" — he re-reads the brochure instead of
                      questioning it. That's a clue about how he's
                      thinking about the source itself.
                    routes_to: {facet: source_credibility}
                    reveals: 1
                    cost: 0

        inferential_validity:
          role: tempting_absent
          opening: >
            It's natural to think about whether Jordan's reasoning makes
            a logical leap here.
          ladder:
            - type: redirect
              text: >
                The science-vs-Integrated-Studies gap is real, and Maya
                catches it later in the conversation. But right now in
                this turn, the bigger issue is where Jordan's information
                is coming from. Look at who wrote the brochure he's
                reading.
              routes_to: {facet: source_credibility}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t02: Sam asks "certified for what?" ──

    t02:
      blank_page:
        opening: >
          Sam just asked Jordan a short question about the certification.
        ladder:
          - type: nudge
            text: >
              Sam asks "Certified for what, though?" What is she trying
              to find out?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Is Sam questioning the zoo, or is she questioning what the
              word "certified" actually means?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Sam is the only person in the room asking Jordan to explain
              the credential rather than just accepting it.
            reveals: 3
            cost: 1

      by_facet:
        source_credibility:
          role: present
          opening: >
            You noticed something important about Sam's question.
          ladder:
            - type: question
              text: >
                Why is Sam's question "Certified for what?" a good
                question to ask here?
              reveals: 1
              cost: 0
            - type: question
              text: >
                What would Jordan need to figure out in order to actually
                answer Sam's question?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Sam is asking Jordan to look past the impressive-sounding
                words and explain what the certification actually covers.
                That's the kind of question that tests whether a source
                is being used well.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Instead of re-reading the brochure line more slowly,
                Jordan could have said "I don't actually know what
                state-certified means here — let me look that up" and
                treated Sam's question as a genuine evaluation challenge.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        source_diversity:
          role: tempting_absent
          opening: >
            It might seem like Sam needs to bring her own evidence for a
            destination to be helpful.
          ladder:
            - type: redirect
              text: >
                Sam doesn't have a brochure or video, but that's not the
                issue here. Focus on what she's actually doing — she's
                asking Jordan to explain what his credential means. That
                question gets at whether Jordan's source is being used
                well, not whether the committee has enough sources.
              routes_to: {facet: source_credibility}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t03: Jordan re-reads the brochure ──

    t03:
      blank_page:
        opening: >
          Jordan just answered Sam's question by reading the same brochure
          line again, more slowly.
        ladder:
          - type: nudge
            text: >
              Did Jordan actually answer Sam's question, or did he do
              something else?
            reveals: 1
            cost: 0
          - type: question
            text: >
              What's the difference between reading something more
              carefully and actually thinking about what it means?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Sam asked what "certified" means. Jordan answered by
              re-reading the brochure — as if Sam's problem was that
              she didn't hear him, not that she wanted him to think
              about it.
            reveals: 3
            cost: 1

      by_facet:
        source_credibility:
          role: present
          opening: >
            You noticed that Jordan's response to Sam's question was to
            re-read rather than re-think.
          ladder:
            - type: question
              text: >
                Sam asked what "certified" means. Jordan read the same
                line again. Is re-reading the same as answering?
              reveals: 1
              cost: 0
            - type: question
              text: >
                What would Jordan need to do differently if he were
                actually trying to figure out what the certification
                means?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                When someone questions a source, going back and reading it
                louder doesn't help. The question isn't "what does the
                brochure say?" — it's "is what the brochure says actually
                useful for our decision?"
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Instead of re-reading the brochure line more slowly,
                Jordan could have said "I don't actually know what
                state-certified means here — let me look that up" and
                treated Sam's question as a genuine evaluation challenge.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        perspective_engagement:
          role: afforded_missing
          opening: >
            You noticed something about how the committee reacts to this
            moment.
          ladder:
            - type: nudge
              text: >
                After Jordan re-reads the brochure, does anyone else
                follow up on Sam's question?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Sam asked a good question and Jordan answered by re-reading.
                What does it mean that the committee let that be the end
                of it?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                The committee could have jumped in to support Sam's
                question or push Jordan to actually explain the
                certification. Instead, they accepted the re-reading
                as a real answer and moved on.
              reveals: 3
              cost: 1
          has_explanation_depth: false

    # ── t04: Maya's YouTube video ──

    t04:
      blank_page:
        opening: >
          Maya just presented a YouTube video as her evidence for the
          amusement park.
        ladder:
          - type: nudge
            text: >
              Maya is really excited about this video. What exactly does
              the video show?
            reveals: 1
            cost: 0
          - type: question
            text: >
              The video shows a teacher taking students to a roller coaster
              park. Is there anything different between that situation and
              what the committee is planning?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              The video shows high schoolers in a physics class at a
              different park with a teacher-designed worksheet. Maya's
              committee is 6th graders in Integrated Studies with no
              worksheet plan. One video from a very different situation
              is all she brought.
            reveals: 3
            cost: 1

      by_facet:
        sufficiency:
          role: present
          opening: >
            You noticed something about how much evidence Maya brought
            and how she's using it.
          ladder:
            - type: question
              text: >
                Maya found one video. Is one example from a different
                school, a different grade, and a different subject enough
                to prove that their field trip would work the same way?
              reveals: 1
              cost: 0
            - type: question
              text: >
                What are all the differences between the video's situation
                and the committee's situation? Count them up.
              reveals: 2
              cost: 0
            - type: hint
              text: >
                The video shows high schoolers (not 6th graders), a physics
                class (not Integrated Studies), a teacher-designed worksheet
                (which the committee hasn't made), and a different park.
                Maya has one piece of evidence and it doesn't match her
                situation in at least four ways.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Maya could have acknowledged that her video shows a high
                school physics class, not a 6th-grade Integrated Studies
                class, and asked whether one example from a different
                context is enough to support her claim.
              reveals: 4
              cost: 2
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - type: question
                    text: >
                      Maya already wanted the amusement park before she
                      searched for evidence. How might that have affected
                      what she searched for?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      She searched for something that would support what
                      she already believed, found one video that felt like
                      enough, and stopped looking. She wasn't trying to
                      find the truth — she was trying to find backup for
                      her answer.
                    reveals: 2
                    cost: 1
              social:
                ladder:
                  - type: hint
                    text: >
                      In this case, Maya's thin evidence is mostly about
                      how she searched — she started with her conclusion
                      and looked for support. The group didn't push her
                      to bring more, but the main issue is her own
                      search process.
                    reveals: 1
                    cost: 0
              interaction:
                ladder:
                  - type: hint
                    text: >
                      Maya's one-video evidence is mainly about her own
                      search process — she found what she wanted and
                      stopped. The group dimension is lighter here than
                      with Jordan's brochure.
                    reveals: 1
                    cost: 0
              tempting_absent:
                ladder:
                  - type: redirect
                    text: >
                      It's not just that Maya didn't have time — look at
                      what she searched for. She already had her conclusion
                      and looked for evidence to match it.
                    routes_to: {facet: sufficiency}
                    reveals: 1
                    cost: 0

        inferential_validity:
          role: tempting_absent
          opening: >
            It does feel like Maya is making a logical leap from one video
            to a big conclusion.
          ladder:
            - type: redirect
              text: >
                Maya's argument does have a structure — teachers use
                amusement parks for learning, so our trip could too. The
                structure isn't really broken. The problem is that she has
                one piece of evidence from a completely different situation
                and treats it as enough. Focus on how thin her evidence is,
                not on whether her reasoning chain is broken.
              routes_to: {facet: sufficiency}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t05: Sam's lunch-program questions ──

    t05:
      blank_page:
        opening: >
          Sam just read her list of questions about the school lunch program.
        ladder:
          - type: nudge
            text: >
              Sam says she "didn't really pick a place." What did she bring
              instead?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Her questions are about who decides the menu, where the food
              comes from, and what happens if someone can't pay. What kind
              of class would those questions fit into?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Sam's questions cover science, economics, civics, and fairness
              all at once. That's exactly what Integrated Studies is supposed
              to be about — looking at one topic from many angles.
            reveals: 3
            cost: 1

      by_facet:
        relevance:
          role: present
          opening: >
            You noticed something about how Sam's questions connect to
            what the committee is actually supposed to be doing.
          ladder:
            - type: question
              text: >
                Everyone else brought evidence for a destination. Sam brought
                questions. Which approach matches what Ms. Tsai's Integrated
                Studies class is supposed to do?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Sam's questions touch science, economics, civics, and
                fairness. Jordan's brochure covers science standards. Maya's
                video covers physics. Which set of research better fits a
                class called "Integrated Studies"?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Sam is the only committee member whose research starts from
                the assignment — asking cross-disciplinary questions about
                real systems. Everyone else started from a place they already
                wanted and looked for evidence to support it.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                If the committee had asked Sam how her questions connect to
                a field trip destination, they would have discovered that
                her research directly addresses the Integrated Studies
                mandate and could reframe the entire discussion around the
                assignment's actual purpose.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        source_diversity:
          role: tempting_absent
          opening: >
            It does look like everyone only brought one thing — one brochure,
            one video, one list of questions.
          ladder:
            - type: redirect
