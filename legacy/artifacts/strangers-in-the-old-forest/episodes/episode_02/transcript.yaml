personas:
- name: Jules
  perspective: 'Saturday night''s call with Anya confirmed what the squirrel already felt like to her.
    She believes Anya takes the question seriously in the way nobody else in her life has, and she wants
    the three friends at the table to feel the weight of what a real researcher said. The fear underneath
    the retelling is that something is happening in Overton and no adult is noticing.

    '
- name: Maya
  perspective: 'She can feel Jules''s chain is not closing. The question "how did your brother know Anya
    was the right person?" is sitting in her head. She also sees Jules''s face and knows Jules is scared.
    She wants both things — for Jules to be held in the room and for the group to know who Anya actually
    is — and she does not yet know how to do both at once.

    '
- name: Cam
  perspective: 'Something interesting is happening and Jules is making it more interesting. If a researcher
    at U of M says what his feed has been saying, that is two now — a pattern. He is not trying to be
    uncritical; he is genuinely excited. He also comes in grudgingly remembering his mom pushing him last
    night to look up yesterday''s TikTok creator, and he has the result to share whether he wants to or
    not.

    '
- name: Priya
  perspective: 'She is quieter today than yesterday. She heard Jules''s weight on Monday and is absorbing
    what Jules is saying today rather than arguing with it. Her friend is scared and her friend''s fear
    is the thing to sit with. She does not reach for what her mom (a U of M biology professor who could
    most immediately disambiguate "researcher at U of M working on urban wildlife") might know — that
    reach is not on the table for her in this scene.

    '
