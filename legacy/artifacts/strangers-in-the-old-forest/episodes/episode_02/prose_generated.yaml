story_id: strangers-in-the-old-forest
episode_number: 2
scenario_id: strangers-in-the-old-forest-ep-02

episode_opening: >
  It's Tuesday after school and the four friends are back at their picnic
  table in Overton Park. Since Saturday, Jules has been holding on to a
  phone call with a grad student named Anya — her brother Marcus put them
  in touch — and today she's finally ready to tell the others what Anya
  said about the red-eyed squirrel. Before Jules even starts, Cam has
  something he has to get off his chest about yesterday's TikTok. Then
  Jules begins repeating Anya's big, confident-sounding phrases, and the
  group starts building on top of them. As you read, pay attention to
  which parts of what Jules repeats the group checks, and which parts
  just get accepted because they sound like they should be right.

attention_targets:
  - passage_id: p1
    support_id: p1_at_1
    use_when: cannot_start
    source_turns: [t02, t03]
    text: >
      Look at what Cam does with the TikTok in turn 2 and then at what
      Jules does with Anya a few turns later in turn 3. They are both
      telling the group about a source. Try to notice what Cam asks about
      his source that nobody asks about Jules's.

  - passage_id: p1
    support_id: p1_at_2
    use_when: wrong_focus
    source_turns: [t05, t06, t07]
    text: >
      Zoom in on turns 5, 6, and 7. Maya is in the middle of asking a
      question, Jules answers, and then Maya's next line is really short.
      Read those three turns in order and watch what happens to Maya's
      question.

  - passage_id: p1
    support_id: p1_at_3
    use_when: wrong_focus
    source_turns: [t03, t06]
    text: >
      Jules uses the word "researcher" and the name "Marcus" to tell the
      group who Anya is. Notice what she does not say — like what Anya
      studies, or what department she's in. What got skipped?

  - passage_id: p1
    support_id: p1_at_4
    use_when: cannot_start
    source_turns: [t04, t09]
    text: >
      Look at Cam's question "what else could it even be?" in turn 4 and
      Jules's answer "nothing else really fits" in turn 9. What other
      kinds of answers never show up in their conversation at all?

