scenario_id: strangers-in-the-old-forest-ep-01
story_id: strangers-in-the-old-forest
episode_number: 1

topic: >
  What, if anything, is going on with the red-eyed white squirrel the four of
  them saw in Overton Park on Saturday.

context: >
  Overton Park in Memphis, Tennessee — a 131-acre urban forest the four kids
  bike to after school. On Saturday afternoon the four of them saw a white
  squirrel with red eyes, and Jules hasn't been able to stop thinking about
  it. It is now Monday after school. They are at their usual picnic table by
  the Old Forest path, bags dropped, Maya's notebook open between them, the
  late-afternoon light going orange through the trees. No adult has framed
  the question for them. The four of them are assembling the shape of the
  mystery between themselves, for the first time, out loud.

instructional_goals:
  - >
    Notice when a confident-sounding causal story is built on top of a single
    observation, and feel the gap between the vividness of the observation
    and the weight of the conclusion.
  - >
    Practice asking where a claim came from and who made it — including when
    the claim arrived through a friend's phone, casually, and sounds like
    part of the conversation.
  - >
    Begin to notice the difference between an observation ("I have not seen
    this anywhere I've walked") and a conclusion ("this doesn't happen
    anywhere"), as soft setup for later episodes.
  - >
    Recognize what it looks like when someone in a group names the question
    the group is actually trying to answer — and what it costs the group when
    that naming is left on the page unaddressed.

discussion_dynamic: >
  Four close friends at a picnic table, with Jules emotionally in the lead.
  Jules is retelling Saturday's sighting for the fourth time in three days,
  not because the others have forgotten but because she has not been able to
  let it go; her retelling lands on a tight causal chain — the squirrel's
  eyes looked wrong, something must be wrong with it, something must have
  caused that — that sounds tight to her because the image is so vivid. Cam
  picks up the thread by quoting a TikTok he watched over the weekend about
  Overton, citing it at the same register he would cite a news article or
  something Ms. Reyes had said. Priya folds in the parks she knows —
  "squirrels don't have red eyes anywhere I've been" — said as observation,
  landing as conclusion. Maya writes the question down in the notebook, says
  once out loud that she wrote it so they can come back to it, and the other
  three acknowledge her and move on. There is no sharp disagreement in the
  scene because the three talkative voices each pull the table in a direction
  that is compatible enough to feel like momentum; the disagreement that
  matters is structural, between what Maya put on the page and what the other
  three are actually talking about. The scene closes with Jules naming the
  edge underneath — "something might be happening and no one's noticing" —
  and the four of them agreeing to keep meeting about it. The notebook
  closes with Maya's question still unopened. Interaction quality: warm,
  animated, urgent under the surface, and genuinely close — these are four
  11-year-olds who have been the four of them since 4th grade, and the
  weight of the scene is the strangeness of their park, not the threat of
  anything hostile.

personas:
  - name: Jules
    perspective: >
      She cannot stop thinking about Saturday. The squirrel's eyes looked
      wrong, and wrong-looking means something is wrong, and something being
      wrong means something changed it, and whatever changed it is worth
      figuring out. She has grown up with a mother who writes curious-weird-
      science pieces for kids' magazines and a brother who talks about SETI
      on walks in the park, so the move of taking an anomaly seriously is
      not foreign — it is what she has learned, at home, a real way of
      seeing. What she wants at the picnic table is for the other three to
      feel the weight she has been carrying since Saturday.
    knowledge: >
      Her own memory of Saturday — where they were, what the squirrel looked
      like, its eyes, what each of them did in the moment. She has replayed
      it enough that she narrates it in a near-rehearsed order. She also
      carries her mother's vocabulary of small-strange-science curiosities
      and her brother Marcus's walking-tour explanations of the Old Forest.
    weaknesses: >
      When something looks wrong to Jules her mind pattern-matches on surface
      similarity and she builds a tight causal chain out loud — wrong-looking
      means something changed it, and something must have caused the change —
      without noticing that every link after the first is resting on the
      same single Saturday moment. She does not hedge; the vividness of the
      image feels like proof. She is an urgent, confident talker when a thing
      has caught her, and that confidence sounds to the others like the
      chain is tight even when it is built on one sighting.
    strengths: >
      She genuinely pays attention to the world. The weird thing she is
      circling is a real weird thing, and her refusal to drop it is what
      brings the group to the table in the first place. Her curiosity is
      sincere, not performative.

  - name: Maya
    perspective: >
      Maya can feel that the group is talking around something without
      landing on it. What she wants is for the four of them to be clear
      about what they are actually trying to figure out — not to answer it
      yet, just to name it so they can come back to it.
    knowledge: >
      What she saw on Saturday, and a pastor's daughter's instinct for when
      an argument is finished and when it is still in the middle. She has
      grown up around sermons that had to land and family dinners where her
      mom walked through why a delivery route was wrong, and she can feel,
      usually correctly, when a line of talk has closed around itself
      without actually answering anything.
    weaknesses: >
      Her instinct is strong enough that nobody pushes her to explain it,
      and she has never built the habit of showing her work on paper. She
      can feel what the group needs but does not yet press it when the
      group moves on — her care for her friends softens how hard she pushes
      when Jules is keyed up the way she is today. In this scene she
      surfaces the right move — writing the question down — and then lets
      the room drift past it without making them look.
    strengths: >
      She is the only person at the table who names, out loud and on paper,
      what the four of them are actually trying to answer. She writes the
      question in her careful handwriting, circles it, leaves room
      underneath for sub-questions, and says once that she wrote it so they
      can come back to it. It is the most load-bearing move anyone makes
      in the scene.

  - name: Cam
    perspective: >
      Interesting things are happening and he wants to be part of figuring
      them out. A TikTok he saw over the weekend said the squirrels in
      Overton have been acting weird for months, and to him that sounds
      like a brick in the case Jules is building.
    knowledge: >
      Saturday's sighting, plus his weekend feed. He has a phone more than
      the other three do, and he moves fluently through TikTok, news clips,
      memes, friends-of-friends — the scroll is how he encounters
      information, and it all arrives through the same feed with roughly
      the same visual weight.
    weaknesses: >
      He cites the TikTok at the same confident register he would cite a
      news article or a thing Ms. Reyes had said — doesn't mention who made
      it, or why he trusts it, or whether he watched more than the first
      few seconds. His tone is casual, not evasive. The claim sits beside
      Jules's chain as if it has the same weight, and nobody pushes back
      because nobody yet has the habit of asking where a video came from.
    strengths: >
      He is genuinely curious and wants to bring material to the group
      rather than just react to theirs. The impulse to contribute is
      good; the sorting of what's worth contributing is what he hasn't
      yet learned.

  - name: Priya
    perspective: >
      She is comparing what they saw to every park she can remember walking,
      and she cannot place it anywhere. That feels significant to her, and
      she says so.
    knowledge: >
      The parks she has walked — Audubon, her neighborhood greenways, her
      Sunday-morning family walks — and two years of Ms. Reyes's questions
      about how you know what you know. Her mother is a biology professor,
      which gives her a lever to check claims later in the season, but in
      this scene her knowledge is about the walks she has taken.
    weaknesses: >
      When she says "squirrels don't have red eyes anywhere I've been," the
      sentence slides from observation into conclusion without her marking
      the slide. She is drawing on the conditions under which she has
      walked — east Memphis parks, on family time, on certain paths — and
      treating the absence of red-eyed squirrels in those specific places
      as a fact about squirrels in general. The sentence lands quietly
      because she usually knows what she is talking about, and nobody at
      the table has the habit yet of asking which walks a claim comes from.
    strengths: >
      She actually compares — she reaches for other parks, not just the one
      in front of her, and that reach is where her scope habit will
      eventually land. In this episode the reach is there; the bookkeeping
      on its conditions is not yet.

target_facets:
  - facet_id: sufficiency
    target_quality: weak
    primary_lens: evidence
    also_visible_through: [scope, logic]
    designed_explanation:
      cognitive_pattern: false_cause
      social_dynamic: null
      interaction_note: null
      cognitive_signal: >
        Jules retells the Saturday sighting and lands on a tight causal
        chain: the squirrel's eyes looked wrong, wrong-looking means
        something is wrong with the squirrel, something being wrong means
        something changed it, and something must have caused the change.
        She speaks the chain confidently because the surface similarity
        feels so strong to her — red eyes *look* like a sign — and she
        does not notice that every link except the first is built on that
        one Saturday observation. The season's purest sufficiency
        weakness: one observation of one animal at one moment, extended
        into a causal story about what is happening to the park.
      social_signal: null
    carrier_persona: Jules
    signal_mechanism: >
      Jules's retelling is the scene's spine. She narrates Saturday in near-
      rehearsed order and lands it on her chain — something is wrong,
      something changed it, something caused the change — with the quiet
      certainty of someone for whom the image is doing the work. The chain
      sounds tight to her because the squirrel is vivid in her head; the
      base of that chain is one animal seen once, and she does not hedge
      that base. Because she is confident and close to the others, the
      chain carries into the group unchallenged, and the rest of the table
      picks up from her chain rather than from the base it is resting on.
      A reader watching for sufficiency should be able to feel the chain
      getting wider at the top without getting wider at the bottom.

  - facet_id: source_credibility
    target_quality: weak
    primary_lens: evidence
    also_visible_through: [logic]
    designed_explanation:
      cognitive_pattern: uncritical_acceptance
      social_dynamic: null
      interaction_note: null
      cognitive_signal: >
        Cam brings up a TikTok he saw about Overton Park over the weekend
        and cites it as if it's a brick in the case — quoting the claim
        ("someone said the squirrels have been acting weird for months")
        at the same confident register he would use for a news article or
        a thing Ms. Reyes had said. He does not mention who made the
        TikTok, why he trusts it, or whether he watched more than the
        first few seconds. His tone is casual, not evasive; the claim
        sits beside Jules's chain as if it has the same weight.
      social_signal: null
    carrier_persona: Cam
    signal_mechanism: >
      Cam's move is single and clean: he picks up Jules's thread and offers
      a TikTok claim about Overton — "someone said the squirrels have been
      acting weird for months" — as corroborating material. His tone is
      casual and the quote lands at the same register the group uses for
      things Ms. Reyes said in class. He names no creator, no channel, no
      reason for trusting it; the TikTok exists, he saw it, it is on the
      table. Because his confidence matches Jules's, and because no one at
      the table has yet built the reflex of asking where a video came
      from, the TikTok slots in alongside the Saturday memory as if the
      two have equal weight. A reader watching for source credibility
      should feel the missing question — who made this? — rather than see
      it named.

  - facet_id: condition_sensitivity
    target_quality: weak
    primary_lens: scope
    also_visible_through: [logic, evidence]
    designed_explanation:
      cognitive_pattern: null
      social_dynamic: null
      interaction_note: null
      cognitive_signal: null
      social_signal: null
    carrier_persona: Priya
    signal_mechanism: >
      Priya contributes a single quiet sentence — "squirrels don't have red
      eyes anywhere I've been" — that reads as observation and lands as
      conclusion. She draws from the conditions under which she has
      walked (east Memphis parks, family walks, specific paths) and
      treats the absence of red-eyed squirrels in those places as
      evidence about squirrels in general. The move is deliberately soft
      in this episode. No one pushes back because Priya usually knows
      what she is talking about and because the sentence is not shaped
      like a claim. The signal is in the slide from "anywhere I've been"
      to "anywhere" — the conditions dropping out of the conclusion
      between one clause and the next. It is the seed of the scope-lens
      habit the season will sharpen later; here it is only a foreshadow.

target_strengths:
  - facet_id: reasoning_completeness
    primary_lens: logic
    also_visible_through: [evidence]
    carrier_persona: Maya
    signal_mechanism: >
      Maya opens the notebook on the picnic table at the start of the scene
      and, as the other three talk, writes the group's question down in her
      own careful handwriting — something like *what do we actually think
      is going on with the red-eyed squirrel in Overton* — circled, with
      room underneath for sub-questions. She says once, out loud, that she
      wrote it so they can come back to it. Jules acknowledges her. Cam
      acknowledges her. Priya acknowledges her. None of the three engage
      with what is on the page — Jules keeps retelling, Cam keeps citing,
      Priya keeps comparing, and the question sits unopened underneath
      all of it. The strength is that Maya is the only person at the
      table who names what the four of them are actually trying to
      answer; the collapse is that the social momentum of the scene runs
      past the page without ever returning to it. The notebook closes
      at the end of the scene with Maya's question still uncircled-back-
      to. A careful reader should feel, afterward, that the most useful
      move anyone made in the scene was the one the scene did not
      reward.
    contrastive_note: >
      Where a weaker version of Maya would simply feel the gap and say
      nothing, and a more assertive version would grab the room and force
      the group to answer what she wrote, this Maya does the load-bearing
      cognitive move — naming the open question and leaving room for it —
      but does not yet insist that the group return to it. The strength
      is real; the collapse is structural, not personal.

discussion_arc: >
  Jules is already mid-retelling when the scene opens, urgency carrying the
  room. She lands the retelling on her chain and Cam picks up the thread
  with his weekend TikTok, the quote sitting beside Jules's memory at
  matching weight. Priya folds in the parks she knows with a sentence that
  sounds like comparison and reads like conclusion. Maya writes the group's
  actual question in the notebook, says once that she wrote it so they can
  come back to it, and the other three acknowledge her and keep going.
  Jules doubles down because the chain still feels tight to her; Cam adds
  detail from the TikTok; Priya keeps folding in parks; Maya stops writing
  at some point because the page has stopped being used. Jules names the
  edge underneath — "something might be happening and no one's noticing" —
  and the other three go briefly quiet before somebody (probably Cam)
  breaks the silence with something casual. They agree to keep meeting
  about it. The notebook closes with Maya's question still unopened. The
  arc does not resolve on a decision or a correction — it resolves on the
  gap the reader is meant to feel: four close friends spent half an hour
  at a picnic table and the question on the top of the page was never
  opened.

turn_outline:
  - speaker: Jules
    accomplishes: >
      Opens mid-retelling, already in the Saturday moment — who saw the
      squirrel first, what its eyes looked like, what she did right after.
      Narrates with the urgency of someone who has run this story in her
      head all weekend.
  - speaker: Jules
    accomplishes: >
      Lands the retelling on her chain out loud — the eyes looked wrong,
      something must be wrong with the squirrel, something must have
      changed it, something must have caused that — spoken in one confident
      breath, as if the chain is as tight as the image.
  - speaker: Cam
    accomplishes: >
      Picks up Jules's thread by bringing in a TikTok he watched over the
      weekend about Overton, quoting the line about "the squirrels acting
      weird for months" the same way he would quote a news article. Does
      not name who made the video.
  - speaker: Maya
    accomplishes: >
      Pulls the notebook between the four of them and writes the group's
      actual question down in careful handwriting — what, if anything, is
      going on with the red-eyed squirrel in Overton — circles it, leaves
      room underneath. Says once, easily, that she wrote it so they can
      come back to it.
  - speaker: Priya
    accomplishes: >
      Does the compare-to-other-parks move — "squirrels don't have red eyes
      anywhere I've been" — said as a casual observation from the parks
      she walks, slipping unmarked into a claim about squirrels generally.
  - speaker: Jules
    accomplishes: >
      Hears Priya's sentence as confirming her chain rather than qualifying
      it, and doubles down — adds more detail from Saturday, re-emphasizes
      the eyes, pushes the causal reading one step further. The chain gets
      taller; the base stays the same one sighting.
  - speaker: Cam
    accomplishes: >
      Adds another detail from the TikTok, quoting another line or comment
      to reinforce the "weird for months" framing. Treats the video as a
      reserve of information he can keep drawing from.
  - speaker: Maya
    accomplishes: >
      Glances down at the page she wrote the question on, and tries once —
      gently, not forcefully — to bring the group back to it. Something
      like wondering what they actually mean by "something is going on."
      The attempt is brief and does not insist.
  - speaker: Priya
    accomplishes: >
      Answers Maya's gentle question by folding in another park comparison
      rather than opening the question on the page — reiterates that she
      has not seen red-eyed squirrels anywhere, so something must be
      specific about Overton.
  - speaker: Jules
    accomplishes: >
      Takes Priya's comparison as further weight for her chain and pushes
      it one more step — the Overton-specific framing becomes the
      something-changed-it framing, spoken with more conviction. The chain
      is visibly running on its own energy now.
  - speaker: Cam
    accomplishes: >
      Agrees, easily, and reaches for his phone or gestures at it — implies
      the TikTok creator is still worth looking at, still a source, still
      on the table. No question about who made it.
  - speaker: Maya
    accomplishes: >
      Stops writing. The notebook stays open but the page stays still.
      Notices the room has moved past what she put down and does not push
      harder. Sits with it.
  - speaker: Jules
    accomplishes: >
      Names the edge underneath — something like "something might be
      happening and no one's noticing" — said not as horror but as the
      real thing that has been under her retelling the whole time. The
      other three go briefly quiet.
  - speaker: Cam
    accomplishes: >
      Breaks the silence casually, easing the room — proposes they keep
      meeting about it, maybe meet here Wednesday after school like usual.
      The four of them agree. The notebook closes with Maya's question
      still on the top of the page, unopened.
