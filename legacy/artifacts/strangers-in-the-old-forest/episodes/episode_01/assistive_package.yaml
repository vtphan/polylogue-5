  talk_moves:
  - I want to push back on that — what I noticed was...
  - Building on what ___ said, I think the next question is...
  - Wait, can we go back to ___'s point? I'm not sure I followed it.
  - I disagree, because the part of the turn I'm looking at says...
  - I want to argue the other side for a second, even though I don't believe it...
  - Can someone read that turn out loud again? I want to hear it.
  consensus_checks:
  - As a group, can you point to the one thing on Saturday that all of Jules's reasoning is resting on?
  - Did the four friends ever actually answer the question Maya wrote in her notebook? If not, what were
    they answering instead?
teacher_support:
  calibration_warnings:
  - Treat Jules's fear as uncanny, not horror-adjacent. The felt content is "something is here and no
    one is noticing," never "something will hurt us."
  - Adults in the story are distracted and dismissive, not hostile or menacing. If a student reads menace
    into the adult world, redirect them to what the text actually shows.
  - The fear resolves into relief, not humiliation. Affirm that being scared was a reasonable response
    to a credentialed adult's framing of a genuinely unsettling observation.
  - If a student lands on the fear before they land on the answer, let them sit there briefly rather than
    rushing to resolve it. The story is designed to let the reasoning do the calming work.
