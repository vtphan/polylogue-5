              text: The conditions of her walking — east Memphis, family walks, specific paths — keep
                doing silent work. The sentence sounds like a fact about Overton; the evidence is still
                only her walks.
              reveals: 3
              cost: 1
            - type: worked_example
              text: If Priya said 'on the walks I've done, I haven't seen it — so maybe Overton is different,
                or maybe the places I walk are,' the conditions would stay attached and Jules couldn't
                pick this up as more weight for her chain.
              reveals: 4
              cost: 2
            has_explanation_depth: false
          overgeneralization:
            role: tempting_absent
            opening: Again, 'too little data' looks like the answer here — but it's the conditions, not
              the count.
            ladder:
            - type: redirect
              text: Priya isn't generalizing from too few visits. She's letting the conditions of those
                visits drop out of her conclusion. Even a hundred more family walks through east Memphis
                wouldn't fix that slide.
              routes_to:
                facet: condition_sensitivity
              reveals: 1
              cost: 0
            has_explanation_depth: false
      t10:
        blank_page:
          opening: Jules closes the chain — notice what she's treating as shared now.
          ladder:
          - type: nudge
            text: Read Jules's two sentences. What's she agreeing with Priya about?
            reveals: 1
            cost: 0
          - type: question
            text: The framing is now 'it's this park, something in this park.' What's it based on?
            reveals: 2
            cost: 0
          - type: hint
            text: The Overton-specific framing becomes the something-changed-them framing, now shared
              across two voices and felt as a group conclusion.
            reveals: 3
            cost: 1
        by_facet:
          sufficiency:
            role: present
            opening: You noticed that Jules's chain closes on a group-sized conclusion with no new observations.
            ladder:
            - type: question
              text: Between t02 and t10, how much has the evidence actually grown?
              reveals: 1
              cost: 0
            - type: question
              text: Priya's agreement isn't a second sighting. So what is 'the whole point' actually resting
                on?
              reveals: 2
              cost: 0
            - type: hint
              text: The chain is now shared across two voices — but shared doesn't mean supported. The
                base is still one squirrel, one afternoon.
              reveals: 3
              cost: 1
            - type: worked_example
              text: If any voice at the table paused here and said 'wait — we're saying 'this park' changed
                them, but we've only seen it once,' the group conclusion wouldn't close the way it does.
              reveals: 4
              cost: 2
            has_explanation_depth: true
            explanation:
              by_explanatory_variable:
                cognitive:
                  ladder:
                  - type: question
                    text: What is Jules doing with Priya's sentence in her head?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: She treats Priya's agreement as fresh weight — confirmation bias. The chain
                      climbs one more step because it feels supported, not because it is.
                    reveals: 2
                    cost: 1
                social:
                  ladder:
                  - type: question
                    text: Notice how fast the chain becomes a shared 'the whole point.' Is anyone pushing
                      back?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: No one pushes back. Two compatible voices create the feeling of a group conclusion,
                      even though the evidence hasn't grown.
                    reveals: 2
                    cost: 1
                interaction:
                  ladder:
                  - type: question
                    text: What's happening in Jules's head AND in the group together at this moment?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: Jules hears agreement as proof; the room lets the chain close because nobody
                      has the habit of pausing it. Both together are what makes this feel like a conclusion.
                    reveals: 2
                    cost: 1
                tempting_absent:
                  ladder:
                  - type: nudge
                    text: Try one lens at a time — what's changing in Jules, and what's changing at the
                      table?
                    reveals: 1
                    cost: 0
          inferential_validity:
            role: present
            opening: You noticed the chain is now closing on a causal claim with no new steps under it.
            ladder:
            - type: question
              text: From 'it's this park' to 'something in this park changing them' — what's the missing
                step?
              reveals: 1
              cost: 0
            - type: question
              text: If you trusted every earlier step, does that last step automatically follow?
              reveals: 2
              cost: 0
            - type: hint
              text: Each 'so' is a leap. At t10 the leaps are stacked on top of each other and the last
                one is said with the most confidence.
              reveals: 3
              cost: 1
            has_explanation_depth: false
          perspective_engagement:
            role: tempting_absent
            opening: It's tempting to say Jules is ignoring other views — but there are no other views
              in the room yet.
            ladder:
            - type: redirect
              text: No one has voiced 'maybe nothing is going on' or 'maybe it was just one strange squirrel.'
                The gap here is that the evidence hasn't grown, not that a competing view was pushed aside.
              routes_to:
                facet: sufficiency
              reveals: 1
              cost: 0
            has_explanation_depth: false
      t11:
        blank_page:
          opening: Cam wants to pull the video up — notice what he's treating as a check.
          ladder:
          - type: nudge
            text: Cam says 'let me pull the video up — we should watch it together.' What is watching
              doing for him here?
            reveals: 1
            cost: 0
          - type: question
            text: If nobody has asked who made the video, does watching it again answer that question?
            reveals: 2
            cost: 0
          - type: hint
            text: Watching feels like verification. But the missing question — who made this? — doesn't
              get answered by watching more of it.
            reveals: 3
            cost: 1
        by_facet:
          source_credibility:
            role: present
            opening: You noticed Cam is still treating the video as a working source.
            ladder:
            - type: question
              text: What would 'checking' this video actually look like?
              reveals: 1
              cost: 0
            - type: question
              text: Does 'we should watch it together' get closer to answering 'who made it?'
              reveals: 2
              cost: 0
            - type: hint
              text: Watching is not checking. Checking means asking who the creator is, what they've posted
                before, and why their claim about Overton squirrels should be trusted.
              reveals: 3
              cost: 1
            - type: worked_example
              text: If Cam said 'let me look up who made it before we watch,' the source question would
