                being treated as settled.
              reveals: 4
              cost: 2
            has_explanation_depth: false
          source_diversity:
            role: tempting_absent
            opening: It's tempting to say the fix is to find other videos — but the same question would
              apply to them.
            ladder:
            - type: redirect
              text: Even if Cam pulled up three more videos, none of them would be checked either if he
                doesn't ask who made them. Source credibility is the cleaner read here.
              routes_to:
                facet: source_credibility
              reveals: 1
              cost: 0
            has_explanation_depth: false
