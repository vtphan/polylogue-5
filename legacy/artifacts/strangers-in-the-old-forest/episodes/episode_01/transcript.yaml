personas:
- name: Jules
  perspective: 'She cannot stop thinking about Saturday. The squirrel''s eyes looked wrong, and wrong-looking
    means something is wrong, and something being wrong means something changed it, and whatever changed
    it is worth figuring out. She has grown up with a mother who writes curious-weird- science pieces
    for kids'' magazines and a brother who talks about SETI on walks in the park, so the move of taking
    an anomaly seriously is not foreign — it is what she has learned, at home, a real way of seeing. What
    she wants at the picnic table is for the other three to feel the weight she has been carrying since
    Saturday.

    '
- name: Maya
  perspective: 'Maya can feel that the group is talking around something without landing on it. What she
    wants is for the four of them to be clear about what they are actually trying to figure out — not
    to answer it yet, just to name it so they can come back to it.

    '
- name: Cam
  perspective: 'Interesting things are happening and he wants to be part of figuring them out. A TikTok
    he saw over the weekend said the squirrels in Overton have been acting weird for months, and to him
    that sounds like a brick in the case Jules is building.

    '
- name: Priya
  perspective: 'She is comparing what they saw to every park she can remember walking, and she cannot
    place it anywhere. That feels significant to her, and she says so.

    '
