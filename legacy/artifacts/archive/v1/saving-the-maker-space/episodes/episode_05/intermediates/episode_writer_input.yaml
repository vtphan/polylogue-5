story_premise: >
  Five 6th graders are trying to save their school's maker space — a
  cluttered back room of soldering irons, a 3D printer that mostly works,
  and a couch nobody is supposed to sit on — from being converted into a
  second computer lab. The principal has reasons; the kids will spend most
  of the season underestimating how good her reasons are.

episode_premise: >
  Two weeks after the group rebuilt their proposal around what a shared
  room would actually look like, they walk into the principal's office
  to present it. Dev delivers. Mira sits next to him with a quiet cue
  they agreed on beforehand. Ren has a photo of the maintenance log on
  her phone in case the principal asks for a number. Sam has prepared
  exactly one sentence and will say it once. Theo is in the room as a
  steady presence and will speak only at the end, on the walk back. The
  principal accepts the proposal with one small addition of her own.
  Nobody walks out of the office celebrating.

episode_number: 5

previously: >
  After Sam interrupted the group two weeks ago to point out that their
  petition spoke for "us" instead of "the kids," the group spent two weeks
  talking to students who don't usually use the maker space and rebuilt
  the proposal around a shared-room schedule that the robotics club and
  the art kids could share. That rebuilt proposal is what they're bringing
  to the principal today.

lead_characters:
  - name: Dev
    voice: >
      Talks fast, uses his hands, has the kind of confidence that makes
      other kids want to agree with him before they've decided whether
      they do. Comfortable in front of an adult. When he's prepared, he
      sounds prepared; when he isn't, he reaches for a warm phrase that
      sounds true.
    perspective: >
      Wants to deliver the proposal cleanly today and earn the principal's
      acceptance. Believes in the shared-room compromise. Knows that under
      pressure his mouth still wants to reach for the line that feels good
      to say instead of the line that does the work.
    knowledge: >
      Has rehearsed the opening of the proposal. Knows the schedule split
      — robotics Mondays and Wednesdays, art Thursdays. Knows the cost
      story at a summary level. Is leaning on Ren for any specific number.
    weaknesses: >
      Under pressure his mouth still reaches for the warm sweeping line
      about how much the kids love the room — the same move that hollowed
      out the original petition presentation. He has learned to catch
      himself, but only with a cue from someone next to him; left alone,
      his reflex would still take over.
    strengths: >
      He can actually walk into a room and deliver a proposal out loud,
      which nobody else in the group can do as well. When the argument
      has been built properly behind him, his delivery makes it land —
      the conclusion follows from the reasons because the reasons
      finally do the work this time.
    prior_beats: >
      Gave the original petition presentation that didn't land. Has spent
      the two weeks since the regrouping helping rebuild the proposal
      around the shared-room idea, and rehearsed the new opening with
      Mira until the warm sweeping phrasing came out of it.

  - name: Mira
    voice: >
      Direct, organizing, decides things out loud. Brings the notebook.
      Speaks in short declarative sentences when she's running a meeting
      and shorter ones when she's correcting a teammate without taking
      the floor.
    perspective: >
      Wants the principal to accept the proposal. Today she is focused
      entirely on what would actually persuade this specific adult,
      not on what would feel best for the group to say. Has agreed
      with Dev beforehand on a quiet table-tap as a cue if he slips
      back into the old framing.
    knowledge: >
      Knows the proposal cold. Knows which rebuilt framings tested well
      in the two weeks of preparation and which didn't. Has the notebook
      in her lap.
    weaknesses: >
      She is still the kid who states the group's consensus a beat
      early, and once she's said "okay so we're all agreed, right?"
      the group nods along whether or not it should. That hasn't gone
      away. What's changed is that today
      she is using that organizing reflex in service of how this lands
      on the principal instead of in service of what the group already
      believes.
    strengths: >
      She keeps the group pointed at the audience instead of at itself.
      In this meeting that means she is tracking Dev's delivery in
      real time and ready to correct it without taking the floor away
      from him.
    prior_beats: >
      Wrote PETITION at the top of the notebook on day one. Stated
      consensus too early throughout the season. Was the one who agreed
      to coordinate the table-tap cue with Dev during the rehearsals.

  - name: Ren
    voice: >
      Curious, slightly hedged, the kind of kid who actually reads things
      between meetings. Tends to start sentences with "wait" or "okay so."
      Less polished than Dev or Mira and not trying to be.
    perspective: >
      Wants to be ready if the principal asks for a number. Has spent part
      of the last two weeks preparing for exactly that. Believes her job
      today is to back up the proposal, not to deliver it.
    knowledge: >
      Checked the maintenance log between meetings, photographed the
      relevant page on her phone, knows which cost number on the handout
      came from where.
    weaknesses: >
      Still uneven about source quality in general — she has not become
      a different researcher overall. But on this specific proposal she
      did the checking ahead of time.
    strengths: >
      She does the work between sessions now, not only at sessions. When
      the principal asks where a number came from, she pulls up the photo
      immediately because she put it on her phone last week knowing she
      might need it. Her growth shows up as preparation, not improvisation.
    prior_beats: >
      Was the one who brought a peer-reviewed paper, a parent blog, and
      a press release to early meetings as if they were equivalent.
      Started asking where things came from after the petition failed.
      Spent the last two weeks photographing the maintenance log.

  - name: Sam
    voice: >
      Quiet. Listens more than she talks. When she does speak it tends
      to be one short specific sentence rather than a paragraph. Doesn't
      raise her voice.
    perspective: >
      Wants the kids on the Tuesday schedule — the ones who don't usually
      come into the maker space but said they'd want it open after school
      sometimes — to be heard in the principal's office. Does not want
      to take the floor unless the moment requires it. Believes her job
      today is to land one specific sentence at the right time.
    knowledge: >
      Talked to the kids on the Tuesday schedule personally in the two
      weeks of rebuilding. Wrote what they said on page three of the
      proposal in her own handwriting.
    weaknesses: >
      Still defaults to silence in rooms where adults are talking. The
      growth from two weeks ago — the moment she interrupted the group
      to name who they were leaving out — is real but partial. She can
      speak when the stakes require it; she does not yet reliably do it
      the rest of the time.
    strengths: >
      She notices whose voices are missing from a room and can name them
      when it matters. Today she has prepared one sentence and she will
      say it once.
    prior_beats: >
      Said almost nothing in the first three episodes. Two weeks ago
      interrupted the group, after the petition failed, to say that
      the petition spoke for "us" when it should have spoken for "the
      kids." Spent the rebuilding weeks talking to students she didn't
      previously know.

  - name: Theo
    voice: >
      Cautious, slow to speak, asks "are we sure?" more than anyone else
      in the group. When he does say something declarative it's short
      and lands harder than he means it to.
    perspective: >
      Has done his work earlier in the season. Is in the meeting today
      as a steady presence, not as a contributor to the proposal itself.
      Holds the season's honest assessment for the walk back from the
      office.
    knowledge: >
      Has been in every meeting. Knows what the proposal says and why.
      Trusts the rebuild.
    weaknesses: >
      None worth naming today. He is in the room and quiet on purpose;
      the story is not asking him to perform.
    strengths: >
      Can name a partial outcome as a partial outcome without flinching
      from either half — neither pretending it's a full win nor letting
      the loss collapse the win.
    prior_beats: >
      Two episodes ago, when the group expected him to say "I told you
      so" after the petition failed, he instead refused to let them
      blame the principal and said "she has a point — what did we
      actually offer her?" That was his big moment. Today he is mostly
      quiet until the walk back.

discussion_arc: >
  The five kids walk down the hallway to the principal's office. In the
  office, Dev opens the rebuilt proposal in front of the principal —
  specific about the schedule split, specific about the lower equipment
  cost. Mid-presentation his mouth starts reaching for the warm sweeping
  line about how much the kids love the room, the same shape from the
  original petition. Mira, sitting next to him, taps the table once
  without saying anything; it's the cue they agreed on beforehand. Dev
  stops, restarts in the rebuilt framing, and keeps going. The principal
  sees the tap and does not comment. The principal asks where one of the
  cost numbers came from; Ren immediately says it's from the maintenance
  log and pulls up the photo on her phone. The principal reads the
  proposal for a long quiet beat. Into that beat, Sam — who has not
  spoken — says her one prepared sentence about the kids on the Tuesday
  schedule wanting the room open after school. The principal underlines
  the sentence in pen and accepts the proposal with one small addition
  of her own about who closes up the room on shared days. The group does
  not argue. Walking back from the office, nobody is celebrating: Mira
  is already second-guessing the Monday choice they just made, Dev
  doesn't know the answer to her question and says so, Sam is already
  thinking about the kids she didn't get to talk to, Ren is checking her
  phone to make sure the maintenance-log photo is still there. Theo,
  who has been silent the whole meeting, closes the scene with one
  short line: it's a partial win and he's okay with that.

turn_outline:
  - speaker: Dev
    accomplishes: >
      Standing in front of the principal's desk, opens the proposal in
      the rebuilt framing — names the shared-room arrangement, the
      schedule split (robotics Mondays and Wednesdays, art Thursdays),
      and the lower equipment cost. Specific numbers, not sweeping
      language.
  - speaker: Dev
    accomplishes: >
      A few sentences in, his mouth starts sliding toward the warm
      sweeping line about how much the kids love the room — the same
      shape from the original petition. The line begins to leave his
      mouth.
  - speaker: Mira
    accomplishes: >
      Without saying anything aloud and without taking the floor away
      from Dev, taps the tabletop once next to him. It is the cue they
      agreed on during rehearsals. The principal sees the tap and does
      not comment on it.
  - speaker: Dev
    accomplishes: >
      Stops mid-sentence, restarts in the rebuilt framing, and sticks
      to the specific cost-and-schedule argument. The recovery happens
      without being announced. The principal then asks, calmly, where
      one of the cost numbers in the handout came from.
  - speaker: Ren
    accomplishes: >
      Immediately: it's from the maintenance log, she checked the dates
      last week. Pulls up the photo of the log on her phone and turns
      it so the principal can see the page. The principal looks at the
      photo, then back at the proposal, and reads for a long quiet beat.
  - speaker: Sam
    accomplishes: >
      Into the long beat of silence, says her one prepared sentence:
      "The kids on the Tuesday schedule said they'd want it open after
      school sometimes too. I wrote that on page three." It is the only
      thing she says in the meeting. The principal underlines the line
      in pen.
  - speaker: Mira
    accomplishes: >
      The principal accepts the proposal with one small addition of
      her own — a rule about who is responsible for closing up the
      room on shared days. Mira nods and says they can do that. Nobody
      pushes back. The group gathers their handouts and walks out of
      the office.
  - speaker: Mira
    accomplishes: >
      On the walk back down the hallway, asks Dev whether Mondays were
      really the right day for robotics. She is already second-guessing
      the schedule they just got accepted.
  - speaker: Dev
    accomplishes: >
      Doesn't know. Says so plainly. Does not try to perform certainty
      he doesn't have.
  - speaker: Sam
    accomplishes: >
      Quietly says she's already thinking about the kids who weren't
      on her list — the ones she didn't get to talk to in the two weeks
      of rebuilding. Not relieved. Not celebrating.
  - speaker: Ren
    accomplishes: >
      Pulls her phone out and checks that the maintenance-log photo is
      still in her camera roll. She already knows it is. Habit now,
      not improvisation.
  - speaker: Theo
    accomplishes: >
      Speaks for the first time in the episode. Says it's a partial
      win and he's okay with that. The "okay with that" has to land
      as honest, not as resignation. End of scene.
