story_id: saving-the-maker-space
episode_number: 4
scenario_id: saving-the-maker-space-ep-04
personas:
- name: Mira
  perspective: 'Mira believes the first petition lost on technicalities — the evidence base was thin,
    the principal poked holes in it — and that a tighter second petition with better numbers will land.
    She is drafting it already and treats the group''s underlying claim ("the kids need this room") as
    the part that does not need rethinking.

    '
- name: Ren
  perspective: 'Ren is starting to suspect that the group''s first round of research was sloppier than
    she wanted to believe. Between this meeting and the last one she went back through her own three sources
    from the beginning of the story and actually read them, and she walks in ready to admit what she found.

    '
- name: Sam
  perspective: 'Sam has been watching the group draft a petition "for the kids" for three meetings now,
    and she has known the whole time that the petition is really for the five of them. She has not said
    so. She thinks she should — she has thought she should for weeks — and she has been letting the moment
    pass because saying it means interrupting Mira, and interrupting Mira is the thing she most wants
    to avoid in any room.

    '
turns:
