# Schema: Validation Output
# Describes the structure of the validation agent's output
# Source: pipeline-spec.md Section 3, Stage 1

schema:
  root:
    type: object
    fields:
      story_id:
        type: string
        required: true
        description: >
          Kebab-case identifier of the parent story. Primary addressing
          field (with episode_number).

      episode_number:
        type: integer
        required: true
        description: 1-indexed position within the parent story's arc.

      scenario_id:
        type: string
        required: false
        description: >
          Legacy traceability field. Optional; primary addressing is by
          story_id + episode_number.

      verdict:
        type: string
        required: true
        description: >
          Overall validation result. Standardized across all four reviewers
          as ACCEPT / REVISE / REGENERATE / REJECT. The validation_agent is
          allowed to return ACCEPT, REVISE, or REJECT — REGENERATE is not
          applicable here because the scenario plan is the producer's first
          output and there is nothing upstream to regenerate from.
        constraints:
          enum: [ACCEPT, REVISE, REJECT]

      criteria:
        type: list
        required: true
        description: Individual validation checks.
        items:
          type: object
          fields:
            criterion:
              type: string
              required: true
              description: What was checked.
              constraints:
                enum:
                  - facet_detectability
                  - cross_lens_visibility
                  - persona_tension
                  - information_barrier_compliance
                  - turn_outline_anti_patterns
                  - signal_mechanism_fidelity
                  - strength_signal_fidelity
            result:
              type: string
              required: true
              constraints:
                enum: [PASS, ISSUE, SUGGESTION]
            explanation:
              type: string
              required: true
              description: Details about the finding.
            references:
              type: list
              required: false
              description: Specific fields or values in the scenario plan that triggered the finding.
              items:
                type: string

      summary:
        type: string
        required: true
        description: Brief overall assessment for the operator.
