# Schema: Assistive Package (merge script output)
# Describes the structure of
#   artifacts/{story_id}/episodes/episode_{NN}/assistive_package.yaml
# Runtime-first package for no-LLM downstream apps.

schema:
  root:
    type: object
    fields:
      package_meta:
        type: object
        required: true
        fields:
          story_id:
            type: string
            required: true
          episode_number:
            type: integer
            required: true
          scenario_id:
            type: string
            required: false
          schema_version:
            type: string
            required: true
          integrity:
            type: object
            required: true
            fields:
              checks_passed:
                type: integer
                required: true
              checks_total:
                type: integer
                required: true
              timestamp:
                type: string
                required: true

      analytic_core:
        type: object
        required: true
        fields:
          passages:
            type: list
            required: true
            constraints:
              min_length: 1
            items:
              type: object
              fields:
                passage_id:
                  type: string
                  required: true
                  constraints:
                    pattern: "p\\d+"
                target_passage_id:
                  type: string
                  required: true
                target_turn_ids:
                  type: list
                  required: true
                  items:
                    type: string
                target_character_ids:
                  type: list
                  required: true
                  items:
                    type: string
                turn_range:
                  type: list
                  required: false
                  items:
                    type: string
                lens_visibility:
                  type: object
                  required: false
                facets_present:
                  type: list
                  required: false
                  items:
                    type: object
          prior_exposure:
            type: list
            required: true
            items:
              type: object
              fields:
                ref:
                  type: string
                  required: true
                first_seen:
                  type: string
                  required: true

      front_door_support:
        type: object
        required: true
        fields:
          attention_targets:
            type: list
            required: true
            items:
              type: object
              fields:
                passage_id:
                  type: string
                  required: true
                support_id:
                  type: string
                  required: true
                use_when:
                  type: string
                  required: true
                  constraints:
                    enum: [cannot_start, wrong_focus]
                lens:
                  type: string
                  required: false
                  constraints:
                    enum: [logic, evidence, scope]
                source_turns:
                  type: list
                  required: false
                  items:
                    type: string
                text:
                  type: string
                  required: true
          sentence_frame_seeds:
            type: list
            required: true
            items:
              type: object
              fields:
                passage_id:
                  type: string
                  required: true
                support_id:
                  type: string
                  required: true
                use_when:
                  type: string
                  required: true
                  constraints:
                    enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
                lens:
                  type: string
                  required: false
                  constraints:
                    enum: [logic, evidence, scope]
                source_turns:
                  type: list
                  required: false
                  items:
                    type: string
                frame:
                  type: string
                  required: true
                seed:
                  type: string
                  required: true
          modeled_episode_examples:
            type: list
            required: true
            items:
              type: object
              fields:
                passage_id:
                  type: string
                  required: true
                support_id:
                  type: string
                  required: true
                use_when:
                  type: string
                  required: true
                  constraints:
                    enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
                lens:
                  type: string
                  required: false
                  constraints:
                    enum: [logic, evidence, scope]
                source_turns:
                  type: list
                  required: false
                  items:
                    type: string
                model_text:
                  type: string
                  required: true
                why_this_counts:
                  type: string
                  required: true
                handoff_prompt:
                  type: string
                  required: true
          transfer_examples:
            type: list
            required: true
            items:
              type: object
              fields:
                passage_id:
                  type: string
                  required: true
                support_id:
                  type: string
                  required: true
                use_when:
                  type: string
                  required: true
                  constraints:
                    enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
                lens:
                  type: string
                  required: false
                  constraints:
                    enum: [logic, evidence, scope]
                example_text:
                  type: string
                  required: true
                why_this_counts:
                  type: string
                  required: true
                handoff_prompt:
                  type: string
                  required: true

      diagnostic_support:
        type: object
        required: true
        fields:
          probes:
            type: object
            required: true
          interventions:
            type: object
            required: true
          struggle_calibration:
            type: object
            required: true

      discussion_support:
        type: object
        required: true
        fields:
          discussion_cues:
            type: object
            required: true
          talk_moves:
            type: list
            required: true
            items:
              type: string
          consensus_checks:
            type: list
            required: true
            items:
              type: string

      teacher_support:
        type: object
        required: true
        fields:
          calibration_warnings:
            type: list
            required: false
            items:
              type: string
