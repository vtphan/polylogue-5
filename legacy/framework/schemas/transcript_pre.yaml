# Schema: Transcript (Pre-Enumeration)
# The dialog writer's raw output before turn/sentence IDs are assigned.
# Matches transcript.yaml but without turn_id and sentence_id fields,
# and without identifier/persona metadata. Identifier fields
# (story_id, episode_number, scenario_id) and the personas block are
# injected post-barrier by enumerate_transcript.py from the sibling
# episode.yaml — dialog_writer runs inside the information barrier and
# cannot read those fields.
# Source: pipeline-spec.md Section 2.2

schema:
  root:
    type: object
    fields:
      turns:
        type: list
        required: true
        description: The discussion turns, without enumerated IDs.
        constraints:
          min_length: 10
          max_length: 14
        items:
          type: object
          fields:
            speaker:
              type: string
              required: true
              description: Persona name.
            sentences:
              type: list
              required: true
              description: 1-3 sentences per turn.
              constraints:
                min_length: 1
                max_length: 3
              items:
                type: object
                fields:
                  text:
                    type: string
                    required: true
                    description: The sentence text.
