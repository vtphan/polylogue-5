# Schema: Expert Analysis
# Describes the structure of
#   artifacts/{story_id}/episodes/episode_{NN}/analysis.yaml
# The pipeline's most framework-dependent artifact — bridges hidden and visible layers.

schema:
  root:
    type: object
    fields:
      story_id:
        type: string
        required: true
        description: >
          Kebab-case identifier of the parent story. Mirrors episode.yaml.
          Primary addressing field (with episode_number).

      episode_number:
        type: integer
        required: true
        description: 1-indexed position within the parent story's arc.

      scenario_id:
        type: string
        required: false
        description: >
          Legacy traceability field — composite "{story_id}-ep-{NN}"
          identifier carried over from the old single-scenario pipeline.
          Optional in downstream artifacts; primary addressing is by
          story_id + episode_number. Propagated from episode.yaml when
          present.

      passage_analyses:
        type: list
        required: true
        description: One entry per evaluable passage (a passage is 1-3 consecutive turns).
        items:
          type: object
          fields:
            passage_id:
              type: string
              required: true
              description: Sequential passage ID (e.g., "passage_01").
              constraints:
                pattern: "passage_\\d{2}"

            turns:
              type: list
              required: true
              description: Turn IDs included in this passage.
              items:
                type: string
                constraints:
                  pattern: "turn_\\d{2}"

            sentence_range:
              type: list
              required: true
              description: All sentence IDs in this passage.
              items:
                type: string
                constraints:
                  pattern: "turn_\\d{2}\\.s\\d{2}"

            # --- Hidden layer (not shown to students) ---
            facet_annotations:
              type: list
              required: true
              description: Facet-level analysis. Hidden from students.
              items:
                type: object
                fields:
                  facet_id:
                    type: string
                    required: true
                    description: From facet inventory.
                  quality_level:
                    type: string
                    required: true
                    description: '"strong", "weak", or a brief qualitative description.'
                  evidence_sentences:
                    type: list
                    required: true
                    description: Sentence IDs where this facet is observable.
                    items:
                      type: string
                  evidence_basis:
                    type: string
                    required: true
                    description: >
                      REQUIRED on every annotation. One sentence pointing to
                      the specific behavior in evidence_sentences that
                      supports the cognitive_pattern and social_dynamic
                      assignments. If evidence is consistent with multiple
                      labels, name the alternatives here rather than
                      committing. For pass-2 (non-targeted) annotations, this
                      field cites the line(s) that prompted the evaluator to
                      surface the facet at all. The rule is uniform — every
                      annotation has an evidence_basis. See
                      framework/docs/story-pipeline-revision.md Part 4C.
                      Validated by validate_schema.py (Part 4D rule 3).
                  primary_lens:
                    type: string
                    required: true
                    constraints:
                      enum: [logic, evidence, scope]
                  also_visible_through:
                    type: list
                    required: true
                    items:
                      type: string
                      constraints:
                        enum: [logic, evidence, scope]
                  explanatory_variables:
                    type: object
                    required: true
                    fields:
                      cognitive_pattern:
                        type: string_or_list
                        required: false
                        description: >
                          Cognitive pattern ID, list of IDs, or null. A
                          single string is "confident" (single-label).
                          A list is "hedged" (the evidence supports
                          multiple labels and the evaluator declines to
                          commit). Hedged annotations are honest but do
                          NOT satisfy story-level coverage; only single-
                          label annotations count. The evaluator MUST
                          hedge whenever evidence underdetermines, even if
                          doing so causes a coverage failure — the fix is
                          never to push the evaluator to commit harder.
                          See framework/docs/story-pipeline-revision.md
                          Part 4C.
                      social_dynamic:
                        type: string_or_list
                        required: false
                        description: >
                          Social dynamic ID, list of IDs, or null. Same
                          hedging semantics as cognitive_pattern.
                      interaction:
                        type: string
                        required: false
                        description: How cognitive and social forces interact here.
                  was_targeted:
                    type: boolean
                    required: true
                    description: Whether this facet was a design target in the scenario plan.
                  notes:
                    type: string
                    required: false
                    description: Evaluator observations — unexpected findings, quality issues.
                  contrastive_explanation:
                    type: string
                    required: false
                    description: >
                      REQUIRED when quality_level is "strong". Explains the
                      sound reasoning *contrastively* using the deficit
                      vocabulary — i.e., what cognitive pattern or social
                      dynamic the personas avoided here that they (or other
                      personas in earlier scenarios) might have fallen into.
                      Example: "Here the group checked the source's interest
                      before accepting the claim, where in the recycling
                      scenario the same kind of website triggered uncritical
                      acceptance." This is how the framework's deficit-only
                      explanatory variables describe positive reasoning —
                      see system-evaluation-20260406.md suggestion E. Omit
                      for weak-quality annotations.

            # --- Visible layer: Unified AI perspective ---
            ai_perspective:
              type: object
              required: true
              description: >
                Single integrated AI perspective per passage. Per-lens observations
                combined with explanation of why the characters reasoned this way.
                Written as perspective, not verdict. Notes both sound and weak reasoning.
                This is the final entry in the unified scaffold sequence.
              fields:
                through_logic:
                  type: object
                  required: true
                  fields:
                    observation:
                      type: string
                      required: false
                      description: >
                        Written as perspective: "Looking at the logic here, I notice..."
                        Null if nothing notable through this lens for this passage.
                        Should note both sound and weak reasoning when present.
                    key_sentences:
                      type: list
                      required: true
                      description: Sentence IDs the observation references.
                      items:
                        type: string
                through_evidence:
                  type: object
                  required: true
                  fields:
                    observation:
                      type: string
                      required: false
                    key_sentences:
                      type: list
                      required: true
                      items:
                        type: string
                through_scope:
                  type: object
                  required: true
                  fields:
                    observation:
                      type: string
                      required: false
                    key_sentences:
                      type: list
                      required: true
                      items:
                        type: string
                why_it_happened:
                  type: string
                  required: false
                  description: >
                    Integrated cognitive × social explanation. Introduces vocabulary
                    as perspective: "One way to think about this is..." or
                    "A cognitive scientist might say..." Covers cognitive pattern,
                    social dynamic, and their interaction when relevant.
                what_to_notice:
                  type: string
                  required: true
                  description: >
                    Brief, student-friendly prompt. E.g., "Something interesting
                    to think about: did anyone in the group push back on this?"
                what_to_notice_sentences:
                  type: list
                  required: false
                  description: Optional sentence IDs that "this" refers to.
                  items:
                    type: string

            # --- Perspectival diversity metadata (hidden layer) ---
            diversity_potential:
              type: object
              required: true
              description: >
                Used for pipeline quality assessment and shared with facilitation guide.
                Not shown to students.
              fields:
                expected_lens_split:
                  type: string
                  required: true
                  description: Which lenses are likely to produce different readings.
                likely_student_observations:
                  type: list
                  required: true
                  description: What students are likely to see and miss, per lens.
                  items:
                    type: object
                    fields:
                      lens:
                        type: string
                        required: true
                        constraints:
                          enum: [logic, evidence, scope]
                      observations:
                        type: list
                        required: true
                        description: Discrete expected observations (not a summary paragraph).
                        items:
                          type: string
                      might_miss:
                        type: list
                        required: true
                        description: Specific things students might not notice.
                        items:
                          type: string
