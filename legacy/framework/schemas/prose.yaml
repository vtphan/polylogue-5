# Schema: Prose (prose agent output, L2)
# Describes the structure of
#   artifacts/{story_id}/episodes/episode_{NN}/prose.yaml
# Short, voiced, register-matched student-facing prose.
# Runtime-package refactor source schema for no-LLM downstream apps.

schema:
  root:
    type: object
    fields:
      story_id:
        type: string
        required: true

      episode_number:
        type: integer
        required: true

      scenario_id:
        type: string
        required: false

      episode_opening:
        type: string
        required: true
        description: >
          One paragraph, student-facing, in the story's declared
          pedagogical_register. Sets the narrative scene and ends with
          a non-leading "what to watch for" sentence. Barrier-safe:
          no framework terminology.

      attention_targets:
        type: list
        required: true
        description: >
          Per-passage attention redirects for students who cannot start
          or are focused on the wrong place.
        constraints:
          min_length: 1
        items:
          type: object
          fields:
            passage_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+"
            support_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+_at_\\d+"
            use_when:
              type: string
              required: true
              constraints:
                enum: [cannot_start, wrong_focus]
            source_turns:
              type: list
              required: false
              items:
                type: string
            text:
              type: string
              required: true

      sentence_frame_seeds:
        type: list
        required: true
        description: >
          Per-passage startup scaffolds that combine a reusable sentence
          frame with a short episode-specific seed.
        constraints:
          min_length: 1
        items:
          type: object
          fields:
            passage_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+"
            support_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+_sf_\\d+"
            use_when:
              type: string
              required: true
              constraints:
                enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
            lens:
              type: string
              required: false
              constraints:
                enum: [logic, evidence, scope]
            source_turns:
              type: list
              required: false
              items:
                type: string
            frame:
              type: string
              required: true
            seed:
              type: string
              required: true

      modeled_episode_examples:
        type: list
        required: true
        description: >
          Explicit supports that model one real flaw in the episode and
          then hand the student back to the text.
        items:
          type: object
          fields:
            passage_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+"
            support_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+_me_\\d+"
            use_when:
              type: string
              required: true
              constraints:
                enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
            lens:
              type: string
              required: false
              constraints:
                enum: [logic, evidence, scope]
            source_turns:
              type: list
              required: false
              items:
                type: string
            model_text:
              type: string
              required: true
            why_this_counts:
              type: string
              required: true
            handoff_prompt:
              type: string
              required: true

      transfer_examples:
        type: list
        required: true
        description: >
          Explicit supports that simplify the pattern outside the episode
          and then hand the student back to the text.
        items:
          type: object
          fields:
            passage_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+"
            support_id:
              type: string
              required: true
              constraints:
                pattern: "p\\d+_te_\\d+"
            use_when:
              type: string
              required: true
              constraints:
                enum: [cannot_start, low_articulation, wrong_focus, after_check_fail]
            lens:
              type: string
              required: false
              constraints:
                enum: [logic, evidence, scope]
            example_text:
              type: string
              required: true
            why_this_counts:
              type: string
              required: true
            handoff_prompt:
              type: string
              required: true

      consensus_check:
        type: list
        required: true
        description: >
          1-2 short questions fired on group-phase closure.
          Not reactive to student state.
        constraints:
          min_length: 1
          max_length: 2
        items:
          type: string
