# v5 episode-plan.yaml schema sketch — human reference only.
#
# Canonical structural rules live in
# pipeline/scripts/validate_episode_plan.py (to be implemented).
#
# The episode plan is the story-facing planning artifact produced per
# episode by the showrunner. v5 extends v4's plan with four fields that
# make the instructional conditions explicit before transcript drafting:
# context, argument, description, and lenses[].
#
# audience appropriateness (6th-grade reading level, middle-school
# subject matter) is enforced on context/argument/description at this
# stage. Downstream agents do not re-check per turn.

type: object
required:
  - story_id
  - episode_id
  - title
  - episode_goal
  - student_takeaway
  - context
  - argument
  - description
  - lenses

properties:
  story_id:
    type: string

  episode_id:
    type: string

  title:
    type: string

  episode_goal:
    type: string
    description: >
      Planning-only — the narrative/learning aim for this episode. Not
      student-facing; not present in lesson_package.yaml.

  student_takeaway:
    type: string
    description: The line the student should carry away at episode close.

  context:
    type: string
    description: >
      What the episode is generally about: mood, theme, social
      situation. Pitched to a 6th-grade reader.

  argument:
    type: string
    description: >
      What one character is trying to get others to believe or do.
      This is the persuasive thread in which reasoning becomes
      visible and teachable. Load-bearing: without an argument, the
      episode does not generate natural teaching anchors. Pitched
      to a 6th-grade reader.

  description:
    type: string
    description: >
      The creative episode concept that satisfies the instructional
      conditions above. Plot texture in story voice; not a scene
      outline. Pitched to a 6th-grade reader.

  lenses:
    type: array
    minItems: 1
    description: >
      One or more lens names declaring which reasoning lens(es) the
      episode will expose. Names must match reference/reasoning-
      taxonomy.yaml lenses.
    items:
      type: string
      enum: [logic, evidence, scope]

  character_beats:
    type: array
    description: >
      Optional per-character voice, relationship, and private-stakes
      notes. Story-shaping aids, not a scene plan.
