# Episode Plan — the-field-trip episode 2
# Generated by planning_agent

scenario_id: the-field-trip-ep-02
story_id: the-field-trip
episode_number: 2

topic: >
  The field trip committee reconvenes with evidence — each member presents
  what they found to support their proposal, but everyone researched only
  their own option.

context: >
  Ms. Tsai's 6th grade Integrated Studies class has one field trip this year.
  A five-person student committee must propose a subject and a destination,
  evaluated on reasoning quality. In the first meeting, four proposals made
  the whiteboard and Sam's was crossed out. The committee agreed to research
  their options before this meeting, which each member interpreted as
  researching their own proposal. Now they reconvene with a brochure, a
  video, a printout, a map, and a list of questions — each piece of evidence
  shaped by the conclusion its owner started with.

instructional_goals:
  - >
    Recognize when a source that looks official and credentialed is not the
    right kind of source to answer the question being asked.
  - >
    Notice when a single piece of evidence is treated as enough to settle
    a question, especially when the person presenting it stopped looking
    after finding one thing that supported their position.
  - >
    Identify when someone asks the right questions but the group does not
    engage because the questions do not look like arguments.

discussion_dynamic: >
  The committee reconvenes with evidence, but each member researched only
  their own proposal. Jordan presents the zoo's promotional brochure and
  reads its credentials aloud with satisfaction, treating official-sounding
  language as if it settled the question. The committee follows his lead in
  treating the credentials as conclusive — Sam asks what "state-certified"
  actually certifies, and Jordan answers by re-reading the brochure more
  slowly. Maya presents a single YouTube video as proof that amusement parks
  are educational, without noticing the video shows a different grade, a
  different subject, and a different park. Sam reads her list of questions
  aloud, and the committee listens politely but moves on — her questions
  are not formatted as arguments for a destination, so the committee does
  not know how to engage with them. Maya catches a genuine gap in Jordan's
  reasoning (his credentials are for science, not Integrated Studies) but
  does not notice the same gap applies to her own pitch. The meeting ends
  in stalemate: everyone has "done their research," nobody has changed their
  mind, and nobody has confronted anyone else's evidence directly.

personas:
  - name: Jordan
    perspective: >
      Believes the zoo is the strongest option because it has official
      educational credentials — state certification, alignment with science
      standards, a dedicated school group coordinator. He sees these as
      settling the question of educational value.
    knowledge: >
      Brought the zoo's promotional brochure, which lists state-certified
      educational programs, alignment with Next Generation Science Standards,
      and a dedicated school group coordinator. Volunteered at the zoo last
      summer. Has not looked into what "state-certified" actually certifies
      or whether the certification applies to a class that is not studying
      biology.
    weaknesses: >
      Takes official-sounding information at face value. If something has a
      credential, a certification, or a professional look, Jordan trusts it
      without asking what the credential actually means or whether it applies
      to the situation. He brought a brochure written by the zoo to attract
      school groups and treats it as if it were an independent evaluation.
      When someone questions his source, he responds by re-reading it more
      carefully rather than reconsidering whether the source is the right one
      to answer the question. His earnest, well-intentioned presentation
      makes the room treat the official language as more meaningful than it is.
    strengths: >
      Earnest and thorough — when Jordan sets out to find information, he
      actually does the work. He brought a real document with real details,
      not a half-remembered impression. His instinct to look things up is
      sound; the gap is in what he does with what he finds.

  - name: Maya
    perspective: >
      Believes the amusement park is the most educational option and has
      found a video that proves it. She sees the video as confirming what
      she already knew — real-world physics learning is exciting and
      effective.
    knowledge: >
      Found a YouTube video of a high school physics teacher who took
      students to an amusement park to measure velocity on roller coasters.
      Has not noticed that the video shows a physics class (not Integrated
      Studies), high schoolers (not 6th graders), a teacher-designed
      worksheet (which the committee has not proposed), and a different
      amusement park.
    weaknesses: >
      Searched for evidence that would support her preferred conclusion and
      stopped looking as soon as she found one result that felt like enough.
      She is presenting a single video as if it proves her case, without
      noticing all the ways the video's situation differs from the
      committee's. She filtered her search to find a hit and didn't look for
      anything that might complicate her position.
    strengths: >
      Sharp at spotting gaps in other people's reasoning. When someone else
      makes a logical leap, Maya is often the first to catch it. She notices
      that Jordan's science credentials don't match what their class is
      actually studying — an observation that is correct and important, even
      though she doesn't see it applies to her own pitch too.

  - name: Sam
    perspective: >
      Still believes the committee should start from a question rather than
      a destination. She has used her research time to develop the questions
      she thinks the committee should be asking, not to build a case for a
      specific place.
    knowledge: >
      Wrote down a set of questions about the school lunch program: who
      decides the menu, where does the food come from, how much does it cost
      per student per day, what happens if a family can't pay. These are
      cross-disciplinary questions that touch science, civics, economics,
      and equity.
    weaknesses: >
      Her questions are not formatted as arguments for a destination, which
      means the committee does not know how to engage with them. She reads
      her list aloud, the committee listens politely, and they move on as
      if she said nothing. She does not reframe her questions as a competing
      case or push back when ignored.
    strengths: >
      She is the only committee member whose research started from a
      question rather than from a destination she already wanted. Her
      questions directly address what the class is supposed to be learning.
      She is doing the thing the assignment asked for, but the committee
      is playing a different game.

target_facets:
  - facet_id: source_credibility
    target_quality: weak
    primary_lens: evidence
    also_visible_through:
      - logic
    designed_explanation:
      cognitive_pattern: uncritical_acceptance
      social_dynamic: authority_deference
      cognitive_signal: >
        Jordan presents the zoo's promotional brochure as if it were an
        independent evaluation. He reads aloud that the zoo has "state-
        certified educational programs aligned with Next Generation Science
        Standards" and a "dedicated school group coordinator," treating each
        credential as settling the question without asking what "state-
        certified" actually certifies, whether the certification applies to
        Integrated Studies rather than biology, or whether a brochure written
        by the zoo to attract school groups is the right source to evaluate
        the zoo's educational value.
      social_signal: >
        Jordan cites the credentials with a tone that implies the question
        is answered — "it's state-certified, so..." — and the committee
        treats the official-sounding language as settling rather than asking
        Jordan to unpack what the certification means. Sam asks one follow-up
        ("certified for what, though?") that Jordan answers by re-reading
        the brochure more slowly, as if the problem were hearing rather than
        evaluating.
      interaction_note: >
        The uncritical_acceptance and authority_deference chain tightly here:
        Jordan trusts the credential because it looks official, and the
        committee trusts Jordan's presentation because credentials sound
        authoritative. The double layer — Jordan not interrogating the source,
        and the committee not interrogating Jordan's reading of it — is the
        design-doc-established pattern for Jordan across the season. The
        distinction from Priya's authority_deference in episode 1 is that
        Priya's was personal (her mother's role), while Jordan's is
        institutional (the credential itself).
    carrier_persona: Jordan
    signal_mechanism: >
      Jordan presents the zoo's promotional brochure with earnest pride,
      reading aloud its credentials — state certification, alignment with
      science standards, a dedicated coordinator. His tone is satisfied, as
      if listing the credentials settles the question. He does not ask what
      "state-certified" actually certifies, whether it applies to Integrated
      Studies rather than biology, or whether a brochure written by the zoo
      to sell school visits is the right source to judge the zoo's
      educational value. When Sam asks "certified for what, though?", Jordan
      re-reads the same line more slowly and carefully, treating Sam's
      question as a hearing problem rather than an evaluation problem. The
      committee follows Jordan's lead — the credentials sound official, so
      the room treats them as conclusive, extending trust from the
      credential to Jordan's reading of it without interrogation.

  - facet_id: sufficiency
    target_quality: weak
    primary_lens: evidence
    also_visible_through:
      - scope
      - logic
    designed_explanation:
      cognitive_pattern: confirmation_bias
      social_dynamic: null
      cognitive_signal: >
        Maya's evidence is a single YouTube video of a high school physics
        teacher taking students to an amusement park. She presents it as
        proof that amusement parks are educational, without noticing that
        the video shows a physics class (not an Integrated Studies class),
        high schoolers (not 6th graders), a teacher-designed worksheet
        (which the committee has not proposed), and a different amusement
        park. She filtered her search to find evidence that supported her
        conclusion and stopped looking as soon as she found one result that
        felt sufficient.
      social_signal: null
      interaction_note: >
        This is a different facet weakness than episode 1's inferential_
        validity. In episode 1, Maya's argument had a chain with logical
        gaps. Here, the argument has a single piece of evidence and nothing
        else — the chain is not invalid, it is unsupported. The distinction
        matters for the discrimination surface: a student might flag
        inferential_validity again ("she's making a leap") when the precise
        problem is sufficiency ("she has one source and treats it as enough").
        confirmation_bias is the correct cognitive pattern for both episodes
        but manifests differently: in episode 1 it shaped the argument's
        structure; here it shaped the evidence-gathering process.
    carrier_persona: Maya
    signal_mechanism: >
      Maya presents a single YouTube video with infectious enthusiasm —
      "this teacher literally took her students to a roller coaster and they
      measured velocity!" She treats the video as proof that amusement parks
      are educational, without noticing the many differences between the
      video's situation and the committee's: a physics class vs. Integrated
      Studies, high schoolers vs. 6th graders, a teacher-designed worksheet
      the committee has not proposed, and a different park entirely. She
      searched for something that would support her preferred conclusion,
      found one result, and stopped. The single video is presented as if
      it settles the question, and Maya does not acknowledge that one
      example from a different context might not be enough.

target_strengths:
  - facet_id: inferential_validity
    primary_lens: logic
    also_visible_through: []
    carrier_persona: Maya
    signal_mechanism: >
      When Jordan presents the zoo brochure's credentials, Maya catches a
      genuine gap: "Wait, it says 'science standards,' but we're not doing
      science class, we're doing Integrated Studies. That's not the same
      thing." The observation is sharp, correct, and important — the
      credential Jordan cited does not apply to the question the committee
      is actually answering. Maya's ability to spot this gap in someone
      else's reasoning is the same faculty that, turned inward, would
      reveal the equivalent gap in her own pitch (a physics class is not
      Integrated Studies either). She does not make that connection.
    contrastive_note: >
      Maya's chain-analysis skill is genuine — she identifies exactly the
      right gap in Jordan's reasoning. The selective application (she sees
      the gap in his argument but not the identical gap in her own) is
      what makes this a strength that coexists with her weakness rather
      than canceling it out.

  - facet_id: relevance
    primary_lens: evidence
    also_visible_through:
      - logic
    carrier_persona: Sam
    signal_mechanism: >
      Sam's questions — who decides the menu, where does the food come
      from, what happens when a family can't pay — are the only research
      that starts from a question rather than a destination. They directly
      address what Integrated Studies is supposed to ask: cross-disciplinary
      questions about how systems work. But because the questions are not
      formatted as arguments for a destination, the committee does not
      engage with them. Sam is doing exactly what the assignment asked for;
      the committee is playing a different game and cannot recognize her
      contribution as relevant to the task they were given.
    contrastive_note: >
      Every other committee member brought evidence that supports their
      preferred destination. Sam is the contrast: she brought questions
      that address the assignment's actual purpose. The committee's failure
      to engage with her questions is a failure of the group's process,
      not of Sam's reasoning.

discussion_arc: >
  The committee reconvenes with evidence in hand, each member having
  researched only their own proposal. Jordan goes first, presenting the
  zoo brochure with pride and reading its credentials as if they settle
  the question. Sam asks what the certification actually means; Jordan
  re-reads the brochure more slowly instead of answering. Maya follows
  with her YouTube video, describing it with enthusiasm but glossing over
  all the ways it differs from their situation. Priya distributes her
  museum printout. Kai unfolds his annotated walking map. Sam reads her
  list of questions; the committee listens politely and moves on. Then
  Maya catches a real gap in Jordan's reasoning — the zoo's science
  credentials don't match their Integrated Studies class — and Jordan
  gets defensive. But Maya doesn't notice the same gap applies to her own
  pitch. The meeting ends in stalemate: everyone has done their homework,
  nobody has changed their mind, and the whiteboard still shows four
  proposals. The comfortable feeling of progress masks the fact that
  nobody evaluated anyone else's evidence.

turn_outline:
  - speaker: Jordan
    accomplishes: >
      Opens by presenting the zoo brochure with pride. He reads aloud the
      credentials — state-certified programs, alignment with science
      standards, a dedicated coordinator — with a tone that implies the
      question is answered. "It's state-certified, so..."

  - speaker: Sam
    accomplishes: >
      Asks a follow-up: "Certified for what, though?" She is genuinely
      curious, not combative — she wants to know what the credential means.

  - speaker: Jordan
    accomplishes: >
      Responds to Sam's question by re-reading the same line from the
      brochure more slowly and carefully, as if Sam's problem were hearing
      rather than evaluating. The committee accepts his re-reading as a
      sufficient answer and moves on.

  - speaker: Maya
    accomplishes: >
      Presents her YouTube video with enthusiasm: "This teacher literally
      took her students to a roller coaster and they measured velocity!"
      She describes the video as if it proves amusement parks are
      educational, without mentioning it was a high school physics class.

  - speaker: Sam
    accomplishes: >
      Reads her list of questions aloud — who decides the menu, where does
      the food come from, what happens if a family can't pay. The committee
      listens politely and then moves on as if she said nothing, because
      her questions are not arguments for a destination.

  - speaker: Jordan
    accomplishes: >
      Pivots the conversation back to evidence presentations, asking if
      anyone else brought something. His tone is organizing — he wants to
      keep the meeting moving — and his redirect means Sam's questions
      are treated as a pause rather than a contribution.

  - speaker: Maya
    accomplishes: >
      Catches a genuine gap in Jordan's reasoning: "Wait, it says 'science
      standards,' but we're not doing science class, we're doing Integrated
      Studies. That's not the same thing." The observation is sharp and
      correct.

  - speaker: Jordan
    accomplishes: >
      Gets defensive about Maya's challenge. He flips through the brochure
      looking for something that addresses her point, then falls back on
      "but it's still an educational program." He does not concede that
      the certification might not apply.

  - speaker: Maya
    accomplishes: >
      Presses Jordan's gap for another beat — "science standards and
      Integrated Studies are literally different things" — but does not
      notice that her own video shows a physics class, which has exactly
      the same mismatch she just called out in Jordan's case.

  - speaker: Sam
    accomplishes: >
      Quietly observes that everyone brought evidence about their own
      destination and nobody looked at anyone else's. She says it plainly,
      once, without emphasis. The observation is accurate, and the
      committee does not respond to it.

  - speaker: Jordan
    accomplishes: >
      Steers toward closing: "Okay, so we all have our stuff — should we
      just vote next time?" His move to logistics signals that the
      evidence-sharing phase is over, even though nobody actually evaluated
      anyone else's evidence.

  - speaker: Maya
    accomplishes: >
      Agrees with moving toward a vote, adding that they all did their
      research so they're ready to decide. Her tone reinforces the
      comfortable feeling that progress was made, even though nobody
      changed their mind.
