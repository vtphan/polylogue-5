          makes that connection.
      evidence:
        engagement: high
        affordance: rich
        what_shows: >
          The entire episode is structured around evidence presentation.
          Jordan reads credentials from a promotional brochure, Maya cites
          a YouTube video, and Sam offers cross-disciplinary questions. The
          passage is rich with opportunities to evaluate what counts as
          good evidence, whether sources are appropriate for the question
          being asked, and whether a single piece of evidence is enough.
      scope:
        engagement: partial
        affordance: moderate
        what_shows: >
          Sam's observation that nobody researched anyone else's destination
          is a scope move — she is asking whether the committee considered
          the full picture. The passage affords scope analysis through the
          committee's failure to engage with perspectives beyond their own
          proposals, but only Sam and briefly Maya engage with scope
          considerations.

