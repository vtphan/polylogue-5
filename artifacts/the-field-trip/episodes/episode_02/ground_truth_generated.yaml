    facets_present:
      # --- Pass 1: target facets (weaknesses) ---

      - facet_ref: source_credibility
        label: Trusting the source
        lens: evidence
        role: primary
        severity: strong
        evidence_turns: [t01, t03, t08]
        one_line: >
          Jordan presents the zoo's promotional brochure as if it were an
          independent evaluation, treating state certification and science
          standards alignment as settling the question without asking what
          the credential actually certifies or whether it applies to
          Integrated Studies.

      - facet_ref: sufficiency
        label: Enough evidence
        lens: evidence
        role: primary
        severity: moderate
        evidence_turns: [t04]
        one_line: >
          Maya presents a single YouTube video as proof that amusement parks
          are educational, without noticing that the video shows a different
          grade level, a different subject, a different park, and a
          teacher-designed worksheet the committee has not proposed.

      # --- Pass 2: target strengths ---

      - facet_ref: inferential_validity
        label: Leaps in reasoning
        lens: logic
        role: strength
        severity: strong
        evidence_turns: [t07, t09]
        one_line: >
          Maya catches a genuine gap in Jordan's reasoning — his zoo
          credentials are for science standards, but the committee is in
          Integrated Studies, which is not the same thing.

      - facet_ref: relevance
        label: Staying on track
        lens: evidence
        role: strength
        severity: moderate
        evidence_turns: [t05, t10]
        one_line: >
          Sam's questions address what Integrated Studies actually asks —
          cross-disciplinary questions about real systems — making her the
          only committee member whose research starts from the assignment
          rather than from a preferred destination.

      # --- Pass 3: emergent facets ---

      - facet_ref: perspective_engagement
        label: Considering other viewpoints
        lens: scope
        role: cross_lens
        severity: moderate
        evidence_turns: [t06, t10, t11, t12]
        one_line: >
          The committee cycles through individual presentations without
          engaging with anyone else's evidence, and when Sam observes this
          directly the group moves past her observation to logistics.

    facets_absent_but_tempting:
      - facet_ref: inferential_validity
        label: Leaps in reasoning
        why_tempting: >
          Maya's YouTube video argument feels like a logical leap — she
          jumps from "a teacher took students to a roller coaster" to "our
          committee should go to an amusement park" — which looks like an
          inferential gap.
        why_wrong: >
          The problem is not a gap in the argument's chain of reasoning but
          the thinness of the evidence base. Maya's argument does have a
          structure (real teachers use amusement parks for learning,
          therefore our trip could too), and the structure is not invalid on
          its face. The actual issue is sufficiency — she has one data point
          from a different context and treats it as enough to settle the
          question. A student who flags inferential_validity here is seeing
          the right family of problem but naming the wrong member of it.

      - facet_ref: source_diversity
        label: Range of sources
        why_tempting: >
          Every committee member brought only one source (a brochure, a
          video, a printout, a map, a list of questions), which looks like
          a source_diversity failure.
        why_wrong: >
          Source diversity asks whether the range and independence of
          evidence is adequate. The central problem here is not that each
          person brought only one source — it is that each person researched
          only their own proposal. Jordan's brochure is not unreliable
          because it is alone; it is unreliable because it is promotional
          material from the institution being evaluated (source_credibility).
          Maya's video is not insufficient because she has only one source;
          it is insufficient because one video from a different context does
          not match the scope of her claim (sufficiency). The single-source
          appearance is a symptom, not the diagnosis.

    lens_visibility:
      logic:
        engagement: partial
        affordance: moderate
        what_shows: >
          Maya engages the logic lens when she identifies the mismatch
          between science standards and Integrated Studies in Jordan's
          argument. The passage affords further logic analysis — the same
