    causal_layer:
      facets_explained:
        - facet_ref: source_credibility
          cognitive:
            - pattern_ref: uncritical_acceptance
              label: Uncritical acceptance
              one_line: >
                Jordan accepts the zoo brochure's credentials at face value
                because they look official, without asking what
                "state-certified" actually certifies or whether a
                promotional brochure is the right source to evaluate
                educational fit.
              evidence_turns: [t01, t03, t08]
          social:
            - dynamic_ref: authority_deference
              label: Authority deference
              one_line: >
                The committee treats Jordan's credential-citing as
                conclusive — official-sounding language settles the room,
                and Sam's follow-up question is answered by re-reading
                rather than re-evaluating.
              evidence_turns: [t01, t03]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Jordan's uncritical acceptance of the credential is individual,
            but the committee's deference to official-sounding language
            amplifies it — Jordan does not question the source, and the
            room does not question Jordan's reading of it. The double
            layer means the credential passes two checkpoints without
            interrogation. Sam's follow-up ("certified for what?") is
            the one moment where the chain could have broken, and
            Jordan's re-reading rather than re-evaluating closes that
            opening.

        - facet_ref: sufficiency
          cognitive:
            - pattern_ref: confirmation_bias
              label: Confirmation bias
              one_line: >
                Maya searched for evidence that would support her preferred
                conclusion and stopped as soon as she found one video that
                felt like enough, filtering her search toward a hit rather
                than toward a representative sample.
              evidence_turns: [t04]
          social: []
          interaction: cognitive_only

        - facet_ref: perspective_engagement
          cognitive:
            - pattern_ref: confirmation_bias
              label: Confirmation bias
              one_line: >
                Each committee member researched only evidence supporting
                their own proposal, so nobody arrived with the ability or
                motivation to engage with anyone else's case.
              evidence_turns: [t06, t10, t11]
          social:
            - dynamic_ref: conflict_avoidance
              label: Conflict avoidance
              one_line: >
                The committee avoids direct evaluation of each other's
                evidence — presentations are politely received and never
                challenged (except Maya challenging Jordan's credential),
                and Sam's meta-observation is ignored rather than
                confronted.
              evidence_turns: [t06, t10, t11]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Confirmation bias shaped the evidence each person brought
            (researching only their own option), and conflict avoidance
            shaped how the committee handled the presentations (politely
            cycling through without challenging). The combination means
            the committee never confronts anyone's evidence directly —
            the biased evidence-gathering produces a room full of
            one-sided cases, and the avoidance of conflict ensures those
            cases are received without scrutiny.

    perspective_transitions:
      - from: evidence
        to: logic
        trigger: >
          Maya notices that Jordan's zoo brochure cites science standards
          but the committee is in Integrated Studies.
        what_they_gain: >
          The logic lens reveals that Jordan's credential does not connect
          to the committee's actual question — the inferential chain from
          "science-certified" to "good for Integrated Studies" has a gap.
        what_they_realize: >
          A real credential can be irrelevant if it certifies the wrong
          thing for the question being asked.
        prompt: >
          Jordan's brochure lists real credentials. What question would
          you need to ask to know if those credentials matter for this
          committee's decision?

      - from: evidence
        to: scope
        trigger: >
          Sam observes that everyone researched only their own destination
          and nobody looked at anyone else's.
        what_they_gain: >
          The scope lens reveals that the committee's evidence-gathering
          process was systematically one-sided — each member confirmed
          their own position without examining alternatives.
        what_they_realize: >
          Doing research is not the same as doing good research if everyone
          only looked for evidence that supported what they already wanted.
        prompt: >
          Every committee member brought evidence. Why might having more
          evidence not actually help the committee make a better decision?

    counterfactuals:
      - facet_ref: source_credibility
        evidence_turn: t01
        what_would_fix_it: >
          Jordan could have asked what "state-certified" actually certifies
          and whether a brochure written by the zoo to attract school groups
          is the right source to evaluate the zoo's educational value for
          an Integrated Studies class.

      - facet_ref: source_credibility
        evidence_turn: t03
        what_would_fix_it: >
          Instead of re-reading the brochure line more slowly, Jordan could
          have said "I don't actually know what state-certified means here —
          let me look that up" and treated Sam's question as a genuine
          evaluation challenge.

      - facet_ref: sufficiency
        evidence_turn: t04
        what_would_fix_it: >
          Maya could have acknowledged that her video shows a high school
          physics class, not a 6th-grade Integrated Studies class, and asked
          whether one example from a different context is enough to support
          her claim.

      - facet_ref: inferential_validity
        evidence_turn: t07
        what_would_fix_it: >
          If the committee had engaged with Maya's correct observation about
          the science-vs-Integrated-Studies mismatch, someone could have
          pointed out that the same gap applies to Maya's physics-class
          video, turning a one-sided critique into a principle the whole
          committee could apply.

      - facet_ref: relevance
        evidence_turn: t05
        what_would_fix_it: >
          If the committee had asked Sam how her questions connect to a
          field trip destination, they would have discovered that her
          research directly addresses the Integrated Studies mandate and
          could reframe the entire discussion around the assignment's
          actual purpose.

      - facet_ref: perspective_engagement
        evidence_turn: t06
        what_would_fix_it: >
          Instead of redirecting past Sam's questions to ask who else
          brought something, Jordan could have asked the committee to
          respond to Sam's questions and discuss whether they address
          what the class is supposed to be learning.

