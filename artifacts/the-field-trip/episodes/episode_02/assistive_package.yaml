    facets_absent_but_tempting:
    - facet_ref: inferential_validity
      label: Leaps in reasoning
      why_tempting: 'Maya''s YouTube video argument feels like a logical leap — she jumps from "a teacher
        took students to a roller coaster" to "our committee should go to an amusement park" — which looks
        like an inferential gap.

        '
      why_wrong: 'The problem is not a gap in the argument''s chain of reasoning but the thinness of the
        evidence base. Maya''s argument does have a structure (real teachers use amusement parks for learning,
        therefore our trip could too), and the structure is not invalid on its face. The actual issue
        is sufficiency — she has one data point from a different context and treats it as enough to settle
        the question. A student who flags inferential_validity here is seeing the right family of problem
        but naming the wrong member of it.

        '
    - facet_ref: source_diversity
      label: Range of sources
      why_tempting: 'Every committee member brought only one source (a brochure, a video, a printout,
        a map, a list of questions), which looks like a source_diversity failure.

        '
      why_wrong: 'Source diversity asks whether the range and independence of evidence is adequate. The
        central problem here is not that each person brought only one source — it is that each person
        researched only their own proposal. Jordan''s brochure is not unreliable because it is alone;
        it is unreliable because it is promotional material from the institution being evaluated (source_credibility).
        Maya''s video is not insufficient because she has only one source; it is insufficient because
        one video from a different context does not match the scope of her claim (sufficiency). The single-source
        appearance is a symptom, not the diagnosis.

        '
