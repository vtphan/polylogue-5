        axis: stance_inversion
        continuation_of: {turn: t04, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: [t04_c1]

      - id: t04_c3
        text: >
          Maya mentions the video got two million views and kids in the
