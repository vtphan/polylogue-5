discussion_cues:
  by_turn:

    # ── t01: Jordan presents the brochure ──

    t01:
      - id: t01_c1
        text: >
          Jordan reads from the zoo brochure and sounds really confident.
          But who actually wrote that brochure, and what were they trying
          to get people to do?
        angle: source_credibility
        lens: evidence
        axis: lens_refraction
        continuation_of: {turn: t01, facet: source_credibility}
        explanatory_ref: uncritical_acceptance
        persona: null
        independent_of: []

      - id: t01_c2
        text: >
          Imagine you are Sam listening to Jordan read the brochure. He
          says "it's literally certified, so that pretty much answers it."
          What question would you want to ask him next?
        angle: source_credibility
        lens: evidence
        axis: persona_projection
        continuation_of: {turn: t01, facet: source_credibility}
        explanatory_ref: null
        persona: Sam
        independent_of: [t01_c1]

    # ── t02: Sam asks "certified for what?" ──

    t02:
      - id: t02_c1
        text: >
          Sam asks "Certified for what, though?" — just three words. Try
          to defend Jordan's side: why might someone hear those words from
          the brochure and feel like the question is already answered?
        angle: source_credibility
        lens: evidence
        axis: stance_inversion
        continuation_of: {turn: t02, facet: source_credibility}
        explanatory_ref: authority_deference
        persona: null
        independent_of: [t01_c1, t01_c2]

    # ── t03: Jordan re-reads the brochure ──

    t03:
      - id: t03_c1
        text: >
          When Sam asks what "certified" means, Jordan reads the exact same
          line again, just slower. What is the difference between reading
          something more carefully and actually thinking about whether it
          answers your question?
        angle: source_credibility
        lens: evidence
        axis: lens_refraction
        continuation_of: {turn: t03, facet: source_credibility}
        explanatory_ref: uncritical_acceptance
        persona: null
        independent_of: [t02_c1]

      - id: t03_c2
        text: >
          Nobody on the committee jumps in to follow up on Sam's question
