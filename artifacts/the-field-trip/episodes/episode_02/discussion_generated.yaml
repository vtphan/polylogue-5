          table, what would you say next?
        angle: perspective_engagement
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t03, facet: perspective_engagement}
        explanatory_ref: null
        persona: null
        independent_of: [t03_c1]

    # ── t04: Maya's YouTube video ──

    t04:
      - id: t04_c1
        text: >
          Maya found one YouTube video and says it proves amusement parks
          are educational. But the video shows high schoolers in a physics
          class at a different park with a teacher-made worksheet. How many
          differences can you count between that video and what the
          committee is actually planning?
        angle: sufficiency
        lens: evidence
        axis: lens_refraction
        continuation_of: {turn: t04, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: []

      - id: t04_c2
        text: >
          Try to argue Maya's side for a minute. She found a video of real
