response_space:
  by_lens:
    logic:
      likely: 'Student notices Maya''s inferential chain has gaps — "roller coasters
        are physics" does not lead to "the park is the best field trip." Maya''s dismissal
        of Sam substitutes a social redefinition for a logical evaluation.

        '
      partial: 'Student spots that Maya''s argument has a structure but doesn''t precisely
        identify the missing steps. May notice the confidence more than the logical
        gaps.

        '
      misreading: 'Student flags Maya''s enthusiasm about all proposals as a contradiction
        (internal_consistency) rather than recognizing it as social behavior distinct
        from her logical argument.

        '
      blindspot: 'Student accepts Maya''s chain at face value because it sounds confident
        and structured. The energy masks the gap.

        '
    evidence:
      likely: 'Student notices Priya''s family connection is treated as evidence for
        the museum''s quality, and that Sam''s cross-disciplinary framing is the strongest
        evidence-to-question connection.

        '
      partial: 'Student notices Priya''s connection is relevant but doesn''t distinguish
        between the credential''s social value and its evidential value. May not connect
        Sam''s evidence to the assignment criteria.

        '
      misreading: 'Student flags source_diversity (each member cites only one source)
        instead of recognizing that the real evidence problems are relevance and source_credibility
        — the issue is what the evidence proves, not how many sources there are.

        '
      blindspot: 'Student does not question Priya''s family connection as a source
        issue — treats insider knowledge as straightforward expertise.

        '
    scope:
      likely: 'Student notices that Sam''s perspective is excluded without engagement,
        that Priya''s insider experience shapes her proposal, and that the committee
        never asks whose perspective is missing or under what conditions proposals
        would work.

        '
      partial: 'Student sees Sam was treated unfairly but focuses on social fairness
        rather than on the epistemic cost of excluding her perspective — the committee
        lost its best proposal.

        '
      misreading: 'Student treats Priya''s knowledge of the museum as purely advantageous
        rather than recognizing it as a positional bias that limits her perspective.

        '
      blindspot: 'Student does not ask what conditions would need to hold for any
        proposal to work — accepts all proposals as unconditional claims.

        '
