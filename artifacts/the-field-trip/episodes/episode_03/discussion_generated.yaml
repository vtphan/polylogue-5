# ──────────────────────────────────────────────
# §2  TALK MOVES
# ──────────────────────────────────────────────

talk_moves:
  - "I noticed in turn ___ that ___, and it made me think ___."
  - "I want to push back on what ___ said, because ___."
  - "Building on ___'s point, I also saw ___."
  - "I think the committee should have ___ instead of ___, because ___."
  - "Can you say more about why you read it that way?"
  - "I changed my mind when I noticed ___."
