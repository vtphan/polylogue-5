discussion_cues:
  by_turn:

    # ── t01: Maya floats the compromise ──

    t01:
      - id: t01_c1
        text: >
          Maya opens with "what if we combine my amusement park with your
          walking tour?" Notice how she describes the day — walk in the
          morning, park in the afternoon. What is missing from that
          sentence that you would expect to be there if she were pitching
          a learning trip?
        angle: sufficiency
        lens: logic
        axis: lens_refraction
        continuation_of: {turn: t01, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: []

      - id: t01_c2
        text: >
          Imagine you are Sam hearing Maya's opening idea. Maya says "walk
          in the morning, park in the afternoon" and stops there. What is
          the first question you want to ask her?
        angle: sufficiency
        lens: logic
        axis: persona_projection
        continuation_of: {turn: t01, facet: sufficiency}
        explanatory_ref: null
        persona: Sam
        independent_of: [t01_c1]

    # ── t02: Kai grabs the compromise in logistics terms ──

    t02:
      - id: t02_c1
        text: >
          Kai says "oh — that actually works" and immediately starts
          working out the bus split, the cost, and the schedule. Count
          how many things Kai mentions in his turn — and ask yourself
          how many of them are about what the class would learn.
        angle: relevance
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t02, facet: relevance}
        explanatory_ref: tunnel_vision
        persona: null
        independent_of: []

      - id: t02_c2
        text: >
          Try arguing Kai's side. Logistics are real — buses cost money,
          field trips have to fit in the school day. Why might someone
          believe that locking down the schedule is exactly the right
          thing to talk about first?
        angle: relevance
        lens: scope
        axis: stance_inversion
        continuation_of: {turn: t02, facet: relevance}
        explanatory_ref: tunnel_vision
        persona: null
        independent_of: [t02_c1]

    # ── t03: Maya rides Kai's energy ──

    t03:
      - id: t03_c1
        text: >
          Maya says "something educational in the morning, fun in the
          afternoon, everyone wins." That is her whole case for the
          compromise compressed into one sentence. Compare it to her
          first-meeting pitch — what has she dropped, and does she
          seem to notice?
        angle: sufficiency
        lens: logic
        axis: lens_refraction
        continuation_of: {turn: t03, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: [t01_c1]

      - id: t03_c2
        text: >
          Imagine you are Maya in this moment. The alliance with Kai
          feels great. Why might it be hard, even for a strong arguer,
          to notice that your own argument has gotten thinner since the
          last time you made it?
        angle: sufficiency
        lens: logic
        axis: persona_projection
        continuation_of: {turn: t03, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: Maya
        independent_of: [t03_c1]

    # ── t04: Sam asks the conditional question ──

    t04:
      - id: t04_c1
        text: >
          Sam asks "under what conditions would the amusement park
          actually teach us anything?" and lists four things — a
          worksheet, a physics teacher, time to measure stuff, a
          physics class. Pick any one of those four and ask whether
          Maya's compromise actually has it.
        angle: condition_sensitivity
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t04, facet: condition_sensitivity}
        explanatory_ref: null
        persona: null
        independent_of: []

      - id: t04_c2
        text: >
          Try arguing the opposite of what Sam is doing. Why might
          someone believe that asking "under what conditions would
          this actually work?" is being negative or slowing the
          group down?
        angle: condition_sensitivity
        lens: scope
        axis: stance_inversion
        continuation_of: {turn: t04, facet: condition_sensitivity}
        explanatory_ref: null
        persona: null
        independent_of: [t04_c1]

      - id: t04_c3
        text: >
          What would Ms. Tsai think if she read Sam's question on the
          transcript? Remember she said she is reading their reasoning,
          not their answer.
        angle: condition_sensitivity
        lens: scope
        axis: persona_projection
        continuation_of: {turn: t04, facet: condition_sensitivity}
        explanatory_ref: null
        persona: Ms. Tsai
        independent_of: [t04_c1, t04_c2]

    # ── t05: Maya deflects with "planning detail" ──

    t05:
      - id: t05_c1
        text: >
          Maya calls Sam's conditions "just a planning detail" and then
          turns straight to Kai to talk about the bus. What is the
          difference between a planning detail and a question that
          decides whether the trip teaches anything at all?
        angle: relevance
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t05, facet: relevance}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: []

      - id: t05_c2
        text: >
          Imagine you are Maya right after Sam asks her question. You
          could have said "good question — let's see if our compromise
          actually meets any of those conditions." Why is that hard to
          say when the conditions might not be met?
        angle: sufficiency
        lens: logic
        axis: persona_projection
        continuation_of: {turn: t05, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: Maya
        independent_of: [t05_c1]

    # ── t06: Kai's load-bearing redirect ──

    t06:
      - id: t06_c1
        text: >
          Kai says "we can figure out the question part later — we need
          to lock in the logistics first." Read that sentence one more
          time. What does it actually do to "the question part"? Is it
          being saved for later, or is it being removed from the table?
        angle: relevance
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t06, facet: relevance}
        explanatory_ref: tunnel_vision
        persona: null
        independent_of: [t02_c1]

      - id: t06_c2
        text: >
          Try defending Kai here. He is not being mean and he is not
          afraid of the argument — he genuinely thinks logistics come
          first. Make the strongest case you can for his redirect.
          Then ask yourself what it would cost the committee.
        angle: relevance
        lens: scope
        axis: stance_inversion
        continuation_of: {turn: t06, facet: relevance}
        explanatory_ref: conflict_avoidance
        persona: null
        independent_of: [t06_c1]

      - id: t06_c3
        text: >
          Sam asked her question once. Kai redirects, and the room
          moves on. Imagine you are Jordan sitting at the table — you
          do not speak in this scene, but you hear all of it. What do
          you notice about how Sam's question is being treated?
        angle: perspective_engagement
        lens: scope
        axis: persona_projection
        continuation_of: {turn: t06, facet: relevance}
        explanatory_ref: conflict_avoidance
        persona: Jordan
        independent_of: [t06_c1, t06_c2]

    # ── t07: Priya's "serious institutions" reframe ──

    t07:
      - id: t07_c1
        text: >
          Priya says "at least the museum and the zoo are actual
          educational institutions." Pull that phrase apart. Is being
          a real educational institution the same thing as being the
          right place to answer the committee's question? When do
          those two things come apart?
        angle: source_credibility
        lens: evidence
        axis: lens_refraction
        continuation_of: {turn: t07, facet: source_credibility}
        explanatory_ref: authority_deference
        persona: null
        independent_of: []

      - id: t07_c2
        text: >
          Imagine you are Jordan when Priya says this. She is looking
          right at you. She has not asked you anything, but the way
          she said it puts you on her side. What goes through your
          head — and what would it take to say "wait, hold on"?
        angle: source_credibility
        lens: evidence
        axis: persona_projection
        continuation_of: {turn: t07, facet: source_credibility}
        explanatory_ref: authority_deference
        persona: Jordan
        independent_of: [t07_c1]

      - id: t07_c3
        text: >
          Try arguing the opposite of Priya's framing. Make the case
          that calling somewhere a "real educational institution" is
          a category, not a quality — and that an amusement park
          could in principle be a better fit for a specific question
          than a museum.
        angle: source_credibility
        lens: evidence
        axis: stance_inversion
        continuation_of: {turn: t07, facet: source_credibility}
        explanatory_ref: null
        persona: null
        independent_of: [t07_c1, t07_c2]

    # ── t08: Maya defends in coalition register ──

    t08:
      - id: t08_c1
        text: >
          Maya snaps back with "the park has literal physics in it."
          That is the smallest version of the argument she had in the
          first meeting. She is not building a case anymore — she is
          throwing a token. What does it tell you that her sharpest
          claim has shrunk to four words?
        angle: sufficiency
        lens: logic
        axis: lens_refraction
        continuation_of: {turn: t08, facet: sufficiency}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: [t01_c1, t03_c1]

    # ── t09: Kai treats agreement as evidence ──

    t09:
      - id: t09_c1
        text: >
          Kai says "two of us have already agreed on something — that's
          more than anyone else in this room has done." Test that move.
          If two people on a committee agree on something, does that
          make the thing they agreed on more likely to be right? Why
          might it feel that way even when it isn't?
        angle: inferential_validity
        lens: logic
        axis: lens_refraction
        continuation_of: {turn: t09, facet: inferential_validity}
        explanatory_ref: group_pressure
        persona: null
        independent_of: []

      - id: t09_c2
        text: >
          Try defending Kai's claim. There is something real about two
          people moving in the same direction in a stuck committee —
          it does feel like progress. What is the difference between
          that kind of progress and an actual answer to the question
          the committee was asked?
        angle: inferential_validity
        lens: logic
        axis: stance_inversion
        continuation_of: {turn: t09, facet: inferential_validity}
        explanatory_ref: group_pressure
        persona: null
        independent_of: [t09_c1]

    # ── t10: Priya rejects bloc-as-evidence ──

    t10:
      - id: t10_c1
        text: >
          Priya says "two people liking a trip isn't the same thing as
          two people being right about it." She is exactly right. But
          look at what she is doing while she says it — she is forming
          her own bloc with Jordan. Can someone be saying something
          true and using it as a coalition move at the same time?
        angle: inferential_validity
        lens: logic
        axis: lens_refraction
        continuation_of: {turn: t10, facet: inferential_validity}
        explanatory_ref: group_pressure
        persona: null
        independent_of: [t09_c1]

      - id: t10_c2
        text: >
          Imagine you are Sam watching Priya call out Kai's move. Priya
          just said the right thing. Does that make her your ally? What
          would you be hoping she does next, and what does she actually
          do?
        angle: inferential_validity
        lens: logic
        axis: persona_projection
        continuation_of: {turn: t10, facet: inferential_validity}
        explanatory_ref: null
        persona: Sam
        independent_of: [t10_c1]

    # ── t11: Sam's meta-observation ──

    t11:
      - id: t11_c1
        text: >
          Sam says "none of this is answering what the class is actually
          supposed to learn" and the room does not respond. She does
          not repeat herself. Why do you think a true sentence can land
          in a room and just not get picked up?
        angle: perspective_engagement
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t11, facet: perspective_engagement}
        explanatory_ref: group_pressure
        persona: null
        independent_of: []

      - id: t11_c2
        text: >
          Imagine you are Priya hearing Sam say this. Priya is usually
          the one who notices when someone is being talked over. Why
          might she let it slide here? What is different about this
          meeting that makes the thing she is usually good at noticing
          harder to notice?
        angle: perspective_engagement
        lens: scope
        axis: persona_projection
        continuation_of: {turn: t11, facet: perspective_engagement}
        explanatory_ref: tunnel_vision
        persona: Priya
        independent_of: [t11_c1]

      - id: t11_c3
        text: >
          Sam's sentence is quiet and the room's energy is elsewhere.
          Try the opposite stance — defend the committee's choice to
          move past her question. Is there any version of "we'll get
          to it later" that would actually be okay here?
        angle: relevance
        lens: scope
        axis: stance_inversion
        continuation_of: {turn: t11, facet: relevance}
        explanatory_ref: null
        persona: null
        independent_of: [t11_c1, t11_c2]

    # ── t12: Kai surfaces the cost number ──

    t12:
      - id: t12_c1
        text: >
          Kai writes eighteen dollars a person plus twelve for the bus
          times twenty-eight kids on the whiteboard — over eight
          hundred dollars. This is the first time anyone in the story
          has named a real number tied to a real proposal. What new
          question does that number put on the table that wasn't on
          the table a minute ago?
        angle: consequence_consideration
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t12, facet: consequence_consideration}
        explanatory_ref: null
        persona: null
        independent_of: []

      - id: t12_c2
        text: >
          Imagine you are Priya looking at "over eight hundred bucks"
          on the whiteboard. The museum is your proposal. Your family
          could pay the eighteen dollars without thinking about it.
          What is the first thing you think — and what is the first
          thing you say out loud?
        angle: consequence_consideration
        lens: scope
        axis: persona_projection
        continuation_of: {turn: t12, facet: consequence_consideration}
        explanatory_ref: null
        persona: Priya
        independent_of: [t12_c1]

      - id: t12_c3
        text: >
          Kai surfaces the cost because he is tracking the budget, not
          because he is thinking about who can pay. Try arguing that
          the strength is real anyway — that naming a number out loud
          can do work even when the person naming it has a different
          reason than you would.
        angle: consequence_consideration
        lens: scope
        axis: stance_inversion
        continuation_of: {turn: t12, facet: consequence_consideration}
        explanatory_ref: null
        persona: null
        independent_of: [t12_c1, t12_c2]

    # ── t13: Maya turns the cost into ammunition ──

    t13:
      - id: t13_c1
        text: >
          Maya hears "eight hundred dollars" and says "see? that's why
          the compromise makes sense — the walking tour is free." She
          treats the number like a scoring point against Priya. What
          question does Maya not ask about the eight hundred dollars,
          and who in the class might that question matter to?
        angle: consequence_consideration
        lens: scope
        axis: lens_refraction
        continuation_of: {turn: t13, facet: consequence_consideration}
        explanatory_ref: confirmation_bias
        persona: null
        independent_of: [t12_c1]

      - id: t13_c2
        text: >
          The meeting ends here. Two blocs, one isolated Sam, a number
          on the whiteboard, a conditional question hanging in the
          air. Imagine you are Ms. Tsai reading the transcript later.
          What is the one thing you most want to ask the committee
