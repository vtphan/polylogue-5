    causal_layer:
      facets_explained:
        - facet_ref: relevance
          cognitive:
            - pattern_ref: tunnel_vision
              label: Tunnel vision
              one_line: >
                Kai's pragmatic frame is narrow rather than wrong —
                logistics are a real part of the problem, but he treats
                them as the whole problem, which crowds out the
                educational question so completely that he stops
                noticing it is missing.
              evidence_turns: [t02, t06]
          social:
            - dynamic_ref: conflict_avoidance
              label: Conflict avoidance
              one_line: >
                Kai's "we can figure out the question part later"
                suppresses productive disagreement through pragmatist
                impatience rather than fear, and the committee lets
                the deflection stand because moving on feels easier
                than reopening the argument.
              evidence_turns: [t06]
          interaction: cognitive_amplified_by_social
          interaction_note: >
            Tunnel vision and conflict avoidance interact structurally:
            Kai's narrow frame is what makes "let's move on" feel
            reasonable. If the educational question were on the table,
            moving on would feel premature. But Kai has already
            removed it from the table by treating logistics as the
            whole problem, so his "let's move on" lands as practical
            rather than evasive. The committee's acquiescence is the
            response half of the social dynamic.

        - facet_ref: source_credibility
          social:
            - dynamic_ref: authority_deference
              label: Authority deference
              one_line: >
                Priya defers to the concept of institutional prestige
                ("real educational institution") as if it settled the
                question of educational fit, and leans on Jordan's
                silent presence to make the framing feel supported
                without his needing to speak.
              evidence_turns: [t07]
          interaction: social_only
          interaction_note: >
            No cognitive_pattern on this entry because Priya's failure
            is primarily social positioning rather than cognitive
            error. She is not reasoning poorly about the museum — she
            is framing the museum relative to the Maya-Kai coalition
            in a way that treats prestige as evidence. The authority
            deference is institutional rather than personal: prestige
            as a category is doing the work of evidence about fit.

        - facet_ref: sufficiency
          cognitive:
            - pattern_ref: confirmation_bias
              label: Confirmation bias
              one_line: >
                Maya has filtered her reasoning toward the subset that
                overlaps with Kai's logistics, which means she has
                dropped the parts of her argument that were strongest
                (the physics connection, however flawed) and kept the
                parts that are easiest to defend (fun, logistically
                simple). She does not notice the argument has thinned
                because the alliance with Kai feels like progress.
              evidence_turns: [t01, t03, t08, t13]
          social:
            - dynamic_ref: group_pressure
              label: Group pressure
              one_line: >
                Two people agreeing functions as evidence for the
                quality of the compromise — the committee treats the
                coalition's size as if it strengthened the argument,
                and Priya responds by forming her own bloc not because
                her framing is strong but because being outnumbered
                feels like losing.
              evidence_turns: [t03, t09, t13]
          interaction: mutual
          interaction_note: >
            The confirmation bias and the group pressure reinforce
            each other. Maya's filtering toward overlap-with-Kai is
            what produces the thinned premises; the bloc effect then
            treats the resulting agreement as proof the argument is
            working, which lets Maya keep not noticing the thinning.
            Kai's t09 line makes the social half explicit, Maya's
            t08 line shows the cognitive half compressed to a
            rebuttal token, and the two together describe a single
            mechanism: coalition-building as a substitute for
            argument.

        - facet_ref: perspective_engagement
          cognitive:
            - pattern_ref: tunnel_vision
              label: Tunnel vision
              one_line: >
                The committee's attention has narrowed to the two
                blocs forming in real time, and Sam's questions land
                outside both frames — not answered, not rejected,
                just not registered as part of the active
                conversation.
              evidence_turns: [t05, t06, t11]
          social:
            - dynamic_ref: group_pressure
              label: Group pressure
              one_line: >
                Being in a bloc is doing work in the room that
                individual reasoning is not, and Sam — isolated
                between the two alliances — has no bloc to back her
                questions, so the committee treats her
                contributions as interruptions rather than moves.
              evidence_turns: [t06, t11]
          interaction: mutual
          interaction_note: >
            Tunnel vision narrows each bloc's attention to the
            rival bloc, and group pressure means a viewpoint with
            no coalition behind it carries no weight. Sam's
            conditional question (t04) and her structural
            observation (t11) are both substantively strong, and
            both slide past because there is nobody in the room
            whose social position depends on picking them up.

    perspective_transitions:
      - from: logic
        to: scope
        trigger: >
          A reader notices that Maya's case has thinned to two
          premises (logic) and then asks why nobody in the committee
          demands more.
        what_they_gain: >
          The scope lens reveals that the thinness of Maya's argument
          is not failing in the room because the room's attention has
          shifted from arguments to blocs. Two people agreeing is
          doing the work that more premises would have to do.
        what_they_realize: >
          An argument can get weaker while feeling stronger if a
          coalition forms around it. The size of the agreement can
          hide the thinness of the reasoning.
        prompt: >
          Maya has dropped premises from her pitch since the first
          meeting. Why does her argument feel stronger to the room
          even though it has less substance?

      - from: evidence
        to: scope
        trigger: >
          A reader notices Priya's "real educational institutions"
          framing treats prestige as evidence (evidence) and then
          asks what question the committee was actually asked to
          answer.
        what_they_gain: >
          The scope lens reveals that "prestigious" and "fits the
          assigned question" are two different claims. Priya's
          framing sounds like an evaluation of the destinations,
          but it is actually a move to position her bloc — the
          committee's real question never appears in her sentence.
        what_they_realize: >
          Calling something a "real educational institution" is a
          category claim, not an answer. It tells you where a place
          fits in a ranking of institutions; it does not tell you
          whether the place addresses the committee's question.
        prompt: >
          Priya says the museum and the zoo are "real educational
          institutions." What question is she answering with that
          phrase — and is it the question the committee was asked?

      - from: scope
        to: evidence
        trigger: >
          A reader notices that Kai surfaces a concrete cost number
          (scope / consequence) and then asks what evidence the
          committee actually has about who can afford the trip.
        what_they_gain: >
          The evidence lens reveals that the cost number is a real
          datum with real implications — it is the first piece of
          hard information any meeting has produced — and that the
          committee has no evidence at all about who can or cannot
          afford eight hundred dollars.
        what_they_realize: >
          A concrete consequence, once named, becomes an evidence
          question the committee can no longer honestly ignore.
          Kai's cost math turns an abstract debate into a specific
          one, even though nobody in the room picks it up.
        prompt: >
          Kai writes eight hundred dollars on the whiteboard. What
          new question does that number put on the table — and why
          might nobody in the meeting want to answer it?

    counterfactuals:
      - facet_ref: relevance
        evidence_turn: t06
        what_would_fix_it: >
          Instead of cutting the exchange short with "we can figure
          out the question part later," Kai could have said "okay,
          hold on — what would we actually learn from the walk, and
          what would we learn from the park?" The same practical
          instinct, turned on the educational question instead of
          away from it, would have made Sam's conditions
          addressable rather than skippable.

      - facet_ref: source_credibility
        evidence_turn: t07
        what_would_fix_it: >
          Priya could have said "the museum and the zoo are more
          likely to have the kind of programming we need" — naming
          what educational programming her claim depends on — instead
          of "at least the museum and the zoo are actual educational
          institutions." Distinguishing "prestigious" from "fits the
          assignment" would force her to make the claim her framing
          is hiding.

      - facet_ref: sufficiency
        evidence_turn: t03
        what_would_fix_it: >
          Maya could have kept the physics framing from episode 1 and
          said "the walk gets us history downtown, and the park lets
          us see physics in action — here is what we would look at
          on both sides." Adding the two missing premises (what the
          walk teaches, what the park teaches) would have given the
          compromise the substance the alliance is currently
          substituting for.

      - facet_ref: sufficiency
        evidence_turn: t08
        what_would_fix_it: >
          Instead of rebutting Priya with "the park has literal
          physics in it," Maya could have said "I dropped the physics
          piece when we started talking compromise — let me put it
          back in: here is what a physics class would actually do at
          the park." Reinstating the claim she had quietly abandoned
          is the specific move that would make the compromise more
          than a fig leaf.

      - facet_ref: condition_sensitivity
        evidence_turn: t04
        what_would_fix_it: >
          Sam's strength is already present in this turn — the
          counterfactual is that the committee would have picked up
          her question. If Maya or Kai had answered "okay, which of
          those conditions do we meet right now?" the conditional
          would have done its work in the meeting rather than
          sitting unanswered on the transcript.

      - facet_ref: consequence_consideration
        evidence_turn: t12
        what_would_fix_it: >
          Kai's strength is already present — the counterfactual is
          that the committee would have engaged the number. If Priya
          or Maya had responded "okay, eight hundred dollars — can
          every kid pay that?" instead of treating the number as a
          scoring point, the cost surfacing would have connected
          consequence to equity in this meeting rather than waiting
          for episode 4.

      - facet_ref: perspective_engagement
        evidence_turn: t11
        what_would_fix_it: >
          When Sam said "none of this is answering what the class is
          actually supposed to learn," anyone in either bloc could
          have said "you are right, let's stop for a second and
          answer that." The counterfactual is not Sam pushing harder
          — she says what she means once — it is the committee
          treating her line as a contribution instead of a pause.

      - facet_ref: inferential_validity
        evidence_turn: t09
        what_would_fix_it: >
          Kai could have said "look, the logistics work and that is
          real progress — but agreeing on logistics is not the same
