    facets_present:
      # --- Pass 1: target facets (weaknesses) ---

      - facet_ref: relevance
        label: Staying on track
        lens: scope
        role: primary
        severity: strong
        evidence_turns: [t02, t05, t06]
        one_line: >
          Kai builds the compromise entirely in logistics terms — free walk,
          cheap bus split, back by 3:30 — and when Sam pushes back he cuts
          the exchange short with "we can figure out the question part
          later, we need to lock in the logistics first," removing the
          educational question from the table without noticing it is
          missing.

      - facet_ref: source_credibility
        label: Trusting the source
        lens: evidence
        role: primary
        severity: moderate
        evidence_turns: [t07]
        one_line: >
          Priya reframes the choice as "serious institutions versus an
          amusement park with a walk attached," treating institutional
          prestige as if it were evidence of educational fit — a category
          distinction dressed up as a quality claim that the committee's
          actual question does not ask about.

      - facet_ref: sufficiency
        label: Enough reasons
        lens: logic
        role: primary
        severity: strong
        evidence_turns: [t01, t03, t08, t13]
        one_line: >
          Maya's case for the compromise has thinned from her episode 1
          pitch — she has dropped the physics framing entirely and is
          arguing from only two premises (the park is fun, the walking
          tour makes the morning educational), and she does not notice
          the argument has less substance than it started with because
          the alliance with Kai feels like proof.

      # --- Pass 2: target strengths ---

      - facet_ref: condition_sensitivity
        label: Under what conditions would this be true?
        lens: scope
        role: strength
        severity: strong
        evidence_turns: [t04]
        one_line: >
          Sam asks the conditional question nobody else thinks to ask —
          "under what conditions would the amusement park actually teach
          us anything?" — and names the exact requirements (worksheet,
          physics teacher, measurement time, physics curriculum) that
          Maya's argument has never specified, turning a flat claim into
          a testable proposition.

      - facet_ref: consequence_consideration
        label: What would actually happen?
        lens: scope
        role: strength
        severity: moderate
        evidence_turns: [t12]
        one_line: >
          Kai surfaces the first concrete consequence of a specific
          proposal in the story — the museum's cost at eighteen dollars
          per student plus twelve for the bus times twenty-eight kids,
          over eight hundred dollars — writing the number on the
          whiteboard where it sits unanswered.

      # --- Pass 3: emergent facets ---

      - facet_ref: perspective_engagement
        label: Whose viewpoint is missing from the discussion?
        lens: scope
        role: cross_lens
        severity: moderate
        evidence_turns: [t05, t06, t11]
        one_line: >
          Sam raises the conditional question once and the committee
          deflects it; she names the structural problem once more in t11
          ("none of this is answering what the class is actually supposed
          to learn") and the room does not respond. The committee treats
          her viewpoint as an interruption rather than a contribution.

      - facet_ref: inferential_validity
        label: Leaps in reasoning
        lens: logic
        role: cross_lens
        severity: moderate
        evidence_turns: [t09]
        one_line: >
          Kai treats "two of us have already agreed on something" as if
          it were evidence that the compromise is correct — the leap
          from "two people agree" to "the argument is sound" is the
          bloc-as-evidence move.

    facets_absent_but_tempting:
      - facet_ref: internal_consistency
        label: Do the claims contradict each other?
        why_tempting: >
          Priya says "two people liking a trip isn't the same as two
          people being right about it" (t10) right after building her own
          implicit bloc with Jordan, which looks like she is contradicting
          herself — using the bloc-as-evidence move in t07 and then
          rejecting it in t10.
        why_wrong: >
          Priya's t10 line is epistemically correct, and her t07 framing
          does not formally claim that two people agreeing makes a
          position correct — she is positioning, not asserting. The
          failure is not internal inconsistency (two claims that can't
          both be true). It is that Priya's "serious institutions"
          framing collapses two different claims (prestigious and
          relevant) into one — a source_credibility problem — and that
          her bloc-formation is social positioning rather than an
          argument. A student who flags inconsistency here is noticing a
          real asymmetry in Priya's behavior but misnaming the facet.

      - facet_ref: source_diversity
        label: Range of sources
        why_tempting: >
          The whole meeting is argued without anyone citing a new source
          — no brochures, no videos, no printouts, just logistics and
          framing — which looks like a source_diversity failure.
        why_wrong: >
          Source diversity asks whether the range and independence of
          evidence is adequate to the claim. Episode 3 is not an
          evidence-gathering meeting; it is a negotiation meeting, and
          the characters are not citing evidence at all. What is missing
          is not different sources but the willingness to engage the
          educational question (relevance), enough premises to support
          the compromise (sufficiency), and a framing that distinguishes
          prestige from fit (source_credibility). The appearance of
          thin sourcing is a side effect of the deeper failures, not the
          failure itself.

      - facet_ref: reasoning_completeness
        label: Are critical steps missing?
        why_tempting: >
          Maya and Kai's compromise skips the educational question
          entirely — they never say how the walking tour would actually
          teach anything — which looks like a missing-step problem.
        why_wrong: >
          A reasoning_completeness failure is when the chain from
          premises to conclusion has visible gaps between named steps.
          Here, the chain is not incomplete — it is truncated at the
          premise level. Maya and Kai are not reasoning from premises
          toward a conclusion about education and leaving out steps;
          they have stopped reasoning about education altogether.
          Kai's "we can figure out the question part later" is not a
          missing step in an argument, it is the removal of the
          argument's subject. This is a relevance failure (the
          conversation is about the wrong thing) compounded by a
          sufficiency failure (Maya's argument has too few premises
          to support the compromise), not a gap between steps.

    lens_visibility:
      logic:
        engagement: partial
        affordance: rich
        what_shows: >
          Maya's argument has thinned to two premises she never states
          explicitly, and Kai's t09 line treats agreement-between-two-
