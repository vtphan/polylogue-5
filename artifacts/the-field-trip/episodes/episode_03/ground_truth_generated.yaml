      evidence:
        engagement: partial
        affordance: moderate
        what_shows: >
          Kai introduces the cost number on the whiteboard — the only
          piece of genuinely new evidence in the meeting — and Priya's
          "real educational institutions" framing gestures at
          institutional credibility without naming any source. The
          evidence lens is moderately afforded: the cost is a concrete
          datum that could be evaluated, and Priya's framing invites
          scrutiny of what "real educational institution" actually
          means, but the committee does neither.
      scope:
        engagement: partial
        affordance: rich
        what_shows: >
          Sam's conditional question (t04) and her structural observation
          (t11) are both explicit scope moves, and Kai's cost surfacing
          (t12) is a consequence-consideration move. The scope lens is
          richly afforded — whose question, whose viewpoint, what would
          actually happen, under what conditions — and is the only lens
          the characters partially use, though the committee lets every
          scope contribution slide past without engagement.

