probes:
  facet:
    by_turn:

      t01:
        trigger: inactivity_or_manual
        question: >
          Maya floats an idea: combine her amusement park with Kai's
          walking tour — walk in the morning, park in the afternoon.
          What are you noticing about her pitch?
        options:
          - text: >
              She's describing the day as a schedule — walk, then park —
              without saying what anyone would learn from either part.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              She has a clever idea for getting two things into one day
              that the committee couldn't agree on before.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t02:
        trigger: inactivity_or_manual
        question: >
          Kai jumps on Maya's idea and starts working out the logistics —
          the walk is free, the bus is cheaper if they split it, they'd be
          back by 3:30. What are you noticing about what Kai is tracking?
        options:
          - text: >
              Every detail Kai cares about is about money and timing —
              he's not talking about what the class would learn at all.
            routes_to: {facet: relevance, role: present}
          - text: >
              Kai is being practical and realistic, which is a strength
              the committee needs.
            routes_to: {facet: consequence_consideration, role: tempting_absent}
          - text: >
              He's just agreeing with Maya because he likes that she
              included his walking tour.
            routes_to: {facet: sufficiency, role: afforded_missing}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t03:
        trigger: inactivity_or_manual
        question: >
          Maya gets excited and says "something educational in the morning,
          fun in the afternoon, everyone wins." What are you noticing about
          her argument for the compromise?
        options:
          - text: >
              Her whole case is just two things — "the park is fun" and
              "the walk is educational" — without any reasons why.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              She's dropped the physics stuff she was talking about in
              earlier meetings and hasn't noticed.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              She's making a logical leap — "everyone wins" doesn't
              really follow from combining the two trips.
            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t04:
        trigger: inactivity_or_manual
        question: >
          Sam asks under what conditions the amusement park would actually
          teach the class something — and lists the things that would have
          to be true. What are you noticing about her question?
        options:
          - text: >
              She's taking Maya's "the park teaches physics" claim and
              naming what would have to be true for it to actually be
              true.
            routes_to: {facet: condition_sensitivity, role: present}
          - text: >
              She's listing exactly what Maya's argument is missing —
              a worksheet, a teacher who knows physics, time to measure
              stuff, a physics class.
            routes_to: {facet: condition_sensitivity, role: present}
          - text: >
              She's being negative about Maya's idea without offering
              her own proposal.
            routes_to: {facet: perspective_engagement, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t05:
        trigger: inactivity_or_manual
        question: >
          Maya calls Sam's conditions "just a planning detail" and turns
          back to Kai about the bus. What are you noticing about Maya's
          response?
        options:
          - text: >
              She's pushing Sam's question aside by calling it a planning
              thing, instead of actually answering whether her trip meets
              any of those conditions.
            routes_to: {facet: relevance, role: present}
          - text: >
              She can't engage with Sam's conditions because her argument
              doesn't actually meet any of them.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              Maya is just trying to keep the meeting moving so they
              don't get stuck again like last time.
            routes_to: {facet: relevance, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t06:
        trigger: inactivity_or_manual
        question: >
          Kai cuts in with "we can figure out the question part later —
          we need to lock in the logistics first." What are you noticing
          about what Kai just did?
        options:
          - text: >
              He just said the educational question — the whole thing the
              committee was asked about — can wait until after the logistics.
            routes_to: {facet: relevance, role: present}
          - text: >
              Nobody on the committee pushes back on Kai's redirect —
              they all just let it stand.
            routes_to: {facet: perspective_engagement, role: afforded_missing}
          - text: >
              Kai is being a good project manager by keeping the meeting
