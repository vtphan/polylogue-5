            routes_to: {facet: consequence_consideration, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t07:
        trigger: inactivity_or_manual
        question: >
          Priya reframes the whole thing: "at least the museum and the
          zoo are actual educational institutions — we're comparing
