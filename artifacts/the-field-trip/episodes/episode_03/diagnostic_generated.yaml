            routes_to: {facet: source_credibility, role: present}
          - text: >
              She's lining up with Jordan — even though he hasn't said
              anything — to make her side look bigger.
            routes_to: {facet: source_credibility, role: present}
          - text: >
              She's contradicting what she says later about two people
