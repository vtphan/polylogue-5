            routes_to: {facet: inferential_validity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t09:
        trigger: inactivity_or_manual
        question: >
          Kai says "two of us have already agreed on something — that's
          more than anyone else in this room has done." What are you
          noticing about how Kai is using that fact?
        options:
          - text: >
              He's treating "two of us agree" like it proves the
              compromise is a good idea, but two people agreeing isn't
              the same as being right.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              He's counting heads instead of counting reasons.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              He's right that the committee needs to make progress
              somehow.
            routes_to: {facet: consequence_consideration, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t10:
        trigger: inactivity_or_manual
        question: >
          Priya answers Kai: "two people liking a trip isn't the same
          thing as two people being right about it." What are you
          noticing about what Priya just said?
        options:
          - text: >
              She's right about Kai's move — but she's saying it to line
              up her own side with Jordan, not to actually reopen the
              argument.
            routes_to: {facet: inferential_validity, role: present}
          - text: >
              She just pointed out exactly the kind of move she made
              herself a few turns ago with "serious institutions."
            routes_to: {facet: internal_consistency, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t11:
        trigger: inactivity_or_manual
        question: >
          Sam says quietly: "none of this is answering what the class
          is actually supposed to learn." Nobody responds. What are you
          noticing about this moment?
        options:
          - text: >
              Sam just named the real problem out loud and the committee
              acted like she didn't even speak.
            routes_to: {facet: perspective_engagement, role: present}
          - text: >
              Sam keeps pulling back to the learning question, but
              nobody in either side-taking bloc is willing to pick it up.
            routes_to: {facet: relevance, role: present}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t12:
        trigger: inactivity_or_manual
        question: >
          Kai runs the cost math out loud: eighteen dollars a person
          plus twelve for the bus, times twenty-eight kids — over eight
          hundred bucks — and writes it on the whiteboard. What are you
          noticing?
        options:
          - text: >
              Kai just named a specific thing that would actually happen
              if they picked the museum — a real dollar amount, not an
              abstract argument.
            routes_to: {facet: consequence_consideration, role: present}
          - text: >
              It's the first concrete number anyone has put on the
              table about any of the options.
            routes_to: {facet: consequence_consideration, role: present}
          - text: >
              Kai is using the number as ammunition against Priya's bloc.
            routes_to: {facet: sufficiency, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t13:
        trigger: inactivity_or_manual
        question: >
          Maya says "See? That's why the compromise makes sense — the
          walking tour is free." What are you noticing about how Maya
          uses Kai's number?
        options:
          - text: >
              She's using the eight-hundred-dollar number as a point
              against Priya, not asking what it means for kids who
              can't pay.
            routes_to: {facet: consequence_consideration, role: afforded_missing}
          - text: >
              She's still adding "the walking tour is free" to her
              argument instead of saying what anyone would learn from it.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              Maya is making a reasonable point that the compromise
              actually is cheaper.
            routes_to: {facet: relevance, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

  explanation:
    by_turn_facet:

      t02.relevance:
        question: >
          Why do you think Kai's logistics talk crowds out the
          educational question so completely?
        options:
          - text: >
              Logistics are a puzzle he knows how to solve, so he leans
              into them and treats them as the whole problem.
            routes_to: {explanatory_variable: cognitive, pattern_ref: tunnel_vision}
          - text: >
              Moving on to logistics lets the group avoid reopening the
              question they couldn't answer in earlier meetings.
            routes_to: {explanatory_variable: social, dynamic_ref: conflict_avoidance}
          - text: >
              Both — Kai's narrow practical focus gives the group a
              comfortable excuse to skip the hard question.
            routes_to: {explanatory_variable: interaction}
          - text: >
              Kai just doesn't care about school and only likes the
              planning part.
            routes_to: {explanatory_variable: tempting_absent}

      t06.relevance:
        question: >
          Why do you think the committee lets Kai's "figure out the
          question part later" stand without pushing back?
        options:
          - text: >
              Kai has narrowed the problem so much that "let's move on"
              sounds practical instead of evasive.
            routes_to: {explanatory_variable: cognitive, pattern_ref: tunnel_vision}
          - text: >
              Reopening the educational question would mean restarting
              an argument the committee is tired of having.
            routes_to: {explanatory_variable: social, dynamic_ref: conflict_avoidance}
          - text: >
              Both — because Kai has already removed the question, moving
              on feels like the sensible thing, and nobody wants to put
              it back on the table.
            routes_to: {explanatory_variable: interaction}
          - text: >
              They're all afraid of Kai.
            routes_to: {explanatory_variable: tempting_absent}

      t07.source_credibility:
        question: >
          Why do you think Priya leans on "real educational institution"
          instead of making a direct case for the museum?
        options:
          - text: >
              She defers to the idea that prestigious places must be
              better for learning, without examining whether that's
              actually true.
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: >
              She wants to pull Jordan into an implicit bloc with her to
              counter the Maya-Kai coalition, and "serious institutions"
              is the framing that does that.
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: >
              Both — she uses the prestige framing both because she
              believes it and because it lines her up with Jordan.
            routes_to: {explanatory_variable: interaction}
          - text: >
              Priya just doesn't have any other arguments.
            routes_to: {explanatory_variable: tempting_absent}

      t03.sufficiency:
        question: >
          Why do you think Maya's argument for the compromise has gotten
          so thin — when she had a whole physics case in earlier meetings?
        options:
          - text: >
              She's filtering her reasoning toward the parts that overlap
              with Kai, and dropping the rest, because the alliance feels
              like proof she's right.
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: >
              Having Kai agree with her makes the argument feel settled,
              so she stops working on it.
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: >
              Both — Maya drops the hard parts of her argument and the
              coalition with Kai acts like the proof the argument no
              longer supplies.
            routes_to: {explanatory_variable: interaction}
          - text: >
              Maya is lazy and just doesn't want to make a real argument.
            routes_to: {explanatory_variable: tempting_absent}

      t09.inferential_validity:
        question: >
          Why do you think Kai thinks "two of us agree" counts as
          evidence the compromise is sound?
        options:
          - text: >
              He's counting how many people are on his side and treating
              coalition size like argument strength.
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: >
              Two people visibly agreeing in the room changes the
              committee's feel of momentum, and Kai treats that feel as
              progress.
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: >
              Both — the coalition acts like extra evidence in the
              room, and Kai leans into that feeling to defend the
              compromise.
            routes_to: {explanatory_variable: interaction}
          - text: >
              Kai just doesn't understand what evidence means.
            routes_to: {explanatory_variable: tempting_absent}

# ──────────────────────────────────────────────
# §2  INTERVENTIONS — per-turn three-role dictionary
# ──────────────────────────────────────────────

interventions:
  by_turn:

    # ── t01: Maya floats the compromise ──

    t01:
      blank_page:
        opening: >
          Maya just floated a compromise with Kai — combine the amusement
          park and the walking tour into one day.
        ladder:
          - type: nudge
            text: >
              Read Maya's pitch again. Does she say what the class would
              learn, or just when things would happen?
            reveals: 1
            cost: 0
          - type: question
            text: >
              In earlier meetings, Maya had a whole physics pitch for the
              park. Does any of that show up in her compromise pitch here?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Maya's pitch is purely structural: walk in the morning,
              park in the afternoon. She's treating a schedule as if it
              were an argument for the trip.
            reveals: 3
            cost: 1

      by_facet:
        sufficiency:
          role: present
          opening: >
            You noticed something about how much Maya's pitch actually
            says.
          ladder:
            - type: question
              text: >
                Maya's whole pitch is "walk in the morning, park in the
                afternoon." How many reasons has she actually given?
              reveals: 1
              cost: 0
            - type: question
              text: >
                What would Maya need to add to this pitch to turn it
                into an actual argument about the field trip?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                A schedule isn't an argument. Maya has told you when
                things would happen, not why anyone should want them
                to happen that way.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Maya could have kept the physics framing from episode 1
                and said "the walk gets us history downtown, and the
                park lets us see physics in action — here is what we
                would look at on both sides." Adding those two missing
                premises would have given the compromise the substance
                the alliance is currently substituting for.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        inferential_validity:
          role: afforded_missing
          opening: >
            It's natural to see Maya's compromise as a clever logical move.
          ladder:
            - type: redirect
              text: >
                Combining two things isn't a logic error — plenty of
                compromises combine two options. The bigger issue is
                that Maya's pitch has almost no content at all. Look
                at how few reasons she actually gives for the
                combination.
              routes_to: {facet: sufficiency}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t02: Kai grabs the compromise and builds logistics ──

    t02:
      blank_page:
        opening: >
          Kai just grabbed Maya's idea and started working out the
          logistics — free walk, cheap bus split, back by 3:30.
        ladder:
          - type: nudge
            text: >
              List the things Kai is excited about. Are any of them
              about learning?
            reveals: 1
            cost: 0
          - type: question
            text: >
              The committee was asked to figure out what the class
              should learn and where they should go. Which of those
              two questions is Kai working on right now?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Every detail Kai mentions is about money or timing. The
              question of what anyone would learn has dropped out of
              the conversation without him noticing.
            reveals: 3
            cost: 1

      by_facet:
        relevance:
          role: present
          opening: >
            You noticed that Kai's whole focus is on the logistics
            and not on what the class would learn.
          ladder:
            - type: question
              text: >
                Make a quick list of everything Kai brings up in this
                turn — the walk being free, the bus split, being back
                by 3:30. What's missing from that list?
              reveals: 1
              cost: 0
            - type: question
              text: >
                If you dropped every sentence of Kai's that is about
                money or timing, how much of his turn would be left?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Kai is treating logistics as the whole problem. Logistics
                are a real part of planning, but Ms. Tsai told them the
                recommendation would be judged on the quality of the
                reasoning — not on whether the bus fits.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Instead of answering Maya's brainstorm purely in cost
                and schedule terms, Kai could have said "okay, but
                what would we actually learn from the walk, and what
                would we learn from the park?" The same practical
                instinct, turned on the educational question instead
                of away from it, would have kept the real question on
                the table.
              reveals: 4
              cost: 2
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - type: question
                    text: >
                      Kai is good at logistics. What happens when
                      someone leans hard into the part of a problem
                      they already know how to solve?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      Kai's practical frame is narrow, not wrong. He
                      treats logistics as the whole problem because
                      that's the piece he can see clearly, and the
                      educational question slides out of view.
                    reveals: 2
                    cost: 1
              social:
                ladder:
                  - type: question
                    text: >
                      Why is the committee happy to let Kai's logistics
                      talk become the whole conversation?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      The educational question is the one the committee
                      couldn't agree on in earlier meetings. Letting
                      Kai make logistics the work lets everyone avoid
                      reopening the argument.
                    reveals: 2
                    cost: 1
              interaction:
                ladder:
                  - type: question
                    text: >
                      Kai's narrow frame makes moving on feel practical.
                      The committee's relief at not reopening the fight
                      makes moving on feel welcome. What do those two
                      things produce together?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      Kai's tunnel vision gives the room an excuse, and
                      the room's tiredness makes the excuse stick. The
                      narrow frame and the relief reinforce each other.
                    reveals: 2
                    cost: 1
              tempting_absent:
                ladder:
                  - type: redirect
                    text: >
                      It might look like Kai just doesn't care about
                      school, but his enthusiasm is real — he's solving
                      a puzzle he finds interesting. The issue isn't
                      that he doesn't care; it's that the puzzle he's
                      solving isn't the one the committee was asked
                      to solve.
                    routes_to: {facet: relevance}
                    reveals: 1
                    cost: 0

        sufficiency:
          role: afforded_missing
          opening: >
            You noticed Kai is jumping on Maya's idea without asking
            what's in it.
          ladder:
            - type: nudge
              text: >
                Did Kai ask Maya any questions about her pitch before
                grabbing it?
              reveals: 1
              cost: 0
            - type: question
              text: >
                What would you expect someone to ask about a brand-new
                compromise idea before deciding it works?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Kai skipped straight from "oh — that actually works" to
                logistics. He didn't stop to check whether Maya's
                compromise has any reasons behind it — he just grabbed
                it because the scheduling was solvable.
              reveals: 3
              cost: 1
          has_explanation_depth: false

        consequence_consideration:
          role: afforded_missing
          opening: >
            It does look like Kai is being practical about what would
            actually happen.
          ladder:
            - type: redirect
              text: >
                Kai is talking about consequences, but only the
                consequences for the schedule and the budget. A real
                consequence-consideration move would ask what happens
                to the class's learning, or what happens to kids who
                can't pay. That comes later in this meeting when Kai
                names the cost. Right now, the bigger issue is that
                the educational question has dropped out of his frame.
              routes_to: {facet: relevance}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t03: Maya rides the energy, two-premise compression ──

    t03:
      blank_page:
        opening: >
          Maya just said "something educational in the morning, fun in
          the afternoon, everyone wins."
        ladder:
          - type: nudge
            text: >
              Count the actual claims in Maya's sentence. How many
              are there?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Maya is saying the walking tour is "educational." Did she
              say what it teaches or why it's educational?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Maya's whole case is two claims with nothing under them —
              the park is fun, the walk is educational — and a bow on
              top: "everyone wins." She has less than she started with.
            reveals: 3
            cost: 1

      by_facet:
        sufficiency:
          role: present
          opening: >
            You noticed that Maya's case for the compromise is thin.
          ladder:
            - type: question
              text: >
                Maya's case is two premises: the park is fun, the walk
                is educational. Is that enough to answer what Ms. Tsai
                asked the committee to recommend?
              reveals: 1
              cost: 0
            - type: question
              text: >
                In earlier meetings Maya had a whole physics chain —
                roller coasters, acceleration, curriculum connections.
                Where did that part of her argument go?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Maya's argument has actually gotten weaker, not stronger.
                She dropped the load-bearing parts of her original pitch
                and kept only the easy parts. The walking tour has
                become a fig leaf she can point at to call the morning
                educational.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Maya could have kept the physics framing from episode 1
                and said "the walk gets us history downtown, and the
                park lets us see physics in action — here is what we
                would look at on both sides." Adding those two missing
                premises would have given the compromise the substance
                the alliance is currently substituting for.
              reveals: 4
              cost: 2
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - type: question
                    text: >
                      Maya had a stronger argument two meetings ago.
                      What part of what she believed back then did she
                      have to drop to make the compromise with Kai
                      work?
                    reveals: 1
                    cost: 0
                  - type: hint
                    text: >
                      Maya is filtering her own thinking toward the
                      parts that overlap with Kai. The physics chain
                      didn't fit the logistics compromise, so it
                      quietly disappeared. She doesn't notice she's
                      doing it because the alliance feels like proof.
