        consequence_consideration:
          role: afforded_missing
          opening: >
            It might look like Kai is pointing at something that would
            actually matter for the committee's progress.
          ladder:
            - type: redirect
              text: >
                The committee does need to make progress, and Kai is
                right that they've been stuck. But "two of us agreed"
                isn't progress on the committee's actual question —
                it's coalition-counting. Real progress would be
                answering one of Sam's conditions or settling what
                the class would learn. Focus on what Kai is treating
                as proof, not on whether progress is needed.
              routes_to: {facet: inferential_validity}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t10: Priya's correct rejection, deployed tactically ──

    t10:
      blank_page:
        opening: >
          Priya just told Kai that "two people liking a trip isn't the
          same thing as two people being right about it."
        ladder:
          - type: nudge
            text: >
              Is what Priya just said true?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Priya's line is correct about Kai's move. But why is she
              saying it right now — to reopen the argument, or to
              solidify her own side?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Priya's point is real and it names exactly the move Kai
              just made. But she isn't saying it to reopen the
              conversation — she's saying it to harden her own bloc
              with Jordan. The same correct observation can be a
              genuine logical correction and a coalition move at the
              same time.
            reveals: 3
            cost: 1

      by_facet:
        inferential_validity:
          role: present
          opening: >
            You noticed that Priya's line is correct — but the way
            she's using it is the thing to watch.
          ladder:
            - type: question
              text: >
                If Priya really wanted to stop the bloc-as-evidence
                move, what would she do after saying this sentence?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Does Priya follow up her correct point by actually
                re-engaging Kai's argument, or does she turn toward
                Jordan and close ranks?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Priya's line is epistemically right and tactically
                deployed at the same time. She's naming Kai's move
                correctly — but using the correction to line up her
                own bloc, not to open the conversation back up. The
                correct observation becomes a tool in the coalition
                fight.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                After saying her line, Priya could have said "so let's
                all drop the coalition counting and actually name what
                each option teaches the class." That would have turned
                her logical correction into an invitation to reopen
                the conversation instead of a tactical move to close
                ranks with Jordan.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        internal_consistency:
          role: tempting_absent
          opening: >
            It might look like Priya is contradicting herself —
            rejecting the bloc-as-evidence move now after using a
            similar framing move in t07.
          ladder:
            - type: redirect
              text: >
                Priya's t07 "serious institutions" line and her t10
                rejection of "two of us agreed" aren't formally
                contradictory — she never actually claimed "two people
                agreeing makes us right" in t07. The asymmetry you're
                noticing is real, but it's about how she uses the
                correct observation, not about two claims that can't
                both be true. Focus on the inferential move, not on
                whether Priya is consistent.
              routes_to: {facet: inferential_validity}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t11: Sam's meta-observation ──

    t11:
      blank_page:
        opening: >
          Sam just said quietly, "none of this is answering what the
          class is actually supposed to learn," and nobody responded.
        ladder:
          - type: nudge
            text: >
              What did Sam just say? And what happened after she
              said it?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Sam has now tried twice to pull the conversation back to
              the educational question. How did the room react both
              times?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Sam named the real problem out loud — twice — and the
              committee acted like she didn't speak. The failure here
              isn't in her argument; it's in the room never engaging
              with her viewpoint at all.
            reveals: 3
            cost: 1

      by_facet:
        perspective_engagement:
          role: present
          opening: >
            You noticed that Sam keeps getting left out of the
            conversation.
          ladder:
            - type: question
              text: >
                Sam just named the structural problem clearly. Why
                doesn't anyone in either bloc pick it up and run with it?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Being in a bloc is doing work in the room right now.
                What does it mean for Sam that she doesn't have a
                bloc behind her?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Sam's contributions aren't being rejected — they're
                being treated as interruptions. Each bloc's attention
                is narrowed to the rival bloc, so a viewpoint with no
                coalition behind it doesn't register as part of the
                active conversation. The silence after her line is
                the failure.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                When Sam said "none of this is answering what the
                class is actually supposed to learn," anyone in either
                bloc could have said "you're right — let's stop for a
                second and answer that." The counterfactual isn't Sam
                pushing harder — she says what she means once — it's
                the committee treating her line as a contribution
                instead of a pause.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        relevance:
          role: present
          opening: >
            You noticed that Sam is naming the relevance failure
            directly.
          ladder:
            - type: question
              text: >
                "None of this is answering what the class is actually
                supposed to learn." What did the committee spend this
                whole meeting answering instead?
              reveals: 1
              cost: 0
            - type: question
              text: >
                If you had to summarize the meeting in one sentence —
                what question has it been answering, turn by turn?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                The meeting has been answering "what's the cheapest
                schedule?" and "which bloc is bigger?" — not "what is
                the class supposed to learn?" Sam is the only person
                tracking the original question, and she names the
                drift out loud. The committee's silence is the answer.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                The committee could have stopped, acknowledged Sam was
                right, and asked "okay — what ARE we actually supposed
                to be learning from this trip?" That single pivot
                would have put the question back on the table in a
                way Kai's "lock in the logistics" deflection had
                removed it.
              reveals: 4
              cost: 2
          has_explanation_depth: false

    # ── t12: Kai surfaces the cost ──

    t12:
      blank_page:
        opening: >
          Kai just ran the cost math out loud — eighteen dollars a
          person plus twelve for the bus, times twenty-eight kids, over
          eight hundred dollars — and wrote it on the whiteboard.
        ladder:
          - type: nudge
            text: >
              What does Kai actually put on the table with this number?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Think back across all three meetings. Is this the first
              time anyone has named a specific, concrete consequence
              of picking a specific place?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              This is a real strength. Every previous argument has
              been abstract — "is the museum educational," "is the
              park fun." Kai just named a specific number for a
              specific option, and written it where the whole
              committee can see it.
            reveals: 3
            cost: 1

      by_facet:
        consequence_consideration:
          role: present
          opening: >
            You noticed that Kai is doing something new here — naming
            a concrete consequence.
          ladder:
            - type: question
              text: >
                Kai's cost number is specific — eighteen dollars per
                student, twelve for the bus, twenty-eight kids, over
                eight hundred. What makes a specific number different
                from an abstract claim about "cost"?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Once the number is on the whiteboard, what new
                questions become possible that weren't possible
                before?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                A concrete consequence, once named, becomes an
                evidence question the committee can't honestly ignore.
                Kai's cost math turns an abstract debate into a
                specific one — even though nobody in the room picks
                it up right now, the number is going to sit there.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Kai's strength is already present — the counterfactual
                is that the committee would have engaged the number.
                If Priya or Maya had responded "okay, eight hundred
                dollars — can every kid pay that?" instead of treating
                the number as a scoring point, the cost surfacing
                would have connected consequence to equity in this
                meeting.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        sufficiency:
          role: afforded_missing
          opening: >
            It might look like Kai is using the number as ammunition
            against Priya's bloc.
          ladder:
            - type: redirect
              text: >
                Maya will use the number as ammunition in the very
                next turn — but that's Maya's move, not Kai's. When
                Kai first writes the number on the whiteboard, he's
                in logistics mode, running the math because the math
                is what he cares about. The strength here is the
                surfacing of a concrete consequence. Focus on what
                Kai did, not on how Maya is about to use it.
              routes_to: {facet: consequence_consideration}
              reveals: 1
              cost: 0
          has_explanation_depth: false

    # ── t13: Maya weaponizes the number ──

    t13:
      blank_page:
        opening: >
          Maya just said "See? That's why the compromise makes sense —
          the walking tour is free."
        ladder:
          - type: nudge
            text: >
              What does Maya do with Kai's eight-hundred-dollar
              number?
            reveals: 1
            cost: 0
          - type: question
            text: >
              Kai's number raised a question about what eight hundred
              dollars means for the class. Did Maya answer that
              question, or did she use the number for something else?
            reveals: 2
            cost: 0
          - type: hint
            text: >
              Maya converts the cost number into ammunition against
              Priya's bloc in two seconds. She never asks who can't
              afford the eight hundred dollars — she uses the number
              as a scoring point, and then adds "free" as if that
              were an argument for the walking tour being educational.
            reveals: 3
            cost: 1

      by_facet:
        consequence_consideration:
          role: afforded_missing
          opening: >
            You noticed that Maya skipped right past the real
            consequence Kai's number raised.
          ladder:
            - type: nudge
              text: >
                Eight hundred dollars is a real number that affects
                real people. Whose perspective is missing from Maya's
                response to that number?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Instead of "the walking tour is free, so we win," what
                would Maya need to ask about the eight hundred
                dollars?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                The number should have put a new question on the
                table: can every kid in the class pay eighteen
                dollars? Maya skips the question entirely and uses
                the cost as a weapon against Priya. The consequence
                Kai surfaced is treated as ammunition, not a problem
                to solve.
              reveals: 3
              cost: 1
          has_explanation_depth: false

        sufficiency:
          role: present
          opening: >
            You noticed that Maya is still adding "free" to her
            argument as if price settled the educational question.
          ladder:
            - type: question
              text: >
                "The walking tour is free" — is free the same as
                educational?
              reveals: 1
              cost: 0
            - type: question
              text: >
                Maya started the meeting with two thin premises. Now
                she's closing it with three — fun, educational, free.
                Has her argument actually gotten stronger?
              reveals: 2
              cost: 0
            - type: hint
              text: >
                Maya keeps adding single-word claims and treating
                them as argument. "Fun," "educational," "free" — none
                of them are wrong, but none of them answer what the
                class would actually learn. The meeting ends with her
                case still two premises wide and a cost sticker
                taped on.
              reveals: 3
              cost: 1
            - type: worked_example
              text: >
                Maya could have said "Kai, that eight hundred number
                matters — can we check whether every kid can pay that
                before we decide?" — treating her ally's data as a
                real question instead of a scoring point. That would
                have turned the compromise into a case that actually
                tracked consequences.
              reveals: 4
              cost: 2
          has_explanation_depth: false

        relevance:
          role: present
          opening: >
            It might look like Maya is making a sensible point that
            the compromise really is cheaper.
          ladder:
            - type: redirect
              text: >
                The compromise may or may not be cheaper — that's
                actually a logistics question, not the committee's
                question. The thing to notice is that "free" is
                doing work "educational" should be doing. Maya's
                reply is still dodging what the class would actually
                learn.
              routes_to: {facet: sufficiency}
              reveals: 1
              cost: 0
          has_explanation_depth: false

# ──────────────────────────────────────────────
# §3  STRUGGLE CALIBRATION
# ──────────────────────────────────────────────

struggle_calibration:
  by_passage:
    p1:
      pace: standard
      minimum_wrestling:
        - selected_a_facet
        - viewed_turn_for_15s
      productive_duration: moderate

# ──────────────────────────────────────────────
# §4  OTHER BLOCKS
# ──────────────────────────────────────────────

introduces:
  - tunnel_vision
  - conflict_avoidance
  - group_pressure
  - condition_sensitivity
  - consequence_consideration

assumes_familiar_with:
  - relevance
  - source_credibility
  - sufficiency
  - perspective_engagement
  - inferential_validity
  - confirmation_bias
  - authority_deference

character_arc_position: rising_action

growth_beats:
  Kai:
    position: setup
    note: >
      Kai's tunnel vision on logistics is established as a pattern —
      he treats the practical puzzle as the whole problem and
      redirects away from the educational question without noticing
      he's doing it. The same meeting also establishes his strength:
      he's the first person in the story to name a concrete
      consequence of a concrete proposal.
  Maya:
    position: inflection
    note: >
      Maya's argument is measurably thinner than in earlier episodes
      — she drops the physics framing and treats the coalition with
      Kai as substitute proof. The thinning is visible, but Maya
      does not notice. The inflection is the gap between how strong
      the argument feels to her (stronger — because of the alliance)
      and how strong the argument actually is (weaker — because she
      dropped load-bearing premises).
  Priya:
    position: setup
    note: >
      Priya's pre-growth pattern deepens: she conflates institutional
      prestige with educational fit and leans on Jordan's silent
      presence to build a bloc. Her tactically-deployed correct
      observation in t10 shows she can see the bloc-as-evidence move
      when someone else makes it, but not when she's making it.
  Sam:
    position: setup
    note: >
      Sam's role as epistemic anchor and isolated voice is
      reinforced. She asks the conditional question the committee
      needed and names the structural problem plainly, and the room
      doesn't engage either time. Her strength is real; the
      committee's failure to pick it up is the point.

response_space:
  by_lens:
    logic:
      likely: >
        Students will notice Maya's argument has gotten thin and
        Kai's "two of us agreed" move counts coalition members
        instead of reasons.
      partial: >
        Students may see Maya's thinness as "she's not trying hard
        enough" without seeing that the coalition with Kai is
        substituting for the premises she dropped.
      misreading: >
        Students may flag Priya's t10 line as a contradiction of
        her t07 move, misnaming a real asymmetry as an
        internal_consistency failure rather than a
        source_credibility + positioning failure.
      blindspot: >
        The mechanism — coalition-building as a substitute for
        argument, where two people agreeing does the work more
        premises would have to do — is hard to articulate for
        sixth graders because it requires holding the social fact
        and the logical test in mind at the same time.
    evidence:
      likely: >
        Students will notice Kai's eight-hundred-dollar cost number
        and treat it as a strength — which it is.
      partial: >
        Students may see Priya's "real educational institution"
        framing as reasonable because museums are in fact more
        prestigious than amusement parks, missing that prestige
        and fit are different claims.
      misreading: >
        Students may flag the absence of new sources in this
        meeting as a source_diversity failure, missing that episode
        3 is a negotiation meeting, not an evidence-gathering
        meeting.
      blindspot: >
        The category/quality distinction in Priya's framing — "real
        educational institution" as a label that sounds like
        evidence of fit but is actually a ranking claim — is
        subtle for this age group.
    scope:
      likely: >
        Students will recognize Sam's conditional question as a
        strength and may also notice Kai's cost surfacing as
        consequence-tracking.
      partial: >
        Students may see Sam as "the smart one" without tracking
        why the committee lets her contributions slide past
        without engagement — the perspective-engagement failure
        around her isolation.
      misreading: >
        Students may read Kai's "lock in the logistics first" as a
        sensible project-management move rather than a relevance
        failure that removes the committee's actual question from
        the table.
      blindspot: >
        The structural observation that every scope move in this
        episode (Sam's conditions, Sam's meta-observation, Kai's
        cost) slides past without the committee engaging it — a
        pattern across the whole passage, not a single-turn issue.
