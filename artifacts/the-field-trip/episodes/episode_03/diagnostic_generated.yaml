            routes_to: {facet: internal_consistency, role: tempting_absent}
          - text: "I'm not sure what I'm noticing."
            routes_to: {blank_page: true}

      t08:
        trigger: inactivity_or_manual
        question: >
          Maya fires back that the walking tour is serious and "the park
          has literal physics in it." What are you noticing about how
          Maya is defending her idea now?
        options:
          - text: >
              Her whole defense of the physics angle is just one phrase —
              "literal physics in it" — with nothing behind it.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              She's treating Priya like the other team instead of
              actually thinking about Priya's point.
            routes_to: {facet: sufficiency, role: present}
          - text: >
              Maya is making a good point that amusement parks do
