    sentence_id: turn_09.s01
  turn_id: turn_09
- speaker: Priya
  sentences:
  - text: Two people liking a trip isn't the same thing as two people being right about it.
    sentence_id: turn_10.s01
  turn_id: turn_10
- speaker: Sam
  sentences:
  - text: None of this is answering what the class is actually supposed to learn.
    sentence_id: turn_11.s01
  turn_id: turn_11
- speaker: Kai
  sentences:
  - text: Okay but hold on — the museum is eighteen dollars a person, plus twelve for the bus, times twenty-eight
