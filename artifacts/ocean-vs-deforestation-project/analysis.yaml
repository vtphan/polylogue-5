scenario_id: ocean-vs-deforestation-project
passage_analyses:
  - passage_id: passage_01
    turns: [turn_01, turn_02, turn_03]
    sentence_range:
      - turn_01.s01
      - turn_01.s02
      - turn_02.s01
      - turn_02.s02
      - turn_03.s01
    summary: >
      Maya opens by declaring the group should do ocean pollution, citing her
      documentary. Jordan counters with deforestation and immediately grounds it in a
      concrete plan (planting trees by the school fence) and a follow-up question
      about who would water them over the summer.
    facet_annotations:
      - facet_id: consequence_consideration
        quality_level: strong
        evidence_sentences: [turn_02.s02, turn_03.s01]
        primary_lens: scope
        also_visible_through: [logic]
        explanatory_variables:
          cognitive_pattern: null
          social_dynamic: null
          interaction: null
        was_targeted: true
        contrastive_explanation: >
          Where in earlier project-planning conversations the group might have run on
          pure enthusiasm without grounding in concrete next steps, here Jordan names
          a specific action (planting trees by the fence) and a real downstream
          question (who waters them over summer) before Maya's enthusiasm and the
          social pressure to agree push him to back down later in the discussion.
        notes: >
          The strength surfaces early, exactly as designed, and is visible in just
          two sentences before the dynamic shifts.
      - facet_id: source_credibility
        quality_level: weak
        evidence_sentences: [turn_01.s02]
        primary_lens: evidence
        also_visible_through: [logic]
        explanatory_variables:
          cognitive_pattern: uncritical_acceptance
          social_dynamic: null
          interaction: >
            Maya treats a single documentary as authoritative without naming who
            made it or how she'd check it.
        was_targeted: false
        notes: >
          Emergent: students may notice that "a documentary" is being used as a
          stand-alone authority. Not designed, but prominent enough that it will
          come up in discussion.
    ai_perspective:
      through_logic:
        observation: >
          Notice how the two openings work differently. Maya leads with a conclusion
          — "we have to do ocean pollution" — and then her reason. Jordan leads with
          an idea and then immediately asks himself a follow-up question about it.
          Both are normal ways people talk, but they set up very different kinds of
          conversation.
        key_sentences: [turn_01.s01, turn_02.s02, turn_03.s01]
      through_evidence:
        observation: null
        key_sentences: []
      through_scope:
        observation: >
          Looking through Scope, Jordan does something easy to miss: he names a
          specific place (the fence on the side of the school) and a specific time
          (over summer). That kind of grounding — actual place, actual time, actual
          people — is often what tells you whether a plan is real or just a good
          feeling.
        key_sentences: [turn_02.s02, turn_03.s01]
      why_it_happened: >
        One way to think about this opening: Jordan is doing something a researcher
        would call thinking in concrete next steps. He's not arguing about which
        problem is bigger; he's asking what would actually happen if they tried.
        That's a real strength, and it's the kind of thinking that often gets lost
        later in a conversation when someone else brings more energy. Watch what
        happens to it.
      what_to_notice: >
        Look at Jordan's two short turns. What is he doing that Maya isn't doing yet?
      what_to_notice_sentences: [turn_02.s02, turn_03.s01]
    diversity_potential:
      expected_lens_split: scope and logic are most likely to surface different readings here
      likely_student_observations:
        - lens: logic
          observations:
            - Jordan is the one actually asking what would happen next.
          might_miss:
            - Maya's opening "we have to" is a conclusion before any reasoning.
        - lens: evidence
          observations:
            - Maya is already leaning on a single documentary.
          might_miss:
            - Jordan's "my uncle showed me" is also a single source, just a quieter one.
        - lens: scope
          observations:
            - Jordan names a specific place (the fence) and a specific time (summer).
          might_miss:
            - This level of grounding will disappear from the rest of the conversation.

  - passage_id: passage_02
    turns: [turn_04, turn_05]
    sentence_range:
      - turn_04.s01
      - turn_04.s02
      - turn_05.s01
      - turn_05.s02
    summary: >
      Maya responds to Jordan's tree plan not by engaging with it but by pulling out
      dramatic facts and images from the documentary — millions of tons of plastic
      and a tangled sea turtle — and using them as if they decide which project the
      group should pick.
    facet_annotations:
      - facet_id: relevance
        quality_level: weak
        evidence_sentences: [turn_04.s01, turn_04.s02, turn_05.s01, turn_05.s02]
        primary_lens: evidence
        also_visible_through: [logic, scope]
        explanatory_variables:
          cognitive_pattern: overgeneralization
          social_dynamic: group_pressure
          interaction: >
            Maya stretches a global, Pacific-Ocean-scale fact into a claim about
            what her local school group should do, and the emotional weight of the
            turtle image makes it socially hard for Jordan to point out the scale
            mismatch.
        was_targeted: true
        notes: >
          The evidence is real and vivid, but it's about a problem in the middle of
          the Pacific — not about anything a school group could touch. The mismatch
          between the evidence's scope and the project's scope is the core weakness.
    ai_perspective:
      through_logic:
        observation: >
          Maya's reply to the tree plan isn't really a reply to the tree plan. She
          moves from "trees are cool" straight to a fact about plastic. That's a
          move worth watching — the topic changed without anyone naming it.
        key_sentences: [turn_04.s01, turn_04.s02]
      through_evidence:
        observation: >
          The "millions of tons of plastic" fact is real, and the sea turtle is
          real. But notice where they're from: a documentary about the middle of
          the Pacific Ocean. The evidence is strong about one thing (there's a lot
          of plastic out there) and silent about another (what a school group could
          do about it).
        key_sentences: [turn_04.s01, turn_05.s01]
      through_scope:
        observation: >
          Through Scope, there's a gap: the evidence is about a place thousands of
          miles away, and the project is about something the group itself will do.
          Big facts about faraway places don't automatically tell you what to do
          nearby.
        key_sentences: [turn_04.s01, turn_05.s01]
      why_it_happened: >
        A cognitive scientist might call this overgeneralization — taking a fact
        that's true at one scale (the whole Pacific) and stretching it into a
        conclusion at a very different scale (our school project). It's easy to do
        when the fact is dramatic, because the feeling of importance covers up the
        size mismatch. And there's a social piece too: the turtle image is
        emotionally heavy, and pushing back on it can feel like you don't care
        about turtles, which makes it hard for anyone in the group to say wait,
        but what would we actually do?
      what_to_notice: >
        Look at where the evidence is from and what the project is about. Are they
        the same kind of thing?
      what_to_notice_sentences: [turn_04.s01, turn_05.s01]
    diversity_potential:
      expected_lens_split: evidence and scope will produce different but compatible readings
      likely_student_observations:
        - lens: logic
          observations:
            - Maya doesn't actually answer the tree-planting plan.
          might_miss:
            - '"Way more important" is an unsupported comparison.'
        - lens: evidence
          observations:
            - The "millions of tons" stat is dramatic but it's about the Pacific.
          might_miss:
            - The turtle image is doing persuasive work the number alone wouldn't do.
        - lens: scope
          observations:
            - The evidence is about somewhere very far from the school.
          might_miss:
            - Maya never says what the group itself would do.

  - passage_id: passage_03
    turns: [turn_06, turn_07, turn_08]
    sentence_range:
      - turn_06.s01
      - turn_06.s02
      - turn_07.s01
      - turn_07.s02
      - turn_08.s01
    summary: >
      Jordan raises his strongest objection — they don't live near the ocean and he
      doesn't see what the group could actually do about plastic in the Pacific.
      Maya brushes it off with "we can figure that out later" and pivots back to
      scale. Jordan tries the feasibility point once more, more weakly.
    facet_annotations:
      - facet_id: perspective_engagement
        quality_level: weak
        evidence_sentences: [turn_06.s01, turn_06.s02, turn_07.s01, turn_07.s02]
        primary_lens: scope
        also_visible_through: [logic]
        explanatory_variables:
          cognitive_pattern: confirmation_bias
          social_dynamic: conflict_avoidance
          interaction: >
            Maya acknowledges the worry just enough to not feel ignored and then
            redirects to the size of the problem; Jordan, rather than restate his
            point, softens it. The strongest counterargument never actually gets
            answered.
        was_targeted: true
        notes: >
          The signature here is the half-acknowledgment-then-pivot. Jordan's
          question is about feasibility; Maya's reply is about importance. The two
          never meet.
    ai_perspective:
      through_logic:
        observation: >
          Jordan asks a real question — what would we actually do? — and Maya's
          answer is about why the problem matters. Those aren't the same question.
          See if you can spot the moment the subject changes.
        key_sentences: [turn_06.s02, turn_07.s02]
      through_evidence:
        observation: null
        key_sentences: []
      through_scope:
        observation: >
          This is the strongest moment for Scope in the whole discussion. Jordan
          names the exact problem: they don't live near the ocean and he doesn't
          know what they'd do about plastic in the Pacific. That's the question
          the group needs to answer before they pick this project. Notice whether
          it gets answered.
        key_sentences: [turn_06.s01, turn_06.s02, turn_08.s01]
      why_it_happened: >
        One reading: Maya isn't ignoring Jordan on purpose. When people are already
        attached to an answer, they tend to hear objections as obstacles to get
        past rather than as questions to think about — that's sometimes called
        confirmation bias. And notice the social side: Jordan asks his question,
        gets waved off, and then asks it again more softly instead of louder. When
        someone backs down rather than repeat themselves, the group can end up
        acting like the question was answered when really it was just dropped.
      what_to_notice: >
        Read Jordan's question in turn 6 and Maya's reply in turn 7 right next to
        each other. Are they about the same thing?
      what_to_notice_sentences: [turn_06.s02, turn_07.s02]
    diversity_potential:
      expected_lens_split: scope is primary; logic students may notice the topic shift
      likely_student_observations:
        - lens: logic
          observations:
            - Maya's reply changes the subject from feasibility to importance.
          might_miss:
            - '"We can figure that out later" treats a real problem as already solved.'
        - lens: evidence
          observations:
            - Maya is still using the documentary instead of new information.
          might_miss:
            - Jordan never gets asked to bring evidence for his side.
        - lens: scope
          observations:
            - Jordan's question about what they could actually do is the strongest thing said.
          might_miss:
            - The question gets dropped, not answered.

  - passage_id: passage_04
    turns: [turn_09, turn_10, turn_11, turn_12, turn_13]
    sentence_range:
      - turn_09.s01
      - turn_09.s02
      - turn_10.s01
      - turn_11.s01
      - turn_12.s01
      - turn_13.s01
      - turn_13.s02
    summary: >
      Maya brings up another documentary fact about ocean currents and repeats
      that this is the most urgent problem on the planet. Jordan softens, Maya
      treats that as agreement, and the group lands on ocean pollution with the
      feasibility question still hanging in the air.
    facet_annotations:
      - facet_id: sufficiency
        quality_level: weak
        evidence_sentences: [turn_09.s01, turn_09.s02, turn_11.s01]
        primary_lens: evidence
        also_visible_through: [logic]
        explanatory_variables:
          cognitive_pattern: false_certainty
          social_dynamic: group_pressure
          interaction: >
            One more dramatic fact plus "everyone says so" gets treated as enough
            to settle a project decision, and Jordan's quiet "sure, okay" is read
            as consensus rather than a dropped objection.
        was_targeted: false
        notes: >
          Emergent: students will likely notice that the decision is "made"
          without any of Jordan's questions actually being answered.
    ai_perspective:
      through_logic:
        observation: >
          The decision in this passage isn't really made by reasoning — it's made
          by one person softening and the other person treating that as a yes.
          "Yeah, I guess" and "sure, okay" aren't the same thing as "you
          convinced me."
        key_sentences: [turn_10.s01, turn_12.s01]
      through_evidence:
        observation: >
          By the end, the only evidence in the room is still the documentary.
          Nobody ever brought new information about either project, and "everyone
          says so" doesn't add any.
        key_sentences: [turn_09.s02]
      through_scope:
        observation: >
          Jordan's feasibility question is still sitting there at the end —
          nobody answered it, the group just stopped talking about it. The
          decision is made, but the question that mattered most for actually
          doing the project never got addressed.
        key_sentences: [turn_06.s02, turn_08.s01, turn_11.s01]
      why_it_happened: >
        Something to think about: groups often confuse "we stopped arguing" with
        "we agreed." When one person is excited and confident and the other
        person doesn't like pushing back, the quiet one's silence can get read
        as a yes even when it's really just tiredness. That's the social side.
        The cognitive side is what researchers sometimes call false certainty —
        the feeling that a decision is settled because nobody's still objecting,
        even though the original objection was never actually answered.
      what_to_notice: >
        Compare what Jordan says in turn 6 to what he says in turn 12. What
        changed — his mind, or something else?
      what_to_notice_sentences: [turn_06.s02, turn_12.s01]
    diversity_potential:
      expected_lens_split: all three lenses converge here; logic and scope are sharpest
      likely_student_observations:
        - lens: logic
          observations:
            - Jordan's softening doesn't actually mean he agrees.
          might_miss:
            - '"Everyone says so" is doing real work in the closing turns.'
        - lens: evidence
          observations:
            - The "millions of tons" and currents fact are still about the Pacific.
          might_miss:
            - All the evidence in the whole discussion comes from one documentary.
        - lens: scope
          observations:
            - Jordan's feasibility question never got answered.
          might_miss:
            - Nobody asked what success would even look like for either project.
