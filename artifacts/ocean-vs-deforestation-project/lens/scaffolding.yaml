scenario_id: ocean-vs-deforestation-project

passage_scaffolding:
  - passage_id: passage_01
    turns: [turn_01, turn_02, turn_03]
    difficulty: accessible
    scaffold_sequence:
      - type: hint
        text: >
          Read Jordan's two short turns again. He's doing something Maya
          hasn't done yet. What kind of thinking is it?
      - type: ai_perspective
        text: >
          The AI pointed out that Jordan names a specific place and a
          specific time. Did you notice that too, or were you looking
          at something different in these turns?
    deepening_probes:
      - lens: logic
        prompt: >
          You noticed something about how Jordan is reasoning. Now think
          about why — what makes his way of talking different from Maya's?
      - lens: evidence
        prompt: >
          You noticed something about the evidence in this opening. Now
          think about why — where is each person getting what they know?
      - lens: scope
        prompt: >
          You noticed something about what Jordan is paying attention to.
          Now think about why — what is he picturing that Maya isn't?
    ai_reflection_prompt: >
      The AI said Jordan is thinking in concrete next steps. Does that
      match what you were trying to say, or do you see it differently?
    common_misreadings:
      - lens: logic
        misreadings:
          - pattern: >
              Jordan is just being negative or shooting down Maya's idea
            redirect: >
              Look again at what Jordan actually says in turn 3. Is he
              shooting down an idea, or is he asking a question about his
              own idea?
      - lens: evidence
        misreadings:
          - pattern: >
              Maya has good evidence because she watched a documentary
            redirect: >
              You noticed Maya has a source. Now look more closely — what
              do we know about that source besides that it exists?
      - lens: scope
        misreadings:
          - pattern: >
              Jordan is talking about trees and Maya is talking about the ocean
            redirect: >
              That's true, but look at the small details in Jordan's turns.
              What specific things does he mention besides "trees"?
    observation_rubric:
      - lens: logic
        levels:
          - level: basic
            examples:
              - Jordan asks a question.
              - Maya just says her opinion.
          - level: developing
            examples:
              - Jordan thinks about what would happen if they actually did it.
              - Maya jumps to a conclusion before giving a reason.
          - level: differentiated
            examples:
              - >
                Jordan tests his own idea by asking a follow-up question
                about it, while Maya states her conclusion first and then
                adds her reason after.
      - lens: evidence
        levels:
          - level: basic
            examples:
              - Maya saw a documentary.
          - level: developing
            examples:
              - Maya only has one source and it's a documentary.
              - Jordan's only source is his uncle.
          - level: differentiated
            examples:
              - >
                Both of them are leaning on a single source — Maya on a
                documentary, Jordan on his uncle — but only Maya is using
                hers like it settles the question.
      - lens: scope
        levels:
          - level: basic
            examples:
              - Jordan talks about trees at school.
          - level: developing
            examples:
              - Jordan names a specific place and a specific time.
          - level: differentiated
            examples:
              - >
                Jordan grounds his idea in a real place (the fence), a
                real time (over summer), and real people (whoever would
                water them) — that's what makes the plan feel possible
                instead of just a good feeling.
    explanation_rubric:
      categories:
        - category: cognitive
          levels:
            - level: basic
              examples:
                - Maya is just excited.
            - level: developing
              examples:
                - >
                  Maya is so sure of her answer that she states the
                  conclusion before giving any reason for it.
        - category: social
          levels:
            - level: basic
              examples:
                - Jordan is quieter than Maya.
            - level: developing
              examples:
                - >
                  Jordan asks a real question but it lands in the middle
                  of Maya's excitement, so it could easily get rolled over.
        - category: interaction
          levels:
            - level: developing
              examples:
                - >
                  Jordan is thinking carefully and Maya is going fast,
                  and that mix makes it easy for the careful thinking to
                  get lost.
            - level: differentiated
              examples:
                - >
                  Jordan's grounded thinking shows up early, but Maya's
                  certainty plus her energy means his careful questions
                  are likely to get treated as slowing things down rather
                  than as the most useful thing in the room.

  - passage_id: passage_02
    turns: [turn_04, turn_05]
    difficulty: moderate
    scaffold_sequence:
      - type: hint
        text: >
          Maya brings out two pieces of evidence in these turns. Where
          are they from? And where is the project supposed to happen?
      - type: hint
        text: >
          Look at the gap between those two places. Does the evidence
          tell the group anything about that gap?
      - type: ai_perspective
        text: >
          The AI talked about a scale gap — Pacific Ocean evidence
          versus a school-group project. Did you see that gap, or were
          you focused on something else, like whether the facts are true?
    deepening_probes:
      - lens: logic
        prompt: >
          You noticed something about Maya's reasoning. Now think about
          why — what was it about the tree-planting plan that made it
          easy to skip past?
      - lens: evidence
        prompt: >
          You noticed something about the evidence. Now think about why —
          what is it about a dramatic fact that makes the size mismatch
          hard to see?
      - lens: scope
        prompt: >
          You noticed something about where the evidence is from. Now
          think about why — what was the group supposed to be deciding,
          and how far is that from what the documentary is about?
    ai_reflection_prompt: >
      The AI named this as overgeneralization — stretching a global fact
      into a local conclusion. Does that match what you were trying to
      say, or were you noticing something different?
    common_misreadings:
      - lens: logic
        misreadings:
          - pattern: >
              Maya is right because plastic in the ocean is a real problem
            redirect: >
              The facts being true isn't the question. Look at what
              decision the group has to make — does the fact help them
              make that specific decision?
      - lens: evidence
        misreadings:
          - pattern: >
              The evidence is strong because there's a big number
            redirect: >
              You noticed the number is big. Now look at where the
              number is from — is it from the same kind of place as
              the project?
      - lens: scope
        misreadings:
          - pattern: >
              Maya cares about turtles
            redirect: >
              That's true. Now look at what the group has to decide
              this week. Does caring about turtles tell them what they
              would actually do for their project?
    observation_rubric:
      - lens: logic
        levels:
          - level: basic
            examples:
              - Maya changes the subject.
          - level: developing
            examples:
              - >
                Maya doesn't answer the tree-planting plan, she just
                jumps to a different fact.
          - level: differentiated
            examples:
              - >
                Maya replies to "trees are cool" with a fact about
                plastic, as if a bigger problem somewhere else
                automatically beats a smaller plan you could actually do.
      - lens: evidence
        levels:
          - level: basic
            examples:
              - The evidence is from a documentary.
          - level: developing
            examples:
              - >
                The fact is true but it's about the Pacific Ocean,
                not about the school.
          - level: differentiated
            examples:
              - >
                The "millions of tons" stat is real and it's about a
                place thousands of miles away — it tells you something
                is wrong out there but it doesn't tell the group what
                they could actually do here.
      - lens: scope
        levels:
          - level: basic
            examples:
              - The ocean is far away from the school.
          - level: developing
            examples:
              - >
                The evidence is about somewhere very far away and the
                project is about something the group itself would do.
          - level: differentiated
            examples:
              - >
                The size of the problem is huge and the size of what
                the group can actually touch is small, and Maya is
                using the first one to settle a question that's
                really about the second one.
    explanation_rubric:
      categories:
        - category: cognitive
          levels:
            - level: basic
              examples:
                - Maya is biased toward her idea.
            - level: developing
              examples:
                - >
                  Maya takes a fact that's true at one size — the whole
                  Pacific Ocean — and stretches it into a conclusion at
                  a totally different size, her school project.
        - category: social
          levels:
            - level: basic
              examples:
                - Nobody pushed back on Maya.
            - level: developing
              examples:
                - >
                  The turtle picture is so emotional that pushing back on
                  it would feel like you don't care about animals, which
                  makes it socially hard to point out the size mismatch.
        - category: interaction
          levels:
            - level: developing
              examples:
                - >
                  Maya stretches the fact and the emotional weight of the
                  turtle keeps Jordan from naming the gap.
            - level: differentiated
              examples:
                - >
                  Maya stretches a Pacific-Ocean fact into a school-project
                  conclusion, and the sea turtle image makes the stretch
                  feel like caring instead of like a mistake — so the
                  group can't notice the gap without sounding cold.

  - passage_id: passage_03
    turns: [turn_06, turn_07, turn_08]
    difficulty: moderate
    scaffold_sequence:
      - type: hint
        text: >
          Read Jordan's question in turn 6 and Maya's reply in turn 7
          right next to each other. What is each one really about?
      - type: hint
        text: >
          Now look at Jordan's turn 8. Compare how he says it to how
          he said the same thing two turns earlier. What changed?
      - type: ai_perspective
        text: >
          The AI said Jordan asked a feasibility question and Maya
          gave an importance answer — two different things. Did you
          notice that gap, or were you looking at something else?
    deepening_probes:
      - lens: logic
        prompt: >
          You noticed something about how Maya replied. Now think
          about why — what made it feel like an answer even though
          it wasn't about the same question?
      - lens: evidence
        prompt: >
          You noticed something about what evidence is in the room.
          Now think about why — did the group ever go look for
          anything new?
      - lens: scope
        prompt: >
          You noticed something about Jordan's question. Now think
          about why — what kept that question from staying alive in
          the conversation?
    ai_reflection_prompt: >
      The AI called this a topic shift — feasibility question,
      importance answer. Does that match what you were trying to
      name, or do you see it differently?
    common_misreadings:
      - lens: logic
        misreadings:
          - pattern: >
              Maya answered Jordan, she said they would figure it out later
            redirect: >
              Look closely at "we can figure that out later." Is that
              an answer to Jordan's question, or is it a way of putting
              the question off?
      - lens: evidence
        misreadings:
          - pattern: >
              Maya has more evidence so she wins
            redirect: >
              Forget who is winning for a second. Look at what Jordan
              is actually asking — is it a question that more facts
              about plastic would even answer?
      - lens: scope
        misreadings:
          - pattern: >
              Jordan gave up
            redirect: >
              You noticed Jordan got quieter. Now look at what his
              question was about — did anyone actually answer it
              before he got quieter?
    observation_rubric:
      - lens: logic
        levels:
          - level: basic
            examples:
              - Maya didn't really answer Jordan.
          - level: developing
            examples:
              - >
                Jordan asked what they would do, and Maya answered
                about why ocean pollution is important. Those aren't
                the same thing.
          - level: differentiated
            examples:
              - >
                Maya's reply nods at Jordan's worry just enough to not
                ignore it, then swings back to how big the problem is —
                so the conversation feels like it kept moving even
                though the actual question got dropped.
      - lens: evidence
        levels:
          - level: basic
            examples:
              - Maya keeps using the documentary.
          - level: developing
            examples:
              - >
                Nobody brings any new information; Maya just goes back
                to the same source.
          - level: differentiated
            examples:
              - >
                Jordan's side of the question never gets to bring any
                evidence at all — the only voice in the room with a
                source is Maya, and her source isn't about the thing
                Jordan is asking about.
      - lens: scope
        levels:
          - level: basic
            examples:
              - Jordan asks what they would actually do.
          - level: developing
            examples:
              - >
                Jordan's question is the strongest thing said, and it
                just gets dropped instead of answered.
          - level: differentiated
            examples:
              - >
                Jordan names the exact thing the group needs to figure
                out before picking this project — what they could
                actually do — and the conversation moves past it
                without anyone admitting it was never answered.
    explanation_rubric:
      categories:
        - category: cognitive
          levels:
            - level: basic
              examples:
                - Maya already made up her mind.
            - level: developing
              examples:
                - >
                  Maya is so attached to ocean pollution that she hears
                  Jordan's question as something to get past instead of
                  as something to actually think about.
        - category: social
          levels:
            - level: basic
              examples:
                - Jordan stopped pushing.
            - level: developing
              examples:
                - >
                  Jordan asks his question and gets brushed off, and
                  then asks it again more softly instead of louder —
                  he's avoiding a fight.
        - category: interaction
          levels:
            - level: developing
              examples:
                - >
                  Maya brushes the question off and Jordan softens
                  instead of repeating it, so the question disappears.
            - level: differentiated
              examples:
                - >
                  Maya treats the objection as something to step around,
                  and Jordan, not wanting to push harder, asks it more
                  weakly the second time — so the group ends up acting
                  like a question got answered when really one person
                  ignored it and the other person let it go.

  - passage_id: passage_04
    turns: [turn_09, turn_10, turn_11, turn_12, turn_13]
    difficulty: challenging
    scaffold_sequence:
      - type: hint
        text: >
          Compare what Jordan says in turn 6 to what he says in turn
          12. Did his mind change, or did something else change?
      - type: hint
        text: >
          Look at how the decision actually happens in these turns.
          Who decides, and what makes it feel "settled"?
      - type: hint
        text: >
          Now look back — Jordan's feasibility question from earlier.
          Where did it go? Did anyone answer it, or did the
          conversation just move on?
      - type: ai_perspective
        text: >
          The AI said "we stopped arguing" isn't the same as "we
          agreed." Does that match what you noticed about how the
          group landed on their decision?
    deepening_probes:
      - lens: logic
        prompt: >
          You noticed something about how the decision got made.
          Now think about why — what made Jordan's "sure, okay" get
          treated as a yes?
      - lens: evidence
        prompt: >
          You noticed something about the evidence at the end. Now
          think about why — over the whole discussion, where did
          everything they "knew" come from?
      - lens: scope
        prompt: >
          You noticed something about Jordan's question. Now think
          about why — what kept the group from coming back to it
          before deciding?
    ai_reflection_prompt: >
      The AI talked about false certainty — feeling like something is
      settled because nobody is still objecting. Does that match what
      you were trying to say, or do you see it differently?
    common_misreadings:
      - lens: logic
        misreadings:
          - pattern: >
              Jordan changed his mind
            redirect: >
              Look at exactly what Jordan says in turn 10 and turn 12.
              Do those words mean "you convinced me," or do they mean
              something else?
      - lens: evidence
        misreadings:
          - pattern: >
              Maya brought new evidence at the end
            redirect: >
              Where is that new fact from? Have you seen that source
              before in this discussion?
      - lens: scope
        misreadings:
          - pattern: >
              They picked ocean pollution so the group decided
            redirect: >
              You noticed they picked something. Now look at the
              question Jordan asked back in turn 6 — is it answered
              anywhere in these last turns?
    observation_rubric:
      - lens: logic
        levels:
          - level: basic
            examples:
              - Jordan just gave up.
          - level: developing
            examples:
              - >
                Jordan's "sure, okay" isn't the same as agreeing —
                he just stopped arguing.
          - level: differentiated
            examples:
              - >
                The decision gets made by Maya treating Jordan's
                quiet softening as a yes, even though none of the
                things he was actually worried about got answered.
      - lens: evidence
        levels:
          - level: basic
            examples:
              - The currents fact is from the documentary too.
          - level: developing
            examples:
              - >
                Every single piece of evidence in the whole
                discussion comes from the same one documentary.
          - level: differentiated
            examples:
              - >
                The closing facts are still from the same source as
                the opening ones, and "everyone says so" is being
                used like it counts as evidence even though it isn't.
      - lens: scope
        levels:
          - level: basic
            examples:
              - They never figured out what they would do.
          - level: developing
            examples:
              - >
                Jordan's question about what they would actually do
                is still hanging there at the end — nobody answered it.
          - level: differentiated
            examples:
              - >
                The group commits to a project without anyone ever
                naming what success would look like, what they would
                actually do, or what would happen after they started.
    explanation_rubric:
      categories:
        - category: cognitive
          levels:
            - level: basic
              examples:
                - Maya thought she had won.
            - level: developing
              examples:
                - >
                  Once nobody is still objecting, Maya feels like the
                  question is settled — even though the original
                  worry never actually got answered.
        - category: social
          levels:
            - level: basic
              examples:
                - Jordan didn't want to argue anymore.
            - level: developing
              examples:
                - >
                  Maya is excited and confident, and Jordan doesn't
                  like pushing back, so his quiet "sure, okay" gets
                  read as a yes when it's really just tiredness.
        - category: interaction
          levels:
            - level: developing
              examples:
                - >
                  Jordan stops pushing and Maya treats stopping as
                  agreement, so the decision goes through.
            - level: differentiated
              examples:
                - >
                  Jordan runs out of energy to keep restating his
                  question, Maya reads his silence as a yes, and the
                  group ends up "deciding" by one person being louder
                  longer — the original question never got answered,
                  it just stopped being asked.
