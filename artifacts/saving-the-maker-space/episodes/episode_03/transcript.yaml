personas:
- name: Mira
  perspective: 'The petition was right. The principal is the obstacle, and obstacles are what you push
    through. If her spreadsheet doesn''t match the conclusion, the spreadsheet has to be incomplete —
    there must be a number she isn''t counting, a value she isn''t seeing. The group''s job is to find
    it together, fast, before anyone loses faith.

    '
- name: Theo
  perspective: 'The principal said something true and they all heard it. He is not interested in being
    right about having warned them; he is interested in not getting it wrong twice. The group has to look
    at what they actually offered her, not what they wish they had offered her, and that means starting
    from her argument, not from theirs.

    '
- name: Dev
  perspective: 'The petition was good. It said true things. If the principal didn''t accept it, the problem
    is that she read it the wrong way, not that the framing was wrong. He wants the group to stay tight
    and to keep believing what they walked into the office believing.

    '
