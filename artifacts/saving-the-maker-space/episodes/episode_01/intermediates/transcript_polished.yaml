personas:
  - name: Mira
    perspective: Thinks the closure is wrong and the group needs to start a petition today.
  - name: Theo
    perspective: Agrees the closure is bad but wants to know the principal's actual reason first.
  - name: Ren
    perspective: Excited to share things she found online that show the maker space matters.
turns:
