  - speaker: Mira
    sentences:
      - text: "I mean, that's gotta be Principal Alvarez's number, she has to know it."
      - text: "That's her job to explain, not ours."
  - speaker: Theo
    sentences:
      - text: "...yeah, okay."
  - speaker: Ren
    sentences:
