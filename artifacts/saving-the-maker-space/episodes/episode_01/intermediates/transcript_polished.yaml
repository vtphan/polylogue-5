      - text: "Like, that's everybody."
  - speaker: Ren
    sentences:
      - text: "Yeah, and the study literally says hands-on learning boosts engagement, so like, done."
  - speaker: Theo
    sentences:
      - text: "...mm."
  - speaker: Mira
    sentences:
      - text: "Okay so we're all on the same page, right? We're doing a petition."
  - speaker: Theo
    sentences:
      - text: "...yeah."
  - speaker: Ren
    sentences:
      - text: "Yeah, okay, let's do it."
  - speaker: Mira
    sentences:
