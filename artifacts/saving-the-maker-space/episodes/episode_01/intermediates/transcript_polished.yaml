      - text: "I read this whole NPR thing last night about how hands-on learning is literally the thing that works for middle schoolers, so like, that part's basically done."
  - speaker: Mira
    sentences:
      - text: "And they're spending forty thousand dollars turning our room into another computer lab, which is insane when there's already one upstairs."
  - speaker: Theo
    sentences:
