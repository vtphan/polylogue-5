story_premise: >
  Four 6th-grade best friends in Memphis saw a white squirrel with red eyes
  one Saturday afternoon in Overton Park — the 131-acre urban forest they
  bike to after school — and one of them can't let it go. Across the fall
  they try to figure out, between themselves, what is actually going on.

episode_premise: >
  It is the Monday after the Saturday sighting, late afternoon, light going
  orange over the Old Forest. The four of them are at the picnic table they
  always use, bags dropped, the notebook open between them. Jules has
  retold Saturday's sighting over and over since it happened — she froze
  when she saw the squirrel, she has not slept well, and she is retelling
  it now for the fourth time in three days. Cam watched a TikTok about
  Overton over the weekend and brings it to the table like it is the first
  piece of a case. Priya is comparing what they saw to every other park she
  knows. Maya writes. No adult is around to frame the question for them —
  the four of them are trying to assemble the shape of the mystery
  themselves, out loud, for the first time.

episode_number: 1

