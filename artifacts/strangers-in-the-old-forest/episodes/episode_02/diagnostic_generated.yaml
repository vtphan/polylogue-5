story_id: strangers-in-the-old-forest
episode_number: 2
scenario_id: strangers-in-the-old-forest-ep-02

# ---------------------------------------------------------------------------
# PROBES — the routing layer (§2.3.1)
# ---------------------------------------------------------------------------

probes:
  facet:
    by_turn:

      t02:
        trigger: inactivity_or_manual
        question: "What are you noticing about what Cam just did with that TikTok?"
        options:
          - text: "He went and checked who actually made the TikTok he was excited about yesterday."
            routes_to: {facet: source_credibility, role: present}
          - text: "He's admitting he was wrong, which is hard to do in front of friends."
            routes_to: {facet: source_credibility, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t03:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Jules is repeating what Anya said?"
        options:
          - text: "She's using big science words, but she hasn't said who Anya actually is."
            routes_to: {facet: source_credibility, role: present}
          - text: "She's already deciding what the squirrel is, before anyone has checked the chain."
            routes_to: {facet: inferential_validity, role: present}
          - text: "Anya might have said more careful things on the call that Jules left out."
            routes_to: {facet: condition_sensitivity, role: present}
          - text: "Jules just doesn't have enough evidence yet — she only saw it once."
            routes_to: {facet: sufficiency, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t04:
        trigger: inactivity_or_manual
        question: "What are you noticing about Cam's reaction to Jules?"
        options:
          - text: "He's treating Anya and the TikTok like they both count as evidence on the same scale."
            routes_to: {facet: source_credibility, role: present}
          - text: "When he says 'what else could it even be?' he's quietly closing off other answers."
            routes_to: {facet: perspective_engagement, role: present}
          - text: "He's making a leap from 'someone said it' to 'so it's a pattern.'"
            routes_to: {facet: inferential_validity, role: present}
          - text: "He just needs another source — they only have two."
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t05:
        trigger: inactivity_or_manual
        question: "What are you noticing about Maya's question here?"
        options:
          - text: "Maya is starting to ask the exact thing nobody has asked: who is Anya, really?"
            routes_to: {facet: source_credibility, role: present}
          - text: "Maya is trying to fill in a step in the chain that's missing."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t06:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Jules answers Maya's question?"
        options:
          - text: "Jules answers with a title — 'researcher at U of M' — instead of what Anya actually does."
            routes_to: {facet: source_credibility, role: present}
          - text: "Jules is leaning on Marcus's word, and Marcus is leaning on knowing Anya from talks."
            routes_to: {facet: inferential_validity, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t07:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Maya's question ends here?"
        options:
          - text: "Maya stops her own question partway through and lets the chain stand."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "A second ago she said one thing, and now she's saying the opposite."
            routes_to: {facet: internal_consistency, role: present}
          - text: "Maya saw Jules getting upset and softened her question to take care of her."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t08:
        trigger: inactivity_or_manual
        question: "What are you noticing about what Cam does with Anya's phrase here?"
        options:
          - text: "Cam takes a general science phrase and points it straight at the one squirrel they saw."
            routes_to: {facet: inferential_validity, role: present}
          - text: "The phrase doesn't really fit one squirrel — it's about populations."
            routes_to: {facet: relevance, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t09:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Jules answers 'what else could it be?'"
        options:
          - text: "Jules answers 'nothing else fits' instantly — like the question only had two possible answers."
            routes_to: {facet: inferential_validity, role: present}
          - text: "Other normal explanations for a white squirrel never even come up."
            routes_to: {facet: perspective_engagement, role: present}
          - text: "She just hasn't done enough research yet."
            routes_to: {facet: sufficiency, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t10:
        trigger: inactivity_or_manual
        question: "What are you noticing about what Maya says now versus what she started saying?"
        options:
          - text: "Maya started by asking who Anya was, and now she's saying Anya counts because she's a grad student."
            routes_to: {facet: internal_consistency, role: present}
          - text: "Maya never finished her earlier question and is talking like it got answered."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t13:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Cam wraps things up?"
        options:
          - text: "Cam is treating Anya as a settled fact the group can lean on tomorrow."
            routes_to: {facet: source_credibility, role: present}
          - text: "Nobody ever asked what kind of researcher Anya actually is, but she's the anchor now."
            routes_to: {facet: source_credibility, role: present}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

  # ---------------------------------------------------------------------
  # Depth probes — only for cells where "why" is load-bearing
  # ---------------------------------------------------------------------
  explanation:
    by_turn_facet:

      t03.source_credibility:
        question: "Why do you think Jules is leaning on Anya's title without saying what Anya actually studies?"
        options:
          - text: "In Jules's head, the title 'researcher at U of M' already feels like the answer, so she shares the title and not the specifics."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "Anya is older and credentialed, so Jules is treating the credential as if it settles the source question."
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: "Both at once — the credential feels like enough because it's also been passed down by someone she trusts."
            routes_to: {explanatory_variable: interaction}
          - text: "Jules just doesn't actually remember what Anya does."
            routes_to: {explanatory_variable: tempting_absent}

      t04.source_credibility:
        question: "Why do you think Cam is treating 'researcher at U of M' as enough?"
        options:
          - text: "He hears the credential word and his brain stops asking further questions."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "Anya outranks him, his feed, and his friends, so her word counts more by default."
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: "Both — his habit of taking sources at face value gets stronger when an adult expert is involved."
            routes_to: {explanatory_variable: interaction}
          - text: "Cam just wants attention from the group."
            routes_to: {explanatory_variable: tempting_absent}

      t06.source_credibility:
        question: "Why do you think Jules answered with a title instead of with specifics?"
        options:
          - text: "In her head, 'researcher at U of M' is what makes Anya count, so that's what she shares."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "She's leaning on Marcus's authority over Anya, and her own retelling of both."
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: "Both — the title-as-answer feels enough because it's also been passed down by someone she trusts."
            routes_to: {explanatory_variable: interaction}
          - text: "Jules doesn't actually remember what Anya does."
            routes_to: {explanatory_variable: tempting_absent}

      t07.reasoning_completeness:
        question: "Why do you think Maya let her question drop?"
        options:
          - text: "She decided pushing wasn't worth the cost — kind of a black-and-white choice between asking and being kind."
            routes_to: {explanatory_variable: cognitive, pattern_ref: black_and_white_thinking}
          - text: "She saw Jules getting close to crying and felt she had to protect her friend."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Both — caring about Jules turned 'finish the question' and 'be kind' into a forced pick."
            routes_to: {explanatory_variable: interaction}
          - text: "Maya didn't actually have a real question to begin with."
            routes_to: {explanatory_variable: tempting_absent}

      t09.inferential_validity:
        question: "Why do you think Jules answers 'nothing else really fits' so fast?"
        options:
          - text: "In her head, the choices have already narrowed to 'aliens for real' or 'boring,' so the answer is automatic."
            routes_to: {explanatory_variable: cognitive, pattern_ref: black_and_white_thinking}
          - text: "Anya's voice is now in the room, and Jules is leaning on what an adult expert seemed to say."
            routes_to: {explanatory_variable: social, dynamic_ref: authority_deference}
          - text: "Both — the binary makes the alien side feel chosen, and the credential makes that choice feel sanctioned."
            routes_to: {explanatory_variable: interaction}
          - text: "She just wants the conversation to end."
            routes_to: {explanatory_variable: tempting_absent}

      t10.internal_consistency:
        question: "Why do you think Maya's spoken position drifted from what she said at t05?"
        options:
          - text: "After softening once, it's hard to circle back; her own brain is letting the standard slide."
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: "The friend-protective pressure that made her soften is still in the room, and it's now keeping the new position stable."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Both — once she chose kindness, her words started fitting that choice instead of her earlier question."
            routes_to: {explanatory_variable: interaction}
          - text: "Maya forgot what she said two minutes ago."
            routes_to: {explanatory_variable: tempting_absent}

# ---------------------------------------------------------------------------
# INTERVENTIONS — per-turn three-role dictionary (§2.3.2)
# ---------------------------------------------------------------------------

interventions:
  by_turn:

    # =====================================================================
    # T02 — Cam's provenance report on the TikTok kid (the strength beat)
    # =====================================================================
    t02:
      blank_page:
        opening: "Cam is doing something here that he didn't do yesterday with that same TikTok."
        ladder:
          - {type: nudge, text: "What did Cam say his mom made him do last night?", reveals: 1, cost: 0}
          - {type: question, text: "Yesterday Cam treated that TikTok like proof. Today he says it's a 7th grader running a comedy account. What changed?", reveals: 2, cost: 0}
          - {type: hint, text: "Cam actually went and looked up who made the TikTok — and he's reporting back even though it makes yesterday look sillier. That's a real move.", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "You noticed Cam doing the 'who actually made this' check — that's the move this whole episode is going to turn on."
          ladder:
            - {type: question, text: "What is Cam's mom asking him to find out about the TikTok creator?", reveals: 1, cost: 0}
            - {type: question, text: "If 'someone posted it' isn't enough to count as a source, what extra information did Cam go get?", reveals: 2, cost: 0}
            - {type: hint, text: "Cam learned that the 'acting weird for months' TikTok is a 7th grader who runs the same aliens bit on every Memphis park. That kills it as evidence — and Cam admits it.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual: the strength here is that Cam did the provenance move and reported it. The gap will be that two minutes from now, when Jules brings up Anya, he won't do it again.", reveals: 4, cost: 2}
          has_explanation_depth: false

    # =====================================================================
    # T03 — Jules retells Anya in Anya's register
    # =====================================================================
    t03:
      blank_page:
        opening: "Jules is repeating Anya's exact phrases — but she hasn't told the group who Anya actually is yet."
        ladder:
          - {type: nudge, text: "Try reading Jules's lines out loud. What's a 6th grader doing using phrases like 'candidate biosignatures'?", reveals: 1, cost: 0}
          - {type: question, text: "What do you actually know about Anya from these three sentences? What is missing?", reveals: 2, cost: 0}
          - {type: hint, text: "Jules is using big science phrases as if the words themselves prove something. Notice that we still don't know what Anya studies, or whether the squirrel is in her wheelhouse.", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "You caught it — Jules is using Anya's words, but she hasn't said who Anya is or what she actually studies."
          ladder:
            - {type: question, text: "If a friend told you 'a researcher at U of M said X,' what would you want to know before you believed X?", reveals: 1, cost: 0}
            - {type: question, text: "Jules names Anya as a grad student. What kind of grad student? What department? Whose lab? Why does the squirrel fall in her area?", reveals: 2, cost: 0}
            - {type: hint, text: "The phrase 'candidate biosignatures' is doing a lot of work here. But the group has no way of knowing whether Anya works on city wildlife, on Mars rocks, or on something else entirely.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual at t06: imagine Jules had said 'Marcus said she's in the biology department, her side project is on urban color variation, he sat next to her at a colloquium last spring.' Then the group could check whether the credential actually fits the squirrel.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Anya said something that lined up with what Jules already wanted to be true. What does that do to how carefully Jules listens?", reveals: 1, cost: 0}
                  - {type: hint, text: "Confirmation bias: when a piece of information fits what you already believe, your brain is much less likely to ask 'wait, but how do they know?'", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Jules is a 6th grader; Anya is a Ph.D. student. How does that gap shape what Jules questions and what she just accepts?", reveals: 1, cost: 0}
                  - {type: hint, text: "Authority deference: when someone with a title says something, we tend to pass it along as fact rather than as a claim we still need to check.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "The two patterns reinforce each other here: the credential makes the wanted answer feel chosen rather than assumed, and the wanted answer makes the credential feel obviously the right one to listen to.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "It's not really a memory problem — Jules is repeating Anya's exact phrases. The question is why she's repeating the confident parts and dropping the careful parts.", reveals: 1, cost: 0}

        inferential_validity:
          role: present
          opening: "Right — Jules has already stitched 'Anya said X' to 'so the squirrel is one of those things,' and the steps in between aren't visible."
          ladder:
            - {type: question, text: "Anya said 'unusual color morphs in isolated urban populations' is what they look for. Did Anya say 'and your one squirrel is one of those'?", reveals: 1, cost: 0}
            - {type: question, text: "What would you have to know to get from 'this is a kind of thing scientists study' to 'and our squirrel is a confirmed example of it'?", reveals: 2, cost: 0}
            - {type: hint, text: "Jules is collapsing two things: the general framing Anya offered, and the specific squirrel they saw. Those are not the same claim.", reveals: 3, cost: 1}
          has_explanation_depth: false

        condition_sensitivity:
          role: present
          opening: "Good catch — a grad student would almost certainly attach 'maybe,' 'we'd need to test,' or 'it depends' to phrases like these. Jules left those out."
          ladder:
            - {type: nudge, text: "What words usually come right before 'candidate biosignature' when a scientist actually says it?", reveals: 1, cost: 0}
            - {type: question, text: "Anya called it 'candidate' — not 'confirmed.' What is 'candidate' doing in that phrase?", reveals: 2, cost: 0}
            - {type: hint, text: "From the counterfactual: imagine Jules had reported Anya's caveats too — 'she said you'd need genetics work to actually tell.' Then the framing would arrive with the conditions Anya almost certainly attached.", reveals: 3, cost: 1}
          has_explanation_depth: false

        sufficiency:
          role: tempting_absent
          opening: "It's tempting to call this an 'only saw it once' problem — but that was yesterday's episode. Today's chain has acquired more pieces."
          ladder:
            - {type: redirect, text: "The chain now has links — Anya, Marcus, the credential, the phrasing. The trouble isn't 'too few pieces of evidence' anymore; it's that the steps connecting the pieces don't actually hold together. That's inferential validity.", routes_to: {facet: inferential_validity}, reveals: 1, cost: 0}
          has_explanation_depth: false

    # =====================================================================
    # T04 — Cam: "that's two now, what else could it even be?"
    # =====================================================================
    t04:
      blank_page:
        opening: "Cam just made two moves at once: he counted Anya as a second source, and he closed the question to other answers."
        ladder:
          - {type: nudge, text: "What did Cam mean by 'that's two now'? Two what?", reveals: 1, cost: 0}
          - {type: question, text: "Two minutes ago Cam said the TikTok was a 7th grader's comedy account. So how is the TikTok one of his 'two'?", reveals: 2, cost: 0}
          - {type: hint, text: "Cam is treating Anya and the TikTok like two votes on the same scale — but he just disqualified the TikTok himself, and Anya hasn't been checked at all.", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "Yes — Cam is putting Anya and the TikTok on the same scale, but neither one has actually been confirmed as a source."
          ladder:
            - {type: question, text: "What did Cam find out about the TikTok kid in turn 2?", reveals: 1, cost: 0}
            - {type: question, text: "What does the group actually know about Anya at this point — beyond that she's at U of M?", reveals: 2, cost: 0}
            - {type: hint, text: "Cam can do the 'who is this source' move — he just did it on the TikTok. He's not doing it on Anya. The shape of the two situations is the same; he doesn't see that.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual: imagine Cam had asked, 'wait, what does she actually work on though, like is it the squirrel kind of thing or the physics kind of thing?' Then the symmetry between the TikTok check and the Anya check would have closed.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Why do you think Cam's brain stops asking questions once he hears 'someone at U of M'?", reveals: 1, cost: 0}
                  - {type: hint, text: "Uncritical acceptance: a credential word like 'researcher' can feel so weighty that it shuts down the next 'but how do we know?'", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Cam is a 6th grader. Anya is a Ph.D. candidate. How does that change what Cam treats as obvious?", reveals: 1, cost: 0}
                  - {type: hint, text: "Authority deference: Anya's words are doing more than her actual claims; her title is doing extra work in the room.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "His default of taking sources at face value (cognitive) gets reinforced by the laundered authority chain (social): Anya → Marcus → Jules → the table. Without the credential to defer to, his uncritical acceptance would have less to attach to.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "It's not about wanting attention — Cam is genuinely excited. The pattern is in how he treats credentialed information versus unverified information as the same kind of thing.", reveals: 1, cost: 0}

        perspective_engagement:
          role: present
          opening: "You heard the question 'what else could it even be?' for what it is — a question that quietly closes the door."
          ladder:
            - {type: question, text: "When someone asks 'what else could it even be?' in that tone, are they actually asking?", reveals: 1, cost: 0}
            - {type: question, text: "What other explanations for a red-eyed white squirrel never make it into the room across the whole conversation?", reveals: 2, cost: 0}
            - {type: hint, text: "Mundane options — leucism, founder effect in a small park, an escaped pet, ordinary pigmentation genetics — never enter the frame to be considered or rejected. The frame closed before they could get in.", reveals: 3, cost: 1}
          has_explanation_depth: false

        inferential_validity:
          role: present
          opening: "Yes — 'that's two now, that's a pattern' is a leap. Two of what? Both treated the same way?"
          ladder:
            - {type: question, text: "What does Cam mean by 'a pattern'? What kind of pattern would actually need to show up to count?", reveals: 1, cost: 0}
            - {type: hint, text: "A pattern is a repeated thing observed under similar conditions. Two unverified mentions of an idea aren't a pattern — they're two unverified mentions.", reveals: 2, cost: 1}
            - {type: lens_switch, text: "Try the evidence lens here too — 'what counts as one of the two?' is really an evidence question hiding inside Cam's logic.", reveals: 3, cost: 1}
          has_explanation_depth: false

        source_diversity:
          role: tempting_absent
          opening: "It does sound like a 'they don't have enough sources' issue — but the deeper problem is that neither item on Cam's 'two' actually counts as a source yet."
          ladder:
            - {type: redirect, text: "The TikTok was just disqualified in turn 2, and Anya's credibility hasn't been established at all. So the question isn't quantity — it's whether the one source they're treating as real is trustworthy. That's source credibility.", routes_to: {facet: source_credibility}, reveals: 1, cost: 0}
          has_explanation_depth: false

    # =====================================================================
    # T05 — Maya begins the right question
    # =====================================================================
    t05:
      blank_page:
        opening: "Maya is starting to ask exactly the question the chain needs — but listen for where her sentence is going."
        ladder:
          - {type: nudge, text: "What is the question Maya is starting to ask? Try finishing it for her in your head.", reveals: 1, cost: 0}
          - {type: question, text: "Why might Maya be the one who asks this and not Cam or Jules?", reveals: 2, cost: 0}
          - {type: hint, text: "Maya is reaching for the move nobody else has reached for: not 'is Anya impressive?' but 'is Anya the right kind of researcher for this question?'", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "Yes — Maya is finally asking what kind of researcher Anya actually is, which is the question this whole chain rests on."
          ladder:
            - {type: question, text: "What specific things does Maya start to want to know about Anya?", reveals: 1, cost: 0}
            - {type: question, text: "Why is 'is she the squirrel kind of —' a more useful question than 'is she at U of M'?", reveals: 2, cost: 0}
            - {type: hint, text: "A title tells you someone exists in a system; a research area tells you whether they actually know about the thing you care about. Maya is trying to drag the conversation from titles to areas.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual at t06: if Jules had answered with specifics (department, side project, how Marcus knows her), the group would either have a usable source or know they don't. Maya's question is what would have made that answer possible.", reveals: 4, cost: 2}
          has_explanation_depth: false

        reasoning_completeness:
          role: present
          opening: "Right — Maya is trying to fill in a step that the chain skipped over."
          ladder:
            - {type: question, text: "Look at Jules's chain in turn 3. What step is Maya trying to add back in with her question?", reveals: 1, cost: 0}
            - {type: question, text: "If we don't know how Marcus knew Anya was the right person to call, what does that do to the rest of the chain?", reveals: 2, cost: 0}
            - {type: hint, text: "The chain has been: Marcus → Anya → biosignatures → the squirrel. Maya is pointing at the very first link and saying 'wait, how does this one even hold?'", reveals: 3, cost: 1}
          has_explanation_depth: false

    # =====================================================================
    # T06 — Jules answers credentials with credibility
    # =====================================================================
    t06:
      blank_page:
        opening: "Maya asked what Anya does. Listen carefully to whether Jules's answer actually answers that question."
        ladder:
          - {type: nudge, text: "Read Jules's two sentences. Do you now know what kind of researcher Anya is?", reveals: 1, cost: 0}
          - {type: question, text: "What is Jules answering with — Anya's job description, or how trustworthy Anya seems?", reveals: 2, cost: 0}
          - {type: hint, text: "Jules answered a 'what does she do' question with a 'why she should be trusted' answer. Those aren't the same.", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "Exactly — 'researcher at U of M' is a title, not a research area, and 'Marcus knows her from colloquia' is a connection, not a credential."
          ladder:
            - {type: question, text: "Knowing someone from colloquia means seeing them at academic talks. What does that actually tell Marcus about Anya's work?", reveals: 1, cost: 0}
            - {type: question, text: "Notice the chain of trust here: the group trusts Jules, Jules trusts Marcus, Marcus knows Anya 'from colloquia.' At each step, what gets dropped?", reveals: 2, cost: 0}
            - {type: hint, text: "This is what 'laundering a credential' looks like: each retelling hop loses a caveat, and the version that lands at the table sounds more solid than the original ever was.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual: 'Marcus said she's in the biology department, her side project is on urban wildlife color variation, he sat next to her at a colloquium last spring.' That's an answer the group could check. What Jules said isn't.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "If 'researcher at U of M' already feels like the answer in Jules's head, what is she likely to leave out?", reveals: 1, cost: 0}
                  - {type: hint, text: "Uncritical acceptance: when a title functions as evidence in your own head, you naturally share the title and not the specifics, because to you the title already settled it.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Jules is leaning on Marcus's authority over Anya, and on her own retelling of both. How many layers of authority is the group accepting at once here?", reveals: 1, cost: 0}
                  - {type: hint, text: "Authority deference happens at each hop — Anya → Marcus → Jules — and the cumulative deference makes the lightest version feel like the strongest version.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "The cognitive habit (treating titles as answers) and the social chain (laundering through Marcus) reinforce each other: the title feels like enough because someone trusted said so, and what someone trusted said feels like enough because the title is in it.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "It's not really a memory failure — Jules has the phrasings memorized. What she's missing is the specifics that would actually establish Anya as relevant.", reveals: 1, cost: 0}

        inferential_validity:
          role: present
          opening: "Right — 'Marcus said she does this stuff' assumes that whatever Marcus thinks counts as 'this stuff' lines up with what the group is asking about."
          ladder:
            - {type: question, text: "What does 'this stuff' actually mean here? Astrobiology? Squirrel biology? Strange-looking-animal biology?", reveals: 1, cost: 0}
            - {type: hint, text: "The vague phrase 'this stuff' is hiding the gap. If the group asked Marcus to spell it out, he might not be able to — and the chain would visibly stop holding.", reveals: 2, cost: 1}
          has_explanation_depth: false

    # =====================================================================
    # T07 — Maya softens and lets it drop
    # =====================================================================
    t07:
      blank_page:
        opening: "Maya was about to push, then she stopped. Look at what happened to Jules's face right before this turn."
        ladder:
          - {type: nudge, text: "What did Maya say in turn 5? What did she say in turn 7? Are they the same kind of thing?", reveals: 1, cost: 0}
          - {type: question, text: "Why might Maya have stopped pressing? What did she see?", reveals: 2, cost: 0}
          - {type: hint, text: "Maya saw Jules's face tightening — Jules was about to cry. Maya softened on purpose, out of love for Jules. The cost of that softening is what the rest of the scene is about.", reveals: 3, cost: 1}

      by_facet:

        reasoning_completeness:
          role: present
          opening: "Yes — Maya stopped halfway through the question that would have closed the chain, and the chain stays open for the rest of the scene."
          ladder:
            - {type: question, text: "What was Maya's question at t05 going to ask? What would the group have learned if she'd finished it?", reveals: 1, cost: 0}
            - {type: question, text: "Notice Maya isn't dropping the question because she stopped seeing the gap. She's dropping it because she sees Jules. What does that change about how we read this turn?", reveals: 2, cost: 0}
            - {type: hint, text: "This is the friend-protective form of the weakness: not 'I never noticed' but 'I noticed and I chose not to push, because pushing would hurt my friend right now.' That's a real choice with a real cost.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual: 'Marcus is smart, and I still want to know what kind of researcher Anya actually is, can you ask him?' That sentence holds the friendship and the question at the same time.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Did Maya treat 'finish the question' and 'be kind to Jules' as if they were two ends of one slider — like she had to pick?", reveals: 1, cost: 0}
                  - {type: hint, text: "Black-and-white thinking can show up in the moment as 'either I push or I'm kind' — but those aren't actually opposites. The counterfactual sentence above does both at once.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "What was the pressure on Maya in this moment? Was it that the group would think she was wrong, or that her friend was scared?", reveals: 1, cost: 0}
                  - {type: hint, text: "This is group pressure in its friend-protective form — not conformity, not fear of looking foolish, but care for a friend who is visibly hurting. It's still pressure; it's just love-shaped pressure.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "Caring about Jules turned 'finish the question' and 'be kind' into a forced choice in Maya's head — and the social pressure (Jules's fear) made the cognitive shortcut (one or the other) feel like the right call.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "It isn't that Maya never had a real question. The first half of t05 shows she did. The puzzle is what made her drop it.", reveals: 1, cost: 0}

        internal_consistency:
          role: present
          opening: "Right — within one breath, Maya goes from 'how did your brother know' to 'Marcus is smart, it's fine.' That's a position change with no new information added."
          ladder:
            - {type: question, text: "Between t05 and t07, did anyone add anything about Anya, Marcus, or how he knows her?", reveals: 1, cost: 0}
            - {type: question, text: "If the facts didn't change, what changed?", reveals: 2, cost: 0}
            - {type: hint, text: "What changed was Jules's face. Maya's spoken position slid to match the emotional moment, even though the standard she'd just articulated hadn't been met.", reveals: 3, cost: 1}
          has_explanation_depth: false

    # =====================================================================
    # T08 — Cam applies Anya's general phrase to the specific squirrel
    # =====================================================================
    t08:
      blank_page:
        opening: "Cam is doing the same kind of move he did at t04, only now he's pointing the words straight at the squirrel."
        ladder:
          - {type: nudge, text: "What is Cam doing with Anya's exact phrase here?", reveals: 1, cost: 0}
          - {type: question, text: "Anya was talking about populations. Cam is talking about one squirrel. What's the difference?", reveals: 2, cost: 0}
          - {type: hint, text: "Cam has shrunk a general scientific framing onto a single sighting. That's a leap — and notice he doesn't ask 'who is Anya?' the way he asked 'who made the TikTok?' a few minutes ago.", reveals: 3, cost: 1}

      by_facet:

        inferential_validity:
          role: present
          opening: "Yes — 'unusual color morphs in isolated urban populations' is a general framing about whole groups, not a label Cam can stick on one squirrel."
          ladder:
            - {type: question, text: "What's a population? What would it mean for the squirrel to actually be one of these 'morphs'?", reveals: 1, cost: 0}
            - {type: question, text: "What evidence would the group need to move from 'this kind of thing exists in biology' to 'this specific squirrel is one of those things'?", reveals: 2, cost: 0}
            - {type: hint, text: "Anya's phrase names a category that scientists study. Cam is treating naming the category as the same as having identified an example. They are not the same step.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual at t09: if Jules had paused after 'the eyes were wrong' and said 'she said it's the kind of thing they look for, but she didn't say our squirrel is one,' the gap would be visible.", reveals: 4, cost: 2}
          has_explanation_depth: false

        relevance:
          role: tempting_absent
          opening: "It does look like 'the evidence doesn't fit the claim' — Anya's population-level phrase, applied to one squirrel. But there's a deeper question."
          ladder:
            - {type: redirect, text: "We can't actually evaluate whether Anya's framing is relevant until we know what Anya works on. The unaudited credential (source credibility) and the unsupported leap (inferential validity) come first.", routes_to: {facet: inferential_validity}, reveals: 1, cost: 0}
          has_explanation_depth: false

    # =====================================================================
    # T09 — Jules: "nothing else really fits"
    # =====================================================================
    t09:
      blank_page:
        opening: "Jules just answered Cam's earlier question — 'what else could it even be?' — with 'nothing else really fits.' Listen for what's not in the room."
        ladder:
          - {type: nudge, text: "Make a quick list. What other normal explanations for a white squirrel with red eyes have come up in the conversation?", reveals: 1, cost: 0}
          - {type: question, text: "If Jules answered 'nothing else really fits' that quickly, did she actually consider other things?", reveals: 2, cost: 0}
          - {type: hint, text: "Real explanations exist — leucism, founder effect in a small park, environmental stress, an escaped pet. None of them ever entered the conversation. The frame closed before they could.", reveals: 3, cost: 1}

      by_facet:

        inferential_validity:
          role: present
          opening: "Yes — 'nothing else really fits' is a conclusion that requires having considered other things. Jules didn't."
          ladder:
            - {type: question, text: "What's the difference between 'nothing else fits' and 'I haven't thought about anything else'?", reveals: 1, cost: 0}
            - {type: question, text: "In Jules's head, how many options does the question have at this point?", reveals: 2, cost: 0}
            - {type: hint, text: "The question has narrowed in Jules's head to two things: 'aliens, for real' or 'nothing interesting at all.' Because she can't accept option two, option one wins by default — without ever having to compete with anything mundane.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual at t09: if anyone had said 'what about leucism, isn't that just a pigmentation thing?', the binary would have had a third option in the room and the frame would have widened by one.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Why might Jules's brain have collapsed all the possible explanations into just two?", reveals: 1, cost: 0}
                  - {type: hint, text: "Black-and-white thinking: the question gets framed as 'aliens-or-boring,' and because boring isn't bearable to Jules right now, the answer is locked in before it's been thought.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "What's now in the room that wasn't in the room at the start of the scene? Whose voice is now backing the alien answer?", reveals: 1, cost: 0}
                  - {type: hint, text: "Authority deference: now that Anya's voice is in the room, the chosen side of the binary feels sanctioned. Without the credential, the binary would be more obvious as a binary.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "The binary makes the alien side feel chosen rather than assumed; the credentialed voice makes the chosen side feel sanctioned. Either pattern alone would be weaker — together, the chain feels tight without anything having actually closed.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "It isn't really 'wanting the conversation to end.' Jules sounds tired and scared, but she's still building. Look at what's missing from the building.", reveals: 1, cost: 0}

        perspective_engagement:
          role: present
          opening: "Right — the mundane alternatives never showed up. They were excluded before they could be weighed."
          ladder:
            - {type: question, text: "Try generating one boring explanation for a white squirrel with red eyes. Now ask: did anyone in the conversation even mention that?", reveals: 1, cost: 0}
            - {type: question, text: "Why might it be that none of the four kids reaches for an everyday explanation?", reveals: 2, cost: 0}
            - {type: hint, text: "When the frame is set up as 'aliens or nothing,' the boring middle ground — leucism, ordinary pigmentation, founder effect — falls outside the question entirely. It's not rejected; it's never let in.", reveals: 3, cost: 1}
          has_explanation_depth: false

        sufficiency:
          role: tempting_absent
          opening: "It can sound like 'they just need more research.' But the bigger problem isn't quantity — it's that the alternatives aren't even on the table."
          ladder:
            - {type: redirect, text: "More evidence won't help if the only options being considered are 'aliens' and 'nothing.' First the frame has to open up to other possible answers — that's perspective engagement.", routes_to: {facet: perspective_engagement}, reveals: 1, cost: 0}
          has_explanation_depth: false

    # =====================================================================
    # T10 — Maya's drift visible
    # =====================================================================
    t10:
      blank_page:
        opening: "Maya is talking now like the chain has closed. Compare what she says here to what she started saying at t05."
        ladder:
          - {type: nudge, text: "Read t05 and t10 back to back. Are they coming from the same Maya?", reveals: 1, cost: 0}
          - {type: question, text: "At t05, Maya wanted to know what kind of researcher Anya was. Has anyone answered that yet?", reveals: 2, cost: 0}
          - {type: hint, text: "Nothing about Anya was added between t05 and t10 — but Maya is now talking as if the question got answered. Her spoken position has drifted.", reveals: 3, cost: 1}

      by_facet:

        internal_consistency:
          role: present
          opening: "Yes — Maya started by asking who Anya is, and now she's saying Anya counts because she's a grad student. Those don't fit together."
          ladder:
            - {type: question, text: "Compare Maya's standard at t05 ('how did your brother know she was the right person') with her standard at t10 ('if the grad student thinks it, that's worth knowing'). Are they the same standard?", reveals: 1, cost: 0}
            - {type: question, text: "What would Maya have to add for t10 to actually meet the standard she set at t05?", reveals: 2, cost: 0}
            - {type: hint, text: "Maya's earlier standard required knowing who Anya was. Her later standard accepts Anya because she's a grad student. The standard slid down to fit what was already in the room.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual: if Maya had reread her own half-sentence in the notebook before speaking — or even said 'wait, two minutes ago I was asking what kind of researcher she is, I don't want to drop that' — her position would have stayed with the standard she had voiced.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Once Maya softened at t07, what's the cost of circling back to her own earlier question?", reveals: 1, cost: 0}
                  - {type: hint, text: "Once you've moved off a position, your brain quietly starts arguing for the new one. It's confirmation bias pointed inward — at your own most recent words.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Is Jules's fear gone yet? Is the friend-protective pressure that made Maya soften still in the room?", reveals: 1, cost: 0}
                  - {type: hint, text: "Group pressure doesn't end when the moment passes. The same friend-protective pressure that made Maya soften at t07 is now keeping her new position stable — because returning to the question would mean putting Jules back where she was.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: hint, text: "Once Maya chose kindness at t07, her words started to fit that choice instead of fitting the question she'd asked. The social pressure (Jules's fear) and the cognitive habit (defending your last move) reinforce each other.", reveals: 1, cost: 1}
              tempting_absent:
                ladder:
                  - {type: redirect, text: "Maya didn't forget t05 — the half-sentence is right there in her own notebook. Something kept her from going back to it. That something is the load-bearing part.", reveals: 1, cost: 0}

        reasoning_completeness:
          role: present
          opening: "Right — the question Maya started at t05 still hasn't been finished. She's now talking as if it had been."
          ladder:
            - {type: question, text: "What would Maya need to say to actually finish her t05 question now?", reveals: 1, cost: 0}
            - {type: hint, text: "The chain has the same gap it had at t05 — 'how did Marcus know Anya was the right person to call' — but the gap is now invisible because Maya is talking past it instead of toward it.", reveals: 2, cost: 1}
          has_explanation_depth: false

    # =====================================================================
    # T13 — Cam consolidates Anya as the anchor
    # =====================================================================
    t13:
      blank_page:
        opening: "Cam is locking Anya in as the thing the group will lean on next time. Notice what hasn't happened yet."
        ladder:
          - {type: nudge, text: "Across the whole conversation, did anyone ever find out what kind of researcher Anya is?", reveals: 1, cost: 0}
          - {type: question, text: "Cam says 'that grad student thing is real.' Real in what sense?", reveals: 2, cost: 0}
          - {type: hint, text: "Anya's authority is now the anchor for everything tomorrow's meeting will be built on — and that authority was never actually checked.", reveals: 3, cost: 1}

      by_facet:

        source_credibility:
          role: present
          opening: "Yes — Cam is making Anya the load-bearing piece for whatever comes next, and the credential under that piece is still unaudited."
          ladder:
            - {type: question, text: "What does it mean for a source to be 'something to hold onto'? What weight is being placed on Anya here?", reveals: 1, cost: 0}
            - {type: question, text: "If tomorrow's meeting starts with 'so the grad student said,' and nobody asks more about Anya, what does that mean for the chain going forward?", reveals: 2, cost: 0}
            - {type: hint, text: "The credential, never audited, has now become a shared anchor. Every step the group takes from here is built on a piece that nobody checked. That's how laundered credentials become stable beliefs.", reveals: 3, cost: 1}
            - {type: worked_example, text: "From the counterfactual at t04: if Cam had asked 'wait, what does she actually work on though?' anywhere in the scene, this consolidation would not feel earned. He didn't, so it does — to him.", reveals: 4, cost: 2}
          has_explanation_depth: false

# ---------------------------------------------------------------------------
# STRUGGLE CALIBRATION (§2.3.3)
# ---------------------------------------------------------------------------

struggle_calibration:
  by_passage:
    p1:
      pace: standard
      minimum_wrestling: [selected_a_facet, viewed_second_lens]
      productive_duration: moderate

# ---------------------------------------------------------------------------
# CROSS-EPISODE CONTINUITY (§2.3.4)
# ---------------------------------------------------------------------------

assumes_familiar_with:
  - sufficiency
  - source_credibility
  - inferential_validity
  - confirmation_bias

introduces:
  - reasoning_completeness
  - internal_consistency
  - perspective_engagement
  - condition_sensitivity
  - black_and_white_thinking
  - uncritical_acceptance
  - authority_deference
  - group_pressure

# ---------------------------------------------------------------------------
# RESPONSE SPACE — internal scratch for audit
# ---------------------------------------------------------------------------

response_space:
  by_lens:
    logic:
      likely:
        - "Students notice Jules's chain feels confident and treat that as the chain working."
        - "Students see Maya at t05 as 'being negative' rather than as plugging a missing step."
      partial:
        - "Students see the leap at t08 ('that's us, right?') but don't connect it to Cam's missing credential audit."
        - "Students notice Maya's softening but don't notice her position-drift at t10."
      misreading:
        - "Reading the issue as 'sufficiency' (not enough evidence) when the chain has acquired links that don't connect."
        - "Reading Maya's softening as Maya being 'wrong' or 'weak,' missing that she made a friend-protective choice with a real cost."
      blindspot:
        - "Failing to see internal_consistency at t10 — students may not register that Maya's standard slid because nothing visibly contradicts itself; the contradiction lives across turns."

    evidence:
      likely:
        - "Students recognize the TikTok provenance check at t02 as a good move."
        - "Students notice 'researcher at U of M' is thin but accept it because Marcus vouched."
      partial:
        - "Students see that Anya wasn't checked but don't see that the same move Cam just made on the TikTok is what would have caught it."
        - "Students accept the credential because they themselves defer to U of M as a known institution."
      misreading:
        - "Reading Cam's t02 strength as cancelling out Cam's t04 weakness — when in fact the contrast is the whole point."
        - "Reading the issue as 'they need more sources' (source_diversity) rather than 'the one source isn't established.'"
      blindspot:
        - "Not pushing past 'researcher at U of M' because the credential feels self-evidently authoritative to the student too. This is the credentialed-source acceptance the diagnostic specifically targets."

    scope:
      likely:
        - "Students may not engage scope at all — the lens has rich affordance but no character reaches for it."
      partial:
        - "Students notice 'what else could it even be?' is rhetorical but don't generate the alternatives themselves."
      misreading:
        - "Reading the absence of mundane alternatives as 'they haven't researched it yet' rather than 'the frame is excluding them.'"
      blindspot:
        - "Not generating any boring explanations for a white red-eyed squirrel — the frame in the student's head closes the same way Jules's does."
