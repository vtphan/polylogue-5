  - passage_id: p1
    support_id: p1_te_2
    use_when: low_articulation
    lens: logic
    example_text: 'Say your uncle tells you, "Scientists say exercise is good for you, so you should run
      ten miles tomorrow." The first part might be true in general. But the step from "exercise is good
      for you" to "you, specifically, should run ten miles tomorrow" skips over a lot — like whether you''ve
      ever run before. A general statement doesn''t automatically tell you what to do in one specific
      case.

      '
    why_this_counts: 'That''s the same shape as going from Anya''s general phrase about color morphs to
      "our squirrel is one of those." The general thing might be fine; the jump to the specific case is
      where the missing step lives.

      '
    handoff_prompt: 'Look at turn 8 where Cam says "that''s us, right?" — what step between Anya''s general
      phrase and that one specific squirrel didn''t get filled in?

      '
  - passage_id: p1
    support_id: p1_te_3
    use_when: wrong_focus
    lens: scope
    example_text: 'Imagine someone loses their phone and says, "I''ve looked everywhere and I can''t find
      it." Then you ask, "Did you check your backpack?" and they realize they never did. "Everywhere"
      felt complete, but it only meant the places they had already thought of. The backpack was never
      in the list of places they searched.

      '
    why_this_counts: 'That''s the same move as "nothing else really fits." It sounds like all the options
      were checked, but really only the options that came to mind got checked. The others never got a
      chance.

      '
    handoff_prompt: 'Back in turns 4 and 9, what''s the "backpack" — the explanation nobody ever even
      mentioned?

      '
  - passage_id: p1
    support_id: p1_te_4
    use_when: after_check_fail
    lens: evidence
    example_text: 'Think about how you might check one video online before you share it — who made it,
      where the info came from, whether it''s a joke account. Then imagine an adult sends you an article
      the next day and you don''t check any of those things because an adult sent it. The checking move
      is the same move; it just feels weird to do it when a grown-up is the source.

      '
    why_this_counts: 'Checking a source is the same skill whether the source is a TikTok or a grad student.
      The move Cam did on the video in turn 2 would also work on Anya in turns 3, 4, and 13.

      '
    handoff_prompt: 'Pick one of those turns (3, 4, or 13) and try writing the question Cam could have
      asked there.

      '
