  transfer_examples:
  - passage_id: p1
    support_id: p1_te_1
    use_when: cannot_start
    lens: evidence
    example_text: 'Imagine a friend tells you, "My cousin says this new drink is actually really healthy,
      and my cousin works at a hospital." Before you decide, you might want to know: what does the cousin
      actually do at the hospital? Is she a doctor, a nutritionist, or does she work at the front desk?
      "Works at a hospital" sounds like it settles the question, but it doesn''t — the specific job is
      what matters.

      '
    why_this_counts: 'A title ("works at a hospital") is not the same thing as a description of what someone
      actually does. Decisions that rest on the title alone can slip past the real question.

      '
    handoff_prompt: 'Now go back to how Jules describes Anya in turn 3 and turn 6. What''s the "what does
      she actually do" question there?

