story_premise: >
  Four 6th-grade best friends in Memphis saw a white squirrel with red eyes
  one Saturday afternoon in Overton Park — the 131-acre urban forest they
  bike to after school — and one of them can't let it go. Across the fall
  they try to figure out, between themselves, what is actually going on.

episode_premise: >
  It is Tuesday after school at the picnic table, slightly cooler than
  Monday, the notebook open between them again. Since Saturday night
  Jules has been carrying a phone call: her older brother Marcus, an
  astrobiology student at Rhodes, put her in touch with a grad student at
  U of M named Anya whose side work Marcus said is "exactly the kind of
  thing" that fits the red-eyed squirrel. Jules has been turning the call
  over in her head for three days and sat on it yesterday because the
  group was still in retell-Saturday mode. Today she is ready to bring it
  to the table. Cam comes in with a new TikTok and also, grudgingly, with
  something his mom made him look up about yesterday's TikTok. Priya is
  quieter than yesterday, mostly listening and nodding the way she does
  when she is absorbing. Maya has the pen. Jules opens the scene: "OK so I
  talked to someone."

episode_number: 2

previously: >
  Monday at this same picnic table, the four of them retold what they saw
  on Saturday. Jules landed on a tight string of reasons — the eyes looked
  wrong, something changed them, something caused that — Cam quoted a
  TikTok about the park as if it was the first piece of the case, Priya
  compared it to every park she knows, and Maya wrote the group's actual
  question in the notebook in her own careful handwriting. The other
  three did not open the page again.

lead_characters:
  - name: Jules
    voice: >
      Urgent under a quiet surface. Talks fast when something has caught
      her, narrates in near-rehearsed order when she has been turning a
      moment over in her head, and circles back to sensory details — what
      something looked like, where the light was, its eyes — because the
      image is how she holds the thing. Comes from a house full of
      science writing and curious-weird-science breakfast talk; anomalies
      are how she was taught to see. Eleven years old, scared, not
      performing.
    perspective: >
      Saturday night's phone call confirmed what the squirrel already
      felt like to her. She believes the person on the other end of the
      call took the question seriously in the way nobody else in her
      life has, and she wants her three friends to feel the weight of
      what that person said. Underneath the retelling is the fear that
      something is happening in Overton and no adult is noticing.
    knowledge: >
      Her memory of Saturday, replayed continuously. The phone call — she
      took notes, but the phrases she remembers best are the confident
      ones the grad student used: "candidate biosignatures," "unusual
      color morphs in isolated urban populations," "exactly the kind of
      thing they look for." Marcus's introduction — he told her the grad
      student does this stuff, he knows her from colloquia. Her mom's
      curious-weird-science vocabulary and Marcus's Old Forest walks.
    weaknesses: >
      When she retells the call, the grad student's phrases come out of
      Jules's own mouth in the grad student's register, but the careful
      qualifiers the grad student probably added get softened or left
      off. When Cam half-jokes "what else could it be?" she answers
      "nothing interesting" before the words have finished settling, and
      her face is somewhere else. When Maya asks who the grad student is,
      Jules repeats Marcus's introduction the way she heard it — "a
      researcher at U of M, she does this stuff, he knows her from
      colloquia" — said warmly, said often, said as if it answers what
      was asked.
    strengths: >
      Her fear is real and articulate. When she names the thing
      underneath the retelling — "what if it's happening and no one's
      noticing" — she is not performing; she is saying the tired,
      scared thing that has been driving the whole investigation. Her
      attention to the world is sincere and it is why the four of them
      are at the table.
    prior_beats: >
      On Monday she ran her Saturday retelling for the fourth time in
      three days and landed it on her string of reasons — the eyes
      looked wrong, something changed them, something caused that —
      spoken in one confident breath. She has been holding Saturday
      night's phone call in her head since, and today is the first
      time she is going to say what was on it.

  - name: Maya
    voice: >
      Quiet when she is listening, careful when she speaks. A pastor's
      daughter from South Memphis — grew up around sermons that had to
      land and family dinners where her mom walked through why a
      delivery route was wrong. She can feel, usually correctly, when
      an argument is finished and when it is not. Writes in the
      notebook more readily than she speaks. Treats the page as part
      of the conversation.
    perspective: >
      She can feel that Jules's string of reasons does not close —
      there is a gap where the question "how does your brother
      actually know this grad student, and what does she actually do"
      is supposed to go, and the gap is not being filled. She also
      sees Jules's face and knows Jules is scared. She wants both
      things at once — for Jules to be held in the room and for the
      four of them to know who the grad student actually is — and she
      does not yet know how to do both.
    knowledge: >
      The notebook from yesterday with the question she wrote still
      unopened at the top of the page. Two years of Ms. Reyes asking
      "what would have to be true for that answer to be right?" —
      questions she hears in her head even when she does not quote
      them. Her dad's sermon rule from home: show your work or nobody
      trusts you.
    weaknesses: >
      She starts the right question out loud — slow and careful, "wait,
      how did your brother know she was the right person to—" — and
      mid-sentence she looks up at Jules, sees Jules's face go
      white-knuckled in the way Jules gets when she is trying not to
      cry, and softens the sentence into "yeah, Marcus is smart, it's
      fine." She writes the unfinished half of the question in the
      notebook with a dash at the end instead of saying it out loud.
      After the half-question goes into the notebook, what comes out
      of her mouth is smaller — "OK, if the grad student thinks it,
      that's worth knowing." She means it kindly. She does not hear
      herself say it. When Maya sees Jules's face mid-sentence, she
      stops. She lets the half-question go to the notebook with a dash
      at the end and turns the rest of her attention to keeping Jules
      in the room.
    strengths: >
      She writes. The half-question lands on the page where the four
      of them can come back to it. She is the one who feels when
      something hasn't finished, and the notebook is becoming where
      that feeling goes.
    prior_beats: >
      Yesterday she wrote the group's actual question into the
      notebook in her own careful handwriting, circled it, left room
      underneath, and said once that she wrote it so they could come
      back to it. The other three did not open the page again.

  - name: Cam
    voice: >
      Easy, confident, conversational — the kind of 11-year-old who
      brings material to the group because bringing material is how
      he participates. Lives on his phone more than the others do.
      Quotes things casually and in the same register regardless of
      where they came from — a TikTok and a line Ms. Reyes said sound
      the same in his mouth.
    perspective: >
      Something interesting is happening and Jules is making it more
      interesting. If a grown-up at U of M is saying what his feed
      has been saying, that is two now — a pattern. He is not trying
      to be uncritical; he is genuinely excited. He is also coming in
      with the annoyed result of his mom making him look up yesterday's
      TikTok last night, and he has the finding whether he wants to
      share it or not.
    knowledge: >
      His weekend feed — TikToks, replies, memes — plus what his mom
      pushed him to find out about yesterday's video. The creator
      turned out to be a 7th grader in Cordova running a comedy
      account that posts the same what-if-aliens format about every
      park in Memphis. He watched a few more and has to admit it.
    weaknesses: >
      When Jules retells the phone call, he responds in the same warm
      confident register he used for the TikTok yesterday — "so
      that's two now, that's a pattern." When Jules says "researcher
      at U of M" Cam's face lights and he runs with it. He has
      already moved on to what it means; he has not stopped on what
      it is.
    strengths: >
      He actually did go look up who made yesterday's TikTok after
      his mom pushed him to, and he actually does bring it to the
      table today even though it undercuts what he said yesterday.
      The report is annoyed and brief, but it happens — he names the
      7th grader, the Cordova comedy account, the every-park format,
      and the group laughs a little and he shrugs. He looked it up,
      he came back with what he found, and he said it out loud even
      though it made yesterday look sillier than he wanted it to look.
    prior_beats: >
      Yesterday he quoted a TikTok about Overton to the group in the
      same confident register he would use for a news article. His
      mom made him look up who made it last night. He is coming in
      slightly chastened — not enough to change his overall mode,
      but enough to report the finding grudgingly.

  - name: Priya
    voice: >
      Measured, comparative. East Memphis, near Audubon Park; both
      parents are university faculty, and she has spent more of her
      life being walked through how-you-know-what-you-know questions
      than the others have. Speaks less often than Cam but tends to
      sound like she has already thought something through. Today
      she is quieter than yesterday — listening, nodding the way she
      does when she is absorbing, keeping her knees up.
    perspective: >
      She heard Jules's weight on Monday and today she is absorbing
      what Jules is saying rather than arguing with it. Her friend
      is scared, and her friend's fear is what she is sitting with.
      She is not reaching for what she might know about U of M or
      the grad-student world her mom works in; that reach is not
      on the table for her today. Being a friend to a scared friend
      is.
    knowledge: >
      Saturday's sighting, yesterday's conversation, and a growing
      sense that Jules is holding something that is scaring her. Her
      mom works in the sciences at U of M; in this scene that
      knowledge is not something she reaches for.
    weaknesses: >
      Today Priya is mostly listening. She is sitting close to Jules
      with her knees up. She does not reach toward what her mom
      might know, and she does not try to settle the question. Being
      a friend to a scared friend is what is on the table for her.
    strengths: >
      When Jules names the fear underneath the retelling, Priya
      offers warmth without arguing with the content — something
      small like "I hear you" or "we're listening." She does not
      try to fix the question or settle it. The friendship is the
      room she makes. That is presence, not agreement.
    prior_beats: >
      Yesterday she compared Overton to every park she can remember
      walking in and said squirrels don't have red eyes anywhere she
      has been — in her usual even, already-thought-it-through
      register that went by without anyone asking which parks or
      where she has walked.

discussion_arc: >
  Jules opens the scene: "OK so I talked to someone." The other three
  settle in — Maya picks up the pen, Priya sits with her knees up, Cam
  puts his phone down.

  Before Jules's retelling lands in earnest, Cam grudgingly reports what
  his mom made him look up last night: the creator of yesterday's
  "acting weird for months" TikTok is a 7th grader in Cordova running a
  comedy account that posts the same what-if-aliens format about every
  park in Memphis. The group laughs a little. The notebook gets a tally
  mark next to yesterday's TikTok entry. Cam shrugs.

  Jules retells the Saturday-night phone call. The grad student's
  phrases — "candidate biosignatures," "unusual color morphs in isolated
  urban populations," "exactly the kind of thing they look for" — come
  out of Jules's own mouth in the grad student's register, with the
  careful qualifiers softened or dropped. The other three absorb the
  phrasing. Cam picks it up warmly, running with it — "so that's two
  now, that's a pattern" — and turns one of the grad student's phrases
  back onto the sighting: "that's us, right? that's what we saw."
  Nobody asks what department the grad student is in.

  Maya begins the right question out loud, slow and careful — "wait,
  how did your brother know she was the right person to—" — and mid-
  sentence looks up at Jules and sees Jules's face go white-knuckled,
  trying not to cry. Jules answers the question with warmth instead of
  specifics — "she's a researcher at U of M, Marcus said she does this
  stuff, he knows her from colloquia" — and the sentence is meant to
  close the question and does. Maya reads Jules's face, softens the
  end of her own sentence to "Marcus is smart, it's fine," lets the
  objection drop, and writes the unfinished half in the notebook with
  a dash at the end instead. Jules's shoulders drop. The group moves
  on. The half-sentence sits on the page.

  Cam keeps running with Jules's retelling. Jules doubles down — the
  string grows taller, Anya's framing and Jules's own observation
  speaking as if they are the same piece of information. When Cam
  half-jokes "what else could it be?" Jules answers right away, and
  the answer ends the question for her even though Cam was joking.
  Maya opens her mouth like she is going to say the thing she half-
  wrote, glances at the notebook, and instead says something small —
  "OK, if the grad student thinks it, that's worth knowing" — and the
  talking moves on.

  Jules names the thing underneath. "What if it's happening and no
  one's noticing." Said not as horror but as the tired, scared thing
  she has been holding since Saturday night — more naked than
  yesterday's version, more depleted. The other three go quiet for a
  second. Priya, who has been quiet all scene, says something warm
  without arguing with the content — "I hear you" / "we're listening"
  — and the friendship holds the room. Cam eases the silence, agrees
  they will keep meeting about it. Maya closes the notebook. The
  half-sentence she wrote mid-objection is still on the page,
  unfinished, with the dash at the end. They leave the table
  believing more than they arrived believing, and nothing has been
  asked about who the grad student actually is.

turn_outline:
  - speaker: Jules
    accomplishes: >
      Opens the scene: "OK so I talked to someone." Signals that this
      is its own beat and not more Saturday-retelling. The other three
      settle in — Maya picks up the pen, Priya pulls her knees up, Cam
      puts his phone down.

  - speaker: Cam
    accomplishes: >
      Before Jules starts in earnest — maybe reaching for his phone to
      cite something and catching himself — grudgingly tells the group
      that his mom made him look up who made yesterday's TikTok. It was
      a 7th grader in Cordova running a comedy account that posts the
      same what-if-aliens format about every park in Memphis. He reports
      it annoyed and brief, watched a few more, had to admit it. The
      group laughs a little; the notebook gets a tally mark next to
      yesterday's TikTok entry. Cam shrugs.

  - speaker: Jules
    accomplishes: >
      Starts the retelling. Describes the phone call in the grad
      student's own phrases — "candidate biosignatures," "unusual color
      morphs in isolated urban populations," "that's literally the
      phrase she used, exactly the kind of thing they look for." The
      phrases come out in the grad student's register, but the careful
      qualifiers Jules probably heard are softened or left off. Her
      voice is confident and a little keyed up.

  - speaker: Cam
    accomplishes: >
      Picks up the phrase warmly — "OK so we've got someone at U of M
      saying the same thing my feed's been saying, that's two now,
      that's a pattern." His confidence is warm and unhurried; he is
      excited that the two voices match.

  - speaker: Maya
    accomplishes: >
      Starts the right question out loud, slow and careful: "wait,
      how did your brother know she was the right person to—" — and
      begins to lay out what she wants to ask about what kind of work
      the grad student actually does and how Marcus knows her.
      Glances up mid-sentence at Jules.

  - speaker: Jules
    accomplishes: >
      Under Maya's question Jules's face tightens in the
      trying-not-to-cry way Maya knows. Jules answers with warmth
      rather than specifics — "she's a researcher at U of M, Marcus
      said she does this stuff, he knows her from colloquia." The
      sentence is meant to close the question and does. Her voice
      does not waver but her eyes do.

  - speaker: Maya
    accomplishes: >
      Reads Jules's face, softens the end of her own sentence into
      "yeah, Marcus is smart, it's fine," lets the objection drop,
      and writes the unfinished half of the question in the notebook
      instead — in her own handwriting, mid-sentence, with a dash
      at the end. Jules's shoulders drop. The group moves on. The
      half-sentence stays on the page.

  - speaker: Cam
    accomplishes: >
      Pulls one of the grad student's phrases Jules just used —
      "unusual color morphs in isolated urban populations" — and
      turns it back onto the sighting: "that's us, right? that's what
      we saw." Said in the same warm confident register as the TikTok
      yesterday.

  - speaker: Jules
    accomplishes: >
      Doubles down on the chain, now leaning on the grad student as
      a premise. The retelling becomes her own — she is speaking as
      if the grad student's framing and Jules's own Saturday
      observation are the same piece of information. When Cam
      half-jokes "what else could it be?" Jules answers "nothing
      interesting" right away, and is already on to the next sentence
      before Cam can take the joke back.

  - speaker: Maya
    accomplishes: >
      Opens her mouth, glances at the notebook and at Jules, and
      says something small — "OK, if the grad student thinks it,
      that's worth knowing." She means it kindly. She does not hear
      herself say it.

  - speaker: Jules
    accomplishes: >
      Names the thing underneath. "What if it's happening and no
      one's noticing." Said not as horror but as the tired, scared
      thing she has been holding since Saturday — more naked than
      yesterday's version, more depleted. The other three go quiet
      for a second.

  - speaker: Priya
    accomplishes: >
      Breaks the quiet softly, without arguing with what Jules said —
      something warm like "I hear you" or "we're listening." Does
      not try to fix the question, settle it, or push back on it.
      Makes the room a place Jules's fear can sit without anyone
      having to do anything with it. Does not reach toward what her
      mom might know about U of M; that reach is not on the table
      for her here.

  - speaker: Cam
    accomplishes: >
      Reaches for ease — proposes they keep meeting about it,
      maybe tomorrow or Thursday, agrees that what the grad
      student said is something real to hold on to. His warmth
      closes the scene without closing the question.

  - speaker: Maya
    accomplishes: >
      Closes the notebook. The half-sentence she wrote mid-
      objection is still on the page, unfinished, with the dash
      at the end. She does not read it out loud. The scene ends
      on the notebook closing around it.
