scenario_id: strangers-in-the-old-forest-ep-03
story_id: strangers-in-the-old-forest
episode_number: 3

topic: >
  Whether the replies to Cam's online post about the red-eyed squirrels count
  as evidence that the sightings are spreading across Memphis — and whether
  the group should press forward on the alien-ish explanation or try the
  genetics framework Maya half-remembers from science class.

context: >
  Wednesday afternoon at the four friends' usual picnic table in Overton
  Park. Late Tuesday night Cam posted about the red-eyed squirrels on his
  own account; by Wednesday the post is mildly viral within his small
  follower count — a handful of supportive replies, some mocking, a couple
  of curious, and one comment claiming a similar sighting in Stonewall Park
  in Frayser, across town. Cam has been checking his phone all day and he
  thinks he has evidence now. In pieces across the afternoon the kids have
  also absorbed dismissive adult reactions — a *lol, aliens* text from
  someone's older sibling, a *honey it's just squirrels* from someone's mom.
  The feeling that no grown-up is taking the question seriously has landed
  hardest on Jules. Maya has the notebook on the table, and the Monday-Cam
  TikTok and the Sunday-Anya call are both still open questions above the
  line she wrote in episode 1. She surfaces, half-tentatively, what Ms.
  Reyes taught them in the Mendelian genetics unit as a framework that
  might actually apply here.

instructional_goals:
  - >
    Notice when a conclusion about "how common" or "how widespread" something
    is rests on a small, unverified handful of agreements rather than on a
    real count.
  - >
    Notice when the "sources" a person is citing are all downstream of that
    same person's original claim — reactions to a framing, not independent
    observations.
  - >
    Notice when a reader keeps the replies that confirm their view and waves
    away the replies that challenge it, even while appearing to "check the
    comments."
  - >
    Notice the kind of move where someone stops trying to extend a shaky
    reasoning chain and instead names the question the chain never answered,
    then points at a framework that might answer it.

discussion_dynamic: >
  Three positions are in the room and none of them wins. Cam arrives at the
  picnic table already animated by his phone: the post did something, the
  replies agree, a cross-town comment mentions Stonewall Park in Frayser,
  and in Cam's reading that is now "everywhere." He scrolls the supportive
  replies out loud and quotes them twice; he skims past the mocking ones
  with a shrug; he skips the curious-but-skeptical ones entirely; and when
  Maya, reading over his shoulder, reads back a skeptical comment
  suggesting the squirrel might just be an albino one, Cam deflects that
  the commenter "didn't actually look." The audit of the replies is
  happening, but it is running inside Cam's hypothesis, not on it. Jules
  pulls the conversation in a different direction: the adult-dismissal
  pieces from the afternoon have piled up on her, and her tired *what if
  everyone's wrong, what if this is real* lands more as isolation than as
  argument. Maya, holding the notebook, finally looks up from Cam's phone
  and surfaces Ms. Reyes's Mendelian genetics unit — tentatively, as a
  question ("what if this is that kind of thing?") — naming what the
  current chain is missing (a real answer to *what else could cause red
  eyes*) rather than trying to extend Cam's chain. Nobody concedes. Cam
  does not back off "everywhere"; Jules does not let go of the fear; Maya
  does not press her framework on Cam. The only decision the group reaches
  is to meet again tomorrow and try applying the genetics framework; Priya
  closes the scene with a small warm aside to Jules as they pack up, and
  the notebook stays open on the table with Maya's Monday question still
  circled at the top and *Ms. Reyes — recessive?* added beneath it in her
  handwriting.

personas:
  - name: Jules
    perspective: >
      Something is actually happening in Overton and the grown-ups are not
      listening. The dismissive texts and overheards from the afternoon
      land on her as evidence that she is alone with the question. She is
      not arguing for aliens so much as she is tired, scared, and waiting
      for one of her three friends to agree that this is real.
    knowledge: >
      Her brother Marcus put her in touch with Anya and Anya talked to her
      over the weekend about unusual color morphs in isolated urban
      populations. Her mother writes curious-weird-science pieces for kids'
      magazines and Jules has grown up believing anomalies matter. Red eyes
      look wrong to her, and everything her family's worldview supplies
      points at *something changed them.*
    weaknesses: >
      When something looks strange, her mind slides from "looks strange" to
      "something out of the ordinary changed it," and once that track is
      laid she defends it as a single thing against a single opposite
      thing: it's either the interesting explanation or the *boring*
      explanation, and giving up the interesting one feels like giving up
      on the whole question. In this episode the adult dismissals have
      bruised her enough that she is not really making arguments; she is
      voicing the fear. She will not push in this scene, but the weight of
      her fear makes it harder for the others to push either.
    strengths: >
      She is genuinely curious and she is the reason the investigation is
      still happening at all. She says things nobody else is willing to say
      out loud, and in this episode her one unguarded line ("what if
      everyone's wrong, what if this is real") makes space for Maya's
      tentative alternative to land without being waved off.

  - name: Maya
    perspective: >
      Something about Cam's "everywhere now" reading doesn't fit, but she
      can't quite put her finger on it in his language. What she can do is
      remember that Ms. Reyes spent a whole unit on genes and alleles and
      *told them they were supposed to apply it to real life.* Red eyes
      might be that kind of thing — something the genetics unit actually
      has an answer to. She offers the idea more than asserts it; she half-
      expects Cam to wave her off, and half-expects Jules not to hear her
      over her own fear.
    knowledge: >
      She carries the notebook. She has Monday's question circled at the
      top of the open page — the *what else could explain red eyes*
      question that went half-written at the end of episode 2. She remembers
      a chunk of what Ms. Reyes taught in the Mendelian unit (recessive
      traits, two copies, *it's supposed to apply to real life*), well
      enough to name the framework even though she cannot yet reconstruct
      the chain.
    weaknesses: >
      She argues on instinct. She can feel when something is off in Cam's
      read but she cannot yet say the reason out loud in a way that would
      land. She also holds back when Jules is visibly scared — softening
      how hard she pushes on Cam so the room doesn't tip Jules further
      into isolation.
    strengths: >
      Her move in this scene is the one new thing: instead of trying to
      extend Cam's chain or argue it down in his own terms, she names what
      the chain hasn't answered — *what else could cause red eyes?* — and
      points at their own science class as a framework that could answer
      it. She offers it as a question. She writes *Ms. Reyes — recessive?*
      in the notebook under Monday's circled question. She does not lay
      out a full chain, but she has, for the first time, noticed that the
      chain needs a piece it doesn't have.

  - name: Cam
    perspective: >
      The post went up last night and it did something. People replied.
      Someone in Frayser said they saw one in Stonewall Park. That is, in
      Cam's reading, a second sighting across town, which makes this a
      citywide thing, which means they were right. He thinks he has
      evidence now and he wants the group to feel what he's feeling when
      he scrolls. He is excited in a way he was not in episodes 1 or 2,
      and the excitement is doing most of the driving.
    knowledge: >
      He has spent the afternoon on his phone — the post, the replies,
      the notifications. He quotes the supportive replies by heart. He has
      the Frayser comment on screen when he sits down.
    weaknesses: >
      He treats "a claim exists in the world and I've seen it" as the
      same thing as "the claim is verified." A single three-word reply
      from one stranger about a completely different park, sitting next
      to a handful of *yeah same* comments, rolls up in his head into
      *this is happening everywhere now* — he doesn't count the replies
      he's reading, he doesn't ask what the Frayser commenter means by
      "saw one," and the leap from a small pile of agreements to a
      citywide pattern feels like a conclusion to him rather than a
      guess. At the same time, without noticing he's doing it, he reads
      the replies as if they were sources — even though they are all
      reactions to his own post, not independent observations — and he
      reads them the way he wishes them to read: the supportive ones
      get quoted twice, the mocking ones get waved off as mean, and the
      curious-skeptical ones he just scrolls past. When Maya reads back
      a skeptical comment that suggests the squirrel could just be an
      albino one, he swats it away by saying the commenter "didn't
      actually look" and keeps scrolling. The whole audit runs inside
      his conclusion rather than on it.
    strengths: >
      He did something — he put the hypothesis out into the world and
      watched what came back, which is a real thing to have done for a
      6th grader. He is not being dishonest with his friends. The same
      willingness to take a public swing at a question is what will,
      later in the story, make him willing to audit his own post. Not
      visible yet in this episode.

  - name: Priya
    perspective: >
      She is here, listening carefully, and mostly hanging back. Something
      about Cam's read bothers her too but she is not pressing on it in
      this scene. She hears Jules get quieter as the afternoon goes on
      and she is paying attention to Jules more than to the phone.
    knowledge: >
      Her mom is a biologist at the University of Memphis and Priya has
      absorbed some of that by osmosis — enough to be reliably the kid
      in the group who can tell a claim from a guess. She has not brought
      that knowledge to this specific conversation yet.
    weaknesses: >
      Not engineered in this episode. She is usually the kid who knows
      what she is talking about, and that reliability is part of why the
      others don't push on her when she does make a weak move. Here she
      is quietly reliable.
    strengths: >
      She reads the room. When the conversation is about to tip Jules
      further into isolation, she notices. The episode's closing move —
      a small warm aside to Jules as they pack up, *we'll figure it out
      tomorrow* or similar — is hers. It is not reasoning; it is the kind
      of social attention the group runs on.

target_facets:
  - facet_id: sufficiency
    target_quality: weak
    primary_lens: evidence
    also_visible_through: [scope, logic]
    designed_explanation:
      cognitive_pattern: overgeneralization
      social_dynamic: null
      interaction_note: null
      cognitive_signal: >
        Cam shows the group the post and the replies — he scrolls
        through them on his phone — and lands on the Frayser comment
        hard: *look, this kid in Frayser said they saw one in Stonewall
        Park, that's a completely different park across town, and these
        other people are saying yeah same, I'm telling you this is
        everywhere now*. The leap is visible in scale: from one
        ambiguous cross-town reply and a handful of *yeah same*
        comments to *everywhere*. He does not count the replies. He
        does not ask what "saw one" means in the Frayser reply — the
        commenter said it in three words and Cam is treating it like a
        verified sighting. The ep-1 TikTok move and the ep-2 Anya move
        repeat their shape here: a claim exists in the world, Cam has
        encountered it, therefore it counts. The quantity problem and
        the verification problem are both invisible to him.
      social_signal: null
    carrier_persona: Cam
    signal_mechanism: >
      Cam's leap in scale is the episode's central weak move. He arrives
      with the post open on his phone and within two or three turns he
      has rolled a small pile of replies — one three-word Frayser comment
      about Stonewall Park, a handful of *yeah same* agreements, some
      mocking, some curious — into the word *everywhere*. In the dialog
      this lands as Cam literally saying "this is everywhere now" or
      "it's spreading" on the strength of a single cross-town reply he
      treats as a verified second sighting. He never counts the replies;
      he never asks what the Frayser commenter means by "saw one"; the
      leap from the pile to the pattern *feels* like a conclusion to him.
      The carrier's voice is scroll-excited, certain, and unaware that
      any quantity or verification question is in play. The turn outline
      puts this moment at the front of the scene so that the rest of the
      episode has to react to it.

  - facet_id: source_diversity
    target_quality: weak
    primary_lens: evidence
    also_visible_through: [scope]
    designed_explanation:
      cognitive_pattern: confirmation_bias
      social_dynamic: null
      interaction_note: >
        overgeneralization and confirmation_bias chain here:
        Cam's confirmation bias is what makes the handful of replies
        *feel* like corroboration, and the overgeneralization is what
        he does with that feeling. Separately, they would be smaller
        moves. Together, they turn a mildly-engaged post into Cam's
        *second credentialed source*, with social media standing in
        for credential. The two patterns reinforce the same move from
        different angles and the reader should feel both in the same
        scroll.
      cognitive_signal: >
        Cam reads the replies as *sources* when they are all downstream
        of his own post — people responding to *his* framing, not
        independent observations. He quotes the supportive replies
        twice, waves past the mocking ones with a shrug (*those people
        are just being mean*), and skips the curious-but-skeptical
        replies entirely. When Maya, reading over his shoulder, catches
        one skeptical comment — *are you sure it wasn't just an albino
        one? my cousin saw one in the zoo once* — and reads it back to
        him, Cam says *yeah but that person didn't actually look, they
        just want to argue* and keeps scrolling. The audit of the
        replies is happening, but it is running *inside* his hypothesis,
        not on it. He wants the post to be right and the replies he
        quotes are the ones that make it look right.
      social_signal: null
    carrier_persona: Cam
    signal_mechanism: >
      The second strand of Cam's weakness runs in the same scroll as
      the first. He is treating the replies as if they were independent
      observations from strangers — "look, all these people are saying
      the same thing" — when they are all reactions to his own post's
      framing and therefore carry no independence at all. His reading
      of the replies is visibly selective: he quotes the supportive ones
      twice, dismisses the mocking ones as people just being mean, and
      skips the curious-but-skeptical ones without reading them aloud.
      Maya, reading the phone over his shoulder, pulls up a skeptical
      comment that proposes an ordinary alternative (the squirrel could
      just be an albino one) and reads it back to him; Cam deflects on
      the commenter's character ("they didn't actually look, they just
      want to argue") and keeps scrolling. The audit of the replies is
      happening, but it is running inside Cam's conclusion rather than
      on it, and the dialog should make that shape unmistakable without
      naming it.

target_strengths:
  - facet_id: inferential_validity
    primary_lens: logic
    also_visible_through: []
    carrier_persona: Maya
    signal_mechanism: >
      Maya's move is a proto-strength, not a full inflection — the real
      inflection lands in episode 5. Partway through Cam's everywhere-now
      read, Maya looks up from the notebook and says something like
      *wait — Ms. Reyes said something about recessive traits? Remember,
      she did that whole unit, she said we were supposed to be able to
      apply it to real life? What if this is that kind of thing?* She
      does not lay out a chain; she does not even say "genetics" with
      confidence. What she names is a missing piece in the current
      chain — the question of *what else could cause red eyes?* — and
      she points at an alternative framework (their own 6th-grade
      science class) that could answer it. The move is tentative: she
      phrases it as a question, she offers it to Cam more than asserts
      it over him, and she half-expects him to wave it away. He does
      not. Jules does not either. The group tentatively agrees to try
      tomorrow. In the dialog this looks like Maya briefly withdrawing
      her attention from Cam's phone, looking down at the notebook,
      saying the teacher's name, and then writing *Ms. Reyes —
      recessive?* beneath the Monday question still circled at the top
      of the open page. The strength is that, for the first time in
      the investigation, Maya has named what the chain is missing
      rather than trying to extend what's already there.
    contrastive_note: >
      In earlier episodes Maya's instinct surfaced as a soft *that doesn't
      sound right* without a pointer at what else could be true. Here,
      for the first time, she names a missing piece in the reasoning and
      points at a framework that might fill it — a chain-aware move
      rather than an instinct-shaped hesitation.

discussion_arc: >
  Cam arrives at the picnic table already scrolling, excited, and within
  two turns has the whole group looking at his phone. He reads the
  supportive replies out loud and lands hard on the Frayser comment as if
  it is a second verified sighting across town; his framing jumps from the
  pile of replies to "this is everywhere now" without anyone counting the
  replies or asking what the Frayser comment actually says. Maya, holding
  the notebook and reading over his shoulder, pulls up a skeptical reply
  that proposes an albino-squirrel alternative and reads it back to him;
  Cam waves it off on the commenter's character and keeps scrolling.
  Adult-dismissal pieces from the afternoon come up — the *lol, aliens*
  text, the *honey it's just squirrels* overheard — and Jules gets quiet.
  She says, not loudly, *what if everyone's wrong, what if this is real*,
  and the line sits in the air. Maya, after a beat, looks up from the
  notebook and tentatively surfaces Ms. Reyes's genetics unit — offered as
  a question, not asserted — and names what Cam's chain hasn't answered:
  *what else could cause red eyes?* The other three pause. Nobody
  concedes. Cam does not let go of "everywhere"; Jules does not let go
  of the fear; Maya does not press her framework. The only decision is
  that they will try applying the genetics framework tomorrow. The scene
  closes with Priya saying something small and warm to Jules as they pack
  up, and Maya adding *Ms. Reyes — recessive?* under her Monday question
  in the notebook. The notebook stays open on the table.

turn_outline:
  - speaker: Cam
    accomplishes: >
      Pulls up the post on his phone the moment the others sit down,
      excited, and starts reading supportive replies out loud — *look,
      this one says "same thing in Stonewall Park," this one in Frayser,
      that's a whole different part of town.*
  - speaker: Cam
    accomplishes: >
      In the same breath, rolls the pile of replies into a pattern —
      *I'm telling you this is everywhere now, it's not just our park,
      it's spreading* — without counting how many replies there are or
      asking what the Frayser person actually saw.
  - speaker: Priya
    accomplishes: >
      Quietly registers that something about Cam's read is fast, without
      pressing on it yet — asks, mildly, how many of the replies are
      actually from people who say they saw one.
  - speaker: Maya
    accomplishes: >
      Reading the phone over Cam's shoulder, catches a skeptical comment
      — *are you sure it wasn't just an albino one? my cousin saw one
      in the zoo* — and reads it back to him.
  - speaker: Cam
    accomplishes: >
      Waves the skeptical comment off on the commenter's character —
      *they didn't actually look, they just want to argue* — and keeps
      scrolling to the supportive replies, reading one of them a second
      time.
  - speaker: Jules
    accomplishes: >
      Mentions, without heat, that her mom's boyfriend's kid texted her
      *lol, aliens in the park, sure*, and that she heard somebody's mom
      say *honey it's just squirrels* when she walked past after lunch.
  - speaker: Jules
    accomplishes: >
      Says, not loudly, more tired than arguing — *but what if everyone's
      wrong, what if this is real* — and lets the line sit. Doesn't
      defend it.
  - speaker: Priya
    accomplishes: >
      Looks at Jules without cutting in on her, just making room. Doesn't
      fill the silence.
  - speaker: Cam
    accomplishes: >
      Tries to steer the conversation back toward the post — *see, that's
      what I'm saying, this is more than us now* — still treating the
      replies as if they were other people's independent sightings.
  - speaker: Maya
    accomplishes: >
      Looks up from Cam's phone down to the notebook on the table; pauses;
      asks, tentatively, *wait — Ms. Reyes did that whole genetics thing,
      right? About recessive traits? She said we were supposed to be able
      to use it for real life.*
  - speaker: Maya
    accomplishes: >
      Names the question the conversation hasn't answered — *what else
      could make a squirrel's eyes look like that?* — and offers it to
      Cam more than asserts it over him. Adds, half to herself, *maybe
      it's that kind of thing.*
  - speaker: Cam
    accomplishes: >
      Doesn't agree, doesn't argue; shrugs, says something like *I mean
      — maybe, I don't know* without letting go of the post. Glances at
      his phone again.
  - speaker: Jules
    accomplishes: >
      Nods at Maya. Doesn't concede the alien framing either; just says
      *okay, tomorrow, we can try*, quieter than she started.
  - speaker: Priya
    accomplishes: >
      Closes the scene with a small warm aside to Jules as they pack up —
      *we'll figure it out tomorrow, Jules* — while Maya writes *Ms.
      Reyes — recessive?* beneath the Monday question still circled at
      the top of the open notebook.
