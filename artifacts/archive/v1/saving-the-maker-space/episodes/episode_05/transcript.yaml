personas:
- name: Dev
  perspective: 'Wants to deliver the proposal cleanly and earn the principal''s acceptance. Believes in
    the shared-room compromise and has rehearsed the new framing, but knows under pressure he tends to
    reach for the line that feels good in his mouth.

    '
- name: Mira
  perspective: 'Wants the principal to accept the proposal and is focused entirely on what would actually
    persuade her, not on what would feel best to say. Has agreed with Dev beforehand on the table-tap
    as a quiet cue if he slips.

    '
- name: Ren
  perspective: 'Wants to be ready if the principal asks for a number. Has spent part of the last two weeks
    preparing for exactly that. Believes her job is to back up the proposal, not to deliver it.

    '
- name: Sam
  perspective: 'Wants the kids on the Tuesday schedule to be heard. Does not want to take the floor unless
    the moment requires it. Believes that her job in this meeting is to land one specific sentence at
    the right time.

    '
- name: Theo
  perspective: 'Has done his work earlier in the season and is in the meeting as a steadying presence.
    Does not need to speak during the proposal itself. Holds the season''s honest assessment for the walk
    back.

    '
