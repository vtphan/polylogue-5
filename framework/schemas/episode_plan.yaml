# Schema: Episode Plan
# Describes the structure of
#   artifacts/{story_id}/episodes/episode_{NN}/episode.yaml
# Source: framework/docs/story-pipeline-revision.md Part 13.5

schema:
  root:
    type: object
    fields:
      scenario_id:
        type: string
        required: true
        description: Kebab-case identifier (e.g., "ocean-pollution-solutions").

      story_id:
        type: string
        required: true
        description: >
          Kebab-case identifier of the parent story. Required: every
          episode belongs to exactly one story. The story design doc
          lives at framework/docs/stories/{story_id}.md.

      episode_number:
        type: integer
        required: true
        description: >
          1-indexed position of this episode within its parent story's
          arc. Must match the episode_number in the per-episode draft at
          framework/docs/stories/{story_id}/episode_{NN}.md.

      topic:
        type: string
        required: true
        description: The discussion topic in plain language.

      context:
        type: string
        required: true
        description: PBL connection — what unit, what driving question, why this topic.

      instructional_goals:
        type: list
        required: true
        description: What the teacher wants students to practice.
        items:
          type: string

      discussion_dynamic:
        type: string
        required: true
        description: >
          Narrative description of the discussion's interpersonal
          mechanics: starting positions, shift mechanism, ending condition,
          and interaction quality. Authored by planning_agent from the
          per-episode draft frontmatter and the story design doc.
          Used to derive discussion_arc and turn_outline. Stripped before
          passing to the dialog writer.

      personas:
        type: list
        required: true
        description: 2-5 discussion participants.
        constraints:
          min_length: 2
          max_length: 5
        items:
          type: object
          fields:
            name:
              type: string
              required: true
            perspective:
              type: string
              required: true
              description: What this persona believes/values and why.
            knowledge:
              type: string
              required: true
              description: What they've researched or experienced.
            weaknesses:
              type: string
              required: true
              description: >
                What they'll get wrong and why — phrased as character traits,
                NOT as facet names or framework terminology.
            strengths:
              type: string
              required: true
              description: >
                What they'll get right and why — phrased as character traits,
                NOT as facet names or framework terminology. Barrier-safe
                translation of the relevant target_strengths signal mechanisms
                (the persona named as carrier of one or more target_strengths
                must have non-trivial content here).

      target_facets:
        type: list
        required: true
        description: Which facets are targeted for weakness (hidden layer).
        items:
          type: object
          fields:
            facet_id:
              type: string
              required: true
              description: From facet inventory.
            target_quality:
              type: string
              required: true
              description: >
                Always "weak" — target_facets carries designed weaknesses only.
                Designed strengths live in the parallel top-level target_strengths
                field, which has no target_quality (it is implicitly strong).
              constraints:
                enum: [weak]
            primary_lens:
              type: string
              required: true
              description: The lens most likely to reveal this facet.
              constraints:
                enum: [logic, evidence, scope]
            also_visible_through:
              type: list
              required: true
              description: Other lenses that can reveal it (from facet inventory).
              items:
                type: string
                constraints:
                  enum: [logic, evidence, scope]
            designed_explanation:
              type: object
              required: true
              description: The intended cognitive-social account.
              fields:
                cognitive_pattern:
                  type: string
                  required: false
                  description: From cognitive patterns list. Null if none.
                social_dynamic:
                  type: string
                  required: false
                  description: From social dynamics list. Null if none.
                interaction_note:
                  type: string
                  required: false
                  description: How the cognitive and social forces interact, if both present.
                cognitive_signal:
                  type: string
                  required: false
                  description: >
                    REQUIRED iff cognitive_pattern is non-null. One sentence
                    describing the behavioral trace of the cognitive pattern
                    in the dialog. Copied verbatim from the per-episode
                    draft frontmatter (the operator's authoring artifact).
                    Validated by validate_schema.py via a conditional rule
                    (Part 4D).
                social_signal:
                  type: string
                  required: false
                  description: >
                    REQUIRED iff social_dynamic is non-null. One sentence
                    describing the move/response turn-pair shape that
                    realizes the social dynamic. Must reference at least
                    two turns. Copied verbatim from the per-episode draft
                    frontmatter. Validated by validate_schema.py via a
                    conditional rule (Part 4D).
            carrier_persona:
              type: string
              required: true
              description: Which persona primarily manifests this facet weakness.
            signal_mechanism:
              type: string
              required: true
              description: >
                Narrative of how this facet weakness concretely manifests
                in the discussion. Authored by planning_agent from the
                draft's cognitive_signal/social_signal/interaction_note and
                the carrier's voice in the story design doc. Used to derive
                the carrier persona's weaknesses field and the relevant
                turn_outline accomplishes fields.

      target_strengths:
        type: list
        required: true
        description: >
          Which facets are targeted for strength (hidden layer). Doctrinally
          required: every scenario must engineer at least one moment of
          genuine sound reasoning so the deficit-only explanatory variables
          can be applied contrastively. Symmetric with target_facets, minus
          designed_explanation — strengths are explained contrastively against
          the deficit vocabulary, not assigned positive cognitive/social
          variables (the framework deliberately has no positive explanatory
          variables; see system-evaluation-20260406.md suggestion E).
        constraints:
          min_length: 1
        items:
          type: object
          fields:
            facet_id:
              type: string
              required: true
              description: From facet inventory.
            primary_lens:
              type: string
              required: true
              description: The lens most likely to reveal this strength.
              constraints:
                enum: [logic, evidence, scope]
            also_visible_through:
              type: list
              required: true
              description: Other lenses that can reveal it (from facet inventory).
              items:
                type: string
                constraints:
                  enum: [logic, evidence, scope]
            carrier_persona:
              type: string
              required: true
              description: Which persona primarily manifests this facet strength.
            signal_mechanism:
              type: string
              required: true
              description: >
                Narrative of how this facet strength concretely manifests
                in the discussion. Authored by planning_agent from the
                draft's optional strength note and the carrier's voice in
                the story design doc. Used to derive the carrier persona's
                strengths field and the relevant turn_outline accomplishes
                fields.
            contrastive_note:
              type: string
              required: false
              description: >
                Optional: how this strength would be explained contrastively
                using the deficit vocabulary (e.g., "here the group checked
                their sources, where in earlier scenarios they would have
                accepted the first thing they read"). Provides a hint for the
                evaluator's contrastive write-up.

      discussion_arc:
        type: string
        required: true
        description: >
          Narrative description of how the discussion unfolds — where tension
          rises, where it resolves or fails to resolve.

      turn_outline:
        type: list
        required: true
        description: Ordered sequence of turns.
        constraints:
          min_length: 10
          max_length: 14
        items:
          type: object
          fields:
            speaker:
              type: string
              required: true
              description: Persona name.
            accomplishes:
              type: string
              required: true
              description: >
                What this turn does for the discussion — phrased in natural
                language, no facet names, no framework terminology.
