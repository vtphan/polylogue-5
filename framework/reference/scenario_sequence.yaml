# Scenario Sequence — Machine-Readable Plan
#
# Mirrors framework/docs/scenario-sequence.md (Anchor + Breadth, Structure C).
# The prose document remains the design rationale; this file is the form the
# pipeline and apps can read. Keep them in sync — if you change the planned
# sequence, update both.
#
# This file is framework-level: it lists the planned facets, cognitive
# patterns, and social dynamics per scenario position, which is universal
# design content. Application-specific hints (e.g. Lens lifeline pool,
# vocabulary toggles) live under per-app blocks (`lens:`) on each entry.
# Other applications can add their own blocks alongside.
#
# Used by:
#   - apps/lens/pipeline/commands/configure_session.md (derives toggles
#     from scenario position rather than asking the operator each time)
#   - framework/pipeline/commands/check_coverage.md (verifies generated
#     artifacts cover what the plan promised)
#
# Coverage targets are tracked at the bottom of this file. The check_coverage
# command compares the union of facets/patterns/dynamics across present
# scenarios against these targets.

sequence:
  - position: 1
    scenario_id: ocean-vs-deforestation
    title: Ocean vs Deforestation
    role: anchor_introduction
    difficulty: accessible
    target_facets: [relevance, perspective_engagement]
    anchors: [relevance, perspective_engagement]
    cognitive_patterns: [overgeneralization, confirmation_bias]
    social_dynamics: [conflict_avoidance, group_pressure]
    primary_lenses: [evidence, scope]
    lens:
      # Earliest session — vocabulary off, generous lifelines, students
      # are still building intuition through Diagnose/Discuss.
      lifeline_pool: 5
      show_cognitive_patterns: false
      show_social_dynamics: false

  - position: 2
    scenario_id: school-garden-water
    title: School Garden Water
    role: new_core_facets
    difficulty: accessible
    target_facets: [sufficiency, perspective_engagement]
    anchors: [perspective_engagement]
    cognitive_patterns: [false_certainty, egocentric_thinking]
    social_dynamics: [authority_deference]
    primary_lenses: [evidence, scope]
    lens:
      lifeline_pool: 5
      show_cognitive_patterns: false
      show_social_dynamics: false

  - position: 3
    scenario_id: recycling-program
    title: Recycling Program
    role: new_core_facets
    difficulty: moderate
    target_facets: [source_credibility, inferential_validity]
    anchors: []
    cognitive_patterns: [uncritical_acceptance, false_cause]
    social_dynamics: [authority_deference]
    primary_lenses: [evidence, logic]
    lens:
      # Mid-sequence: introduce cognitive-pattern vocabulary now that
      # students have seen weak-reasoning shapes twice.
      lifeline_pool: 4
      show_cognitive_patterns: true
      show_social_dynamics: false

  - position: 4
    scenario_id: climate-poster-claims
    title: Climate Poster Claims
    role: anchor_return
    difficulty: moderate_challenging
    target_facets: [relevance, condition_sensitivity]
    anchors: [relevance]
    cognitive_patterns: [overgeneralization, false_certainty]
    social_dynamics: [group_pressure]
    primary_lenses: [evidence, scope]
    lens:
      lifeline_pool: 4
      show_cognitive_patterns: true
      show_social_dynamics: true

  - position: 5
    scenario_id: field-trip-proposal
    title: Field Trip Proposal
    role: anchor_return
    difficulty: moderate_challenging
    target_facets: [perspective_engagement, consequence_consideration]
    anchors: [perspective_engagement]
    cognitive_patterns: [tunnel_vision, black_and_white_thinking]
    social_dynamics: [conflict_avoidance]
    primary_lenses: [scope]
    lens:
      # Final session: full vocabulary on, tighter lifeline budget.
      lifeline_pool: 3
      show_cognitive_patterns: true
      show_social_dynamics: true

# Coverage targets — what the sequence as a whole promises to cover.
# /check_coverage compares generated scenarios against this.
coverage_targets:
  facets:
    # Core tier — all 5 must be covered
    - source_credibility
    - relevance
    - sufficiency
    - inferential_validity
    - perspective_engagement
    # Extend tier — partial coverage by design (see scenario-sequence.md)
    - condition_sensitivity
    - consequence_consideration
  cognitive_patterns:
    - confirmation_bias
    - tunnel_vision
    - overgeneralization
    - false_cause
    - uncritical_acceptance
    - black_and_white_thinking
    - egocentric_thinking
    - false_certainty
  social_dynamics:
    - group_pressure
    - conflict_avoidance
    - authority_deference

# Facets intentionally NOT in coverage_targets (documented in
# scenario-sequence.md "Coverage Gaps"): source_diversity,
# reasoning_completeness, internal_consistency.
intentionally_excluded:
  facets:
    - source_diversity
    - reasoning_completeness
    - internal_consistency
