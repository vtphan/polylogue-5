story_id: strangers-in-the-old-forest
episode_number: 1
scenario_id: strangers-in-the-old-forest-ep-01

probes:
  facet:
    by_turn:
      t02:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Jules connects her ideas here?"
        options:
          - text: "She builds a chain of 'so, so, so' — but every link is still resting on just one sighting."
            routes_to: {facet: sufficiency, role: present}
          - text: "Each 'so' is a little jump in reasoning that the one sighting doesn't actually prove."
            routes_to: {facet: inferential_validity, role: present}
          - text: "She sounds really sure because the image in her head is so vivid — but sure-sounding isn't the same as having enough."
            routes_to: {facet: sufficiency, role: present}
          - text: "The problem is that she hasn't looked at a bunch of different kinds of sources yet."
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t03:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Cam brings in the TikTok?"
        options:
          - text: "He says 'a TikTok said' without telling us who made it or why to trust them."
            routes_to: {facet: source_credibility, role: present}
          - text: "He quotes the TikTok the same way someone might quote a teacher or a news article."
            routes_to: {facet: source_credibility, role: present}
          - text: "The real issue is that Cam only mentioned one video — he should have brought in more kinds of sources."
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t04:
        trigger: inactivity_or_manual
        question: "What is Maya doing here that's different from what the others are doing?"
        options:
          - text: "She writes down the question they're actually trying to answer, so the group can come back to it."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "She's slowing the group down to pin the question before they keep piling on answers."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "She's listening to all sides before deciding, which means she's weighing different viewpoints."
            routes_to: {facet: perspective_engagement, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t05:
        trigger: inactivity_or_manual
        question: "What are you noticing about Priya's sentence here?"
        options:
          - text: "She starts with 'anywhere I've been' and ends up talking like it's true everywhere."
            routes_to: {facet: condition_sensitivity, role: present}
          - text: "She drops out the parks she actually walks — Audubon, her greenway — and her conclusion sounds bigger than her evidence."
            routes_to: {facet: condition_sensitivity, role: present}
          - text: "She's overgeneralizing — jumping from a few parks to all squirrels."
            routes_to: {facet: overgeneralization, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t06:
        trigger: inactivity_or_manual
        question: "What stands out about how Jules responds to Priya?"
        options:
          - text: "She hears Priya as proof and builds her chain even taller on the same one sighting."
            routes_to: {facet: sufficiency, role: present}
          - text: "She leaps from 'not normal anywhere else' to 'something in the park changed it' without a step in between."
            routes_to: {facet: inferential_validity, role: present}
          - text: "The issue is she hasn't heard from anyone who disagrees — she's missing other viewpoints."
            routes_to: {facet: perspective_engagement, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t07:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Cam uses the video's comments?"
        options:
          - text: "He treats strangers' comments in a video as more evidence — without asking who any of them are."
            routes_to: {facet: source_credibility, role: present}
          - text: "'I saw one too, I saw one too' lands like proof, but nobody has checked where these people are commenting from."
            routes_to: {facet: source_credibility, role: present}
          - text: "The problem is he's relying on only one video instead of lots of different ones."
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t08:
        trigger: inactivity_or_manual
        question: "What is Maya trying to do here?"
        options:
          - text: "She's trying to pull the group back to the question she wrote down."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "She's asking everyone to pin down what they actually mean before they answer."
            routes_to: {facet: reasoning_completeness, role: present}
          - text: "She's making sure both sides of the argument get heard equally."
            routes_to: {facet: perspective_engagement, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t09:
        trigger: inactivity_or_manual
        question: "What stands out about how Priya answers Maya?"
        options:
          - text: "She says 'it has to be an Overton thing' — but her evidence is still just the parks she walked."
            routes_to: {facet: condition_sensitivity, role: present}
          - text: "Instead of opening Maya's question, she makes her earlier sentence even more certain."
            routes_to: {facet: condition_sensitivity, role: present}
          - text: "She's drawing a big conclusion about Overton from only a few visits to other parks."
            routes_to: {facet: overgeneralization, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t10:
        trigger: inactivity_or_manual
        question: "What are you noticing about how Jules closes her chain?"
        options:
          - text: "She says 'something in this park' is changing them — still based on one Saturday afternoon."
            routes_to: {facet: sufficiency, role: present}
          - text: "Each step in her chain is a leap the one sighting doesn't support."
            routes_to: {facet: inferential_validity, role: present}
          - text: "She sounds sure because Priya agreed — but two people agreeing isn't the same as more evidence."
            routes_to: {facet: sufficiency, role: present}
          - text: "The issue is that Jules only cares about her own viewpoint and ignores others."
            routes_to: {facet: perspective_engagement, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

      t11:
        trigger: inactivity_or_manual
        question: "What stands out about Cam offering to pull the video up?"
        options:
          - text: "He treats watching the video again as a way to check it — but he still hasn't asked who made it."
            routes_to: {facet: source_credibility, role: present}
          - text: "The video is still a working source for him, and nobody has checked its creator."
            routes_to: {facet: source_credibility, role: present}
          - text: "The problem is that he should be showing them more videos, not just this one."
            routes_to: {facet: source_diversity, role: tempting_absent}
          - text: "I'm not sure what I'm noticing"
            routes_to: {blank_page: true}

  explanation:
    by_turn_facet:
      t02.sufficiency:
        question: "Why do you think Jules's chain keeps growing even though her evidence is still one sighting?"
        options:
          - text: "The image of the red eyes is so vivid in her head that it feels like proof on its own."
            routes_to: {explanatory_variable: cognitive, pattern_ref: false_cause}
          - text: "She's sure because she feels sure — the strong feeling stands in for a second piece of evidence."
            routes_to: {explanatory_variable: cognitive, pattern_ref: false_cause}
          - text: "Her friends are making her say it — the group is pressuring her."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "Both the vivid image in her head AND the warm agreement of her friends push the chain forward at the same time."
            routes_to: {explanatory_variable: interaction}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t03.source_credibility:
        question: "Why do you think Cam cites the TikTok without mentioning who made it?"
        options:
          - text: "For him, things that show up in his feed all arrive with about the same weight — he hasn't built the habit of asking 'who made this?'"
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "He accepted the video when he watched it, and now he's just relaying it the way he accepted it."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "He's afraid the group will laugh at him if he admits he doesn't know who made it."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t06.sufficiency:
        question: "Why does Jules double down instead of pausing when Priya speaks?"
        options:
          - text: "She hears Priya's sentence as agreeing with her — so it feels like proof, even though Priya's talking about different parks."
            routes_to: {explanatory_variable: cognitive, pattern_ref: false_cause}
          - text: "The vividness of Saturday is still doing the work — agreement adds fuel to something the image already made feel true."
            routes_to: {explanatory_variable: cognitive, pattern_ref: false_cause}
          - text: "Priya forced her to agree by being louder."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t07.source_credibility:
        question: "Why do you think Cam treats the comments as more evidence?"
        options:
          - text: "Comments in his feed look the same as the video — he hasn't built the habit of checking any of them."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "'I saw one too' sounds like witnesses, and witnesses feel like proof, even when he doesn't know who they are."
            routes_to: {explanatory_variable: cognitive, pattern_ref: uncritical_acceptance}
          - text: "He's just being polite — he knows better but doesn't want to argue."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t04.reasoning_completeness:
        question: "Why do you think Maya writing the question matters so much?"
        options:
          - text: "The room's momentum is running past Maya's page — three voices pull the table forward and the page gets left behind."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Without Maya's move, the group would keep piling on answers to a question nobody has named — the table's forward pull is what makes her page load-bearing."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Both what Maya does AND the way the room's energy passes over it combine to make this moment load-bearing."
            routes_to: {explanatory_variable: interaction}
          - text: "Maya is afraid to push harder — she's holding back because she doesn't want to disagree with her friends."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t08.reasoning_completeness:
        question: "Why does Maya's second try not land?"
        options:
          - text: "The group's momentum — Jules's urgency, Cam's citing, Priya's comparing — carries the table right past her question."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Both her gentle way of asking AND the room's forward pull combine so the page doesn't get opened."
            routes_to: {explanatory_variable: interaction}
          - text: "Maya doesn't really understand the question herself — that's why she doesn't push."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "The others actively disagree with her question."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

      t10.sufficiency:
        question: "Why does Jules's chain close on a group-sized conclusion when the evidence hasn't grown?"
        options:
          - text: "Jules hears Priya's agreement as fresh weight — it feels like her chain just got supported, even though no new sighting came in."
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: "Priya's sentence lines up with what Jules already believes, so Jules treats it as proof and pushes the chain one more step."
            routes_to: {explanatory_variable: cognitive, pattern_ref: confirmation_bias}
          - text: "Two compatible voices at the table feel like a group conclusion — nobody has the habit of pausing to check the base."
            routes_to: {explanatory_variable: social, dynamic_ref: group_pressure}
          - text: "Both things at once — Jules hears agreement as proof AND the room lets the chain close because no one pushes back."
            routes_to: {explanatory_variable: interaction}
          - text: "Priya is forcing Jules to agree with her."
            routes_to: {explanatory_variable: tempting_absent}
          - text: "I'm not sure why"
            routes_to: {explanatory_variable: tempting_absent}

interventions:
  by_turn:
    t02:
      blank_page:
        opening: "Jules just ran a little chain out loud — notice the string of 'so' words."
        ladder:
          - {type: nudge, text: "Try reading Jules's sentence again — how many times does she say 'so'?", reveals: 1, cost: 0}
          - {type: question, text: "Each 'so' is a step. What evidence is each step resting on?", reveals: 2, cost: 0}
          - {type: hint, text: "Count the observations underneath her chain. She's seen the squirrel how many times?", reveals: 3, cost: 1}
      by_facet:
        sufficiency:
          role: present
          opening: "You noticed that Jules is building a lot on one Saturday afternoon."
          ladder:
            - {type: question, text: "How many times have the four of them seen this squirrel?", reveals: 1, cost: 0}
            - {type: question, text: "Jules says 'you don't just get a red-eyed white squirrel for no reason.' Is one sighting enough to say that?", reveals: 2, cost: 0}
            - {type: hint, text: "Watch how the chain grows at the top (something changed it, something caused that) while the bottom stays the same one sighting.", reveals: 3, cost: 1}
            - {type: worked_example, text: "Picture Jules saying it this way instead: 'we only saw it once, so maybe I'm wrong about part of this.' Naming the one-sighting base out loud is what would show the gap.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Jules's retelling is a picture she can see clearly in her head. Does a vivid picture count as a second piece of evidence?", reveals: 1, cost: 0}
                  - {type: hint, text: "The red eyes looked wrong, so to her it feels like a cause must exist. That's the pattern — surface similarity doing the work of proof.", reveals: 2, cost: 1}
                  - {type: worked_example, text: "It's the false-cause move: 'eyes looked wrong' → 'something changed it' → 'something caused that,' with the vividness of the image filling in for the missing link.", reveals: 3, cost: 2}
              social:
                ladder:
                  - {type: question, text: "Are any of the others actually pressuring Jules here, or is she running on her own engine?", reveals: 1, cost: 0}
                  - {type: hint, text: "Nobody is making Jules talk — but the warm agreement at the table lets the chain keep growing without anyone checking it.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What's happening inside Jules's head AND what's happening at the table at the same time?", reveals: 1, cost: 0}
                  - {type: hint, text: "The vivid Saturday picture is doing its work in her head; the warm, unchallenged table lets that chain come out in public without getting checked.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "Try picking one — cognitive or social — and read her sentence again to see which one feels truer.", reveals: 1, cost: 0}

        inferential_validity:
          role: present
          opening: "You noticed the jumps between each 'so' in Jules's chain."
          ladder:
            - {type: question, text: "Between 'eyes looked wrong' and 'something changed it,' what's missing?", reveals: 1, cost: 0}
            - {type: question, text: "If you trusted the first step completely, would that get you all the way to the last step?", reveals: 2, cost: 0}
            - {type: hint, text: "Each 'so' is a leap that needs its own evidence. Watch where the sentence goes faster than the evidence does.", reveals: 3, cost: 1}
          has_explanation_depth: false

        source_diversity:
          role: tempting_absent
          opening: "It's tempting to say Jules needs more sources — but here the base isn't sources, it's one sighting."
          ladder:
            - {type: redirect, text: "The gap in this turn is about how much a single observation can carry, not about the variety of sources. Look again at how many times the squirrel has been seen.", routes_to: {facet: sufficiency}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t03:
      blank_page:
        opening: "Cam just brought something in from outside Saturday — notice where it came from."
        ladder:
          - {type: nudge, text: "Read Cam's turn again. What does he say about who made the TikTok?", reveals: 1, cost: 0}
          - {type: question, text: "If a friend said 'someone said the squirrels are acting weird for months,' what would you want to ask next?", reveals: 2, cost: 0}
          - {type: hint, text: "Cam cites the video the way people cite a teacher or a news article. The missing question is 'who made this?'", reveals: 3, cost: 1}
      by_facet:
        source_credibility:
          role: present
          opening: "You noticed Cam cites the TikTok without saying who made it."
          ladder:
            - {type: question, text: "What would you want to know about the person who made that TikTok?", reveals: 1, cost: 0}
            - {type: question, text: "'Months, dude' — does saying it with confidence change how much we should trust it?", reveals: 2, cost: 0}
            - {type: hint, text: "A TikTok and a news article can both show up on a phone. That doesn't make them equal sources.", reveals: 3, cost: 1}
            - {type: worked_example, text: "Picture Cam saying it this way: 'a TikTok this weekend — I don't know who made it, but they said the squirrels have been acting weird for months.' Naming the missing attribution out loud would tilt the move toward a check instead of a citation.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "In Cam's feed, a TikTok, a meme, and a news clip all look about the same size. What habit is he missing?", reveals: 1, cost: 0}
                  - {type: hint, text: "He accepted the video when he watched it and is relaying it at the same weight. That's uncritical acceptance — no check on the creator, no check on why to trust it.", reveals: 2, cost: 1}
                  - {type: worked_example, text: "The move is: watched → accepted → relayed. The missing rung is 'asked who made it' — and that rung never happens.", reveals: 3, cost: 2}
              social:
                ladder:
                  - {type: question, text: "Is anyone at the table pushing Cam to share this? Or is he just offering it?", reveals: 1, cost: 0}
                  - {type: hint, text: "No one is pressuring him. The table is warm and curious — the group simply hasn't built the habit of asking 'who made this' together yet.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What in Cam's head AND what in the table's shared habits let the TikTok sit there unchallenged?", reveals: 1, cost: 0}
                  - {type: hint, text: "Cam doesn't ask who made it, and the friends don't have the habit of asking either. The two combine so the claim stays on the table.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "Try picking one — does this feel more like something in Cam's head, or something in the group's habits?", reveals: 1, cost: 0}

        source_diversity:
          role: tempting_absent
          opening: "It's tempting to say Cam needs more videos — but the issue in this turn is one step earlier."
          ladder:
            - {type: redirect, text: "Even five more TikToks wouldn't fix this move if none of them are checked. The missing question is 'who made this one?' not 'how many are there?'", routes_to: {facet: source_credibility}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t04:
      blank_page:
        opening: "Maya just did something the others didn't — notice what she's doing with the notebook."
        ladder:
          - {type: nudge, text: "Read Maya's three sentences. What does she actually write?", reveals: 1, cost: 0}
          - {type: question, text: "Why would she write the question down instead of just answering it?", reveals: 2, cost: 0}
          - {type: hint, text: "Jules is retelling. Cam is citing. Priya is comparing. Maya is doing a fourth thing — pinning down what the group is trying to answer.", reveals: 3, cost: 1}
      by_facet:
        reasoning_completeness:
          role: present
          opening: "You noticed Maya is doing something different from the other three."
          ladder:
            - {type: question, text: "What does Maya put on the page? In her words, not yours.", reveals: 1, cost: 0}
            - {type: question, text: "Jules, Cam, and Priya are all giving answers. What is Maya doing first, before answering?", reveals: 2, cost: 0}
            - {type: hint, text: "Writing the question and circling it is a logic-of-the-investigation move — 'what are we actually trying to figure out?' — so the group can come back to it.", reveals: 3, cost: 1}
            - {type: worked_example, text: "A weaker version of Maya would feel the gap and say nothing. A pushier version would grab the room. This Maya does the load-bearing move — naming the question and leaving room — but doesn't yet insist the group return to it.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              social:
                ladder:
                  - {type: question, text: "Watch what happens right after Maya writes the question. Does anyone engage with the page?", reveals: 1, cost: 0}
                  - {type: hint, text: "The room's momentum — Jules's urgency, Cam's weekend video, Priya's parks — passes right over the page. Nobody pushes back on Maya; nobody opens it either.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What Maya does AND what the room does together — how do the two relate?", reveals: 1, cost: 0}
                  - {type: hint, text: "Maya's move is load-bearing; the room's warm forward pull is structural. Together they make the moment that the scene does not reward the most useful move anyone makes.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "It's tempting to locate this in Maya's head — but the collapse sits in the room, not in her. Try reading the turn watching what the table does with the page.", reveals: 1, cost: 0}

        perspective_engagement:
          role: tempting_absent
          opening: "It's tempting to frame Maya as weighing different views — but that's not quite what she's doing here."
          ladder:
            - {type: redirect, text: "Nobody at the table has voiced an opposing view yet. Maya isn't weighing perspectives — she's naming the question itself so the group can come back to it. That's reasoning completeness, not perspective engagement.", routes_to: {facet: reasoning_completeness}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t05:
      blank_page:
        opening: "Priya's sentence sounds small but does something big — watch where it starts and where it ends."
        ladder:
          - {type: nudge, text: "Read Priya's first sentence again. Notice the phrase 'anywhere I've been.'", reveals: 1, cost: 0}
          - {type: question, text: "Priya lists Audubon and her greenway. Is that the same as 'anywhere'?", reveals: 2, cost: 0}
          - {type: hint, text: "The sentence starts inside the parks she actually walks and ends sounding like a fact about squirrels in general. The parks drop out between the clauses.", reveals: 3, cost: 1}
      by_facet:
        condition_sensitivity:
          role: present
          opening: "You noticed that Priya's 'anywhere I've been' quietly turns into 'anywhere.'"
          ladder:
            - {type: question, text: "Which parks has Priya actually walked?", reveals: 1, cost: 0}
            - {type: question, text: "Does her sentence stay inside those parks, or step outside them by the end?", reveals: 2, cost: 0}
            - {type: hint, text: "'Anywhere I've been' becomes 'I've never seen that' — the conditions of her walks drop out between one clause and the next.", reveals: 3, cost: 1}
            - {type: worked_example, text: "Picture Priya saying it this way: 'squirrels don't have red eyes at Audubon or the greenway by my house, at least on the walks I've done.' Keeping the conditions attached keeps the sentence honest.", reveals: 4, cost: 2}
          has_explanation_depth: false

        overgeneralization:
          role: tempting_absent
          opening: "It's tempting to call this overgeneralization — small sample, big claim. But there's a cleaner read."
          ladder:
            - {type: redirect, text: "Priya isn't jumping from 'lots of data' to 'even more data.' She's dropping the conditions of her walks — east Memphis, family walks, specific paths — out of her conclusion. The weakness is about the conditions that narrowed her sample, not the size of it.", routes_to: {facet: condition_sensitivity}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t06:
      blank_page:
        opening: "Jules hears Priya and builds higher — notice what the new floor of her chain is."
        ladder:
          - {type: nudge, text: "Read Jules's second sentence. What does she add that wasn't there at t02?", reveals: 1, cost: 0}
          - {type: question, text: "Does Priya's comparison actually give Jules new evidence, or just agreement?", reveals: 2, cost: 0}
          - {type: hint, text: "The chain is taller now — 'something's doing it here, something in the park, something changed it' — but the base is still one Saturday sighting.", reveals: 3, cost: 1}
      by_facet:
        sufficiency:
          role: present
          opening: "You noticed that Jules's chain grows but her evidence doesn't."
          ladder:
            - {type: question, text: "Between t02 and t06, how many new sightings have they actually had?", reveals: 1, cost: 0}
            - {type: question, text: "Jules takes Priya's sentence as proof and pushes one step further. What got added: evidence, or confidence?", reveals: 2, cost: 0}
            - {type: hint, text: "The chain gets wider at the top. The base stays one observation. Agreement is not the same as a second data point.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If Jules said 'we only saw it once, so maybe I'm wrong about part of this' at t02, Priya's agreement at t05 wouldn't land as confirmation — the gap would already be visible.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Jules hears Priya as agreeing with her chain. Why does that feel like proof?", reveals: 1, cost: 0}
                  - {type: hint, text: "Confirmation bias is sneaking in — she hears Priya's sentence as supporting what she already thinks, so she pushes the chain harder instead of checking it.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Is Priya actually pressuring Jules, or is Jules using Priya's words on her own?", reveals: 1, cost: 0}
                  - {type: hint, text: "Priya isn't pushing. The warmth of the table — three voices each pulling in a compatible direction — is enough to feel like momentum.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What's happening in Jules's head AND at the table that lets the chain keep growing?", reveals: 1, cost: 0}
                  - {type: hint, text: "In Jules's head, the vivid image keeps doing its work. At the table, three compatible voices feel like shared momentum. Together the chain climbs without anyone checking the base.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "Try one lens at a time — which feels truer, something in Jules's head or something about how the group is moving together?", reveals: 1, cost: 0}

        inferential_validity:
          role: present
          opening: "You noticed the leap between 'not normal anywhere else' and 'something changed it.'"
          ladder:
            - {type: question, text: "Even if Priya's sentence were completely true, would it prove 'something in the park changed it'?", reveals: 1, cost: 0}
            - {type: question, text: "What would need to be between those two ideas for the leap to hold?", reveals: 2, cost: 0}
            - {type: hint, text: "'Not normal anywhere else' could mean a hundred different things. Jules picks one — something in the park is doing it — and skips straight to it.", reveals: 3, cost: 1}
          has_explanation_depth: false

        perspective_engagement:
          role: tempting_absent
          opening: "It's tempting to say the problem is nobody pushes back — but this turn is really about the evidence gap, not missing viewpoints."
          ladder:
            - {type: redirect, text: "Perspective engagement is about dismissing or ignoring a view that's been raised. Here no one has voiced 'maybe nothing is going on' — the issue is that Jules's chain grows without more observations underneath it.", routes_to: {facet: sufficiency}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t07:
      blank_page:
        opening: "Cam is going back to the same video for more — notice what he pulls out this time."
        ladder:
          - {type: nudge, text: "Read Cam's turn. What is he quoting from this time?", reveals: 1, cost: 0}
          - {type: question, text: "If we don't know who made the video, what do we know about the commenters?", reveals: 2, cost: 0}
          - {type: hint, text: "He treats the comments like witnesses — 'I saw one too, I saw one too.' But nobody has checked who those people are.", reveals: 3, cost: 1}
      by_facet:
        source_credibility:
          role: present
          opening: "You noticed Cam is using strangers' comments as more evidence."
          ladder:
            - {type: question, text: "Who are the people saying 'I saw one too'?", reveals: 1, cost: 0}
            - {type: question, text: "If the video's creator hasn't been checked, can its comments be checked either?", reveals: 2, cost: 0}
            - {type: hint, text: "The comments sit at the same register as the uncredited video. Both are anonymous; both are being treated as evidence.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If Cam said 'I don't know who these commenters are either,' the same missing question — who made this? — would come up again, and the group could notice it together.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "Why does a bunch of 'I saw one too' comments feel like proof to Cam?", reveals: 1, cost: 0}
                  - {type: hint, text: "Lots of voices saying the same thing feels like witnesses. That's uncritical acceptance — the repetition does the work that a check on who's speaking should do.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Is the table asking Cam for more? Or is he offering more on his own?", reveals: 1, cost: 0}
                  - {type: hint, text: "Nobody's pushing — but because no one pushes back either, the comments slot in as more bricks in the case.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What in Cam's head AND what in the group together lets 'I saw one too' count as evidence?", reveals: 1, cost: 0}
                  - {type: hint, text: "Cam treats repetition as witnesses; the table doesn't have the habit of asking 'who are these commenters?' The two combine so the comments sit at full weight.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "Try each one — is this more about what Cam thinks, or about what the table does together?", reveals: 1, cost: 0}

        source_diversity:
          role: tempting_absent
          opening: "It's tempting to say Cam needs other sources, not more from the same one — but that's one step past the real issue."
          ladder:
            - {type: redirect, text: "The problem isn't that Cam is only using one video. It's that the video itself has no check on who made it, and the comments have no check on who wrote them. Source credibility comes first.", routes_to: {facet: source_credibility}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t08:
      blank_page:
        opening: "Maya tries once more — notice what she's asking the group to do."
        ladder:
          - {type: nudge, text: "Read Maya's two sentences. What is she pointing back to?", reveals: 1, cost: 0}
          - {type: question, text: "Why might Maya ask 'what do we actually mean' instead of answering?", reveals: 2, cost: 0}
          - {type: hint, text: "She's trying, gently, to bring the group back to the question she wrote at t04 — to open the page before the group keeps piling on answers.", reveals: 3, cost: 1}
      by_facet:
        reasoning_completeness:
          role: present
          opening: "You noticed Maya is trying to pull the group back to her question."
          ladder:
            - {type: question, text: "What would it look like if the others actually engaged with what Maya wrote?", reveals: 1, cost: 0}
            - {type: question, text: "Maya asks once and doesn't insist. Watch what the room does right after she speaks.", reveals: 2, cost: 0}
            - {type: hint, text: "Priya answers by folding in another park comparison; the room's momentum carries right through Maya's gentle pause. The move is real; the room doesn't open.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If Maya pressed one more turn — holding the room on 'what are we trying to figure out?' until somebody answered the page — the strength she named at t04 would land structurally instead of collapsing.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              social:
                ladder:
                  - {type: question, text: "Watch what happens the moment after Maya asks. Who answers? Do they answer her, or swerve?", reveals: 1, cost: 0}
                  - {type: hint, text: "Priya answers by folding in another park comparison instead of opening the page. The room's forward momentum — three compatible voices — carries right through Maya's gentle pause.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What Maya does AND what the room does together — why does the question stay unopened?", reveals: 1, cost: 0}
                  - {type: hint, text: "Maya asks gently; the room pulls forward. Both pieces have to be there for the page to close the way it does. Neither alone would do it.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "It's tempting to locate this in Maya's head — but the collapse sits in the room's momentum, not in her. Try reading again watching what the table does with her question.", reveals: 1, cost: 0}

        perspective_engagement:
          role: tempting_absent
          opening: "It's tempting to read Maya as making sure everyone's heard — but she's doing something more basic."
          ladder:
            - {type: redirect, text: "Maya isn't balancing different viewpoints. She's asking the group to name the question they're answering before the answers keep coming. That's reasoning completeness.", routes_to: {facet: reasoning_completeness}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t09:
      blank_page:
        opening: "Priya answers Maya, but notice what she answers with."
        ladder:
          - {type: nudge, text: "Read Priya's two sentences. Is she opening Maya's question or closing it?", reveals: 1, cost: 0}
          - {type: question, text: "'It has to be an Overton thing' — what sample of parks is that resting on?", reveals: 2, cost: 0}
          - {type: hint, text: "She hardens her earlier observation into a conclusion about Overton. The walking-conditions base doesn't change; the claim gets stronger anyway.", reveals: 3, cost: 1}
      by_facet:
        condition_sensitivity:
          role: present
          opening: "You noticed Priya's claim gets sharper but her evidence doesn't."
          ladder:
            - {type: question, text: "Which parks is Priya's 'Overton thing' conclusion resting on?", reveals: 1, cost: 0}
            - {type: question, text: "Between 'I haven't seen it anywhere' and 'it has to be an Overton thing' — what silent step makes that possible?", reveals: 2, cost: 0}
            - {type: hint, text: "The conditions of her walking — east Memphis, family walks, specific paths — keep doing silent work. The sentence sounds like a fact about Overton; the evidence is still only her walks.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If Priya said 'on the walks I've done, I haven't seen it — so maybe Overton is different, or maybe the places I walk are,' the conditions would stay attached and Jules couldn't pick this up as more weight for her chain.", reveals: 4, cost: 2}
          has_explanation_depth: false

        overgeneralization:
          role: tempting_absent
          opening: "Again, 'too little data' looks like the answer here — but it's the conditions, not the count."
          ladder:
            - {type: redirect, text: "Priya isn't generalizing from too few visits. She's letting the conditions of those visits drop out of her conclusion. Even a hundred more family walks through east Memphis wouldn't fix that slide.", routes_to: {facet: condition_sensitivity}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t10:
      blank_page:
        opening: "Jules closes the chain — notice what she's treating as shared now."
        ladder:
          - {type: nudge, text: "Read Jules's two sentences. What's she agreeing with Priya about?", reveals: 1, cost: 0}
          - {type: question, text: "The framing is now 'it's this park, something in this park.' What's it based on?", reveals: 2, cost: 0}
          - {type: hint, text: "The Overton-specific framing becomes the something-changed-them framing, now shared across two voices and felt as a group conclusion.", reveals: 3, cost: 1}
      by_facet:
        sufficiency:
          role: present
          opening: "You noticed that Jules's chain closes on a group-sized conclusion with no new observations."
          ladder:
            - {type: question, text: "Between t02 and t10, how much has the evidence actually grown?", reveals: 1, cost: 0}
            - {type: question, text: "Priya's agreement isn't a second sighting. So what is 'the whole point' actually resting on?", reveals: 2, cost: 0}
            - {type: hint, text: "The chain is now shared across two voices — but shared doesn't mean supported. The base is still one squirrel, one afternoon.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If any voice at the table paused here and said 'wait — we're saying 'this park' changed them, but we've only seen it once,' the group conclusion wouldn't close the way it does.", reveals: 4, cost: 2}
          has_explanation_depth: true
          explanation:
            by_explanatory_variable:
              cognitive:
                ladder:
                  - {type: question, text: "What is Jules doing with Priya's sentence in her head?", reveals: 1, cost: 0}
                  - {type: hint, text: "She treats Priya's agreement as fresh weight — confirmation bias. The chain climbs one more step because it feels supported, not because it is.", reveals: 2, cost: 1}
              social:
                ladder:
                  - {type: question, text: "Notice how fast the chain becomes a shared 'the whole point.' Is anyone pushing back?", reveals: 1, cost: 0}
                  - {type: hint, text: "No one pushes back. Two compatible voices create the feeling of a group conclusion, even though the evidence hasn't grown.", reveals: 2, cost: 1}
              interaction:
                ladder:
                  - {type: question, text: "What's happening in Jules's head AND in the group together at this moment?", reveals: 1, cost: 0}
                  - {type: hint, text: "Jules hears agreement as proof; the room lets the chain close because nobody has the habit of pausing it. Both together are what makes this feel like a conclusion.", reveals: 2, cost: 1}
              tempting_absent:
                ladder:
                  - {type: nudge, text: "Try one lens at a time — what's changing in Jules, and what's changing at the table?", reveals: 1, cost: 0}

        inferential_validity:
          role: present
          opening: "You noticed the chain is now closing on a causal claim with no new steps under it."
          ladder:
            - {type: question, text: "From 'it's this park' to 'something in this park changing them' — what's the missing step?", reveals: 1, cost: 0}
            - {type: question, text: "If you trusted every earlier step, does that last step automatically follow?", reveals: 2, cost: 0}
            - {type: hint, text: "Each 'so' is a leap. At t10 the leaps are stacked on top of each other and the last one is said with the most confidence.", reveals: 3, cost: 1}
          has_explanation_depth: false

        perspective_engagement:
          role: tempting_absent
          opening: "It's tempting to say Jules is ignoring other views — but there are no other views in the room yet."
          ladder:
            - {type: redirect, text: "No one has voiced 'maybe nothing is going on' or 'maybe it was just one strange squirrel.' The gap here is that the evidence hasn't grown, not that a competing view was pushed aside.", routes_to: {facet: sufficiency}, reveals: 1, cost: 0}
          has_explanation_depth: false

    t11:
      blank_page:
        opening: "Cam wants to pull the video up — notice what he's treating as a check."
        ladder:
          - {type: nudge, text: "Cam says 'let me pull the video up — we should watch it together.' What is watching doing for him here?", reveals: 1, cost: 0}
          - {type: question, text: "If nobody has asked who made the video, does watching it again answer that question?", reveals: 2, cost: 0}
          - {type: hint, text: "Watching feels like verification. But the missing question — who made this? — doesn't get answered by watching more of it.", reveals: 3, cost: 1}
      by_facet:
        source_credibility:
          role: present
          opening: "You noticed Cam is still treating the video as a working source."
          ladder:
            - {type: question, text: "What would 'checking' this video actually look like?", reveals: 1, cost: 0}
            - {type: question, text: "Does 'we should watch it together' get closer to answering 'who made it?'", reveals: 2, cost: 0}
            - {type: hint, text: "Watching is not checking. Checking means asking who the creator is, what they've posted before, and why their claim about Overton squirrels should be trusted.", reveals: 3, cost: 1}
            - {type: worked_example, text: "If Cam said 'let me look up who made it before we watch,' the source question would be back on the table. Watching together without asking slides the video another step toward being treated as settled.", reveals: 4, cost: 2}
          has_explanation_depth: false

        source_diversity:
          role: tempting_absent
          opening: "It's tempting to say the fix is to find other videos — but the same question would apply to them."
          ladder:
            - {type: redirect, text: "Even if Cam pulled up three more videos, none of them would be checked either if he doesn't ask who made them. Source credibility is the cleaner read here.", routes_to: {facet: source_credibility}, reveals: 1, cost: 0}
          has_explanation_depth: false

struggle_calibration:
  by_passage:
    p1:
      pace: standard
      minimum_wrestling:
        - selected_a_facet
        - viewed_turn_for_15s
      productive_duration: moderate

introduces:
  - sufficiency
  - source_credibility
  - condition_sensitivity
  - reasoning_completeness
  - inferential_validity
  - false_cause
  - uncritical_acceptance

assumes_familiar_with: []

response_space:
  by_lens:
    evidence:
      likely: >
        Students will land on sufficiency at t02/t06/t10 (Jules's chain on one
        sighting) and on source_credibility at t03/t07/t11 (the uncredited
        TikTok). These are the two strongest, most visible weaknesses in the
        passage and both use concrete cues — "so, so, so" and "a TikTok said"
        — that a sixth grader can point to.
      partial: >
        Students may feel the chain at t02 as "she's making a big leap" without
        yet naming it as a sufficiency problem. The intervention cell treats
        that as a partial landing on sufficiency and walks from the size of
        the base to the height of the chain.
      misreading: >
        The most tempting misread is source_diversity — "Cam should have more
        videos." The redirect rung at t03/t07/t11 names why that's one step
        past the real issue and routes back to source_credibility.
      blindspot: >
        Students may miss that "we should watch it together" at t11 is still
        the same uncritical-acceptance move. The blank-page ladder names
        "watching is not checking" as the crux.
    logic:
      likely: >
        The clearest logic landing is reasoning_completeness at t04/t08 —
        Maya writing the question and trying once to pull the group back.
        Students tend to feel that Maya is doing something different even
        before they can name it.
      partial: >
        inferential_validity at t02/t06/t10 — "the 'so' doesn't really follow"
        — is the natural partial landing. The cells are present-role with
        shorter ladders because the sufficiency cell carries the explanatory
        depth for Jules's chain.
      misreading: >
        Reading Maya as "weighing different perspectives" is the most common
        misread; the tempting_absent cell on perspective_engagement at t04/t08
        redirects to reasoning_completeness. A second misread is locating the
        strength-collapse in Maya's head (cognitive pattern) rather than in
        the room's momentum — the explanation depth at t04/t08 intentionally
        omits a cognitive branch, because ground truth records no cognitive
        pattern operating on this facet; probes route that misread to
        tempting_absent so the redirect lands on the social/interaction branches.
      blindspot: >
        Students may not see the strength-collapse at t08 — that Maya's
        gentleness and the room's momentum together leave the page closed.
        The explanation depth at t08 holds both halves.
    scope:
      likely: >
        condition_sensitivity at t05 ("anywhere I've been") and t09 ("has to
        be an Overton thing") is the primary scope landing. The cue — the
        shift between clauses — is concrete and quotable.
      partial: >
        Students may name t05 as "she hasn't checked enough parks." The
        overgeneralization tempting-absent cell redirects: it's the
        conditions, not the count.
      misreading: >
        Calling Priya's move overgeneralization is the cleanest misread.
        Both t05 and t09 tempting-absent cells explicitly redirect to
        condition_sensitivity and explain why.
      blindspot: >
        Students may miss that Priya's t09 answer to Maya is also a scope
        move — it deflects the reasoning_completeness moment by folding
        the parks back in. The ladder at t09 holds that dual role.
