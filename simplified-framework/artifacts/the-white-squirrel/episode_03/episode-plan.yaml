story_id: the-white-squirrel
episode_id: episode_03
title: The Walk

episode_goal: >
  Land the real answer without handing it to the kids. Leela catches Ms.
  Reyes after class; Ms. Reyes refuses to explain and only nudges — have
  you looked at the whole park, are the squirrels you saw one big group?
  The three map their sightings and realize they have always walked the
  south side of Overton Park. They walk the north side. No red-eyed
  squirrels there. Leela names the highway cutoff — the forest patch is
  separated from the rest of Memphis by highways. They go back to Sophie
  with plainer questions. Sophie admits mammals aren't her field but
  agrees that a rare mutation in a small cut-off group fits what the
  kids actually saw. The group assembles the plain-language answer
  themselves: a rare trait, a small cut-off group, rare things showing
  up more often over time. Circle back to the opening sighting image and
  ground it — white fur and red eyes as a real rare trait, the quick
  vanish as normal squirrel behavior that felt impossible only because
  they had never seen it before. The final joke beat lands only after
  the real explanation is clean.

student_takeaway: A pattern in what you have walked is not a pattern in the whole place.

character_beats:
  - character_id: cam
    beat: >
      Cam's phone stays in his pocket more this episode. He is the one
      who maps their past sightings — a note or a sketch of where they
      have actually walked in the park. He also goes back to Sophie
      (this time messaging her, or going to her office hours, or handing
      the plainer questions to Leela) and is a little sheepish about
      having treated her page as an answer in Episode 1. He carries most
      of the earned-discovery energy at the end.
  - character_id: james
    beat: >
      James tries to chain the right answer anyway — "and then mutation,
      and then highways, and then — it has to be —" and Leela or Cam
      stops him, not to mock him, but because this time the group wants
      to build the answer slowly. He is the one who lands the closing
      "agree to disagree." His squirrel nickname from earlier episodes
      comes back one last time as friendship glue.
  - character_id: leela
    beat: >
      Leela drives the episode. She is the one who talks to Ms. Reyes,
      brings back the nudging questions, insists they walk the north
      side, and names the highway cutoff out loud. She is also the one
      who jokes at the end that maybe Cam's hair is a mutation too.
      Careful: she has been right all series by checking — let her feel
      a little of the earned quiet that comes from having actually done
      the walking this time.
