proposals:
  - proposal_id: p01
    proposal_type: tweak
    turn_id: t39
    focus_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    replacement_text: "Everywhere. All of it. We've been all over that park."
    rationale: >
      Current text is a single word ("Everywhere.") which reads as a casual
      aside and can feel moderate on the page. Adding two short confident
      beats in James's voice — "All of it." and "We've been all over that
      park." — doubles down on the unearned certainty so the flaw is
      unmistakable on first read, and sets up the south-only list at t41–t46
      as a sharper contrast. Still chatty and over-sure, still James; no
      lecturing, no new vocabulary.

  - proposal_id: p02
    proposal_type: tweak
    turn_id: t86
    focus_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    replacement_text: "Okay, but maybe they're just — hiding. The white ones. Today. They're probably hiding today."
    rationale: >
      Current text trails off on the dash ("maybe they're just — hiding.")
      which reads as a half-formed guess and can feel moderate. Adding
      "The white ones. Today. They're probably hiding today." makes the
      rescue-explanation shape visible: James is now explicitly protecting
      the original everywhere-claim by patching it with a new excuse. The
      fragmentary repetition stays in his chain-happy voice without turning
      analytic.

  - proposal_id: p03
    proposal_type: tweak
    turn_id: t122
    focus_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    replacement_text: "I know. I know, okay. I just — I read her page once and I was like, cool, that's the answer. I didn't even check. She wasn't the answer. She's a person."
    rationale: >
      Current text names the self-correction ("I treated her website like
      the answer") but the trusting_a_source_too_quickly shape is implicit.
      Adding "I read her page once and I was like, cool, that's the answer.
      I didn't even check." makes the too-quickly part explicit without
      turning Cam into a classroom voice: it's still his self-talk, still
      the same I-treated-her-website-like-the-answer arc, just with the
      speed and the not-checking surfaced so a student reader can feel the
      flaw being described.

