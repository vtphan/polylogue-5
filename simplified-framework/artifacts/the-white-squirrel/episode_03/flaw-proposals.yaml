story_id: the-white-squirrel
episode_id: episode_03
source_draft: transcript.raw.yaml
status: approved

candidate_turns:
  - turn_id: t32
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >
      James answers Ms. Reyes's first question ("have we looked at the whole
      park") with an immediate "Yes. Obviously." He treats "we have been in
      that park a weird amount" as if it proved full coverage. This is the
      cleanest, most recognizable instance of the episode's main teaching
      flaw: a pattern in the walks they have taken is not a pattern in the
      whole park. A 6th grader can feel the flaw on first read because the
      next twenty turns are exactly the group discovering that "a weird
      amount" and "the whole park" are not the same thing.

  - turn_id: t39
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >
      When Cam asks "where have we actually walked," James answers
      "Everywhere." Same flaw as t32, one beat later: the kids' felt sense
      of coverage is treated as actual coverage. Useful as a secondary or
      alternate anchor because the contrast with the south-only list that
      follows is mechanically visible to a student reader.

  - turn_id: t86
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >
      After thirty minutes on the north side with zero white squirrels,
      James tries "maybe they're just — hiding." He is reaching for a
      rescue explanation to keep the original everywhere-claim alive. This
      is a smaller jumping_to_a_conclusion moment and it teaches the same
      lesson from the opposite direction: when the evidence you walked
      does not match your claim, the claim moves, not the park.

  - turn_id: t109
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >
      "Small group, cut off, white fur, red eyes, and then mutation, and
      then highways, and then it has to be —" James sprints from a handful
      of observations to a closed conclusion in a single breath. Leela
      names it out loud at t112 ("You're doing the thing. You're
      chaining."), which makes this turn unusually teachable: the flaw and
      its label sit side by side on the page.

  - turn_id: t122
    suggested_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    rationale: >
      Cam's self-correction — "I treated her website like the answer. She
      wasn't the answer. She's a person." — is a reflective diagnosis of
      trusting_a_source_too_quickly from earlier in the series. It is not
      a live flaw in this episode, but it is a clean teachable callback a
      student can recognize as the same shape as the main lesson: a
      pattern in one source is not the whole answer, just like a pattern
      in one side of the park is not the whole park. Supporting anchor
      only; use sparingly.

