story_id: the-white-squirrel
episode_id: episode_01
source_draft: transcript.raw.yaml
status: approved
candidate_turns:
  - turn_id: t39
    suggested_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    rationale: >-
      Cam flips the screen around and presents Sophie's major as if it
      answers the question. With the sharpening tweak, the line names
      the title as the answer ("that's our answer right there") so the
      title-as-evidence move is unmistakable instead of implied by the
      gesture. This is the episode's clearest title-as-answer moment
      and aligns with the student takeaway about source fit.
  - turn_id: t48
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >-
      James stacks "she's in Memphis, and her page says astrophysics, and
      astrophysics is space, so she studies space, so it has to be
      connected." Each link sounds fine on its own, but the leap to
      "connected to the squirrel" skips several steps. A clean showing
      of a chain that feels like proof because the final step has
      nothing holding it up. Left untouched - already strongly
      expressed in the raw draft.
  - turn_id: t60
    suggested_flaw: ignoring_another_perspective
    expression_strength: strongly_expressed
    rationale: >-
      Leela has just offered a clean counter-example - her cousin's
      school has a whale in the header image and she does not study
      whales. With the sharpening tweak, James openly refuses to
      engage with the counter-example ("that doesn't count") rather
      than riffing past it, so the brush-off reads as ignoring her
      point rather than a playful bit.
  - turn_id: t87
    suggested_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    rationale: >-
      Cam reads "research interests - astrophysics" straight off the
      headline. With the sharpening tweak, James explicitly names that
      he is not going to scroll or read further ("don't even scroll,
      that's the whole answer"), so the one-line-then-stop pattern is
      stated in the line itself rather than inferred from the
      surrounding beat.
  - turn_id: t118
    suggested_flaw: not_enough_evidence
    expression_strength: strongly_expressed
    rationale: >-
      After an entire theory has been built on Sophie's page, Cam admits
      he just clicked the first search result. The group has been
      reasoning from one page about one person they never confirmed
      was the right person. One search result, one page, one sighting
      is a thin base for a big claim. Left untouched - the admission
      is already bluntly stated and lands the flaw cleanly.
