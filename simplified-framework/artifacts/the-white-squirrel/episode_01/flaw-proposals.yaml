  - proposal_id: p01
    proposal_type: tweak
    turn_id: t39
    rationale: >-
      Sharpen Cam's title-as-answer move so the line itself names the
      major as the answer, not just a thing to look at.
    focus_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    replacement_text: >-
      Because look at her major. Look. That's our answer right there.
  - proposal_id: p02
    proposal_type: tweak
    turn_id: t60
    rationale: >-
      Make James's wave-off land as refusing to engage with Leela's
      counter-example rather than reading as a playful riff.
    focus_flaw: ignoring_another_perspective
    expression_strength: strongly_expressed
    replacement_text: >-
      Nah, that doesn't count. Whale energy is not galaxy energy. Not
      the same thing.
  - proposal_id: p03
    proposal_type: tweak
    turn_id: t87
    rationale: >-
      Make the one-line-then-stop flaw explicit by having James name
      that he is not going to scroll or read further.
    focus_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    replacement_text: >-
      Boom. Done. Don't even scroll, Cam, that's the whole answer.
      Fluffnik is hers.
