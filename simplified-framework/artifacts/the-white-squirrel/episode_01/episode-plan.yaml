story_id: the-white-squirrel
episode_id: episode_01
title: The Sighting

episode_goal: >
  Open the story by planting the shared sighting image (red eyes,
  fake-for-a-second look, sudden vanish) and let an alien-scout
  hypothesis lock in around it. Cam pulls up Sophie's university page;
  her astrophysics title and academic look make her feel like the
  authority that explains the squirrel. James chains the title into
  alien-scout territory in one excited breath, the group's jokes
  reinforce the theory faster than they can pressure-test it, and one
  ridiculous nickname half-sticks. The episode wobbles — but does not
  fully collapse — when Leela actually opens Sophie's page and reads
  what astrophysics really studies. The point of the episode is not
  that Sophie is wrong or fake. It is that the kids trusted the
  near-enough fit of an impressive-sounding source before checking
  whether her field could even answer the question they were asking.

student_takeaway: A source that sounds important is not the same as a source that fits the question.

scene_design:
  opening: >
    Open on the sighting itself, in close, sensory detail. Three sixth
    graders at Overton Park on a Saturday, the white squirrel frozen
    on a low branch, the light hitting its eyes red, the half-second
    where one of them genuinely thinks it might be a fake squirrel
    somebody stuck in the tree, James saying something dumb about
    alien surveillance, then the squirrel gone. The image needs to
    land cleanly enough that later episodes can re-read the same
    details under different theories. Establish friendship texture in
    the first beats — these kids already know each other, the jokes
    already have history.
  turn: >
    Cam scrolls and surfaces "Sophie, astrophysics, university page,"
    reads the title and tone like that settles it, and James grabs
    "space science" and chains: scout, surveillance, the eyes glowing
    on purpose, the disappearing act, "it has to be." The jokes get
    funnier and the theory gets sturdier in the same beats. Leela
    rides along but starts to look at the page itself rather than at
    Cam reading it out. Let her quiet drag tension into the room
    without turning her into a teacher.
  close: >
    Leela actually checks what astrophysics is. Sophie studies stars
    and planets and physics-of-space, not animals, not biology, not
    anything that could explain a squirrel. She says it flat. The
    alien framing wobbles but does not die — the sighting still feels
    impossible, the kids are still unsettled, and the half-stuck
    nickname is still there as evidence the theory had social weight
    even after it lost intellectual weight. Close on the image of the
    squirrel still unexplained, and on the kids agreeing they have to
    keep looking.

character_beats:
  - character_id: cam
    beat: >
      Cam is the one who pulls Sophie up and reads her page like the
      page is the answer. He is excited, generous with the source,
      and treats the university header and the word "astrophysics"
      as proof rather than as one signal among many. He is also the
      one most likely to say "wait, should this be on the news?" and
      half-mean it. He is not stupid; his whole information life has
      taught him that anything credentialed-adjacent counts equally.
  - character_id: james
    beat: >
      James is the chainer. His turns should sound like opener +
      stacked links + closer ("okay but check this out" → "and
      then" → "so" → "it has to be"). His ideas should sound the
      most fun to follow even when they are the worst. He should
      try at least two ridiculous alien nicknames for the squirrel
      in this episode; one should half-stick across the rest of the
      story.
  - character_id: leela
    beat: >
      Leela is quiet for most of the episode. She laughs at the
      jokes, lets James chain, and then opens the page. Her drag is
      the thing that wobbles the theory. Keep her dry, not
      schoolmarmish — she is a friend with a sharp gut, not the
      adult in the room. Plant her flip side: she trusts her own
      observation, and her sample is narrower than she realizes
      (this matters in episode 3).
