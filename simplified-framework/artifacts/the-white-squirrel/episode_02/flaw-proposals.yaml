proposals:
  - proposal_id: p01
    proposal_type: replace
    turn_id: t13
    focus_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >-
      Sharpen the one-breath chain so the missing step is visible to a
      6th-grade reader. Keep James's signature shape — opener, and,
      and, and, so, it has to be — but tighten each link so the jump
      from "same kind of water" to "it has to be the water" lands as
      one clean leap instead of reading as a reasonable build.
    replacement_text: >-
      Okay wait — the squirrel had red eyes, and red eyes mean
      irritation, and that raccoon in the video had messed-up fur,
      and our squirrel had messed-up fur, and that river is water,
      and our park has water, so it's the same kind of water — it
      has to be the water. It has to be.

  - proposal_id: p02
    proposal_type: replace
    turn_id: t07
    focus_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    rationale: >-
      Amplify Cam treating anonymous commenters as if they confirm
      the video. Make him explicitly lean on the comments as proof
      and name them as a source — "people are saying," "the top
      comment" — so the flaw (taking strangers online at their word
      without asking who they are or how they'd know) is named on
      the page rather than implied.
    replacement_text: >-
      Right? And look, the comments back it up — the top one has
      like thousands of likes, it says the animals down there are
      getting sick. And this guy says his dog drank from it and
      threw up for two days. People are saying it. That's a lot of
      people saying the same thing, so it's real.

  - proposal_id: p03
    proposal_type: replace
    turn_id: t38
    focus_flaw: not_enough_evidence
    expression_strength: strongly_expressed
    rationale: >-
      Make the one-river-to-our-tap stretch explicit. Cam should
      collapse "water" into one big category out loud — "water is
      water" — so the evidence gap is visible. Keep his phone-native
      pile-on voice (pasta, toothbrush, the tap) but push the leap
      from local fountain to city tap water into one sentence a
      6th grader can point at.
    replacement_text: >-
      And it's not just the park — water is water, right? If it's
      bad in that park fountain, it's bad in our pipes too, because
      the water has to come from somewhere. I drink from the tap.
      My mom cooks pasta in the tap. My cousin brushes his teeth
      with the tap. That's the same water.

  - proposal_id: p04
    proposal_type: replace
    turn_id: t20
    focus_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >-
      Push the confirmation-biased re-read all the way. James should
      audibly rewrite the Episode 1 memory on the page: he was
      calling it white, now he sees it was bleached the whole time,
      and the red eyes and the "booking it" slot into the raccoon
      theory too. Keep his excited and/and/so cadence so the flaw
      reads as one breathless leap — a conclusion reaching back and
      repainting older observations until they all point the same way.
    replacement_text: >-
      Washed out. Exactly. Like the raccoon. No wait — see, that's
      what I'm saying, I was calling it snow-white this whole time
      but that wasn't white, that was bleached, and the red eyes
      weren't cute-weird-eyes, they were irritated eyes, and it
      didn't vanish, it was booking it out of there — so it's the
      same thing as the raccoon, it's been the same thing the whole
      time, I was literally looking right at it.

  - proposal_id: p05
    proposal_type: replace
    turn_id: t34
    focus_flaw: not_enough_evidence
    expression_strength: strongly_expressed
    rationale: >-
      Upgrade from tweak to replace so Cam can build a full
      single-case-as-proof beat. One dog doing the whole evidentiary
      job: he names the dog, promotes it to "proof," and treats that
      one animal's daily drink as settled evidence the water is
      dangerous. Keep his phone-native civic-worry tone — the dog
      becomes a witness, a data point, a case — so a 6th grader can
      point at exactly one animal being asked to carry a big claim.
    replacement_text: >-
      And Mrs. Alvarez walks her dog through there every single
      morning. That dog drinks out of the fountain. I've seen it
      drink out of it. Like — that dog is basically proof, right?
      That's an animal drinking that water every day. If the water
      was fine, the dog would be fine, and if the water's bad, the
      dog tells us. That's one whole animal. That counts.

