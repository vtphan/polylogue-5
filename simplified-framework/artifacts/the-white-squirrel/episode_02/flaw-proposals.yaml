status: approved

candidate_turns:
  - turn_id: t13
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >-
      James strings together red eyes, washed-out fur, the Louisiana
      raccoon, and "we drink from the same kind of water" into one
      breathless chain that ends at "it has to be the water." The leap
      is clean on the page: several smaller noticings collapsed into a
      single big conclusion without any check in between. This is the
      episode's main teaching beat for the one-breath chain with a step
      missing.

  - turn_id: t07
    suggested_flaw: trusting_a_source_too_quickly
    expression_strength: strongly_expressed
    rationale: >-
      Cam backs up the TikTok by reading top comments — "the animals
      down there are getting sick" and "somebody said their dog drank
      from it and threw up for two days" — and treats those strangers
      as if they confirm the video. He never asks who posted, how they
      would know, or whether random commenters are reliable. A
      recognizable "I saw it online and the replies agree" move.

  - turn_id: t38
    suggested_flaw: not_enough_evidence
    expression_strength: strongly_expressed
    rationale: >-
      Cam stretches one Louisiana river to Memphis tap water in a
      single step — park fountain, then "our water comes from
      somewhere," then pasta and toothbrushes. He treats "water" as
      one big category, so one bad river becomes evidence about our
      tap. Leela's later aquifer check is the corrective; this turn is
      where the evidence gap is most visible.

  - turn_id: t20
    suggested_flaw: jumping_to_a_conclusion
    expression_strength: strongly_expressed
    rationale: >-
      James re-reads the Episode 1 squirrel sighting through the
      Louisiana raccoon lens: the white fur he had been calling
      "snow-white" becomes "bleached" and "washed out. Exactly. Like
      the raccoon." This is a confirmation-biased re-read — the new
      theory is pulling old memories into its shape, turning a neutral
      observation into more evidence for the same conclusion. A good
      secondary anchor for how a conclusion, once picked, starts
      rewriting what you already saw.

  - turn_id: t34
    suggested_flaw: not_enough_evidence
    expression_strength: strongly_expressed
    rationale: >-
      Cam points to Mrs. Alvarez's dog drinking from the fountain as
      more proof the park water is dangerous. But one dog drinking
      from a fountain does not show the water is bad — the dog is
      fine in the story, and one observation is being asked to carry
      a big claim. This pairs naturally with t38 as a "piling up
      little things that aren't actually evidence" beat.

