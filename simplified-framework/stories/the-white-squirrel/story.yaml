story_id: the-white-squirrel
title: The White Squirrel

premise: >
  Three sixth graders in Memphis — Cam, James, and Leela — spot a white
  squirrel with red eyes at Overton Park one Saturday afternoon. For one
  second it does not look real. It freezes on a low branch, the light
  catches its eyes, one of them thinks for half a second that somebody
  stuck a fake squirrel in the tree, James says something stupid about
  alien surveillance, and then it is gone. This exact sighting image
  should survive downstream into the episode plan and transcript: the
  freeze, the red eyes catching light, the fake-for-a-second reaction,
  and the quick disappearance. None of them can let it go. Across three
  episodes they chase three different explanations for what they saw.
  Each explanation is pushed by a different reasoning flaw, and the flaw
  is what drives the wrong conclusion, not a separate layer over it. The
  same sighting should keep getting re-read across the arc: first as
  uncanny, then as alarming, and finally as real in a way that explains
  why it felt so strange.

  Episode 1 pursues an alien hypothesis. Cam finds a university page
  for Sophie, a college student majoring in astrophysics. James hears
  "space science" and starts running with it. Soon the group is joking
  about alien squirrels, secret park experiments, and whether this is
  the first scout from another planet. James keeps trying to give the
  squirrel a ridiculous alien nickname, and one bad nickname half-sticks
  across the story. The jokes make the theory stick. In this episode the
  kids do not talk to Sophie directly. They only read her page and talk
  about what they think it means. Cam reads Sophie's page like it is the
  answer, not just a source. The point is not that Sophie is foolish or
  fake. The point is that the kids trust the title, the tone, and the
  near-enough fit before checking whether her field actually answers the
  question they are asking. When Leela finally checks what Sophie really
  studies, the alien framing wobbles. In this episode the sighting image
  should feed the mystery: the red eyes, the fake-for-a-second look, and
  the vanishing act all get treated like evidence that something
  impossible happened. Episode 1 planning should either open on this
  sighting or return to it immediately as the memory all three kids are
  arguing from.

  Episode 2 pursues an environmental hypothesis. Cam shows the group a
  TikTok about a polluted river in Louisiana where animals looked sick,
  and James chains from "red eyes, and mutations, and that river, and
  our squirrel" to "it has to be the water" in one breath. The disproof
  is local and visible — Memphis tap water comes from the Memphis Sand
  Aquifer and is famously clean, and the TikTok was about a different
  place with different conditions. This theory feels scarier than the
  alien one because it sounds like it could affect real people now. The
  kids start asking whether they have been drinking bad water, whether
  little kids at the park are okay, whether the ducks and dogs there
  are okay, and whether something is wrong in their own city. In this
  episode the same sighting image gets re-read as warning signs: the red
  eyes look irritated, the white fur looks wrong or washed out, and the
  quick disappearance feels like something is off. Episode 2 should
  explicitly reuse those same details as the evidence James stacks into
  the pollution claim.

  Episode 3 pursues the right answer. Leela catches their science
  teacher, Ms. Reyes, after class, but Ms. Reyes does not explain the
  squirrel. She only nudges: are you sure you have looked at the whole
  park, and are you sure the squirrels you saw are one big group? The
  group maps their sightings, realizes they have only ever walked the
  south side of Overton Park, walks the north side, and finds no red-
  eyed squirrels there. Leela names the thing that had been sitting
  next to them the whole time: the highways cut this forest patch off
  from the rest of Memphis. Then they go back to Sophie with plainer
  questions. She admits her field is not mammal biology, but agrees that
  a rare mutation in a small cut-off group fits what the kids found. The
  kids assemble the plain-language answer themselves: a rare mutation, a
  forest patch cut off by highways, a small cut-off group where rare
  things show up more often over time. By the end, the answer is real,
  local, and earned — and the squirrel is still genuinely strange, just
  in a way that actually holds together. The final joke beat should come
  only after the real explanation has landed cleanly. Then the story can
  relax again: Leela says maybe Cam's hair is a mutation too, Cam shoots
  back that her name is a mutation of "allele," Leela says it is an
  anagram, and James ends with "agree to disagree." In this episode the
  same sighting image gets grounded instead of thrown away: the white
  fur and red eyes become part of a real rare trait, and the quick
  disappearance reads as normal squirrel behavior that looked impossible
  only because the kids had never seen anything like it before. Episode
  3 should explicitly circle back to the opening image and show why it
  felt impossible before the kids knew what they were looking at.

  Across the arc the kids practice three critical-thinking moves —
  checking a source before trusting it, slowing down when a big claim
  is built out of fast little jumps, and noticing the missing
  condition behind a pattern. The reasoning is the engine of the story;
  the final answer is real, earned, and still weird enough to matter.

setting:
  place: Overton Park, Memphis, Tennessee
  tone: curious, slightly uncanny, friendship-first

characters:
  - id: cam
    name: Cam
    voice_notes: >
      Cam is phone-native. His informational life is a scroll — TikToks,
      Instagram posts, comment threads, the credentialed-adjacent
      people his older cousins follow — arriving through one feed with
      one visual weight. He treats sources as interchangeable because
      his whole information environment has treated them as
      interchangeable. A PhD student's university page, a viral TikTok,
      and a verified comment section all carry the same authority to
      him on first read. He is enthusiastic, quick to bring outside
      material into the conversation, and the most confident about the
      things he half-knows. He is also the first one to turn a weird
      sighting into a bit, which helps the group stay excited when they
      should be slowing down. Cam is the ep-1 lead because the alien
      framing lands through exactly this move: Sophie sounds like a
      science expert, so she must be the expert. Across the three
      episodes he starts to learn that the phone is a pile of sources,
      not a source. He is also the one most likely to say "wait, should
      this be on the news?" and mean it for half a second.

  - id: james
    name: James
    voice_notes: >
      James is the chainer. He moves from one observation to a much
      bigger conclusion in one breath. His signature dialog shape is an
      opener ("okay but check this out"), stacked links ("and then",
      "so", "so"), and a closer ("it has to be"). He does not sound
      hesitant when he is chaining — he sounds excited, like the idea
      is assembling itself in front of him. He is also the funniest of
      the three when he gets wound up, which means his worst ideas can
      sound the most fun to follow. He keeps trying to nickname the
      squirrel something ridiculous, and the others keep rejecting it
      until one bad nickname half-sticks and keeps resurfacing as a
      running joke. James is the ep-2 lead because his shape — stack
      three links fast and close with "has to be" — is exactly how the
      group slides from "Cam saw a TikTok" to "our water is toxic."
      Across the arc the chains do not disappear, but by ep 3 he lets
      other people finish a thought before he jumps.

  - id: leela
    name: Leela
    voice_notes: >
      Leela has a sharp gut for other people's reasoning. She is the
      one who says "that doesn't sound right" and is usually correct.
      The same instinct has a flip side: she trusts her own
      observation, and her sampling is narrower than she realizes. She
      lives near one edge of Overton Park and only ever walks one loop
      through the south side. She is the ep-3 lead because the missing
      condition — "we've only ever walked the south side" — is hiding
      inside her own experience. The virtue and the flaw share a root.
      She is also the quietest of the three; when she speaks, the
      others tend to stop to listen. Her dry one-line reactions help
      pop the group's biggest theories without turning her into the
      boring one. She is the one most likely to turn a huge moment with
      one flat line that makes the others finally hear how wild they
      sound.

# Sophie is referenced in the dialog, but never appears on stage.
# In episode 1 the kids only read her university page and argue over what
# they think it means. They do not talk to her directly until episode 3.

episodes:
  - episode_id: episode_01
    title: The Sighting
    flaws:
      - trusting_a_source_too_quickly
      - jumping_to_a_conclusion
    final_takeaway: A source that sounds important is not the same as a source that fits the question.

  - episode_id: episode_02
    title: The Water
    flaws:
      - jumping_to_a_conclusion
      - trusting_a_source_too_quickly
    final_takeaway: A big conclusion in one breath is usually a chain with a step missing.

  - episode_id: episode_03
    title: The Walk
    flaws:
      - missing_important_conditions_or_consequences
      - ignoring_another_perspective
    final_takeaway: A pattern in what you have walked is not a pattern in the whole place.
