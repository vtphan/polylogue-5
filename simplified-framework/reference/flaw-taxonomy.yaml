flaws:
  - id: jumping_to_a_conclusion
    student_label: jumping to a conclusion
    difficulty_band: low
    definition: The speaker moves from one idea or observation to a bigger conclusion too quickly.
    authoring_notes:
      - Best for early episodes and warm-ups.
      - Prefer scenes where the missing step in the chain is easy to name.
      - The whole point is the gap between the base observation and the conclusion — make sure the base observation is in the same scene.
    amplification_guidance:
      unmistakable:
        characteristic_cues:
          - four or more "so→so→so" links in a single breath
          - a quotable signal phrase ("that proves it", "that basically means", "obviously")
          - the conclusion sits many steps removed from the base observation
          - the final sentence is fallacy-shaped on its own
        sample_line: >
          "Its eyes were red, so something's wrong with it, so something
          did this to it, so somebody's doing this on purpose. That
          basically proves it."
        watchout: >
          Each link should feel almost reasonable on its own — the
          wrongness is visible only when you read the whole chain at
          once. If individual links are absurd, the speaker sounds
          unhinged and the lesson lands as mockery instead of teaching.

      showcased:
        characteristic_cues:
          - exactly one visible leap with one bridge missing
          - one signal phrase ("obviously", "it has to be", "so that means")
          - no stacked chain — single move
        sample_line: >
          "It's the only red-eyed squirrel any of us have ever seen.
          Obviously something here is doing it."
        watchout: >
          Resist adding a second leap. One missing bridge per turn at
          this level. If you find yourself stacking two or three jumps,
          you have drifted into unmistakable territory.

      heightened:
        characteristic_cues:
          - a single confident claim that skips one identifiable step
          - reads as reasonable until paraphrased back
          - no overt signal phrase — the speaker's confidence carries the move
        sample_line: >
          "I mean, the data fits genetics, so that has to be it."
        watchout: >
          At this level the flaw is in the speaker's confidence, not in
          a labeled signal phrase. If a careful listener cannot
          paraphrase what step was skipped, the flaw is not there at
          all and the line is just normal talk.

  - id: not_enough_evidence
    student_label: not enough evidence
    difficulty_band: low
    definition: The speaker makes a claim without enough support.
    authoring_notes:
      - Use concrete evidence gaps that a student can point to in the dialog.
      - Good for early episodes and level practice.
      - The base evidence has to be visible in the scene; do not let the speaker reference data the reader has not seen.
    amplification_guidance:
      unmistakable:
        characteristic_cues:
          - explicit numerical contrast (one→all, once→always)
          - emphatic repetition of the small number
          - a single example escalated to a universal claim
          - escalator phrase ("so basically", "so every", "so all of")
        sample_line: >
          "We saw one squirrel. One. One time. So basically every
          squirrel in this park has something wrong with it."
        watchout: >
          Keep the contrast crisp — small data on one side, big claim
          on the other, nothing softening the gap. Surrounding hedges
          dilute the move; let the spike land bare.

      showcased:
        characteristic_cues:
          - one example used as support for a broad claim
          - no contrasting turn marking the gap before it
          - soft generalizer ("clearly", "always", "every time")
        sample_line: >
          "Cam's mom said it once and she's a nurse, so red eyes always
          means something is wrong."
        watchout: >
          Avoid a numerical-contrast spike at this level — that belongs
          to unmistakable. Here the broad claim should follow the
          example smoothly without anyone explicitly marking the gap.

      heightened:
        characteristic_cues:
          - a small generalization built on a thin observation
          - reads as casual confidence rather than overreach
          - the claim might be true; the gap is in the support, not the conclusion
        sample_line: >
          "Every squirrel I've ever seen at Audubon was grey. So the
          white one is probably new to here."
        watchout: >
          At this level the speaker is making a real epistemic move
          that a careful adult might also make. The flaw is in the
          speaker not having actually counted, not in the conclusion
          being absurd.

  - id: ignoring_another_perspective
    student_label: ignoring another perspective
    difficulty_band: medium
    definition: The speaker does not consider another person's point of view, another explanation, or another possibility that matters.
    authoring_notes:
      - Use only when the missing perspective or alternative is clear.
      - Better after students have practiced more obvious flaws first.
      - The alternative being ignored has to be present in the scene — either named by another character or implicit in something the reader has already seen.
    amplification_guidance:
      unmistakable:
        characteristic_cues:
          - another character offers an alternative out loud in the immediately preceding turn
          - speaker talks over them or dismisses with a hard signal phrase ("nothing else fits", "no, it has to be")
          - the dismissal happens in the same exchange, visibly
        sample_line: |
          Maya: "Or it could just be one weird squirrel that we
          happened to see."
          Jules: "No, no — it's the whole park. That's the thing."
        watchout: >
          The alternative the speaker ignores has to be visible to the
          reader. If Maya's alternative is buried, hedged, or
          interrupted, then there is nothing for Jules to ignore in a
          way the student can point at.

      showcased:
        characteristic_cues:
          - alternative is named by another character and brushed past with a one-word acknowledgment
          - speaker continues their original direction without engagement
          - small marker word ("sure, but", "yeah, anyway")
        sample_line: |
          Priya: "Or maybe we just walk the same paths."
          Jules: "Sure, but the eyes were red. Anyway —"
        watchout: >
          Do not have the speaker engage the alternative substantively
          before dismissing it. The flaw is the brushing-past, not the
          engaging-and-disagreeing. Substantive engagement is good
          reasoning, not a flaw.

      heightened:
        characteristic_cues:
          - speaker proceeds as if there is only one explanation
          - no other angle ever surfaces in their framing
          - another character's later or quieter turn hints at what got skipped
        sample_line: >
          "The pattern only makes sense if it's an environmental thing
          in this park."
        watchout: >
          At this level no one has to explicitly offer the alternative
          on stage. The flaw is in the closedness of the speaker's
          framing. A trained student notices what is not being
          considered. An untrained student should not be expected to.

  - id: trusting_a_source_too_quickly
    student_label: trusting a source too quickly
    difficulty_band: low
    definition: The speaker treats a source as reliable without checking who it is, how they know, or whether they can be trusted.
    authoring_notes:
      - Make the source cue explicit in the dialog.
      - Good for warm-ups and early levels.
      - The kind of source matters — TikTok creators, anonymous comments, popularity numbers, and credentialed-adjacent adults all carry different texture.
    amplification_guidance:
      unmistakable:
        characteristic_cues:
          - source named with no attribution ("some guy", "this video", "this account")
          - popularity-as-truth ("a million views", "everyone's saying it")
          - a certainty escalator stacked on the weak source ("that has to mean something")
          - corroboration that is itself the same kind of weak source (comments under the same video, replies on the same post)
        sample_line: >
          "I don't know who posted it, but the video had a million
          views. A million people. That basically proves it. And the
          comments were all people going I saw it too, I saw it too."
        watchout: >
          Stack the cues on the source, not on the speaker. The kid
          should sound enthusiastic, not stupid. The point is to put
          the bad reasoning on display, not to mock the character.

      showcased:
        characteristic_cues:
          - one clearly weak source citation
          - one signal phrase that frames acceptance ("so that means", "so that's not nothing")
          - the source's weakness is visible in the phrasing itself (anonymous, second-hand, popularity-as-evidence)
        sample_line: >
          "The comments under my post all said the same thing, so
          that's not nothing, right?"
        watchout: >
          Resist the urge to stack a certainty escalator on top. One
          cue, one frame. If you find yourself adding "and a million
          people watched it," you have drifted into unmistakable.

      heightened:
        characteristic_cues:
          - credentialed-adjacent claim used as if it were domain expertise (grad student in physics quoted on biology; older sibling quoted as authority)
          - one elevated phrase that does the lifting ("she literally works on this", "that's not nothing")
        sample_line: >
          "Anya's literally a grad student at U of M, and this stuff is
          what she works on. So if she says it could be a biosignature,
          that's not nothing."
        watchout: >
          At this level the speaker has to sound reasonable. If the kid
          sounds gullible, the level has slipped to showcased. The
          whole point of heightened is that the line passes for normal
          talk until a trained student catches the move.

  - id: missing_important_conditions_or_consequences
    student_label: missing important conditions or consequences
    difficulty_band: medium
    definition: The speaker leaves out an important detail about when the claim would hold, or what might happen if they are wrong.
    authoring_notes:
      - Use only when the missing condition or consequence is easy to name.
      - Better as a supporting flaw unless the episode is designed around it clearly.
      - Stronger when the missed condition is something the reader has already seen in the scene.
    amplification_guidance:
      unmistakable:
        characteristic_cues:
          - universal claim ("they only live here", "this happens everywhere") in the same scene as a visible local-context contradiction
          - the contradiction is set up in an immediately adjacent turn
          - the missed condition is something a 6th grader can name in plain language
        sample_line: |
          Maya: "We always loop the same way through the south side."
          Priya: "Right, and we've only ever seen them on this loop. So
          they only live on this side of the park."
        watchout: >
          The missing condition has to be set up in the dialog before
          the flaw lands. If the student cannot see the condition
          without outside knowledge, the level slips and the moment
          becomes unteachable at the beginner band.

      showcased:
        characteristic_cues:
          - a claim that quietly assumes a condition a careful listener notices
          - small generalizer ("they always", "you only ever see")
          - the condition is nameable in one short student sentence
        sample_line: >
          "You only ever see them when it's quiet — that's when they
          come out."
        watchout: >
          The missed condition should still be sayable by a 6th grader
          in plain language. If naming it requires expert framing,
          either rewrite as unmistakable with a setup turn or pick a
          different flaw for this moment.

      heightened:
        characteristic_cues:
          - a claim whose limiting condition does hidden load-bearing work
          - only catchable on a reread, or after a later scene reframes it
          - speaker sounds completely casual
        sample_line: >
          "These ones are the most curious squirrels I've ever met."
        watchout: >
          At this level the flaw is genuinely subtle. Use sparingly and
          only after the same flaw has appeared at higher levels in
          earlier episodes. If even a trained reviewer struggles to
          point at the missed condition, the line is just casual
          conversation and should be left alone.
