flaws:
  - id: jumping_to_a_conclusion
    student_label: jumping to a conclusion
    lens: logic
    definition: The speaker moves from one idea or observation to a bigger conclusion too quickly.

  - id: not_enough_evidence
    student_label: not enough evidence
    lens: evidence
    definition: The speaker makes a claim without enough support.

  - id: ignoring_another_perspective
    student_label: ignoring another perspective
    lens: scope
    definition: The speaker does not consider another person's point of view, another explanation, or another possibility that matters.

  - id: trusting_a_source_too_quickly
    student_label: trusting a source too quickly
    lens: evidence
    definition: The speaker treats a source as reliable without checking who it is, how they know, or whether they can be trusted.

  - id: missing_important_conditions_or_consequences
    student_label: missing important conditions or consequences
    lens: scope
    definition: The speaker leaves out an important detail about when the claim would hold, or what might happen if they are wrong.
