turns:
  - turn_id: t01
    speaker: Jules
    text: Okay, no, because it was not just white. The eyes looked actually red, and it just stood there looking at us like it wanted us to notice it.

  - turn_id: t02
    speaker: Cam
    text: I saw it first and I thought I was seeing things, but then Jules made that face and I knew it was not just me.

  - turn_id: t03
    speaker: Maya
    text: Can we slow down for one second? Are we trying to figure out what we saw, or are we already trying to explain it?

  - turn_id: t04
    speaker: Jules
    text: I mean, if its eyes were that red, something had to happen to it. Stuff does not just get that wrong-looking for no reason.

  - turn_id: t05
    speaker: Priya
    text: I have never seen a squirrel like that at Audubon or by the Greenway or anywhere else, though. I keep thinking about that part.

  - turn_id: t06
    speaker: Jules
    text: Exactly. So if none of us have seen one anywhere else, it is probably something about this park.

  - turn_id: t07
    speaker: Maya
    text: Or it could just mean we saw one weird squirrel one time. That is still different from saying the whole park is doing something.

  - turn_id: t08
    speaker: Cam
    text: Wait, but I saw a video this weekend where this guy said weird squirrel stuff has been happening in Overton for months.

  - turn_id: t09
    speaker: Maya
    text: What guy?

  - turn_id: t10
    speaker: Cam
    text: I do not know, just some park account maybe, but the comments were all people going, I saw one too, I saw one too.

  - turn_id: t11
    speaker: Jules
    text: See? Then it is not just our squirrel. That means something is going on out there.

  - turn_id: t12
    speaker: Priya
    text: Or it means people in comments say stuff. But I do think it is weird that we all keep coming back to the same part.

  - turn_id: t13
    speaker: Maya
    text: I am writing this down before we get ahead of ourselves. What, exactly, are we trying to answer about the squirrel?

  - turn_id: t14
    speaker: Cam
    text: I mean, I still want to meet again, because if there is even a chance something weird is happening, I want to know.
