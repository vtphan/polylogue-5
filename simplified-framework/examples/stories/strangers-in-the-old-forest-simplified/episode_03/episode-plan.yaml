story_id: strangers-in-the-old-forest-simplified
episode_id: episode_03
title: The Theory Gets Bigger

episode_goal: >
  The group's theory starts expanding beyond what they actually know, and several
  students begin speaking as if a large pattern is established when they still
  have only a small amount of support.

flaws:
  - not_enough_evidence
  - ignoring_another_perspective

student_takeaway: A big claim needs stronger support than one example or one story.

scene_design:
  opening: The group comes in with energy and starts building on earlier ideas.
  turn: Their theory gets bigger, but the evidence underneath it stays thin.
  close: The conversation ends with a stronger theory than the group has really earned.

character_beats:
  - character_id: jules
    beat: keeps connecting small pieces into a much larger pattern
  - character_id: cam
    beat: amplifies the theory by treating repeated excitement like repeated evidence
  - character_id: maya
    beat: notices the evidence problem but struggles to slow the momentum
  - character_id: priya
    beat: offers an everyday perspective that could ground the group if they listened

target_teachable_moments: 5
warmup_candidate_goal: 2
level_candidate_goal: 3

flaw_embedding_guidance:
  must_include:
    - one moment where repeated talk is treated like repeated evidence
    - one moment where the group talks like a pattern is proven when it is not
    - one missed opportunity to consider a more ordinary explanation
  avoid:
    - subtle evidence distinctions that require expert explanation
    - too many competing flaws in the same short exchange
    - flattening Priya into only a cautionary voice
