# Simplified story.yaml schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_story.py.

type: object
required:
  - story_id
  - title
  - premise
  - characters
  - episodes

properties:
  story_id:
    type: string
  title:
    type: string
  premise:
    type: string
  characters:
    type: array
  episodes:
    type: array
  setting:
    type: object
  audience:
    type: object
