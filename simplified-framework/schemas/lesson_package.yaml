# Lesson package schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_lesson_package.py.

type: object
required:
  - package_meta
  - episode
  - levels

properties:
  package_meta:
    type: object
    required: [story_id, episode_number, schema_version]
  episode:
    type: object
    required: [title, summary, flaws, final_takeaway]
    # `previously` is required when package_meta.episode_number > 1 and
    # forbidden on episode 1 (enforced by the Python validator, not Zod).
    properties:
      title:
        type: string
      summary:
        type: string
        description: >
          Plain-language episode orientation shown before any dialog.
          Soft cap ~60 words; warned by validator.
      previously:
        type: string
        description: >
          Short recap carrying the arc into this episode (ep 2+ only).
          Soft cap ~40 words; warned by validator.
      flaws:
        type: array
      final_takeaway:
        type: string
  levels:
    type: array
    minItems: 3
    maxItems: 3
    description: >
      Exactly 3 levels. No two levels may target turns in the same scene.
