# Lesson package schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_lesson_package.py.

type: object
required:
  - package_meta
  - episode
  - levels

properties:
  package_meta:
    type: object
    required: [story_id, episode_number, schema_version]
  episode:
    type: object
    required: [title, summary, flaws, final_takeaway]
    # `previously` is required when package_meta.episode_number > 1 and
    # forbidden on episode 1 (enforced by the Python validator, not Zod).
    properties:
      title:
        type: string
      summary:
        type: string
        description: >
          Plain-language episode orientation shown before any dialog.
          Soft cap ~60 words; warned by validator.
      previously:
        type: string
        description: >
          Short recap carrying the arc into this episode (ep 2+ only).
          Soft cap ~40 words; warned by validator.
      flaws:
        type: array
      final_takeaway:
        type: string
  levels:
    type: array
    minItems: 3
    maxItems: 3
    description: >
      Exactly 3 levels. No two levels may target turns in the same scene.
    items:
      type: object
      required:
        - level_id
        - sequence_index
        - turn_id
        - title
        - focus_flaw
        - prompt
        - answer_options
        - feedback
        - takeaway
      properties:
        level_id:
          type: string
        sequence_index:
          type: integer
        turn_id:
          type: string
        title:
          type: string
        focus_flaw:
          type: string
        prompt:
          type: string
        hint:
          type: string
        answer_options:
          type: array
          items:
            type: object
            required: [option_id, text, kind]
            properties:
              option_id:
                type: string
              text:
                type: string
              kind:
                type: string
        feedback:
          type: object
          required: [correct, by_option]
          properties:
            correct:
              type: object
              required: [option_ids, text]
              properties:
                option_ids:
                  type: array
                  items:
                    type: string
                text:
                  type: string
            by_option:
              type: object
              description: >
                Map of each wrong option_id directly to a feedback string.
                Values are plain strings, not nested objects.
              additionalProperties:
                type: string
        takeaway:
          type: string
