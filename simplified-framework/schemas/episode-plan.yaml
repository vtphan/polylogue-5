# Simplified episode-plan.yaml schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_episode_plan.py.
#
# The plan is a story-facing planning artifact. It does not author flaw
# inventories, amplification bands, quiz-distribution targets, or
# reader-facing scene structure.

type: object
required:
  - story_id
  - episode_id
  - title
  - episode_goal
  - student_takeaway

properties:
  story_id:
    type: string
  episode_id:
    type: string
  title:
    type: string
  episode_goal:
    type: string
    description: >
      Planning-only — the narrative/learning aim for this episode. Not
      student-facing; not present in lesson_package.yaml.
  student_takeaway:
    type: string
  character_beats:
    type: array
    description: >
      Optional per-character voice, relationship, and private-stakes notes
      for the downstream writer. These are story-shaping notes, not a scene
      plan or quiz-planning surface.
