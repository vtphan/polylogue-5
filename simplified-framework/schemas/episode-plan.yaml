# Simplified episode-plan.yaml schema sketch
#
# This file is a placeholder for the eventual formal schema.
# For now it documents the intended structured shape.

type: object
required:
  - story_id
  - episode_id
  - title
  - episode_goal
  - flaws
  - student_takeaway

properties:
  story_id:
    type: string
  episode_id:
    type: string
  title:
    type: string
  episode_goal:
    type: string
  flaws:
    type: array
  student_takeaway:
    type: string
  scene_design:
    type: object
  flaw_embedding_guidance:
    type: object
  target_teachable_moments:
    type: integer
  warmup_candidate_goal:
    type: integer
  level_candidate_goal:
    type: integer
  character_beats:
    type: array
