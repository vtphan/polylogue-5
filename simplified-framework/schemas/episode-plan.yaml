# Simplified episode-plan.yaml schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_episode_plan.py.

type: object
required:
  - story_id
  - episode_id
  - title
  - episode_goal
  - flaws
  - student_takeaway

properties:
  story_id:
    type: string
  episode_id:
    type: string
  title:
    type: string
  episode_goal:
    type: string
  flaws:
    type: array
    items:
      type: object
      required: [id, amplification]
      properties:
        id:
          type: string
        amplification:
          type: string
          enum: [unmistakable, showcased, heightened]
        scene_note:
          type: string
  student_takeaway:
    type: string
  scene_design:
    type: object
  flaw_embedding_guidance:
    type: object
  target_teachable_moments:
    type: integer
  warmup_candidate_goal:
    type: integer
  level_candidate_goal:
    type: integer
  character_beats:
    type: array
