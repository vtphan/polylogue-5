# Simplified transcript.yaml schema sketch — human reference only.
#
# Canonical structural rules live in
# simplified-framework/pipeline/scripts/validate_transcript.py.
#
# The transcript is source dialogue organized into 3+ scenes. Each scene
# has a plain-language summary and 1+ turns; turn_id is globally unique
# across the whole transcript so lesson_package.yaml references keep working.

type: object
required:
  - story_id
  - episode_id
  - title
  - characters
  - scenes

properties:
  story_id:
    type: string
  episode_id:
    type: string
  title:
    type: string
  characters:
    type: array
  scenes:
    type: array
    minItems: 3
    items:
      type: object
      required: [scene_id, summary, turns]
      properties:
        scene_id:
          type: string
          description: unique within transcript (e.g., s1, s2).
        summary:
          type: string
          description: >
            Plain-language scene summary, 6th-grade vocabulary.
            Soft cap ~30 words; validator emits a warning past the cap.
        turns:
          type: array
          items:
            type: object
            required: [turn_id, text]
            properties:
              turn_id:
                type: string
                description: tNN; unique across the whole transcript, strictly increasing.
              kind:
                type: string
                enum: [dialog, action]
              speaker:
                type: string
              text:
                type: string
